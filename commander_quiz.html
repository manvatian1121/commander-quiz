<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你是哪种指挥官？— EDH 新人主将挑选测试</title>
<style>
  :root{
    --w:#f8f0d8; --u:#a5cfe8; --b:#c9b8d4; --r:#f0a898; --g:#a8d4b0;
    --bg:#0f1218; --bg2:#161b24; --panel:#1b2130; --line:#2a3345;
    --ink:#e8edf6; --dim:#94a3b8; --accent:#7dd3fc; --gold:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#1e293b 0%,var(--bg) 55%);
    color:var(--ink); min-height:100vh; padding:24px 16px 64px;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 20px 50px -30px #000}
  h1{font-size:clamp(24px,4.4vw,38px);line-height:1.25;letter-spacing:-.01em}
  h2{font-size:20px;margin-bottom:12px}
  h3{font-size:15px;color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  p{color:#cbd5e1}
  .lead{font-size:16px;color:#cbd5e1;margin-top:14px}
  .muted{color:var(--dim);font-size:13.5px}
  .btn{
    appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;
    background:linear-gradient(180deg,#38bdf8,#0ea5e9);color:#04121c;
    padding:14px 30px;border-radius:11px;transition:.16s;font-size:16px
  }
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink);border-color:#3d4a63}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .mt{margin-top:22px}.mt-s{margin-top:12px}

  /* 进度 */
  .bar{height:6px;background:#0d1119;border-radius:99px;overflow:hidden;margin-bottom:8px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#7dd3fc);width:0;transition:width .28s ease}
  .sechead{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}

  /* 选项 */
  .opt{
    display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:#141a26;border:1px solid var(--line);border-radius:12px;
    padding:15px 18px;color:var(--ink);margin-bottom:10px;transition:.13s;position:relative
  }
  .opt:hover{border-color:#3f5170;background:#182030;transform:translateX(2px)}
  .opt.on{border-color:var(--accent);background:#12283a;box-shadow:0 0 0 1px var(--accent) inset}
  .opt .idx{display:inline-block;min-width:22px;color:var(--dim);font-size:13px;font-weight:700}
  .opt.on .idx{color:var(--accent)}
  .qtext{font-size:19px;font-weight:600;margin:6px 0 18px;line-height:1.5}

  /* 颜色符号 */
  .pips{display:inline-flex;gap:4px;vertical-align:middle}
  .pip{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#131820;border:1px solid #0006}
  .pip.W{background:var(--w)}.pip.U{background:var(--u)}.pip.B{background:var(--b)}
  .pip.R{background:var(--r)}.pip.G{background:var(--g)}.pip.C{background:#c8cdd6}

  /* 结果 */
  .hero{border-radius:16px;padding:26px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;opacity:.09;pointer-events:none;
    background:radial-gradient(400px 200px at 90% 0%,var(--glow,#7dd3fc),transparent)}
  .hero .rank{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
  .hero .name{font-size:clamp(22px,3.6vw,30px);font-weight:800;line-height:1.2;margin:6px 0 2px}
  .hero .zh{font-size:15px;color:var(--dim);margin-bottom:14px}
  .alt{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#141a26;margin-top:12px}
  .alt .n{font-weight:700;font-size:16px}
  .alt .z{font-size:13px;color:var(--dim)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
  .stat{background:#121822;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .stat .k{font-size:11.5px;color:var(--dim);letter-spacing:.05em}
  .stat .v{font-size:17px;font-weight:700;margin-top:2px}

  .axis{margin-bottom:9px}
  .axis .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
  .axis .lab b{font-weight:600}
  .axis .track{height:7px;background:#0d1119;border-radius:99px;overflow:hidden}
  .axis .track > i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);border-radius:99px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:12px;padding:3px 10px;border-radius:99px;background:#1d2736;border:1px solid var(--line);color:#b9c6da}
  .chip.axis{background:#12283a;border-color:#22506e;color:#9ddcf8}
  .tagline{font-size:15px;font-weight:600;color:var(--gold);margin:8px 0 4px;letter-spacing:.01em}
  .hero .tagline{font-size:17px}
  .block{margin-top:16px}
  .block .bt{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--dim);
    text-transform:uppercase;margin-bottom:6px}
  .block p{font-size:14.5px;line-height:1.78;color:#cbd5e1}
  .cards{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .cc{font-size:12.5px;padding:5px 11px;border-radius:8px;background:#101a24;
    border:1px solid #24384a;color:#9fb4c8}
  .cc b{color:#dfeaf4;font-weight:600}
  .cc i{font-style:normal;color:#67809a;font-size:11px;margin-left:5px}
  .cc.key{border-color:#3a5a78;background:#12252f}
  a{color:var(--accent)}
  .divider{height:1px;background:var(--line);margin:22px 0}
  .warn{background:#2a1f14;border:1px solid #5c3f1c;color:#f5d9a8;padding:12px 14px;border-radius:10px;font-size:13.5px}
  @media(max-width:560px){.card{padding:20px}.hero{padding:20px}}
</style>
</head>

,"Adventures":"冒险","Advisors":"参谋","Apes":"猿猴","Blood":"血滴","Clash":"争斗","Clues":"线索","Crime":"罪行","Daleks":"戴立克","Day / Night":"昼夜","Deserts":"沙漠","Devils":"恶魔","Elephants":"象","Enrage":"激怒","Fling":"投掷","Foretell":"预视","Fungi":"真菌","Gnomes":"侏儒","Golems":"魔像","Guildgates":"公会门","Illusions":"虚影","Kaheera Companion":"卡希拉行侣","Keywords":"关键字","Land Animation":"地牌活化","Life Exchange":"生命交换","Madness":"疯狂","Mana Dorks":"产费生物","Monkeys":"猴","Necrons":"死灵","Nightmares":"梦魇","Oozes":"软泥","Orcs":"半兽人","Outlaws":"不法之徒","Persistent Petitioners":"执着的请愿人","Plot":"谋划","Primal Surge":"原初涌动","Relentless Rats":"无情鼠","Scarecrows":"稻草人","Shadowborn Apostles":"影裔使徒","Slime Against Humanity":"对抗人类的黏液","Sunforger":"铸阳锤","The Ring":"魔戒","Unicorns":"独角兽","Web-slinging":"蛛丝摆荡","Werewolves":"狼人"},"descriptions":{"Y'shtola, Night's Blessed":{"tagline":"法术一多，掉血、抽牌、烧脸全套跟上","intro":"夜之民雅·修特拉（Y'shtola, Night's Blessed）会把场上的掉血换成你的手牌：每个回合结束前只要有人掉过四点血，你就白抽一张；你每用一张费用三点以上的咒语，她对每个对手各打两点伤害、让你回两点血。喜欢控制节奏的人会喜欢她。","build":"核心是「掉血换抽牌」：除灭（Snuff Out）这类拿血当费的牌正好能触发她抽牌；帕帕力莫·托托力莫（Papalymo Totolymo）和第三席爱梅特赛尔克（Emet-Selch of the Third Seat）能和她连成一条链。莉瑟·赫克斯特（Lyse Hext）让非生物咒语更便宜。用便宜咒语换掉对手的关键威胁，等她的手牌优势滚起来再动手。"},"Edgar Markov":{"tagline":"吸血鬼越打越多，主将不上场也在铺场","intro":"艾德嘉马可夫（Edgar Markov）是万智牌里最直白的吸血鬼头子：只要他在主将区，你每用一张别的吸血鬼咒语，他就白送一个 1/1 吸血鬼衍生物，完全不用等他上场；他自己先攻、敏捷，一进攻就给所有吸血鬼加一层强化。","build":"生物位尽量留给吸血鬼：蛊惑吸血鬼（Captivating Vampire）、热忱吸血鬼（Cordial Vampire）和迎宾吸血鬼（Welcoming Vampire）都能一边铺场一边继续补牌。暮影蔷薇之棘维托（Vito, Thorn of the Dusk Rose）能把回血变成打脸。三色护符负责调色，几张双色地保证不卡手；他费用不低，前几回合站住。"},"The Ur-Dragon":{"tagline":"五色巨龙越铺越大，一进攻就换一桌牌","intro":"太初龙（The Ur-Dragon）是五色五费的巨龙，但价值在他躺在主将区也生效：你施放的其它龙咒语都少付一点法术力。他自己飞行，只要有一群龙一起进攻，就能按数量抽牌，还能把手里的一张永久物直接放进场。喜欢大生物的人会喜欢它。","build":"先把地铺好，太初龙需要五种颜色。龙位放上古龙卫米瑞穆（Miirym, Sentinel Wyrm）、提亚玛特（Tiamat）和龙后拉黎丝（Lathliss, Dragon Queen）。铁木尔霸权（Temur Ascendancy）给全体敏捷还能抽牌。龙都很贵，前期要忍，手里一堆大龙却没有地是最常见的问题。"},"Atraxa, Praetors' Voice":{"tagline":"让所有指示物一边长大，一边越变越多","intro":"魔判官之声亚崔夏（Atraxa, Praetors' Voice）是会飞行、警戒、死触、系命的天使，每个回合结束时你繁殖一次：场上和玩家身上每种已有的指示物都再加一个。这套牌不追求爆发，而是让指示物慢慢变多，适合喜欢看着自己的东西长大的人。","build":"把产生指示物的牌铺开：演化智者（Evolution Sage）让每次地进场都繁殖，求知圣主特库索（Tekuthal, Inquiry Dominus）把繁殖翻倍，难阻浪潮（Inexorable Tide）让你每用一张咒语就繁殖；泰兹瑞的计策（Tezzeret's Gambit）能补牌再繁殖。四色的地优先放能调色的，别让牌卡在手上。"},"Krenko, Mob Boss":{"tagline":"鬼怪越铺越多，最后一波直接带走","intro":"暴民头目克仑可（Krenko, Mob Boss）是最好懂的主将之一：横置他，你就造出一群 1/1 红色鬼怪衍生物，数量等于你场上鬼怪的数量——几回合后就是一大片。鬼怪本身便宜、能很快进攻，适合刚入门、想体验「我的生物比对手多」的人。","build":"鬼怪战酋长（Goblin Warchief）和鬼怪酋长（Goblin Chieftain）既减费又给全体敏捷，精灵王（Goblin King）再叠一层加攻。攻城指挥官（Siege-Gang Commander）一次带三个衍生物，冲击震颤（Impact Tremors）让每个进场的生物都往对手脸上打一点。他清场后你常会空手空场，别把希望全押一波。"},"Vivi Ornitier":{"tagline":"法术一多，他就暴涨，脸也跟着掉血","intro":"比比·奥尼提尔（Vivi Ornitier）把「多用法术」换成伤害：你每用一张非生物咒语，他就多一个加攻指示物，并对每个对手各打一点；他还能横置产生一大笔蓝红法术力，数量等于他的攻击力，越到后面越能连着出牌。喜欢连甩咒语的人会喜欢他。","build":"关键的搭配是好奇（Curiosity）：贴在他身上，他每次打到对手你都能抽一张，于是法术越多抽得越多、伤害也越高。欧菲迪安蛇眼（Ophidian Eye）和协力警戒员（Tandem Lookout）是同一套路。开局用低费法术把他的攻击力养大；但他很脆，一旦被打掉整条链就断了。"},"Sauron, the Dark Lord":{"tagline":"对手每用一张牌，你的兽人军团就长一圈","intro":"黑暗魔君索隆（Sauron, the Dark Lord）不自己动手，靠对手动手：对手每用一张咒语，你的兽人军队就多一个强化指示物；军队打到人时魔戒会诱惑你，你可以弃掉整手牌换四张新的。整套牌是兽人、魔戒、坟场三件事搅在一起，头几次玩会有点绕。","build":"魔戒相关的牌是骨架：魔戒呼唤（Call of the Ring）每回合诱惑你并补一张，白手萨茹曼（Saruman, the White Hand）让你的咒语按费用给军队加指示物，安格玛巫王（Witch-king of Angmar）能逼对手牺牲生物。索隆遗宝（Relic of Sauron）出三色法术力还能弃牌抽牌。地放能调色的三色地。"},"Kaalia of the Vast":{"tagline":"她一挥翅膀，天使恶魔龙直接砸下来","intro":"穹境的卡莉雅（Kaalia of the Vast）是飞行的三色主将：她攻击某个对手时，你可以从手里把一张天使、恶魔或龙的生物直接放进场，横置着攻击那个对手——本来要七八点法术力的大生物，靠她能提前砸下来。喜欢一回合制造巨大压力的人会喜欢她。","build":"天使、恶魔、龙要占多数：金夜之刃姬瑟拉（Gisela, Blade of Goldnight）和符痕恶魔（Rune-Scarred Demon）都能在她一攻击时立刻兑现价值，战领欧瑞梨（Aurelia, the Warleader）多给你一次战斗，等于多放一只大生物。三色地负责调色，加速也要放够，否则手里全是七八费的东西会很尴尬。"},"Teval, the Balanced Scale":{"tagline":"进攻就磨牌，磨完再把地捡回来继续铺","intro":"公正鳞龙特瓦尔（Teval, the Balanced Scale）是一只会飞的龙：每次攻击先磨三张牌，然后把坟场里的一张地横置放回场；只要有牌离开你的坟场，你就得到一个 2/2 僵尸德鲁伊。进攻、磨牌、回收、铺场串成一条链，适合喜欢坟场套牌的人。","build":"要让坟场不停进进出出：特瓦尔的裁决（Teval's Judgment）每次都能给你一点好处，晶石蟹（Hedron Crab）让每张地进场都多磨三张，黑土滋壤（Life from the Loam）把三张地捡回手继续铺；墓场匍尸（Gravecrawler）能从坟场反复爬出来。地要放够，注意出场顺序，链子一断就什么都没了。"},"Fire Lord Azula":{"tagline":"一边打架一边甩法术，每张都来两份","intro":"烈火君阿祖拉（Fire Lord Azula）围绕「打架时用法术」设计：她进攻时会给你一笔红色法术力，只要她正在进攻，你用的每张咒语都会多复制一份，复制品还能重新选目标。一回合里先打人再连甩咒语，场面会突然翻倍，适合喜欢快节奏的人。","build":"低费法术是弹药：暴风窑艺家（Storm-Kiln Artist）每用或复制一张瞬间、法术就给你一个珍宝，荣休大法师（Archmage Emeritus）让你每张都抽一张。大干一票（Big Score）和意外横财（Unexpected Windfall）既补牌又出珍宝。只有她进攻时才有复制，注意时机。"},"Ms. Bumbleflower":{"tagline":"给对手递牌，自己把场面堆得更高","intro":"野花小姐（Ms. Bumbleflower）是「送牌换成长」的主将：你每用一张咒语，就让一个对手抽一张，同时给一个生物加一层强化并让它飞行；如果这是本回合第二次结算，你自己抽两张。她逼你算清楚送出去的牌值不值，适合喜欢政治的人。","build":"围绕「给对手抽牌」做文章：蹊径会的罗兰（Loran of the Third Path）可以横置让双方各抽一张，长河拉拽（Long River's Pull）和职业：法师（Wizard Class）能把送牌变成你自己的收益。廿蚪蟾蜍（Twenty-Toed Toad）不限手牌上限，越攒越多。加速和双色地要放够，别忘给对手的牌会变成他们的资源。"},"Pantlaza, Sun-Favored":{"tagline":"每来一只恐龙，就从牌库顶白捡一张","intro":"烈阳眷恩潘塔札（Pantlaza, Sun-Favored）每次有恐龙进场（包括它自己）时，都能从牌库顶开始翻，免费放出一张比它便宜的牌，每回合只能来一次。所以手感是「一只接一只」，越打越大，适合喜欢大生物、喜欢每次翻出惊喜的人。","build":"恐龙和强化恐龙的牌是主体：怨怒迅猛龙（Wrathful Raptors）能把受到的伤害反弹出去，撼地血口龙（Earthshaker Dreadmaw）进场按恐龙数量抽牌，好奇硕伟龙（Curious Altisaur）让恐龙打中人就抽牌；荒野韵律（Rhythm of the Wild）给全体敏捷。发现每回合只有一次，出手顺序要想清楚。"},"Giada, Font of Hope":{"tagline":"便宜的白天使主将，天使一来就自带强化","intro":"希望圣源吉娅妲（Giada, Font of Hope）是两费、飞行警戒的天使：她每多存在一会儿，你之后施放的其他天使进场时就多带一层强化指示物，所以越早出场越赚；她自己还能横置产生白色法术力。规则简单，很适合第一次自己组牌的新人。","build":"天使要放多：黎明使者莱拉（Lyra Dawnbringer）给全体天使加攻、系命和先攻，年轻女武神（Youthful Valkyrie）会随着天使进场不断长大，华辉天使（Resplendent Angel）在你回够血时造出天使衍生物。斯达海姆求索客（Starnheim Aspirant）让天使咒语更便宜。天使虽然大只但都很贵，别急。"},"Lathril, Blade of the Elves":{"tagline":"妖精越铺越多，最后一次性吸干全场","intro":"妖精之刃拉席莉（Lathril, Blade of the Elves）只要打中对手，就按伤害量造出等量的 1/1 妖精战士衍生物，她一个人就能把场面铺起来；她还藏着一招：横置自己和十个妖精，每个对手各掉十点生命、你回十点。喜欢妖精部落的人会喜欢她。","build":"产法术力的小妖精是地基：妖精高位德鲁伊（Elvish Archdruid）和泰坦尼亚牧师（Priest of Titania）都能按妖精数量一次产出很多绿色法术力，骄傲至美（Imperious Perfect）和善战妖精（Elvish Warmaster）一边加攻一边造人。她只有两点防御，很容易被打掉，前期先铺稳地和大妖精。"},"The Wise Mothman":{"tagline":"大家一起磨牌，磨出来的东西全变成强化","intro":"天蛾人智者（The Wise Mothman）是飞行的三色主将：它进场或攻击时每个人都得到一个辐射指示物，被辐射的人会不断磨掉牌库顶的牌；每当有非地的牌被磨掉，你就能给若干个生物各加一层强化。你越磨场面越大，适合喜欢磨牌的人。","build":"辐射和磨牌是主线：发光种（Glowing One）每次打中对手就给对方四个辐射，乱心辐射海鸥（Vexing Radgull）专门给还没辐射的人补上，泥沼蟹女王（Mirelurk Queen）让每次磨牌都换成一张牌加一层强化；异尘余生（Nuclear Fallout）是难得的清场。三色地和调色要放够，辐射是全场的，你也会被磨。"},"Toph, the First Metalbender":{"tagline":"神器当地用，地牌则变成会打人的生物","intro":"冶金师始祖拓芙（Toph, the First Metalbender）把两件平时不相干的事凑到一起：你场上的神器同时也算地，而每个回合结束时你会运土 2，把一张自己的地变成带两个强化指示物的生物，它死后还会回来。喜欢地牌和神器的人会喜欢她。","build":"神器是地基：脓水涌泉（Ichor Wellspring）进场和离场都能抽牌，反复利用很划算。运土的伙伴也放上：力量全开的布米（Bumi, Unleashed）进场就运土 4；固执师父拓芙（Toph, Hardheaded Teacher）和运土宗师拓芙（Toph, Earthbending Master）都能持续运土。注意神器算地并不等于能产法术力。"},"Jodah, the Unifier":{"tagline":"传奇越铺越多，然后互相把对方拉上场","intro":"诸界一统裘达（Jodah, the Unifier）是五色主将，核心只有一句话：你每从手里用一张传奇咒语，就从牌库顶往下翻，直到翻出一张更便宜的传奇牌免费放出；同时你场上的传奇生物会按传奇数量互相加攻防。喜欢满桌名人的人会喜欢它。","build":"生物位几乎全给传奇：晴空号船长西赛（Sisay, Weatherlight Captain）能直接把传奇永久物找出来，潜探灾祸夏义德（Shanid, Sleepers' Scourge）让你每用一张传奇就抽一张，克撒的毁世震荡（Urza's Ruinous Blast）能清掉全场非传奇的永久物。五色地要放足，传奇占比不够高的话，裘达会经常翻空。"},"Nekusar, the Mindrazer":{"tagline":"让所有人多抽牌，然后每抽一张就打一下","intro":"毁灵师奈库萨（Nekusar, the Mindrazer）干的是「送牌又打人」：每个玩家抽牌时都多抽一张，而每个对手每抽一张牌就被打一点。表面上你在帮大家补牌，实际上把整套牌变成一道慢慢累加的伤害，喜欢让全场都难受的人可以试试。","build":"多让人抽牌的牌越多越好：地底幻梦（Underworld Dreams）、嚎叫的矿井（Howling Mine）和乱涂匍体（Scrawling Crawler）都能让对手一边补牌一边掉血，横财（Windfall）让所有人弃掉手牌重抽一轮，一轮就能打掉一大截。三色护符和双色地负责调色；给别人补牌是双刃剑，对手手里有解牌时最先倒霉的是你。"},"Cloud, Ex-SOLDIER":{"tagline":"装备全挂在他身上，一刀一刀换牌换伤害","intro":"前神罗战士克劳德（Cloud, Ex-SOLDIER）围绕装备设计：他自带敏捷，进场时能直接挂上一件装备；之后每次攻击，场上有装备好的攻击生物就抽牌，攻击力够大时还会白给两个珍宝。喜欢把装备一件件叠在同一个人身上、看他一刀砍穿的人会喜欢他。","build":"先把挂件凑齐：巨锤（Colossus Hammer）能给他很大加成，物灵师之剑（Sword of the Animist）让他攻击时找地，征服者连枷（Conqueror's Flail）挂上时能压住对手的施放。净钢神圣武士（Puresteel Paladin）让装备进场就能抽牌，格斗家蒂法（Tifa, Martial Artist）补上多个对手时的收益。"},"Hearthhull, the Worldseed":{"tagline":"牺牲地牌换牌，同时把对手的血一点点磨掉","intro":"播世之种芯炉号（Hearthhull, the Worldseed）是一艘主将飞船：你可以横置生物给它加充能指示物；攒到两个以后，每回合能牺牲一张地来抽两张牌并多铺一张地；攒到八个，它自己变成会飞、警戒、敏捷的生物。你每次牺牲地，对手都掉血。","build":"把地当资源用：慕达雅先知（Oracle of Mul Daya）让你每回合多铺一张地，绚烂复生（Splendid Reclamation）一口气把坟场里的地全捞回来，整地（Harrow）一次换两张地进场，事后分析师（Aftermath Analyst）磨三张再回收所有地。地牌要放得比一般套牌多，牺牲太快断地是最常见的问题。"},"Kefka, Court Mage":{"tagline":"逼全场弃牌，再把对手的掉血换成抽牌","intro":"宫廷魔法师凯夫卡（Kefka, Court Mage）进场或攻击时，每个玩家各弃一张牌，然后你按弃掉的牌类型数量抽牌；凑出八点法术力后他还能翻面，翻面后你在自己回合里让对手掉多少血，就抽多少张牌。靠逼对手弃牌换资源，但很讲究时机。","build":"弃牌触发是主线：物尽其用（Waste Not）在对手弃牌时给你法术力或衍生物，饰品妙盗细骨（Tinybones, Bauble Burglar）把对手弃掉的牌收起来让你之后自己用，菁华异变（Essence Flux）能在关键时刻把他送回场，再触发一次进场弃牌。三色地要放够，翻面前先攒好八点法术力。"},"Yuriko, the Tiger's Shadow":{"tagline":"小生物打不透就换忍者，翻到贵牌直接打脸","intro":"虎影百合子（Yuriko, the Tiger's Shadow）有指挥官忍术：只要你的攻击生物没被挡住，就能花两点蓝黑把它从主将区直接换进场；之后每次有忍者打中对手，你翻开牌库顶一张收进手牌，同时每个对手掉与那张牌费用相同的血。","build":"低费忍者和小生物是主体：妙手渗透者（Ingenious Infiltrator）能让你多抽牌，化形黜人（Changeling Outcast）和扑翼机（Ornithopter）是几乎挡不住的忍者载体，浪人梅泽哲子（Tetsuko Umezawa, Fugitive）让攻击力一点的生物都难以格挡。双色地和低费牌要放够；忍术的时机要多练几局才顺手。"},"Kenrith, the Returned King":{"tagline":"想要什么就按哪个，五色技能随你挑","intro":"复归国王肯理斯（Kenrith, the Returned King）是五色的万能主将：花不同颜色的法术力，他能让全体生物获得践踏和敏捷、给生物加强化、给某个玩家回血或抽一张牌，或者从坟场复活一个生物。你想让这套牌偏哪边都行。","build":"关键是让技能更便宜、能反复用：训练场（Training Grounds）和生机术士佣兽（Biomancer's Familiar）都能把启动费用降两点，苗生谬思（Seedborn Muse）让你在别人回合反复启动。五色地是重点；因为要五色，前几回合容易慢，别急着一次启动好几个技能。"},"Sephiroth, Fabled SOLDIER":{"tagline":"不停牺牲小生物，一边抽牌一边吸血","intro":"传奇神罗战士萨菲罗斯（Sephiroth, Fabled SOLDIER）是黑色主将：他进场或攻击时，你可以牺牲另一个生物换一张牌；之后每当有别的生物死掉，某个对手掉一点血、你回一点血，本回合第四次结算时他直接翻面。适合喜欢牺牲流的人。","build":"要源源不断有小生物可牺牲：舞蛇术士（Ophiomancer）每回合都给你一条蛇，鲜血画家（Blood Artist）让每次死亡都变成吸血，冷酷袭劫者（Pitiless Plunderer）和繁殖地易魂师（Warren Soultrader）把死亡换成法术力；遭弃矿工（Forsaken Miner）死后还能从坟场爬回来。别为了翻面而乱牺牲。"},"Isshin, Two Heavens as One":{"tagline":"进攻触发全部翻倍，一次攻击干两份活","intro":"二天一流一心（Isshin, Two Heavens as One）自己不打架，他做的事情是把「攻击时触发」的能力全部再触发一次：只要有生物进攻引起的触发，都会额外结算一遍。把重点放在攻击触发的牌上，同样的进攻能榨出双倍收益，适合喜欢快攻的人。","build":"找「攻击时」有收益的牌：锡街头目克仑可（Krenko, Tin Street Kingpin）每次攻击都按攻击力造一堆鬼怪，物灵师之剑（Sword of the Animist）让他攻击时找地；华辉护教军艾德琳（Adeline, Resplendent Cathar）人多时攻击力很高。触发多容易漏。"},"Baylen, the Haymaker":{"tagline":"手下人越多，法术力、牌和拳头全都越多","intro":"干草堆匠拜棱（Baylen, the Haymaker）把衍生物当成资源：横置两个衍生物给你一点任意颜色的法术力，横置三个抽一张牌，横置四个就在他自己身上加三层强化并让他获得践踏。你铺的每一群小东西都能换资源，剩下的还能拿来打人。","build":"衍生物来源要足够：肌肉野兔（Jacked Rabbit）攻击时不断造兔子，二度收获（Second Harvest）能把你场上的衍生物一口气翻倍，王牌弓手芬纳斯（Finneas, Ace Archer）给每个衍生物加一层强化，金圆喷泉（Halo Fountain）可以反复造出公民衍生物。三色地和调色要放够，别让衍生物横不出法术力。"},"Valgavoth, Harrower of Souls":{"tagline":"对手一掉血他就长大，顺手再给你一张牌","intro":"搅魂魔瓦伽沃（Valgavoth, Harrower of Souls）是会飞的双色恶魔：对手每个回合第一次掉血时，他就多一层强化、你抽一张牌；别人要指定他，还得先付两点生命。这套牌不需要自己动手，只要让对手持续掉一点血，他就会越滚越大。","build":"让对手一直掉血的牌是核心：奇登磊寄生怪（Kederekt Parasite）、析命巫婆（Fate Unraveler）和尖头锐器人（Razorkin Needlehead）都能在对手抽牌时打他一点，屠戮神墨癸斯（Mogis, God of Slaughter）在对手维持时直接掉两点血；渎神行径（Blasphemous Act）负责清场自保。"},"Miirym, Sentinel Wyrm":{"tagline":"每条龙都变两条，龙多到桌子放不下","intro":"上古龙卫米瑞穆（Miirym, Sentinel Wyrm）是六费的飞行龙，效果非常直接：每当有非衍生的龙在你场上进场，就再变出一个它的复制品，只是复制品不再是传奇。你放一条龙就得到两条，两条又各自触发别的龙的效果。","build":"先用减费和加速把它放出来：龙袭风暴（Dragon Tempest）让每条龙进场都打一点伤害，龙后拉黎丝（Lathliss, Dragon Queen）自己也能不断造龙，灭世龙王安塔卡（Atarka, World Render）让每条进攻的龙获得双击，伐卡兹祸害（Scourge of Valkas）按龙的数量打伤害。三色地要放足，龙都偏贵。"},"Chatterfang, Squirrel General":{"tagline":"你造任何衍生物，都额外多一群松鼠","intro":"松鼠将军聒牙（Chatterfang, Squirrel General）把所有衍生物都变成松鼠：你原本要造的任何衍生物，除了它本身，还会额外多出等量的 1/1 绿色松鼠。他还能花一点黑牺牲松鼠，让某个生物掉同样的攻防。","build":"衍生物越多越好：松鼠巢穴（Squirrel Nest）能让一张地不断产松鼠，叽响喷吐器（Chitterspitter）会让松鼠越打越大，繁根教的哈珠儿（Hazel of the Rootbloom）能把衍生物复制一份，密讯信使托斯奇（Toski, Bearer of Secrets）保证你打人就能抽牌。松鼠虽多但都很小，一张清场会收走一大片。"},"Ulalek, Fused Atrocity":{"tagline":"每用一张奥札奇，就把这一手全复制一遍","intro":"残暴合体钨拉雷（Ulalek, Fused Atrocity）是五色的奥札奇主将：你每用一张奥札奇咒语，只要再付两点无色法术力，就能把你当时控制的所有咒语、所有启动式和触发能力统统复制一份。看上去绕，实际就是「这回合做的事全部再来一次」。","build":"无色法术力和奥札奇是两条腿：奥札奇殿堂（Eldrazi Temple）专门产无色法术力，遭弃纪念碑（Forsaken Monument）让无色生物更大、产法术力时还多给，眩目片肉体（Glaring Fleshraker）每用一张无色咒语就造一个能换法术力的衍生物；尽归尘土（All Is Dust）是清场利器。复制要留两点无色，别把法术力全花光。"},"Hashaton, Scarab's Fist":{"tagline":"弃掉大生物，花两点蓝换一个 4/4 僵尸","intro":"甲虫神之拳哈夏顿（Hashaton, Scarab's Fist）是两费主将，把弃牌变成场面：你每次弃掉一张生物牌，只要再付两点蓝，就能造出一个复制它、但是 4/4 黑色僵尸的衍生物，而且是横置进场。你丢掉的大生物不但不浪费，还能再用一次。","build":"要让弃牌稳定发生：苦刑生活（Tortured Existence）可以反复把生物从坟场换回手再弃掉，魂魅小偷（Ghostly Pilferer）在你每次重置时能付费抽一张，灵能蛙（Psychic Frog）让弃牌顺便变成强化，狂搜乱寻（Frantic Search）一次补两张牌再弃两张，正好供给主将。手牌太少时这套牌会卡住。"},"Frodo, Adventurous Hobbit // Sam, Loyal Attendant":{"tagline":"不停做饭回血，攒够了就让魔戒勾引你","intro":"雄心霍比特人弗罗多（Frodo, Adventurous Hobbit）和忠诚随员山姆（Sam, Loyal Attendant）是一对搭档主将：弗罗多进攻时，只要你本回合回过三点以上的血，魔戒就诱惑你一次；攒够还抽牌，整套牌围绕食品和回血打转。","build":"食物和回血是主体：佩里格林·图克（Peregrin Took）让你造的每个衍生物都多带一个食品，山姆怀斯·甘姆吉（Samwise Gamgee）在每个非衍生物生物进场时给你一个食品，南小路的罗西·科顿（Rosie Cotton of South Lane）能两边兼顾。这套牌进攻不强，要耐得住性子，把优势一点点攒起来。"},"Ashling, the Limitless":{"tagline":"元素半价提前下场，死了还会变成两份","intro":"瀚力无边灰儿（Ashling, the Limitless）围绕「呼引」设计：你从手里施放元素生物时多了一个便宜的替代费用，用它施放的话，元素进场后会被牺牲；而每当你有非衍生的元素被牺牲，你就造出一个它的复制品，只是得付五色法术力把它留下。","build":"元素要放够：醒转暗礁（Risen Reef）让你每放一个元素就翻牌库顶，是地就进场、是牌就收进手里；漂念精（Mulldrifter）用呼引放下来就是「抽两张再变两条」。编焰师（Flamebraider）和编烟师（Smokebraider）专门产元素咒语要的法术力。五色地要放足，呼引的时机也要练。"},"Bello, Bard of the Brambles":{"tagline":"桌上一堆神器结界，全都站起来一起打","intro":"刺棘诗人贝洛（Bello, Bard of the Brambles）在自己的回合里，把你那些费用四点以上的非装备神器和非灵气结界都变成 4/4 元素生物，而且自带不灭、敏捷和「打中就抽一张牌」。平时只用来加速、抽牌的神器和结界，都会站起来打人。","build":"牌表尽量塞四费以上的神器和结界：狂战士猛攻（Berserkers' Onslaught）给攻击生物双击，无端暴力（Gratuitous Violence）让伤害翻倍，超凡成长（Unnatural Growth）每次战斗前把攻击力翻倍；索蓝发电机（Thran Dynamo）负责加速。敏捷只在你的回合生效，别当生物挡。"},"Esika, God of the Tree":{"tagline":"每回合白放一个生物，传奇越多越顺手","intro":"世界树神埃西卡（Esika, God of the Tree）正面是便宜的神，自己就能产任意颜色法术力，还能给其它传奇生物同样的产费能力；背面虹彩桥（The Prismatic Bridge）在你每个维持时翻到一张生物或鹏洛客牌，直接免费放进场。","build":"传奇生物和鹏洛客是主体：法老神尼可波拉斯（Nicol Bolas, God-Pharaoh）这种平时太贵的鹏洛客也能免费出场，太古诸龙的辉煌重生（Primevals' Glorious Rebirth）能把坟场里的传奇永久物捞回来，泰菲力的誓约（Oath of Teferi）让鹏洛客能力一回合用两次；世界树（The World Tree）能让地变任意色。"},"Hakbal of the Surging Soul":{"tagline":"全族人鱼一起探索，一边变大一边铺地","intro":"翻涌之魂哈巴尔（Hakbal of the Surging Soul）只做人鱼这一件事：你每个战斗开始时，所有人鱼一起探索——翻牌库顶一张，是地就进手牌，不是地就给那条人鱼加一层强化；他自己进攻时还能把手里的地直接铺进场，做不到就改成抽一张。","build":"人鱼要放满：珍珠三叉戟大师（Master of the Pearl Trident）给全体人鱼加攻，海空女神希亚尔（Svyelun of Sea and Sky）负责保护大家还能抽牌，水流通导师妮坎琪（Nicanzil, Current Conductor）让你探索到地就多铺一张；秘溪讯使（Herald of Secret Streams）让带强化的生物无法被挡。"},"Muldrotha, the Gravetide":{"tagline":"坟场就是第二个手牌，每回合都能再捞一次","intro":"腐潮穆杜塔（Muldrotha, the Gravetide）把你的坟场变成第二个手牌：你自己的每个回合里，可以再从坟场施放每种永久物类型各一张，还能多铺一张地。丢掉的东西不是浪费，而是排在下一次使用的队列里，规则简单但操作上限很高。","build":"要往坟场里塞能反复用的牌：芽胞蛙（Spore Frog）每次牺牲就能挡掉一整回合的战斗伤害，原基缄印（Seal of Primordium）能反复拆对手的神器或结界，卡娅的魂体（Kaya's Ghostform）让重要生物死后再回来一次；樱宗长老（Sakura-Tribe Elder）负责找地。前期别急着把坟场清空，那是你的资源。"},"Rin and Seri, Inseparable":{"tagline":"猫狗互相召唤，越铺越多","intro":"林恩与瑟黎永不离是一对猫狗搭档：你施放一只狗，场上就多出一只猫；施放一只猫，就多出一只狗，生物会自己越变越多。它还能把狗的数量换成伤害、把猫的数量换成回血。喜欢可爱小动物、又爱看场面越铺越大的玩家会喜欢它。","build":"套牌主体是一大堆便宜的猫和狗，配上威严狞猫（Regal Caracal）、犬群领袖（Pack Leader）这类给同类加身材的生物，原本不起眼的小家伙就能变成能打的队伍，场面越滚越宽。赢的办法通常不是靠某一只特别大的生物，而是靠一整排加过身材的猫狗同时压过去。新人要注意：主将本身不管颜色，三种颜色的地牌得配厚一些，不然手里有牌也打不出来。"},"Glarb, Calamity's Augur":{"tagline":"牌库顶就是手牌，边看边用","intro":"灾祸卜算师格拉布让你随时能看牌库顶，并且可以直接从上面打出地牌和费用较高的咒语，等于多了一条抓牌通道。它自己带死触，挡人很讨厌，还能定期整理牌库顶。喜欢一边铺地一边慢慢磨、心思比较细的玩家会喜欢它。","build":"这套牌一半以上是地牌和找地的牌，靠探险（Exploration）每回合多下一块地快速铺开，主将则负责把牌库顶的牌变成能用的资源。摸到牲祭仪式（Culling Ritual）可以一次扫掉对手的小生物，但它连你自己的小东西一起清，出手前先数一数。新人要注意：先保证每回合都能下地，能看牌库顶的主将最好一直留在场上。"},"Animar, Soul of Elements":{"tagline":"生物越打越便宜，也越大","intro":"元素之魂阿尼玛每见到一张生物咒语就长大一圈，同时让生物越来越便宜，于是你能越打越多、越打越大。它不受白黑两种颜色的干扰，站场很稳。想体验一口气铺出一大排生物的玩家，会从它身上得到最多乐趣。","build":"铺场主要靠兽群语者（Beast Whisperer）这类每下一张生物就抓一张牌的生物，手牌不容易断。坚固鳞甲（Hardened Scales）能让主将多长一层，于是生物变得更快更便宜，滚起来非常快。新人要注意：前几回合先用便宜的小生物和找地的牌把颜色调顺，别急着把手里的大生物一口气全打出去，不然很容易后劲不足。"},"Aragorn, the Uniter":{"tagline":"每放一个咒语，就多一份好处","intro":"重联君王阿拉贡是四色主将，你每施放一个咒语，它就按颜色给你不同的回报：白的多一个士兵，蓝的帮你先看牌，红的直接打对手一下，绿的把某个生物养肥。等于每张牌都顺手多带一点效果。喜欢把各种颜色的好牌混着用的人会很满足。","build":"因为每种颜色都能触发回报，组牌时可以把四种颜色的好牌混着用。安妮入伙（Annie Joins Up）、波洛斯护符（Boros Charm）这类多色咒语一次就能触发好几条效果，等于一张牌干好几件事。新人要注意：这套牌对颜色要求很高，地牌要优先保障四种颜色都出得来，节奏偏慢，别急着抢攻，把主将稳稳放下场更重要。"},"Arcades, the Strategist":{"tagline":"守军不再只会挡，还能打人","intro":"智龙阿卡迪把只能防守的守军变成能主动进攻的部队，而且用它们的防御力来算伤害，越是站得住的墙，打人越疼。它自己会飞，还能在你每次放出守军时帮你抓一张牌。喜欢用别人眼中很慢的生物把对手顶穿的玩家会觉得很痛快。","build":"套牌里塞满各种守军。蔓生城垛（Overgrown Battlement）既挡人又能产法术力，别的守军进场时还会顺手帮你抓牌，手牌不会断。高度戒备（High Alert）是备用方案：万一主将被人清掉，它也能让守军照常打人。新人要注意：守军本身不能攻击，全靠主将把这条限制去掉，所以主将不在场时先老老实实防守，别硬冲。"},"Ygra, Eater of All":{"tagline":"全场都算食物，吃掉就长大","intro":"万生噬兽依格拉有个古怪的设定：场上所有生物同时都算食物，谁都能被吃掉换三点生命。而它真正在意的是，每当有食物离开战场，它就长大两圈。所以你会不断牺牲自己的小东西，把它喂成一头巨兽。喜欢拿生物当消耗品的玩家会喜欢。","build":"思路是一边造食物一边吃掉。金鹅（Gilded Goose）这类生物进场就带一份食物，佩里格林·图克（Peregrin Took）让你每次造东西都额外多一个食物，喂主将的速度会快很多。新人要注意：主将的护身符是有人想动它就得先牺牲一个食物，所以别把食物全吃光，手里留着点余地更安全；吃掉对手的生物也能让它长大。"},"Maralen, Fae Ascendant":{"tagline":"用对手的牌，去打对手","intro":"化身仙儿的马拉兰会飞，每当她和自己这边的妖精、仙灵进场，就把对手牌库顶的两张牌流放出去。你场上这类生物越多，能免费施放的咒语就越贵，等于借用对手的好牌。喜欢偷牌、喜欢算数量差、不介意打得慢一点的玩家会喜欢。","build":"大部分位置留给便宜的妖精和仙灵。罗堰妖精（Llanowar Elves）这类既帮你加速又算进数量，苦涩花开（Bitterblossom）每回合稳定造出会飞的仙灵，数量堆得比对手清得快。等数量够了，主将就能免费放出对手被流放的好牌。新人要注意：前期不要急着进攻，先把数量铺起来，这套牌是越到后面越舒服的类型。"},"Mr. House, President and CEO":{"tagline":"掷骰子，出衍生物，赚宝物","intro":"总裁兼执行官豪斯先生靠掷骰子办事：掷出四点以上就冒出一个衍生物，掷到六还能额外拿一份宝物。宝物不只是钱，还能让你在启动主将能力时多掷几颗骰子。喜欢赌运气、喜欢每回合都有意外惊喜的玩家会觉得这套牌很有意思。","build":"套牌里放的都是和掷骰子有关的牌。职业：野蛮人（Barbarian Class）让你多掷一颗骰子并丢掉最小的那颗，掷出好点数的概率明显提高；乱心魔盒（Vexing Puzzlebox）按掷出的点数攒指示物，攒够了还能换个大家伙。新人要注意：宝物别急着花掉，留着让主将多掷几颗骰子更划算，一次多掷几颗比一次只掷一颗靠谱得多。"},"Caesar, Legion's Emperor":{"tagline":"一开打就牺牲一只，换两样好处","intro":"军团皇帝凯撒在你每次进攻时，可以牺牲掉另一个生物，然后从三个选项里挑两样：立刻多两个正在攻击的士兵、抓一张牌并掉一点血、或者按场上衍生物的数量直接打对手一下。进攻本身变成了资源。喜欢主动出击、边打边赚的玩家会很中意。","build":"套牌里要有足够多便宜、死了也不心疼的小生物。备忘夹（Skullclamp）能把要被牺牲的小兵换成两张牌，卫护荒漠（Secure the Wastes）则能一口气铺出一大排小生物，既能喂给主将也能直接压过去。新人要注意：进攻时每次都得决定牺牲谁，别把唯一还能挡人的生物送出去；也别舍不得牺牲，白送的收益不拿就浪费了。"},"The Necrobloom":{"tagline":"每下一块地，就多一个衍生物","intro":"死冥盛花是一位和地牌紧紧绑在一起的主将：你每放下一块地，它就长出一个衍生物；当地名凑够七种不同的时候，出来的会更结实。它还能让坟场里的地牌被反复挖回来用。喜欢慢慢堆地、把游戏拖成自己节奏的玩家适合它。","build":"套牌里一半以上是地，而且尽量选名字不一样的地，好早点凑够七个不同名字，让每次落地出来的衍生物更结实。噬人蛙怪（The Gitrog Monster）能让你每回合多下一块地，硬盔虫聚群（Scute Swarm）则跟着每次落地不停繁殖。新人要注意：这套牌需要地不断进出，别把地捏在手里不下，下地本身就是这套牌最划算的动作。"},"Flubs, the Fool":{"tagline":"把手牌打空，就能一直抓牌","intro":"愚者法布斯让你每回合多下一块地，但它有个怪脾气：每次你下地或放咒语，手里还有牌就得弃一张，手牌空了才给你抓一张。所以这套牌追求的是把手牌打光。喜欢连打十几张牌、享受一气呵成的玩家会很上头，它也很考验出牌顺序。","build":"组牌思路是把费用尽量压低，让你一个回合能连着打出好几张牌。创生颂曲（Song of Creation）能让你边打边补牌，莲花眼镜蛇（Lotus Cobra）则在你每次下地时补上法术力，两张牌一起就转得很顺。新人要注意：手里留牌反而会被迫弃掉，出手前先想清楚这一回合要打哪几张，把顺序排好再动手，不然容易自己把好牌弃了。"},"Kuja, Genome Sorcerer":{"tagline":"法师越攒越多，伤害翻倍","intro":"基因组术士库加每回合都会白送一个法师，法师攒到四个它就会变身成更强的形态，之后它们造成的伤害全部翻倍。因为那些法师专门在你施放非生物咒语时咬对手一口，所以这套牌的伤害是一点一点磨出来的。喜欢慢慢磨死对手的人会喜欢。","build":"套牌里除了法师，还要配上大量非生物咒语。黑魔纹（Circle of Power）、黑色华尔兹3号（Black Waltz No. 3）都能顺手造出会咬人的法师，或者把这种伤害直接放大，非生物咒语越多咬得越狠。等法师攒够四个，主将变身，之后伤害还会翻倍。新人要注意：那些法师非常脆弱，别拿去挡人，让它们待在后排慢慢磨就好。"},"Wilhelt, the Rotcleaver":{"tagline":"僵尸死了不亏，还能换牌","intro":"断腐尸威海特让你死掉的僵尸不断变成新的僵尸回来。这些新僵尸不能挡人、打完就得牺牲，但拿来继续牺牲正合适。每到你的结束步骤，你还能吃掉一个僵尸换一张牌。喜欢用一整个僵尸潮把对手淹掉、也不怕自己亏牌的玩家会喜欢它。","build":"套牌里几乎全是僵尸。死亡爵主（Death Baron）给全队加身材又给死触，屋顶风暴（Rooftop Storm）甚至能让僵尸不用付法术力就下场，一回合铺出一排僵尸是常事，对手很难全部挡住。新人要注意：结束步骤的牺牲是自愿的，别忘了换牌；另外新冒出来的僵尸打完就得牺牲，不能留着挡人，别指望它们守家。"},"Oloro, Ageless Ascetic":{"tagline":"不出场也在加血，加血就反击","intro":"永生苦修士欧罗若有个特殊之处：只要它待在主将区，你每回合照样回两点生命，根本不用把它放出来。搭配上每次加血就让对手掉血的牌，你的生命值会直接变成对手的压力。喜欢稳扎稳打、慢慢把对手耗死的玩家会喜欢这套牌。","build":"这套牌不着急进攻，也不靠某一两张大牌定胜负。先把护灵师（Soul Warden）这类每次加血都有好处的小生物铺好，再让血色羁绊（Sanguine Bond）把回血直接变成伤害，你的生命值就变成了对手的压力。新人要注意：主将待在主将区也能每回合加血，不必急着让他下场；这套牌节奏偏慢，前几回合别乱用资源，慢慢磨就行。"},"Breya, Etherium Shaper":{"tagline":"牺牲神器，换解场或伤害","intro":"乙金塑师布莱娅本身就是一个神器，进场自带两个会飞的小飞机。你可以牺牲两个神器来发动它的能力：打对手三点、让一个生物变小、或者给自己回五点血。等于把场上的神器当成万能资源在用。喜欢摆弄神器、手上永远有选择的人会喜欢。","build":"套牌里全是便宜的神器，乙金塑师（Etherium Sculptor）让它们更便宜，悉诺议会宅邸（Seat of the Synod）这类神器地既产法术力又能拿去牺牲，材料永远不缺。主将的三个选项要按现场情况挑：打人、让生物变小、或者给自己回血。新人要注意：别把神器一次牺牲光，手上留两个备用答案更稳妥，不然遇到麻烦就没办法了。"},"Ureni of the Unwritten":{"tagline":"大龙落地，顺手再拉一条","intro":"未详之威乌列尼是一条又大又会飞的龙，它进场或攻击时都会翻牌库顶的八张牌，直接把其中一条龙拉到场上，运气好就是一回合多一条大龙。因为费用偏高，这套牌前半段主要在铺法术力和防守。喜欢大生物砸桌子的玩家适合它。","build":"套牌里其他牌几乎都是龙。龙袭风暴（Dragon Tempest）让它们落地就能打人，不用等一回合；铁木尔霸权（Temur Ascendancy）给全队敏捷还顺手帮你抓牌。主将每次翻牌库顶都能拉一条龙出来，运气好的时候场面会突然变大。新人要注意：主将费用很高，前几回合先铺法术力和防守，别急着让他下场，等有本钱再一口气压过去。"},"Meren of Clan Nel Toth":{"tagline":"死掉的生物，自己爬回来","intro":"奈拓族的莫伦记录你牺牲掉的每一个生物。攒够数量之后，它就能在结束步骤把坟场里符合条件的生物直接拉回场上，条件不够的至少也回到手上。于是你的生物变成了用完还能再用的资源。喜欢反复利用同一批生物、精打细算的玩家会喜欢它。","build":"套牌靠不断牺牲往前推进。拽脏预言师（Viscera Seer）这类随时可以把别的生物牺牲掉的小生物最合适，芽胞蛙（Spore Frog）甚至能挡下整整一回合的攻击，然后自己爬回来接着用。主将记录你牺牲掉的每一个生物，攒够数量就能在结束步骤把坟场里的生物拉回场上。新人要注意：经验数是主将给的，别随便把他换出场，结束步骤记得先想好拉谁。"},"Arabella, Abandoned Doll":{"tagline":"小生物越多，打人越疼","intro":"遭弃娃娃阿拉贝拉只要两点费用，很早就能下场。它每次攻击都会按你场上力量不超过二的生物数量，对每个对手各打一下，同时给你回等量的血。所以关键不是把生物养大，而是把小生物堆得越多越好。喜欢铺一地小家伙的玩家会喜欢。","build":"套牌里全是便宜的小生物。冲击震颤（Impact Tremors）让它们进场就咬对手一口，迎宾吸血鬼（Welcoming Vampire）在你铺小生物时帮你抓牌，伤害和手牌一起来，小生物就是这套牌的弹药。新人要注意：生物一旦被养到力量三以上就不再算数，给身材的牌要谨慎用；另外主将得真的打中对手才有收益，前期别让它白白送掉。"},"Kinnan, Bonder Prodigy":{"tagline":"产法术力的东西，一次产两份","intro":"持绊逸才季宁只花两点费用就能下场，它让所有不是地、但能产法术力的东西多产一份法术力，于是你能比别人更早拿到一大笔费用。攒够之后，它还能直接翻出牌库顶的生物放到场上。喜欢快速铺开、手里一直有牌可打的玩家会喜欢它。","build":"套牌里要放很多能产法术力的非地牌。玄武巨石（Basalt Monolith）这类神器在主将面前会多产出一份法术力，范得贺恩妖精（Fyndhorn Elves）这类小生物则负责前期把场面铺开，费用涨得比对手快很多。攒够之后，主将能直接翻出牌库顶的生物放到场上。新人要注意：这套牌启动很快，对手往往会盯着你，别在朋友局里第一次就掏出来。"},"Tidus, Yuna's Guardian":{"tagline":"指示物挪来挪去，越滚越大","intro":"尤娜护卫提达围绕指示物运转：开打前它可以把一个生物身上的指示物挪到另一个生物身上，让该长的长、该冲的冲。它自己这边带指示物的生物打中对手后，你还能抓一张牌并让场上的指示物再变多。喜欢精打细算、把资源挪来挪去的玩家会喜欢。","build":"套牌的核心是不断往生物身上堆指示物。坚固鳞甲（Hardened Scales）让每次放指示物都多一个，幻光盘（Sphere Grid）在你生物打中对手时继续往上加，越打越多。主将还负责把指示物从一个人身上挪到更需要它的地方。新人要注意：挪指示物是主动选择，每次开打前先想好挪给谁；主将不在场时这套牌会慢很多。"},"Teysa Karlov":{"tagline":"生物死了不亏，好处还翻倍","intro":"泰莎卡洛夫让生物死亡这件事产生双倍的好处：你那些死了就有回报的生物，效果会触发两次。它还会给场上的衍生物额外的好处。所以这是一套靠自己牺牲来赢的牌。喜欢看着对手在你每次牺牲时掉血、也不怕自己亏牌的玩家会很喜欢它。","build":"套牌里要有一批死掉就有好处的生物。筑拉波割喉客（Zulaport Cutthroat）这类生物让你每次牺牲都让对手掉血、自己回血，主将则让这些效果触发两次，收益直接翻倍。备忘夹（Skullclamp）负责把要被牺牲的小生物换成两张牌。新人要注意：主将只管死亡触发的效果，别的触发不会翻倍，别把它当成万能加倍器。"},"Zhulodok, Void Gorger":{"tagline":"高费无色咒语，一张当几张用","intro":"虚空饕体祖禄铎只关心一件事：费用很高、而且没有颜色的咒语。只要它在你场上，你从手里打出这类咒语就会白送两次翻牌机会，等于一张牌换出好几张。喜欢那种一张牌砸下来全场安静的感觉、并且不在意前期慢的玩家会喜欢它。","build":"套牌里要放一大堆费用高、而且没有颜色的咒语。尽归尘土（All Is Dust）这类咒语在主将面前会额外白送两次翻牌机会，等于一张牌换出好几张，场面说翻就翻。索蓝发电机（Thran Dynamo）负责把法术力堆上去，让你有本钱打出那些大家伙。新人要注意：这套牌前期很慢，前几回合别硬顶，先老实铺法术力。"},"Gishath, Sun's Avatar":{"tagline":"恐龙冲进去，又拉一堆恐龙","intro":"烈阳化身基撒斯是一条费用很高、但一旦打中对手就会疯狂拉龙的恐龙。它每次造成伤害，就翻开同样数量的牌，把其中的恐龙直接放到场上。所以这套牌前期几乎都在铺法术力。喜欢再等一回合就能翻盘这种大起大落的玩家会喜欢。","build":"套牌里几乎全是恐龙，能不能赢基本就看主将能不能打中对手。帝王龙首领（Regisaur Alpha）给全队敏捷，始啸埃泰力（Etali, Primal Storm）一进攻就能白拿对手的牌，两条大恐龙一起冲，对手很难全挡住。新人要注意：主将费用很高，前面几回合要靠便宜的法术力来源把地铺开，然后再让他落地打人；急着出只会被对手轻松处理掉。"},"Tom Bombadil":{"tagline":"传纪讲完一章，再免费接一章","intro":"汤姆·邦巴迪尔是一位和传纪绑在一起的主将：每当一个传纪讲到最后一章，它就从牌库顶翻出一张新的传纪直接放上场。传纪是一章一章慢慢结算的，所以这套牌是慢慢积累、逐步掌控场面的类型。喜欢故事感、喜欢一步一步布局的玩家会喜欢。","build":"套牌里主要放传纪。圣所织叶灵（Sanctum Weaver）按场上传纪的数量产法术力，洗澡歌（The Bath Song）一边讲一边帮你理手牌，传纪越多收益越大，场面是慢慢长大的。主将能在传纪讲完故事后，从牌库顶免费拉出一张新的继续讲。新人要注意：传纪是一章一章慢慢结算的，别急着一起放，节奏错开会顺很多。"},"Atla Palani, Nest Tender":{"tagline":"敲蛋换大生物，砸得越勤越赚","intro":"护巢人娥拉帕拉尼能造出蛋，也能在你敲碎蛋的时候翻牌库顶，把第一条翻到的生物直接拉到场上。所以套牌里的大生物越多，收益越大。它不靠慢慢铺场，而是靠几次关键的交换换来大东西。喜欢赌一把、喜欢突然翻出巨兽的玩家会喜欢。","build":"套牌的核心是蛋。阿士诺的祭坛（Ashnod's Altar）、鬼怪轰炸（Goblin Bombardment）这类牌负责把蛋主动敲碎，蛋一死，主将就翻牌库顶，把第一条翻到的生物直接拉到场上。而且主将造蛋的能力每回合都能用，别忘了启动。新人要注意：别留着一堆没敲开的蛋，主动砸蛋才是这套牌赢的办法，蛋只是工具不是战力。"},"Korvold, Fae-Cursed King":{"tagline":"牺牲越多，它越大，牌也越多","intro":"受诅国王寇沃每牺牲一样东西就长大一圈并抓一张牌，进场和进攻时还会逼你再牺牲一样。所以这是一套不断把自己东西送掉的牌，越送越强、手牌也越多。喜欢有舍才有得这种节奏、并且不心疼自己场面的玩家会喜欢它。","build":"套牌里要有一大堆可以牺牲的东西。冷酷袭劫者（Pitiless Plunderer）让每次生物死亡都换来一份宝物，破坏魔鬼（Mayhem Devil）则让对手每次牺牲都掉血。主将每牺牲一样东西就长大一圈并抓一张牌，越送越强。新人要注意：主将进场和攻击时都得牺牲一样永久物，别把自己唯一的地或者关键的神器送掉，先看看场上有什么可以舍。"},"Zurgo Stormrender":{"tagline":"每次进攻都送兵，走了就抓牌","intro":"镇霆可汗珠高每次进攻都会自带一个小兵，而且这些小兵打完就得牺牲。别人看来是浪费，对你来说正好：只要这些正在攻击的衍生物离场，你就能抓一张牌。于是每次进攻都变成一次补牌。喜欢一直主动进攻、手牌永远不缺的玩家会喜欢。","build":"套牌里要放很多能主动造出小兵的东西。渐强终响（Grand Crescendo）能一口气铺出一大排小衍生物，备忘夹（Skullclamp）则把快要牺牲的小兵换成两张牌，牺牲和补牌正好接上。这些小兵打完就得牺牲，但只要它们是在进攻时离场，你就能抓一张牌。新人要注意：进攻前先算清楚这一轮会有几个小兵离场、能抓到几张。"},"Shorikai, Genesis Engine":{"tagline":"一台帮你抓牌的神器载具","intro":"创机胜利械是一台车，自己不能打人，但每回合都能让你抓两张牌再弃一张，还顺手造出驾驶它的衍生物。它本身也是一件便宜的神器，能和一堆降低神器费用的牌配合。喜欢每回合都有稳定收益、并且爱摆弄神器的玩家会喜欢它。","build":"套牌里大部分是神器。松卷钟（Unwinding Clock）让你在每个对手的回合都能解开自己的神器，俄佐立印记（Azorius Signet）这类加速负责把费用堆起来。主将本身是台车，每回合都能让你抓两张牌再弃一张，还顺手造出驾驶它的衍生物。新人要注意：主将要凑够力量才能当成生物用，别急着让它去挡人；抓牌的能力别忘了用满。"},"Felothar the Steadfast":{"tagline":"拿防御力当拳头，墙也能打人","intro":"坚毅可汗芾洛塔让所有生物的伤害按防御力来算，于是那些平时只能挡人的高防御力生物一下子变得很能打。它还能牺牲一个生物来换牌，防御力越高换得越多。喜欢用别人看不上眼的守军硬顶过去、并且擅长做交换的玩家会喜欢它。","build":"套牌里塞满各种守军和防御力高的生物。预兆墙（Wall of Omens）这类守军进来就抓一张牌，失败终焉（Jaws of Defeat）则把防御力高出攻击力的部分直接变成对手掉的血。因为主将让伤害按防御力来算，这些平时只能挡人的生物一下子变得很能打。新人要注意：主将能牺牲生物换牌，防御力越高换得越多，但别把唯一挡人的主力送掉。"},"The Wandering Minstrel":{"tagline":"地直立进场，城镇凑齐就铺场","intro":"异国的诗人有个很舒服的能力：你所有的地都是直立进场的，不受进场横置的影响，等于每回合都能立刻用上。套牌里凑够五块城镇之后，它还会每回合白送一个衍生物。喜欢铺地、喜欢把场面一点点摆满的玩家会喜欢它。","build":"这套牌几乎全是地，而且要尽量选带城镇这个类别的地，凑够五块之后主将就会每回合白送一个衍生物。初始市镇（Starting Town）、夜之都特雷诺（Treno, Dark City）这类地进场时本来是横着的，但主将能让它们直立进场，等于白赚一回合的节奏。新人要注意：地牌的颜色要分散，别全押在一种颜色上，不然主将的大招放不出来。"},"Queen Marchesa":{"tagline":"让人互相消耗，自己在旁边收","intro":"玛切莎女王一进场就让你成为君主，这个身份会招来对手的进攻，而你正好希望他们互相打。你还能在别人抢走君主位置时拿到帮手。这套牌不急着赢，而是靠耗着、让别人彼此消耗。喜欢玩心眼、喜欢在多人局里做局的玩家会喜欢它。","build":"套牌打的是让别人互相消耗。魂魅拘禁（Ghostly Prison）让对手想打你就得多付费用，馈击掌（Deflecting Palm）则把打过来的伤害原样还回去，进攻你的人反而吃亏。主将一进场就让你成为君主，这个身份会招来对手，而你正好希望他们互相打。新人要注意：君主是个很烫手的位置，别急着一个人扛，要学会把火力引向别人。"},"Urza, Lord High Artificer":{"tagline":"神器越便宜，主将越能翻牌","intro":"铸物勋爵克撒进场自带一个按神器数量变大的衍生物，还能把任何一件神器变成法术力来源，最后一个能力则让你不断免费翻出牌库顶的牌。它是一套纯神器的牌。喜欢一件事做到极致、并且享受对手被压制的玩家会喜欢它。","build":"套牌里全是便宜的神器。乙金塑师（Etherium Sculptor）让它们更便宜，松卷钟（Unwinding Clock）让你在每个对手的回合都能解开自己的神器。主将进场自带一个按神器数量变大的衍生物，自己也能把神器变成法术力。新人要注意：主将单独站着很弱，先铺够神器再让他下场；这套牌会让对手有点难受，别在朋友局里第一次就掏出来。"},"Avatar Aang":{"tagline":"四种御术凑齐，主将就变身","intro":"降世神通安昂要求你在同一个回合里把御气、运土、御水、御火四种都做到一次，做到就变身成强得多的形态。变身之后，你放的咒语会便宜一大截，它自己还会每回合放大招。喜欢挑战操作、喜欢把四种不同手段凑在一起的玩家会喜欢它。","build":"套牌要围绕四种御术来搭：御气、运土、御水、御火各来一次，主将就能变身。无所畏惧的卡塔拉（Katara, the Fearless）让你伙伴类生物的能力多触发一次，截气修习（Airbending Lesson）负责御气那一边，还能顺手帮你抓一张牌。新人要注意：四种御术要在同一回合里都用上才算数，出牌顺序得提前想好，不然很容易差一种。"},"Go-Shintai of Life's Origin":{"tagline":"神龛越齐，每张收益越大","intro":"命源御神体本身就是一个神龛，还能把坟场里的神龛捞回场上。场上的神龛越多，每一张的效果就越强：有的产法术力，有的让对手掉血，有的给你铺小兵。所以这是一套越到后面越顺的牌。喜欢攒东西、看着收益一点点变大的玩家会喜欢它。","build":"套牌里除了主将，其余基本都是神龛。万物圣殿（Sanctum of All）每回合都能帮你找出下一个神龛，大罗本殿（Honden of Life's Web）则按神龛数量给你铺小兵，神龛越多每张的收益越大。主将还能把坟场里的神龛捞回来接着用，等于多赚了一轮。新人要注意：单个神龛很弱，前期先忍着把它们凑齐，别急着跟对手硬碰。"},"Helga, Skittish Seer":{"tagline":"大生物越大，法术力越多","intro":"难测先知赫尔嘉专门奖励费用四点以上的大生物：你每放一张，它就让你抓一张牌、回一点血并长大一圈。它自己还能按力量产出大笔法术力，专门用来放那些大家伙。喜欢一张接一张放出大生物的玩家会喜欢它，它需要一定的出牌顺序。","build":"套牌里要放一大堆费用四点以上的生物。贾路的反抗（Garruk's Uprising）让它们全部获得践踏，兽群语者（Beast Whisperer）让你每下一张生物就抓一张牌，手牌不断。主将会跟着你的大生物一起长大，再用力量产出法术力。新人要注意：产出的法术力只能用来放费用四点以上的生物，别留着做别的事；出牌顺序也要排好。"},"K'rrik, Son of Yawgmoth":{"tagline":"用生命当法术力，血就是资源","intro":"约格莫夫之子格锐克让你用生命来付黑色的费用，等于把生命值直接变成资源。它自己带系命，你放黑色咒语它还会长大。这套牌打的是一边大量掉血、一边吸回来的来回拉锯。喜欢走钢丝、喜欢把生命当筹码用的玩家会喜欢它，但别玩得太激进。","build":"这套牌的核心是用生命换法术力。暗血主祭（Blood Celebrant）能把生命直接转成法术力，黑暗祭礼（Dark Ritual）则负责前期一口气爆出一大笔费用。主将本身带系命，你每放一张黑色咒语它还会长大。新人要注意：生命值既是你的资源也是你的命，别为了抢速度把自己耗到危险的地方，留一点余地更稳。"},"Choco, Seeker of Paradise":{"tagline":"鸟一进攻，地就铺满场","intro":"桃源寻旅巧克是一套围绕鸟和地的牌：你用鸟进攻时，它就会翻开等量的牌，把其中的地直接铺到场上去。每到一块地进场，它自己也会短暂变大。整套牌是一边下地一边成形。喜欢铺地、喜欢鸟、喜欢场面越摊越开的玩家会喜欢它。","build":"套牌里大部分是鸟，再配上一大堆地。萨兹的陆行鸟（Sazh's Chocobo）跟着每次落地长大，伊美黎天使（Emeria Angel）则在你下地时给你添一只鸟，鸟越多主将翻到的牌越多。主将会在你用鸟进攻时翻牌库顶，把地直接铺到场上去。新人要注意：这套牌需要鸟真的打中对手才算，前期先铺场面，别让主将一个人冲。"},"Zaxara, the Exemplary":{"tagline":"花多少费，就白送多大的多头龙","intro":"她是一头会死触的多头龙，本身还能横置产出两点任意颜色的法术力。她的本事是给「花多少由你决定的咒语」加码：你每放一个这种咒语，就额外得到一头同样大小的多头龙。喜欢一次花一大笔、看场面瞬间变大的玩家会很对味。","build":"一半以上放地，其余大多是加速，先把法术力堆厚。主力是放干鲜血（Exsanguinate）这类投入越多越狠的咒语，水螅融合体（Hydroid Krasis）则能一次给你一头生物、几张牌和几点生命。新人要注意：就算把那笔投入定成零，主将也会触发，但那头 0/0 的多头龙一进场就会立刻死掉，等于白花一张牌；她自己也是能打的生物，上场挡一下并不亏。"},"Terra, Herald of Hope":{"tagline":"一边磨自己，一边把生物捞回来","intro":"她每次战斗开始前先让你把牌库顶两张牌放进坟场，然后自己飞起来。她打中对手时，只要再付两点法术力，就能把坟场里一个力量 3 以下的小生物直接拉回场上。喜欢坟场、愿意用小生物反复换命的玩家会喜欢她。","build":"思路是主动往坟场里送牌：拼接师备尸（Stitcher's Supplier）一进场或者一死就磨三张，最合适不过；活尸法（Reanimate）能把坟场里的大生物直接抢到自己场上，不必只靠主将拉小的。新人注意两点：坟场里得先有货，主将的效果才用得上；每回合还要留出额外两点法术力，并且想好什么时候让她飞起来打人。"},"Kotis, the Fangkeeper":{"tagline":"打不死的独行侠，打中对手就白拿牌","intro":"他自带不灭，几乎杀不掉，所以你可以放心把装备和灵气全堆在他一个人身上。他打中对手几点伤害，就翻出对手牌库顶同样多的牌，其中的牌还能让你免费放出来。喜欢一个人越堆越强这种玩法的玩家会很喜欢他。","build":"先保证他能打中：似水流形（Aqueous Form）让他无法被阻挡，仇视（Rancor）给他加力量和践踏，被拆掉还会回到你手上，可以反复贴。新人注意两件事：免费放出来的牌不是想放就能放，费用和时机都要看清楚；他打中一点伤害就只能翻一张牌，所以力量越大越赚，把他养大才是这套牌的正事。他一个人就能撑起整套牌的节奏。"},"Betor, Ancestor's Voice":{"tagline":"回血换身材，掉血换复活","intro":"他是条会飞、带系命的灵龙。每个回合结束时，你这回合回了多少血，就给他身边一个生物加多少 +1/+1 指示物；你这回合掉了多少血，就能从坟场免费拉回一个费用不超过这个数字的生物。喜欢把生命当资源来回倒的玩家会喜欢他。","build":"一边放稳定的回血来源，一边主动花生命。罗克维念师（Rhox Faithmender）能让每次回血翻倍，等于主将给的指示物也跟着翻倍；寇利斯之子（Children of Korlis）可以在关键时刻把这回合掉的血一次补回来，正好换成一次复活。新人注意：掉血换复活只看这一回合的账，出牌顺序要想好，也别把自己掉进危险血线。"},"Auntie Ool, Cursewretch":{"tagline":"让对手的生物越打越小","intro":"她整副牌都在玩 -1/-1 指示物：往对手的生物身上放这种指示物，把它们的体型一点点压小，甚至直接压死。你操控的生物被放指示物时你抽一张牌，对手的生物被放时他掉一点血。喜欢慢慢消耗、看对手越打越弱的玩家会喜欢她。","build":"核心是司毒维齐尔哈芭恰（Hapatra, Vizier of Poisons）：你往任何生物身上放指示物，她就顺手给你一个 1/1 的衍生物。平时就靠不停给对方的生物放指示物，把他的场面一点点拆掉，自己不用大打出手；再配上一张清场牌，全场生物一起变小，对手会非常难受。新人注意：主将的护卫要对手在自己的生物上放两个指示物，想点掉她很心疼。"},"Terra, Magical Adept":{"tagline":"会变身的五色结界主将","intro":"这张主将有正反两面。正面进场时先帮你磨五张牌，把磨到的结界捞一张进手，之后花六点法术力和横置就能翻面成一张传纪。传纪的每一章都在复制你的结界，最后一章直接给你五色的双倍法术力，然后变回正面。喜欢结界、也不怕多记几件事的玩家会喜欢。","build":"牌表里大半是结界，尤其是能一章一章讲故事的那种。圣所织叶灵（Sanctum Weaver）按你的结界数量产法术力，丰收之手叙提丝（Sythis, Harvest's Hand）在你放结界时回血又抽牌，保证手牌不断。新人注意：复制出来的结界在下个回合结束时要牺牲掉，别把它当永久的东西；这套牌能做的事情很多，建议先跟老玩家打几局熟悉一下再自己改。"},"Ghyrson Starn, Kelermorph":{"tagline":"一点小伤害，变成三点","intro":"他的本事是盯住「正好 1 点」的伤害：只要你操控的其它来源造成正好 1 点伤害，他就再补上 2 点。于是那些「每个对手掉 1 点」的小牌，一下子变成掉 3 点。喜欢用小伤害滚雪球、把对手慢慢磨死的玩家会喜欢他。","build":"热力炼金术士（Thermo-Alchemist）和焰箭弓手（Firebrand Archer）都专打每个对手各 1 点，配上主将就变成 3 点，两三个回合对手的血就见底了。新人注意：必须是正好 1 点才触发，打 2 点或 3 点的牌不会有多余伤害，所以牌表要挑小伤害的；主将身上有护卫，对手想点掉他得先付两点法术力，不用太担心他站不住。小伤害反而更狠。"},"The First Sliver":{"tagline":"放一个裂片妖，连锁带出好几个","intro":"它让所有裂片妖咒语都带上倾曳：你放一个裂片妖时，一直翻牌库顶，直到翻出一张费用更低的非地牌，然后可以免费把它放出来，而它又会再倾曳一次。喜欢一张接一张把场面铺满的玩家会很喜欢它。","build":"牌表几乎全是裂片妖，外加点加速和产颜色的地。灿衣裂片妖（Gemhide Sliver）和纺魔裂片妖（Manaweft Sliver）把整队都变成法术力来源，让连锁停不下来，一个接一个往外冒。新人注意：倾曳是一张一张翻出来的，一回合会花掉不少时间，出牌顺序最好事先想清楚，不然容易漏掉触发，场面反而乱。裂片妖之间还会互相加成。"},"Xyris, the Writhing Storm":{"tagline":"让对手多抽牌，你就多一堆蛇","intro":"它会逼对手多抽牌：对手每多抽一张（自己回合正常抽的那张不算），你就得到一条 1/1 的蛇。它自己打中谁，你和那个人就一起抽那么多牌。喜欢场面越乱越热闹、不介意顺手帮对手一把的玩家会喜欢它。","build":"嚎叫的矿井（Howling Mine）让每个玩家每回合都多抽一张；横财（Windfall）一次让所有人换掉整手牌，蛇会成片冒出来。冲击震颤（Impact Tremors）在你每个生物进场时打每个对手 1 点，蛇一多就能直接收尾。新人注意：帮对手抽牌也是在帮对手，多出来的手牌会让他们的回合更难受，所以一定要准备好把成群的蛇变成伤害的办法。"},"Kilo, Apogee Mind":{"tagline":"每次横置，全场指示物涨一轮","intro":"他是个带敏捷的神器生物，规则很简单：每次他横置，就增殖一次，场上每种已经存在的指示物都多一个。所以只要场上摆着加身材的指示物或者充能指示物，他每动一次，全场就膨胀一轮。喜欢慢慢积累、看数字不断变大的玩家会喜欢他。","build":"汩汩圣杯（Everflowing Chalice）靠充能指示物产法术力，指示物越多产得越多；电涌通导械（Surge Conductor）在你每放一个神器时又增殖一次，正好和主将互相喂养，越转越快。新人注意：增殖只会给场上已经有的指示物各加一个，空场时什么也不会发生，先铺好带指示物的牌再让他动起来。指示物攒得越多，收益越明显。"},"Sisay, Weatherlight Captain":{"tagline":"从牌库直接找传奇牌上场","intro":"她是传奇牌工具箱型主将：你场上的传奇永久物颜色越多，她的身材就越大；然后花五色各一点法术力，就能从牌库直接找出一张费用比她力量小的传奇牌放进场。喜欢每局看对手换不同答案的玩家会喜欢她。","build":"天堂鸟（Birds of Paradise）和莳花师（Bloom Tender）负责凑齐五色法术力，是这套牌的地基；传奇永久物越多，主将就越大，能找出来的牌也越贵。新人注意：一定要先让她变大，才能找出费用高的传奇牌，顺序反了就白花五色法术力；等你凑齐颜色，随时能掏出意想不到的答案，但她上场后很招人盯，别让她一个人挨打。"},"Eriette of the Charmed Apple":{"tagline":"给对手贴灵气，他们就攻不了你","intro":"她让所有被你灵气结附的生物都不能攻击你。每个回合结束时，你有多少灵气，每个对手就掉多少血，你也回同样多的血。所以玩法是往对手的生物身上贴灵气，一边封锁对手一边慢慢吸血。喜欢防守和慢慢消耗的玩家会喜欢。","build":"空灵铠（Ethereal Armor）和闪光宝物（All That Glitters）花得少、堆得快，是这套牌的日常主力；灵气越多，每回合对手掉的血和你回的血就越多。新人注意：灵气贴对手的生物才能保护你，贴在自己生物上只是加强自己；另外贴灵气本身不抽牌，记得放些能补手牌的牌，不然对手的生物被贴住就打不了你，你却先空手了。"},"Ragost, Deft Gastronaut":{"tagline":"你的神器都算食物，吃了就开火","intro":"他让你所有神器同时算作食物，于是每张神器都多了两个用法：花两点法术力吃掉回 3 点血，或者花一点吃掉让每个对手掉 3 点。因为他一回血，结束时就重新站起来，所以一回合里能反复开火。喜欢把小零件拼成大炮的玩家会喜欢。","build":"大学院制造工人（Academy Manufactor）和脓水涌泉（Ichor Wellspring）能不断造出食物和宝物，前者一次给你三样，后者进场和进坟场都抽一张，正好都是主将的弹药。新人注意：两种吃掉的效果不一样，想打人就选一点法术力的那种；回血是让他重新站直的关键，先囤几个神器再开吃，一回合能连打好几次。神器越多，火力越猛。"},"Norman Osborn":{"tagline":"正面摸牌长大，反面从坟场再来一次","intro":"这张主将有正反两面。正面不能被阻挡，打中对手就抽一张丢一张，丢到非地牌他还会变大。花四点法术力变身之后，他变成会飞的绿魔，而且你这回合丢进坟场的非地牌都能再从坟场放一次。喜欢坟场、喜欢一张牌用两次的玩家会喜欢。","build":"丧信掠夺（Faithless Looting）和狂搜乱寻（Frantic Search）是喂坟场的老手，便宜、抽得多、丢得也多，一回合就能把坟场垫厚。新人注意：变身是这套牌最关键的动作，什么时候变要想清楚，变身前后打的是两套牌；坟场里的牌不要随便丢，那是你的第二只手，丢进去才能再放一次。正面偷牌长大，反面才是真正的杀手。"},"Henzie \"Toolbox\" Torre":{"tagline":"大生物当一次性大招反复用","intro":"他给你所有 4 费以上的生物一个额外选项：提前用同样的费放出来，它立刻能动，死了还抽一张牌，代价是这个回合结束时要牺牲掉。等于把每只大生物都变成一次性大招，而且他每被重放一次，这个选项就更便宜。喜欢炸场面的玩家会喜欢。","build":"黯色幻影（Solemn Simulacrum）和导实梣木（Seedguide Ash）这类死了有好处的生物最合适，死一次赚一次，正好配合这套把大生物当一次性大招的玩法。新人注意：选了这个选项的生物结束时会牺牲，别舍不得，那本来就是它的用法；主将每被重放一次这个选项就更便宜，所以别怕他被解掉，先手放出大生物压场。"},"Urtet, Remnant of Memnarch":{"tagline":"秘耳越铺越多，然后一起变大","intro":"他是只秘耳主将：你每放一个秘耳咒语，就额外得到一个 1/1 的秘耳；战斗开始时所有秘耳都会站起来，可以反复用它们产法术力。凑齐五色法术力横置他，全场秘耳每个都加三个 +1/+1 指示物。喜欢小生物铺满场再一口气变大的玩家会喜欢。","build":"金秘耳（Gold Myr）等几种产法术力的秘耳既凑颜色又铺场，钯秘耳（Palladium Myr）一次给两点无色法术力，让主将的技能可以早点用出来。新人注意：秘耳个体都很小，先想办法把它们变大再打过去，不然只是白送；凑齐五色法术力并不容易，先把产法术力的秘耳铺好，一回合能凑出好几色。秘耳多了以后，横置产法术力也很划算。"},"Captain N'ghathrod":{"tagline":"磨光对手牌库，再把他们的牌抢来用","intro":"他让手下所有惊惧兽都带威慑，惊惧兽打中对手就磨掉对手牌库同样多的牌。最狠的是每个回合结束时，他能把对手这回合刚磨进坟场的一个生物或神器直接拉到你场上。喜欢用对手的牌打对手的玩家会喜欢。","build":"吞噬畸变体（Consuming Aberration）身材等于对手坟场的牌数，越磨越大，是最能打的惊惧兽；凿灵钻（Mindcrank）在对手掉血时继续磨牌，两条线互相带动。新人注意：主将只能捡这回合从牌库进坟场的牌，顺序不能反，先磨再捡，不然什么也拿不到；每一轮都在给主将准备免费的牌。对手越挣扎，坟场越厚，你的场面越大。"},"Omnath, Locus of Creation":{"tagline":"一回合多下几块地，奖励层层加码","intro":"他靠地进场拿奖励：这一回合第一次有地进场，你回 4 点血；第二次有地进场，给你四个颜色的法术力；第三次有地进场，直接打每个对手 4 点。所以整副牌的思路就是想尽办法一回合多下几块地。喜欢滚雪球的玩家会喜欢。","build":"莲花眼镜蛇（Lotus Cobra）让每块地都顺带产法术力，落地越多法术力越多；硬盔虫聚群（Scute Swarm）在地够多时会不断繁殖，场面自己会长大。新人注意：先让能多下地的牌在场，再开始下地，顺序反了奖励就少一档；这一回合第几次有地进场决定你拿到哪个奖励，多下的地是整套牌的动力。奖励拿满的回合，对手会很难受。"},"Hope Estheim":{"tagline":"回多少血，就磨掉对手多少张牌","intro":"他是个有系命的两费主将，规则只有一句：每个回合结束时，你这回合回了多少血，每个对手就磨掉同样多的牌。所以这套牌靠一堆进场就回血的小牌攒生命，再把生命换算成对手牌库的消耗。喜欢慢节奏的玩家会喜欢。","build":"护灵师（Soul Warden）让任何生物进场你都回一点血，是最稳的回血来源；罗克维念师（Rhox Faithmender）让每次回血翻倍，磨牌速度也跟着翻倍，两三个回合就能看出差距。新人注意：这是靠磨光对手牌库取胜的玩法，一局会打得比较久，前期要多放能挡住攻击的生物；他有系命，自己也能顶上去挡一挡。回血和磨牌其实是同一件事的两面。"},"Voja, Jaws of the Conclave":{"tagline":"妖精越多，全场生物涨得越猛","intro":"他是头警觉、践踏、还带护卫的狼。每次他攻击，你场上有多少妖精，你所有生物就各加多少 +1/+1 指示物；你每有一只狼，你还抽一张牌。所以先用便宜妖精把场铺满，再靠他一次把整队撑起来。喜欢铺场再一口气压过去的玩家会喜欢。","build":"罗堰妖精（Llanowar Elves）这类便宜妖精是最好的开局，先铺场又产法术力；覆面林连结点（Maskwood Nexus）让所有生物都算妖精，主将一次就能给全队加一大圈。新人注意：主将自己是狼不是妖精，别把它算进妖精数量；妖精越多主将给的指示物越多，所以要一边铺一边算，攒够了再一起攻击。他一攻击，全队都跟着变大一截。"},"High Perfect Morcant":{"tagline":"每放一个妖精，对手就得弄小自己一只","intro":"她和你的每个妖精进场时，每个对手都得在自己的生物上放一个 -1/-1 指示物。她还能横置三个妖精来增殖，让场上所有指示物再涨一轮。所以她是一边自己越铺越大、一边让对手越铺越小的主将。喜欢妖精又喜欢让对手难受的玩家会喜欢。","build":"茁壮防卫（Flourishing Defenses）在生物被放 -1/-1 指示物时给你 1/1 妖精，和主将形成天然循环，越打越占优势。新人注意：对手可以自己挑哪只生物挨指示物，所以要靠数量压过他的选择；妖精不断进场，他的场面就一直在变小，而增殖能让双方的指示物一起长大。她的核心就是让对手的生物越用越废，自己的妖精越铺越多。"},"Alela, Cunning Conqueror":{"tagline":"在别人回合施法，就多一只仙灵","intro":"她自己就能飞。每个对手的回合里，你施放第一张咒语时，就免费得到一只 1/1 会飞的仙灵。你的仙灵打中谁，谁就得派一个生物去攻击别人，不能来打你。喜欢留法术力过回合、随时准备接招的玩家会喜欢她。","build":"纷咒仙灵（Spellstutter Sprite）和咒语缠结（Spell Stutter）都是对手回合才好用的牌，和主将配合得恰到好处：既干扰对手，又顺手造出仙灵，一张牌做两件事。新人注意：一定要在对手的回合施放才给仙灵，你自己的回合不行，所以要习惯留着法术力过回合，别一口气花完。对手每回合都得提防你手里有招，节奏自然被你带着走。"},"Magda, Brazen Outlaw":{"tagline":"矮人一横置就出宝物，攒够就找龙","intro":"你每有一个矮人横置，就得到一个宝物；攒够五个宝物牺牲掉，就能从牌库直接找任意一张神器或龙放进场。所以整套牌都在想办法让矮人反复横置。喜欢凑零件、突然掏出一张大牌的玩家会喜欢她。","build":"覆面林连结点（Maskwood Nexus）让所有生物都算矮人，横置来源一下子翻倍；索尔石怪（Xorn）让你每次造宝物都多造一个，攒五个的时间更短。新人注意：宝物本身也能当法术力用，很难忍住不花，要克制住才攒得到五个；矮人越多攒得越快，所以能横置的东西都要留着，别急着拿去攻击。五个宝物就能换一张大牌，收益非常高。"},"Obeka, Splitter of Seconds":{"tagline":"打中几点，就多几次维持开始","intro":"她带威慑，打中对手几点伤害，这个阶段之后你就多出几次维持开始。听起来抽象，用处却很直接：所有写着「在你的维持开始时」的牌，一回合里会连续触发好几次。喜欢翻牌找这类触发、玩花样的玩家会喜欢她。","build":"野心宫廷（Court of Ambition）每次维持都让对手掉 3 点血；受逐召龙师（Dragonmaster Outcast）每次维持都给你一条 5/5 的龙，多出来的每个维持都等于一次小爆发。新人注意：多出来的维持只在战斗之后才有，所以一定要先打中对手；她带威慑，穿点装备让她更大，打中的伤害越多维持就越多。多出来的维持越多，场上的牌触发得越勤。"},"Sidar Jabari of Zhalfir":{"tagline":"骑士团主将，抽一丢一还能复活骑士","intro":"只要他在场上或者还在主将区，你用骑士攻击时就能抽一张牌再丢一张牌。他自己会飞、有先攻，打中对手时还能把坟场里的骑士直接拉回场上。喜欢骑士、喜欢把牌丢进坟场再复活回来的玩家会喜欢他。","build":"骑士模范（Knight Exemplar）让所有骑士变大又打不死，骑士冲锋（Knights' Charge）让每次骑士攻击都让对手掉血、你回血，一来一回差距就拉开了。新人注意：抽一丢一既是好处也是负担，把用不上的骑士丢进坟场，正好是主将的复活材料；每回合都在丢弃，很快就会有一堆可以捡回来的东西。骑士一波接一波，坟场就是你的第二手牌。"},"Zinnia, Valley's Voice":{"tagline":"每个生物都能多花两费生一个复制品","intro":"她给所有生物咒语一个额外选项：多付两点法术力，那个生物进场时就额外得到一只 1/1 的复制品。她自己的身材也和场上攻击力 1 的生物数量挂钩，所以你铺得越满，她就越大。喜欢小东西突然变成一大群的玩家会喜欢。","build":"玛瑙石煽动者（Agate Instigator）自己也有这套复制本事，小生物很容易成倍出现；好奇塑师（Curiosity Crafter）在复制品打中对手时帮你抽牌，越打手牌越多。新人注意：多付两费是自愿的，不是每只都值得复制，优先挑进场有效果的；复制品只有 1/1，本体攻击力是 1 的才最划算，她一变大全队都跟着冲。铺得越满她越大。"},"Niv-Mizzet, Parun":{"tagline":"抽一张牌，就打一点伤害","intro":"他是条不能被反击、会飞的六费龙：你每抽一张牌，他就打 1 点伤害；只要有玩家放瞬间或法术，你就抽一张牌。这两条凑在一起正好成循环：抽牌打点，打点又让你抽牌。喜欢法术连发、把对手一点点烧死的玩家会喜欢他。","build":"好奇（Curiosity）和贫窟伏击客（Guttersnipe）是一攻一守的两张关键牌：前者贴在他身上，他一造成伤害你就抽牌，抽牌又打伤害，循环直接起飞；后者在你放瞬间法术时打每个对手 2 点。新人注意：他六费才下，前期要多放能挡能拖的牌和加速，耐心拖到六费，之后每张牌都是伤害。抽牌和伤害在他身上是同一件事。"},"Brago, King Eternal":{"tagline":"主将打中一次，全场进场效果再来一遍","intro":"他会飞，打中对手时就能把自己场上一批非地永久物先送出场外、再原样拿回来。因为它们是重新进场，所有写着「进场时」的效果都会再触发一次：抽牌、产法术力、把对手的生物弹回手牌。喜欢反复利用进场效果的玩家会喜欢他。","build":"预兆墙（Wall of Omens）进场抽一张，被主将带一次就再抽一张；隼龙兽（Peregrine Drake）进场能站直五块地，反复触发法术力越滚越多。新人注意：只有非地永久物能被这样回收，而且主将必须打中才触发，所以要用飞行和防护保证他连得上；进场效果越多，一轮下来能做的事情就越多。每打中一次，场上的效果就再来一轮。"},"Grand Arbiter Augustin IV":{"tagline":"你的蓝白更便宜，对手的咒语更贵","intro":"他的规则简单又直接：你放的白色和蓝色咒语各便宜一点法术力，对手放的每个咒语都贵一点。再配上一堆让人不想打你的牌，整局的节奏会被拖得很慢。喜欢慢慢布防、让对手处处别扭的玩家会喜欢他。","build":"宣导（Propaganda）让想打你的对手每个生物都要先付两点法术力，攻击成本一高就没人愿意来；税赋压身（Smothering Tithe）把对手的抽牌变成你的宝物，时间一长你手上的资源就比谁都多。新人注意：这套牌会让对手有点难受，别在朋友局里第一次就掏出来；赢法通常是慢慢积累优势，一局会打得比较久。"},"Anikthea, Hand of Erebos":{"tagline":"把坟场里的结界变成僵尸拉回来","intro":"她自己就是结界生物，还让其他结界生物带威慑。她进场时和每次攻击时，都能从你坟场里放逐一张非灵气的结界牌，造一个它的复制品，那个复制品同时是一只 3/3 的黑色僵尸。等于结界版的复活术。喜欢结界和坟场的玩家会喜欢她。","build":"花丛幻灵（Eidolon of Blossoms）让你每放一个结界就抽一张牌，手牌不会断；命运之攫（Grasp of Fate）进场就能暂时移走对手的东西，被主将复活一次就再来一遍。新人注意：能被复活的必须是非灵气的结界牌，所以要想办法把结界送进坟场；她进场时和每次攻击都能复活一张，复活的结界还是结界。坟场里的结界越多，你能复活的东西越多。"},"Yarok, the Desecrated":{"tagline":"所有进场时的效果，统统触发两次","intro":"他自带死触和系命，最大的本事是让永久物进场引起的触发效果统统再来一次：进场抽牌变成抽两张，地进场产法术力变成产两份。喜欢同一件事做两遍的玩家会喜欢他。","build":"漂念精（Mulldrifter）进场抽两张，被主将翻倍就是四张；盘卷先知（Coiling Oracle）进场翻牌，翻到地就直接下场，翻两次等于加速两次。新人注意：他只管进场引起的触发，进坟场或者施放时的效果不算，所以挑牌时要看准这一条；一块地能翻两次牌，整套牌下来手牌和场面都会堆得很快。进场效果越多，这套牌越赚。"},"Tergrid, God of Fright":{"tagline":"逼对手弃牌牺牲，那些牌归你","intro":"她的规则很霸道：对手每牺牲一个非衍生物永久物、或者每弃掉一张永久物牌，那张牌就直接从坟场归你。她的背面是一盏提灯，能逼一个玩家掉 3 点血，除非他牺牲一个永久物或者弃一张牌。喜欢抢对手东西的玩家会喜欢她。","build":"物尽其用（Waste Not）把对手的弃牌变成僵尸、法术力和抽牌，越逼越赚；播疫师（Plaguecrafter）逼每个人各牺牲一个生物，牺牲掉的东西直接归你。新人注意：这套牌会让对手非常难受，别在朋友局里第一次就掏出来；她背面那盏提灯还能直接逼人掉血，什么时候逼、逼谁都要挑时机。对手越舍不得牺牲，就越吃亏。"},"Light-Paws, Emperor's Voice":{"tagline":"贴一个灵气，就从牌库再找一个更便宜的","intro":"她只要两费，规则是：你每贴一个灵气，就能从牌库找一张费用不超过它、而且名字不一样的灵气，免费贴在她身上。所以从最便宜的灵气开始，能一路往上找。喜欢一张牌带出一串牌、把主将养大的玩家会喜欢她。","build":"鬣狗本影（Hyena Umbra）只要一点法术力，是最适合开路的第一个灵气；寇族魂舞者（Kor Spiritdancer）在你放灵气时帮你抽牌，把找上来的灵气一张张接住。新人注意：牌表要按费用从低到高排好，乱了就容易接不上；一个灵气带出一个，她很快就会变得又大又难挡，但主将一旦被移走会非常伤。灵气一层层堆上去，她很快就能一个人打穿一路。"},"Xenagos, God of Revels":{"tagline":"每回合开打前，让一只生物的攻击力翻倍","intro":"他本身杀不掉，但只有场上红绿两色的法术力符号够多时，他才算一个生物。每个回合进入战斗前，他可以给另一个生物敏捷，并且让它的攻击力翻倍。所以只要场上有一只大生物，它马上就能打出两倍伤害。喜欢大生物直接砸过去的玩家会喜欢。","build":"始饥戈厄塔（Ghalta, Primal Hunger）的费用会因为你场上的生物而变便宜，被主将翻倍之后几乎挡不住，一只就能带走一个对手。新人注意：前期他常常只是张结界，别指望他帮你防御；红绿两色的法术力符号攒够七个他才变成生物，所以场上要多留些红绿的永久物，大生物砸过去就是最好的防守。"},"Talrand, Sky Summoner":{"tagline":"放一个瞬间或法术，就多一条飞龙","intro":"他的规则只有一句：你每放一个瞬间或法术咒语，就得到一条 2/2 会飞的龙兽。所以整套牌由一堆便宜的小咒语组成，一边抽牌、一边挡招，一边慢慢把龙兽攒起来。他适合新手，因为单色地最简单，玩法也直白。","build":"抉择（Opt）和注定（Preordain）只要一点法术力，是最顺手的开局，一边看牌一边把龙兽攒起来；眷顾之风（Favorable Winds）让你所有会飞的生物都变大，龙兽一群一起打很吓人。新人注意：龙兽是一点点攒出来的，前期别急着打，攒够一波再一起上；单色地最简单，卡手的概率也低，很适合当第一副自己组的牌。"},"Wyleth, Soul of Steel":{"tagline":"装备堆得越多，攻击时抽得越多","intro":"他会践踏，每次攻击时，身上贴了几张灵气和装备就抽几张牌。所以他一个人带着整套装备往前冲，一边打一边把手牌补满。喜欢把所有资源都压在一位英雄身上的玩家会喜欢他，这套牌配件多，但思路很直白。","build":"席嘉妲的援助（Sigarda's Aid）让装备能在对手回合瞬间装上，攻其不备；净钢神圣武士（Puresteel Paladin）让装备进场就抽牌，手牌一直补得上来。新人注意：东西全压在主将身上，他一被移走你就很难受，所以记得留保护手段；他带践踏，攻击时抽到的牌还能帮你找到下一件装备，越滚越顺。装备堆得越多，他打起来越轻松。"},"Witherbloom, the Balancer":{"tagline":"小生物铺得越多，这条大龙越便宜","intro":"启衡巨龙靡华（Witherbloom, the Balancer）是黑绿的大龙，八费看着很贵，但你场上的生物越多它就越便宜。它自己会飞、带死触，落地就能压住场面。喜欢先攒人、再憋一记大的玩家会喜欢它。","build":"牌组前半段只做一件事：多放便宜生物和产法术力的妖精，再用林地墓园（Woodland Cemetery）、蔓生墓园（Overgrown Tomb）这类双色地保证颜色。收尾通常靠放干鲜血（Exsanguinate），让每个对手一起掉血、你回血；贾路开道（In Garruk's Wake）能在只剩自己人时清场。新人注意：先铺开小生物，别急着硬凑大龙。"},"Ezio Auditore da Firenze":{"tagline":"五色刺客铺场，对手残血就直接赢","intro":"佛罗伦萨的艾吉奥·奥迪托雷（Ezio Auditore da Firenze）只要两点法术力就能下场。让刺客们打中对手，一旦对手生命降到十点或以下，它再打中一次并支付五色法术力，对方就直接输掉。喜欢靠一群人围殴取胜的玩家会喜欢它。","build":"牌组塞满刺客，暗杀王拉瑟斯（Ramses, Assassin Lord）给它们加成，复仇之刃艾吉奥（Ezio, Blade of Vengeance）让刺客打中对手时补牌，夜色掩护（Cover of Darkness）让对手更难挡，兄弟会总部（Brotherhood Headquarters）专产刺客咒语的法术力。新人注意：先铺场再动手，别只盯一个人打。"},"Atraxa, Grand Unifier":{"tagline":"翻十张牌挑进手，反复来一次更好","intro":"大一统飞将亚崔夏（Atraxa, Grand Unifier）是四色的大天使，七费下场，飞行、警戒、死触、系命都有。它进场时翻出牌库顶十张牌，每一种类型各挑一张进手，所以一落地就能补一大把牌。喜欢琢磨怎么让它反复进场的玩家会喜欢它。","build":"亚崔夏一进场就能抓一堆牌，所以牌组常见的做法是让它的进场效果多发生几次。流光烁影（Ephemerate）和传送法阵（Teleportation Circle）把它送走再拉回来，移位幼兽（Displacer Kitten）和灵魂牧者（Soulherder）也能做同样的事。新人注意：七费不便宜，前期要靠地牌把法术力铺稳。"},"Deadpool, Trading Card":{"tagline":"把自己的牌面文字换给别人，专搞怪","intro":"集换卡牌死侍（Deadpool, Trading Card）是黑红的四费传奇生物。它进场时可以和另一个生物交换「牌面文字框」，对面那只生物会获得死侍的能力，死侍自己则换上对方的能力。喜欢搞怪、不怕玩乱一点的玩家会喜欢它。","build":"组牌时可以多准备和复制有关的牌：一锯两断（Saw in Half）能杀掉一只生物换来两个缩小版的复制品，众我长剑（Blade of Selves）、军团之盔（Helm of the Host）都能不断制造复制体，镜像盒（Mirror Box）则让传奇生物可以同时在场上一堆。新人注意：交换文字框会同时改变双方的能力，出牌前把两边的牌面都读一遍。"},"Mendicant Core, Guidelight":{"tagline":"神器越铺越大，速度拉满就复制咒语","intro":"循光械济缘核心（Mendicant Core, Guidelight）是蓝白的两费神器生物，力量等于你场上神器的数量。你让对手掉血就会提高速度，速度到顶后，你放神器咒语时多付一点法术力就能复制一份。喜欢铺小神器、爱滚大雪球的玩家会喜欢它。","build":"牌组以低价神器为主，铸造厂监工（Foundry Inspector）、乙金塑师（Etherium Sculptor）这类牌能让神器咒语少付一点，于是你可以在一回合里连出好几件。悉诺议会宅邸（Seat of the Synod）、远古狮穴（Ancient Den）既是地又能算作神器。新人注意：速度要靠让对手掉血才会涨，所以别只顾自己铺，要适时进攻。"},"Galadriel, Light of Valinor":{"tagline":"妖精不断进场，每只都带来一份好处","intro":"维林诺之光加拉德瑞尔（Galadriel, Light of Valinor）是绿白蓝的五费精灵。她只在别的生物进场时触发，每回合三种好处各一次：产三点绿法术力、给全场生物加指示物，或者看两张牌再抓一张。喜欢铺场补牌的玩家会喜欢她。","build":"牌组围绕精灵和衍生物：织望阿尔玟（Arwen, Weaver of Hope）让新进场的生物多带指示物，妖精高位德鲁伊（Elvish Archdruid）和善战妖精（Elvish Warmaster）一边给全队加成、一边产小精灵。加拉德瑞尔的驱散（Galadriel's Dismissal）能让对手的阻挡者暂时消失。新人注意：一回合内安排好进场顺序。"},"Jin Sakai, Ghost of Tsushima":{"tagline":"一次只派一个人打，给他连击或让他穿过去","intro":"对马岛之鬼境井仁（Jin Sakai, Ghost of Tsushima）是黑白蓝的四费武士。你只用一个生物攻击某位玩家时，可以让它获得连击，或者让它这回合无法被阻挡；它自己打中对手还会让你抓一张牌。喜欢养一个核心打手的玩家会喜欢它。","build":"牌组一半是装备，一半是让你单挑占便宜的牌。毁灭剑（Buster Sword）打中对手能补一张牌，源氏之护手（Genji Glove）给双击、并在第一个战斗阶段后追加一次战斗，难阻刀客（Unstoppable Slasher）打中对手就让对方掉一半生命。永岩城（Eiganjo Castle）能保住核心打手。新人注意：只有单独攻击才触发主将的效果。"},"Storm, Force of Nature":{"tagline":"先连发一堆小咒语，最后一发变成很多发","intro":"自然之力暴风女（Storm, Force of Nature）是红绿蓝的四费飞行生物。只要它打中对手一次，你这一回合接下来施放的第一个瞬间或法术就会获得风暴：你在这之前每施放过一个咒语，它就多复制一份。喜欢算牌、享受一回合连招的玩家会喜欢它。","build":"牌组多是便宜、能循环的瞬间法术：魔力塑型（Manamorphose）、沉思（Ponder）帮你调色选牌，狂搜乱寻（Frantic Search）能解开地牌继续出牌。暴风窑艺家（Storm-Kiln Artist）和荣休大法师（Archmage Emeritus）每出一个瞬间或法术就给珍宝或抓牌。新人注意：先数这回合出过几个咒语，再决定最后一发。"},"Kynaios and Tiro of Meletis":{"tagline":"大家都多抓牌多下地，你慢慢攒优势","intro":"迈勒提斯的库瑙斯与提罗（Kynaios and Tiro of Meletis）是四色的四费人，效果非常友善：每到你的回合结束，你先抓一张牌，然后每位玩家都可以多放一张地下去，没放地的人还能再抓一张。喜欢和气牌局的新人会很适合。","build":"牌组顺着主将铺：茁壮仪式（Rites of Flourishing）、嚎叫的矿井（Howling Mine）、克罗芬斯的旨意（Dictate of Kruphix）让所有人每回合多抓牌。给出去的好处迟早变成威胁，所以得留后手：宣导（Propaganda）和魂魅拘禁（Ghostly Prison）让对手想打你先付钱。新人注意：这套牌打得慢，要有耐心。"},"Captain America, First Avenger":{"tagline":"把装备一件件挂上，再甩出去砸人","intro":"复仇者先锋美国队长（Captain America, First Avenger）是红白蓝的三费人。每个战斗开始时，你可以免费把一件装备挂到他身上；你也可以付三点法术力把装备甩出去，装备越贵伤害越高。适合喜欢收集装备、养一个大打手的新人。","build":"牌组要多放装备，也要能省装备费、能找装备。净钢神圣武士（Puresteel Paladin）在你出装备时补牌，席嘉妲的援助（Sigarda's Aid）让你放上装备就能立刻挂好。装备越贵越划算：巨锤（Colossus Hammer）加得最多，蜥怪颈环（Basilisk Collar）给他死触和系命。新人注意：挂装备和甩装备是两件事。"},"Aminatou, Veil Piercer":{"tagline":"结界抽到就能便宜放，越铺越难被打","intro":"洞帘师阿米娜图（Aminatou, Veil Piercer）是黑白蓝的四费法师。她每回合帮你把牌库顶两张牌过一遍；你手里的结界牌还都获得了奇迹，只要它是你这一回合抽到的第一张牌，就能少付四点法术力放上场。适合喜欢铺结界的人。","build":"牌组主线是结界。脑力激荡（Brainstorm）把不想留的牌放回牌库顶，方便之后抽到想要的结界并便宜施放；台地咒术师（Mesa Enchantress）让你每出一个结界补牌，昂度灵舞者（Ondu Spiritdancer）还能复制进场的结界。安全球罩（Sphere of Safety）让对手打你先付钱。新人注意：奇迹只对这回合抽到的第一张牌生效。"},"Tifa Lockhart":{"tagline":"每下一块地，她的拳头就翻一倍","intro":"蒂法·洛克哈特（Tifa Lockhart）是绿色的两费人，规则简单得可爱：她自带践踏，而且你每下一块地，她的力量就在这回合翻一倍。只要你能在一个回合里连下好几块地，她就能打出非常夸张的一拳。喜欢一拳头解决问题的新人会很适合。","build":"组法很直接：想办法一回合多下几块地。云游者梓纱（Azusa, Lost but Seeking）让你每回合能多放两块地，整地（Harrow）和恩特式复原（Entish Restoration）能一次换来两块地，蒂法的极限招式（Tifa's Limit Break）可以在关键时刻把她的力量再翻倍。新人注意：地要在战斗前下，翻倍才有意义。"},"Éowyn, Shieldmaiden":{"tagline":"人类一个接一个进场，骑兵跟着冲出来","intro":"执盾女战士伊奥温（Éowyn, Shieldmaiden）是红白蓝的五费骑士，自带先攻。只要你这回合有另一个人类进场，战斗开始时她就会带出两个能立刻进攻的骑士衍生物；场上人类够多时还能让你补一张牌。喜欢铺场进攻、步骤清楚的新人会喜欢她。","build":"牌组以人类为主，让他们一个接一个进场。洛斯阿尔那赫队长（Lossarnach Captain）和卫士贝瑞刚德（Beregond of the Guard）进场就能影响场面，洛汗国王希奥顿（Théoden, King of Rohan）给某个生物双击；埃奥尔勇往直前！（Forth Eorlingas!）一次造出一队骑兵。新人注意：战斗前要安排好人类进场。"},"Iroh, Grand Lotus":{"tagline":"咒语用完还能从坟场再放一次","intro":"白莲长老艾洛（Iroh, Grand Lotus）是红绿蓝的六费人。在你的回合里，你坟场里每一张非课业的瞬间和法术都获得返照，可以再施放一次；课业牌更便宜，只要一点法术力就能再用。喜欢精打细算、把手牌和坟场都当资源的玩家会喜欢他。","build":"他六费才下场，前期要靠便宜咒语和产法术力的地铺稳。抛却牵挂（Abandon Attachments）让你换一张牌并多抓两张，冶金术起源（Origin of Metalbending）能拆神器或结界。重点是坟场：这些牌在你回合里都能再来一遍，苏科遭逐（Zuko's Exile）这类课业牌会很难缠。新人注意：返照用过的牌会被放逐，用过就没了。"},"Zimone, Mystery Unraveler":{"tagline":"每下一块地就翻出一只面朝下的生物","intro":"揭秘琦梦（Zimone, Mystery Unraveler）是蓝绿的四费法师。你每下一块地，当天第一块会让她从牌库顶两张牌里挑一张，面朝下放到场上变成小生物；再下更多地，就能把已经面朝下的生物翻正面。喜欢有点小心机的玩家会喜欢她。","build":"牌组要多下地：樱宗长老（Sakura-Tribe Elder）帮你找地，析米克生长室（Simic Growth Chamber）稳定给两点颜色，盖尔海峡暴君艾西（Aesi, Tyrant of Gyre Strait）让你每回合多放一块地，管中出怪（They Came from the Pipes）进场就面朝下埋东西。新人注意：翻正面要挑时机，早了容易被打掉。"},"Lightning, Army of One":{"tagline":"先打中一次，之后所有伤害都翻倍","intro":"王牌驱散雷光（Lightning, Army of One）是红白的三费人，自带先攻、践踏和系命。一旦她打中某位对手，直到你下个回合之前，任何来源对那位对手或他的永久物造成的伤害都会翻倍。喜欢把装备和伤害都往一个目标上堆的玩家会喜欢她。","build":"牌组给她配装备，也配上能蹭到翻倍的伤害牌。源氏之护手（Genji Glove）给她双击，还在第一个战斗阶段后追加一次战斗；毁灭剑（Buster Sword）打中对手补一张牌，蜥蜴双刀（Lizard Blades）也提供双击。等她打中过，闪电击（Lightning Bolt）这类伤害牌就会打出双倍。新人注意：翻倍只对她打中的玩家有效，别打错人。"},"Satya, Aetherflux Genius":{"tagline":"每次攻击复制一只生物，能量够就留下来","intro":"乙太流天才萨提亚（Satya, Aetherflux Genius）是红白蓝的四费人。她每次攻击时会复制你另一只生物，复制品立刻跟着进攻，同时给你两个能量指示物；回合结束时你付得出等量的能量，它就留在场上。喜欢积攒资源的玩家会喜欢她。","build":"牌组要同时准备值得复制的生物和足够的能量。乙太枢纽（Aether Hub）、日能转换仪（Solar Transformer）除了产法术力还顺手给你能量，炼煮模块（Decoction Module）在每只生物进场时给你一点，伊捷产能所（Izzet Generatorium）让你拿到的能量都多一个。新人注意：能量是用来买下复制品的，别一口气全花光。"},"Eshki, Temur's Roar":{"tagline":"放大生物就长个子，还会烧对面全体","intro":"铁木尔之吼艾丝琦（Eshki, Temur's Roar）是红绿蓝的三费战士。你每施放一个生物咒语，她都会变大一点；那只生物的力量有四点以上，你还能顺便抓一张牌；六点以上时她还会对每个对手造成等于自己力量的伤害。喜欢大打大闹的新人会很享受。","build":"牌组几乎全是力量四点以上的大生物。黑山之威血爪（Goreclaw, Terror of Qal Sisma）让这类生物少付两点法术力，铁木尔战呼人（Temur Battlecrier）在你场上有大生物时让所有咒语都变便宜，两者加起来能让始饥戈厄塔（Ghalta, Primal Hunger）很早就下场。新人注意：优先出力量六点以上的生物，才能启动烧血。"},"Eluge, the Shoreless Sea":{"tagline":"洪水染地，法术越来越便宜，鱼也越来越大","intro":"无滨瀚海艾鲁格（Eluge, the Shoreless Sea）是蓝色的四费大鱼。它进场或攻击时能在自己的地上放洪水指示物，那块地就多出一个海岛身份；它的攻防等于你场上海岛的数量。适合喜欢慢节奏的玩家。","build":"牌组以蓝法术为主：知识涌流（Flow of Knowledge）和预示终时（Finale of Revelation）一次抓一大把牌，高潮（High Tide）让海岛多产蓝法术力，蓝宝石徽章（Sapphire Medallion）让蓝色咒语更便宜。菁华异变（Essence Flux）让艾鲁格离场再回来，再触发一次洪水。新人注意：洪水指示物要放自己地上。"},"Marina Vendrell":{"tagline":"一间间解锁结界房间，慢慢把场面摆满","intro":"玛丽娜樊卓尔（Marina Vendrell）是五色的五费人。她进场时翻开牌库顶七张，把其中的结界全部收进手里；之后每回合她还能免费解锁一张你控制的房间，而房间要解锁后才有效果。适合喜欢慢慢拼场面的人。","build":"牌组几乎全由房间结界搭起来。中央电梯（Central Elevator // Promising Stairs）这类双名房间都能靠主将免费开门，好奇烁光体（Inquisitive Glimmer）让结界咒语和解锁费用都便宜一点，怪体追踪人（Entity Tracker）会在结界进场时帮你抓牌。新人注意：主将每回合只能开一道门，先想好最需要哪一间。"},"Cosmic Spider-Man":{"tagline":"蜘蛛军团全体起飞，一起扑上去","intro":"宇宙蜘蛛侠（Cosmic Spider-Man）是五色的五费传奇生物，自己带着飞行、先攻、践踏、系命和敏捷。每个战斗开始时，你场上其他蜘蛛也会获得这一整套能力直到回合结束。所以这套牌就是收集各种蜘蛛，让它们一起扑上去。适合喜欢群攻的人。","build":"牌组全是蜘蛛。朋克蜘蛛侠（Spider-Punk）让其他蜘蛛获得类似好处，对手还没法反击你的咒语；放射性蜘蛛（Radioactive Spider）帮你找出关键的蜘蛛英雄；潘妮驾驭的SP//dr（SP//dr, Piloted by Peni）进场给生物加指示物，你用改造过的生物打中对手时还能补牌。新人注意：保证蜘蛛数量，主将好处分给所有同伴。"},"Temmet, Naktamun's Will":{"tagline":"一边打一边换牌，越抓僵尸越猛","intro":"拿塔蒙之志蒂穆特（Temmet, Naktamun's Will）是黑白蓝的五费僵尸法师，自带警戒和威慑。它每次攻击都能让你抓一张牌再丢一张牌，而你只要抓牌，你场上所有僵尸就会一起变大。喜欢僵尸题材、想体验边打边换牌节奏的玩家会喜欢它。","build":"牌组以僵尸为主。甲虫神（The Scarab God）会在你回合开始时按僵尸的数量让对手掉血，永生煞神欧柯塔（God-Eternal Oketra）在你每出一只生物时都会带来一个体型不小的僵尸战士。坟场也是资源：邪气石窟（Unholy Grotto）能把僵尸放回牌库顶。新人注意：丢牌别乱丢，坟场里的僵尸还有用。"},"Inspirit, Flagship Vessel":{"tagline":"给飞船充能，充够八点就变身","intro":"威武旗舰激励号（Inspirit, Flagship Vessel）是红白蓝的三费传奇神器飞船。你可以横置自己另一个生物，按它的力量给飞船放充能指示物；凑到八个以后它就变成生物并开始飞行。喜欢拼零件、把一个东西一点点养大的玩家会喜欢它。","build":"牌组围绕充能指示物和神器展开。至高思维奇洛（Kilo, Apogee Mind）每次被横置都会让所有带指示物的东西再多一个，正好喂给飞船；电涌通导械（Surge Conductor）在每件神器进场时也帮你补指示物；洞察引擎（Insight Engine）自己攒充能指示物并照数量抓牌。新人注意：把力量大的生物专门留给飞船充能，效果最好。"},"Azlask, the Swelling Scourge":{"tagline":"自己人越死越多，全体就越大越凶","intro":"翻涌灾祸兹拉克（Azlask, the Swelling Scourge）是五色的三费奥札奇。每当它自己或者你其他无色生物死去，你就得到一个经验指示物；之后你付五色法术力，你所有生物就会按经验指示物的数量变大。喜欢用小兵换场面的新人会喜欢它。","build":"牌组主线是造一堆便宜的无色小兵，再让它们去死。觉醒区域（Awakening Zone）每回合都免费给你一只奥札奇衍生物，吱响调度体（Chittering Dispatcher）这类生物离场时还会留下小兵。奈拓族的莫伦（Meren of Clan Nel Toth）每次有生物死掉都给你经验指示物。新人注意：攒够经验指示物后，那一发五色法术力才是重点。"},"Fire Lord Zuko":{"tagline":"从放逐区偷牌来用，全队一起长大","intro":"烈火君苏科（Fire Lord Zuko）是黑红白的三费人。它攻击时会产出等于自己力量的红色法术力；而你从放逐区施放咒语、或者你的永久物从放逐区回到场上时，你场上所有生物都会各加一个指示物。喜欢一点点把全场喂大的玩家会喜欢它。","build":"牌组要保证几乎每回合都有东西能从放逐区拿出来。重铸利锋拉耶梨（Laelia, the Blade Reforged）、遭逐储君苏科（Zuko, Exiled Prince）、书契坡斯博（Prosper, Tome-Bound）都能把牌库顶的牌放进放逐区让你施放，每用出一张，全场生物就变大。新人注意：放逐区里的牌通常只在规定时间内能用，别错过时机。"},"Doran, Besieged by Time":{"tagline":"防御力高的生物最吃香，打起来还变强","intro":"岁月攻蚀的杜蓝（Doran, Besieged by Time）是黑白绿的四费树妖。它偏爱防御力比力量高的生物：这类生物费用便宜一点，而且进攻或阻挡时会按力量与防御力的差额临时变大。喜欢用一堆墙一样的大块头压人的玩家会喜欢它。","build":"组牌的关键是找防御力明显高于力量的生物。突袭阵型（Assault Formation）、攻城塔杜蓝（Doran, the Siege Tower）、基岩驮龟（Bedrock Tortoise）这几张都能让生物改成按防御力打人，和主将一起在场时，你那边的每一拳都会比看上去重很多。新人注意：别只看力量，这套牌的本事藏在防御力里。"},"Blech, Loafing Pest":{"tagline":"一回血，害虫蝙蝠虫子全变大","intro":"游荡害虫毕雷奇（Blech, Loafing Pest）是黑绿的三费害虫，规则一句话就能说完：你每回一次血，你场上所有的害虫、蝙蝠、昆虫、蛇和蜘蛛都会各加一个指示物。所以只要不停回血，小虫子们就会一只只变大，上手难度很低。","build":"牌组要做的就是多多回血，并且尽量让场上的生物都属于那五种类型。教师的害虫（Teacher's Pest）攻击时让你回一点血，还能从坟场反复回来；害虫侵扰（Pest Infestation）一次造出一大批害虫衍生物，贝雷卓靡华（Beledros Witherbloom）每回合都送你一只害虫。新人注意：造衍生物和回血要交替着来，别只顾一头。"},"Dr. Eggman":{"tagline":"对手要么丢牌，要么放你一只大机器人上场","intro":"蛋头博士（Dr. Eggman）是蓝黑红的五费科学家，自带飞行。每到你的回合结束，你先抓一张牌，然后每个对手都要做一个坏蛋式的选择：要么丢掉一张牌，要么让你从手里免费把一张组构体、机器人或载具放进场。适合喜欢机器人的玩家。","build":"牌组里全是组构体、机器人和载具，越有冲击力越好。恶毒巨械（Noxious Gearhulk）进场能拆掉对手一只生物并让你回血，易燃巨械（Combustible Gearhulk）逼对手在你抓三张和被打一顿之间选一个，秘耳斗球（Myr Battlesphere）一次带出四个小机器。新人注意：手里随时留一张大机器人，对手多半宁愿丢牌。"},"Omo, Queen of Vesuva":{"tagline":"给一块地加个指示物，它就变成所有地形","intro":"维苏瓦女皇欧茉（Omo, Queen of 维苏瓦（Vesuva））是蓝绿的三费变形兽。它进场或攻击时可以给一块地和一只生物各放一个万能指示物：带指示物的地会同时算作所有地形类型，带指示物的非地生物则同时算作所有生物类型。适合喜欢拼地牌的玩家。","build":"牌组重点就是地牌。云际哨站（Cloudpost）按同类地数量产法术力，克撒的塔（Urza's Tower）、克撒的动力炉（Urza's Power Plant）、克撒的矿脉（Urza's Mine）凑齐后法术力大增；欧茉的万能指示物能让一块地算作这几类地形。维苏瓦（Vesuva）能复制别的强力地牌。新人注意：万能指示物一次只给一块地和一只生物。"},"Shroofus Sproutsire":{"tagline":"小孢子生物越铺越多，一冲就翻倍","intro":"孢爵舒福斯（Shroofus Sproutsire）是绿色的三费传奇生物，带践踏。你的孢子小兵每次打中对手，你就再造出等量的新孢子小兵——打中几只就多几只，于是下一次攻击的规模更大。适合第一次接触万智牌、喜欢看小生物变多的新人。","build":"牌组要尽量多造绿色的小孢子衍生物，并且让它们打得到人。新叶树灵（Tendershoot Dryad）、乌托菌（Utopia Mycon）每回合都会免费给你新的小孢子，孢冠散绿菌（Sporecrown Thallid）和森林赞美诗（Sylvan Anthem）给这些小东西加成。新人注意：尽量让每个小兵都打中对手，而不是被挡住。"},"Wolverine, Best There Is":{"tagline":"让他不停找人打架，越打越大","intro":"全力出战金刚狼（Wolverine, Best There Is）是个专找架打的主将：他造成的伤害翻倍，只要这回合打中过别的生物，回合结束就能多一个＋1/＋1 指示物。喜欢单挑、看他一个人清场的人会中意。","build":"思路是创造让他打中对手生物的机会，同时别让他死。坚固鳞甲（Hardened Scales）让指示物多攒一个，欧佐晶岩（The Ozolith）能收起指示物再送回去，成长仪式（Rite of Passage）让他挨打也长大，狂暴术（Berserk）让他这回合难以阻挡。茜卓扬焰（Chandra's Ignition）把他的攻击力一次泼给所有对手和生物。"},"Edward Kenway":{"tagline":"开着载具出海，顺手把对手的牌偷来用","intro":"爱德华·肯威（Edward Kenway）是海盗船队的头目。你回合结束时，每个横置的海盗、刺客或载具都会变成一枚宝物；载具打中对手时，你还能从对方牌库顶翻走一张牌，之后一直可以用掉它。","build":"先铺海盗和载具，再把宝物花掉。载具要横置生物才能开动，所以海盗既是船员也是攻击手。寒鸦号（Jackdaw）打中对手时能弃掉整手牌换一批新的，好战者号（The Belligerent）每次攻击都产宝物，大无畏号（The Indomitable）让你每次打中对手都抽一张牌。宝物既能付费用，也能拿来施放你偷来的牌。"},"Golbez, Crystal Collector":{"tagline":"神器铺满场，捞回大生物让对手掉血","intro":"水晶收集客高贝扎（Golbez, Crystal Collector）两点法术力就能上场。你每有一个神器进场，他都能看一眼牌库顶并决定它的去留；回合结束时，如果你场上有四个以上神器，他会从坟场捞一张生物牌回手，八个以上还会让所有对手掉血。","build":"核心是堆神器。悉诺议会宅邸（Seat of the Synod）、细语黯窖（Vault of Whispers）这类神器地既产法术力又算神器，乙金塑师（Etherium Sculptor）让神器咒语更便宜，扑翼大师塞埃（Sai, Master Thopterist）每放一个神器就多一只飞行的衍生物。想赢靠坟场里最大的生物：反复捞回手上，让对手持续掉血。"},"Vren, the Relentless":{"tagline":"对手的生物一死，就变成你的老鼠","intro":"无情的维伦（Vren, the Relentless）会让对手原本要死的生物被放逐，不会真的进坟场。每到回合结束，他就按这回合被放逐的生物数量造出同样多的老鼠衍生物。所以对手越是失去生物，你场上就越是热闹。","build":"组牌方向是让对手的生物消失，再让维伦把尸体换成老鼠。希欧蕊的勒令（Sheoldred's Edict）逼对手自己牺牲生物，贫窟霸食人魔（Ogre Slumlord）和水渠鼠霸捷敏王（Lord Skitter, Sewer King）会在生物死亡时顺带给你老鼠，啮骨牙（Marrow-Gnawer）则能让已有的老鼠成倍增加。老鼠单个不大，但会互相加持。"},"Anti-Venom, Horrifying Healer":{"tagline":"把所有伤害都扛在自己身上，越挨打越大","intro":"可怖医师反毒液（Anti-Venom, Horrifying Healer）进场时，如果你是从手上施放他的，可以顺手把坟场里一张生物牌拉回场上。更关键的是，任何要打在他身上的伤害都会被挡下，变成同样多的＋1/＋1 指示物。挨打就是变强。","build":"思路是把对手火力全引到他身上。贱民（Pariah）和贱民之盾（Pariah's Shield）把打你的伤害转到他身上，罪恶感（Guilty Conscience）让他打人的同时反受伤害，还因此变强。非瑞克西亚雪恨兽（Phyrexian Vindicator）也是「伤害被挡下就反弹」的生物，宿敌面具（Nemesis Mask）能逼所有生物来挡他。"},"Rendmaw, Creaking Nest":{"tagline":"给每个人都发一只鸟，让他们互相打","intro":"嘎响草窝裂口（Rendmaw, Creaking Nest）是个稻草人。它进场时，以及每当你在一个回合里使用一张兼具两种以上类别的牌，场上每个人都会得到一只带飞行的 2/2 黑色鸟衍生物，而且这些鸟每回合都必须攻击，还得尽量去打你以外的玩家。","build":"所以要多放「一张牌算两种类型」的东西：暗苔结桥（Darkmoss Bridge）是神器兼地，瓦伽沃巢穴（Valgavoth's Lair）是结界兼地，树灵乔木（Dryad Arbor）是地兼生物，天堂扑翼机（Ornithopter of Paradise）是神器兼生物。它们既产法术力，又能反复触发裂口。赢法不是自己打死人，而是让对手互相攻击耗掉。"},"Disa the Restless":{"tagline":"把大怪物丢进坟场，再让它们跳回场上","intro":"勇行者蒂莎（Disa the Restless）盯着一类叫拉高耶夫（Lhurgoyf）的生物。只要这类永久物牌从别的地方进到你的坟场，她就会直接把它放到场上；而每当你的生物打中对手，你还能造出一只衍生物。喜欢坟场玩法的人会很中意。","build":"把拉高耶夫（Lhurgoyf）送进坟场靠自己丢和磨。烈焰耶夫（Pyrogoyf）、复体耶夫（Polygoyf）都是这类生物，身材按坟场牌数算，坟场越厚越大。丧信掠夺（Faithless Looting）让你抽牌的同时丢掉不要的牌，覆面林连结点（Maskwood Nexus）让你的生物都算作拉高耶夫（Lhurgoyf），吃到蒂莎的复活效果。"},"Wick, the Whorled Mind":{"tagline":"养一只越变越大的蜗牛，一次炸掉所有对手","intro":"迷眠心灵威克（Wick, the Whorled Mind）和老鼠、蜗牛打交道。每当他或另一只老鼠进场，如果你还没有蜗牛，他就给你造一只 1/1 蜗牛；已经有蜗牛的话，就往蜗牛身上加一个＋1/＋1 指示物。蜗牛越大，他后面那一击就越痛。","build":"铺老鼠是第一步，因为每只老鼠都能让蜗牛变大。水渠鼠霸捷敏王（Lord Skitter, Sewer King）和鼠群魔笛手（Piper of the Swarm）都能不断补充老鼠，托腾坦之歌（Song of Totentanz）能一次铺出一大票。等蜗牛体型够了，付出蓝黑红各一点法术力把它牺牲掉，威克就会按它的攻击力打所有对手一次，同时让你抽同样数量的牌。"},"Celes, Rune Knight":{"tagline":"从坟场反复把人叫回来，全队一起长大","intro":"符文骑士塞丽丝（Celes, Rune Knight）进场时可以先丢掉任意数量的牌，再抽比丢掉的数目多一张。她真正的本事在后面：只要你有一个别的生物从坟场进到场上，你场上所有生物都会拿到一个＋1/＋1 指示物。","build":"所以这套牌反复从坟场叫人回来。活尸法（Reanimate）、尸变（Animate Dead）把坟场生物拉回场上；腐臭鬼怪（Putrid Goblin）、夺魂红帽客（Murderous Redcap）这类死掉会自己回来的生物，每死一次给全队加指示物；流光烁影（Ephemerate）把生物放逐再送回，同样触发塞丽丝。要记住：只有从坟场进场才算数。"},"Hazel of the Rootbloom":{"tagline":"衍生物越铺越多，还能复制最好用的那个","intro":"繁根教的哈珠儿（Hazel of the Rootbloom）是松鼠德鲁伊。她可以让你横置若干个衍生物、付两点生命，换回等量的任意颜色法术力；每到回合结束，她还会复制你场上的一个衍生物，如果复制的是松鼠，就一次复制两个。","build":"铺衍生物是基础：既是她的法术力，也是复制对象。松鼠将军聒牙（Chatterfang, Squirrel General）让每次造衍生物多一只松鼠，叽响喷吐器（Chitterspitter）靠牺牲衍生物把整队松鼠养大，暴群场大屠杀（Swarmyard Massacre）一次造两只松鼠，还削弱不属于虫、鼠、蜘蛛、松鼠的生物。复制优先给场上最大的。"},"Sonic the Hedgehog":{"tagline":"带一群跑得快的家伙冲上去，顺手攒宝物","intro":"刺猬索尼克（Sonic the Hedgehog）自带敏捷，攻击时会给每个有闪现或敏捷的生物都加一个＋1/＋1 指示物。更妙的是，你的这类生物每次受到伤害，你就能造一枚宝物。所以他不怕互殴，反而希望自己的生物被打。","build":"核心是塞满有闪现和敏捷的生物：针鼹纳克鲁斯（Knuckles the Echidna）和跨金桥巨龙（Goldspan Dragon）都跟着变大。鲜血烈焰（Pyrohemia）每付一点红色法术力，就对每个生物和玩家各造成一点伤害，正好反复触发索尼克受伤产宝物。超级状态（Super State）贴上去把生物变成 9/9，并给飞行、先攻、践踏和敏捷。"},"The Mindskinner":{"tagline":"让它的伤害全部变成对手的牌库大出血","intro":"剥忆惧魇（The Mindskinner）不能被阻挡，而它造成的伤害不会真的打伤对手，而是让每个对手把牌库顶同样数量的牌放进坟场。所以它不是靠把人打到 0 血赢，而是靠把对手的牌库掏空。适合喜欢慢慢磨死对手的人。","build":"让它打中对手是唯一要做的事，所以要提高次数和数值。鸣火杖（Fireshrieker）让它一次攻击打两轮伤害，浮夸的布鲁瓦（Bruvac the Grandiloquent）让对手每次磨牌都翻倍，水之水晶（The Water Crystal）每次多磨四张。遗迹蟹（Ruin Crab）在你下地时也会帮忙，宣导（Propaganda）能拖住对手的进攻。"},"Shadow the Hedgehog":{"tagline":"用神器产的法术力施咒，对手插不上手","intro":"刺猬夏特（Shadow the Hedgehog）自带敏捷，而且你的有闪现或敏捷的生物死掉时会让你抽一张牌。他最特别的地方是：只要你施放咒语时用到了神器产出的法术力，那个咒语在结算前对手基本无法回应。","build":"这套牌要的是神器产出的法术力：大熔炉（Great Furnace）、玄铁殿堂（Darksteel Citadel）这类神器地，还有不羁饰符（Talisman of Indulgence）都值得放。生物死掉能抽牌，所以致命争执（Deadly Dispute）这种牺牲换两张牌的牌一点不亏。宝窖（Treasure Vault）能一次换成一大把宝物。"},"Captain Howler, Sea Scourge":{"tagline":"丢了牌就变大，打中对手还能补牌","intro":"沧海之灾嚎勒船长（Captain Howler, Sea Scourge）喜欢看你丢牌：每当你丢弃一张或更多牌，一个目标生物就会按弃牌数量获得＋2/＋0；如果那个生物这回合打中了对手，你还能抽一张牌。而且对手想指定他还得额外付出代价。","build":"组的重点是抽了再丢的牌。丧信掠夺（Faithless Looting）和狂搜乱寻（Frantic Search）都能让你一次抽两张再丢两张，正好喂饱船长；浆身火炮师（Magmakin Artillerist）更是每弃一次就打所有对手一轮。坚忍纪念碑（Monument to Endurance）每次丢牌都给你抽牌、宝物或让对手掉三点血。"},"Yuna, Grand Summoner":{"tagline":"法术力和＋1/＋1 指示物互相喂养","intro":"大召唤士尤娜（Yuna, Grand Summoner）横置就能产一点任意颜色法术力，并且让你这回合下一只生物进场时多带两个＋1/＋1 指示物。她还有第二段：只要你场上别的永久物带着指示物进坟场，那些指示物就能转移到你指定的生物身上。","build":"打法是用她的法术力施放带指示物的生物，再靠指示物撑场面。幻光盘（Sphere Grid）、坚固鳞甲（Hardened Scales）让指示物攒得更快更多，自行弩炮（Walking Ballista）、护育德鲁伊（Incubation Druid）把指示物当资源用。厄亡裁决（Damning Verdict）摧毁所有没指示物的生物，你的生物安然留下。"},"Sokka, Tenacious Tactician":{"tagline":"每施放一个咒语，就多一个伙伴、全队变大","intro":"坚毅策士索卡（Sokka, Tenacious Tactician）自己带威慑，而且你每施放一个非生物咒语他就暂时变大一点，其他伙伴也有同样的能力。每当你施放非生物咒语，他还会造出一只 1/1 的白色伙伴衍生物。你越爱用咒语，场上人越多。","build":"所以要塞很多便宜的非生物咒语：脑力激荡（Brainstorm）和抉择（Opt）既能摸牌又能触发索卡，流放之径（Path to Exile）顺手解决一个麻烦生物，思绪旋风（Whirlwind of Thought）让你每施放一个非生物咒语就再抽一张。伙伴多了之后，索卡的冲锋（Sokka's Charge）和齐心抗敌（United Front）会更值。"},"Dina, Essence Brewer":{"tagline":"小生物一个个喂给她，换来生命和巨型生物","intro":"酿灵迪娜（Dina, Essence Brewer）靠牺牲活着。你每次牺牲一个生物，她就能让你抽一张牌，不过一回合只触发一次；她还能付两点法术力和一次横置，牺牲另一个生物，换来等量的生命，并把同样多的＋1/＋1 指示物堆到一个生物身上。","build":"关键是有可随时牺牲的小东西。舞蛇术士（Ophiomancer）和害虫救护师（Pest Rescuer）每回合免费送你一只可牺牲的衍生物，最高市场（High Market）能牺牲生物换生命，贝雷卓靡华（Beledros Witherbloom）还能付十点生命重置所有地。牺牲的生物力量越大，换来的生命和指示物越多，适合拿小的换资源、大的长大再动手。"},"Tinybones, Bauble Burglar":{"tagline":"逼对手弃牌，再把弃掉的牌拿来自己用","intro":"饰品妙盗细骨（Tinybones, Bauble Burglar）只有两点法术力，却很难应付。对手每弃掉一张牌，那张牌就会被放逐并做上标记；到了你的回合，你可以用任意法术力把这些不属于你的牌施放出来。他还能源源不断地逼所有对手弃牌。","build":"整套牌围绕对手弃牌。物尽其用（Waste Not）在对手弃牌时给衍生物、法术力或牌，压制（Oppression）和痛苦窘境（Painful Quandary）让对手每次施放咒语都弃牌或掉血，窃物鼠（Burglar Rat）进场逼所有人弃牌。盖司秘录（Geth's Grimoire）让你对手弃牌就抽一张。新手要记得，别人的牌也得付得起费用。"},"Kona, Rescue Beastie":{"tagline":"让科纳横着，免费从手上放永久物进场","intro":"救星兽伴科纳（Kona, Rescue Beastie）只有一个效果，但很实在：在你的第二主阶段开始时，只要科纳是横置状态，你就可以从手上直接放一张永久物牌进场，不用付法术力。攻击也好、拿它去产法术力也好，只要它横着就行。","build":"所以要让横置科纳变成顺手的事。春叶鼓（Springleaf Drum）能横置生物产法术力，正好一举两得；坚守者聚落（Holdout Settlement）是能横置生物产法术力的地。手上要放得下大东西，世脊亚龙（Worldspine Wurm）这类高费大生物因此能提前几回合登场，东树木灵（Kodama of the East Tree）还能接着铺。"},"Alania, Divergent Storm":{"tagline":"一回合三连法术，靠水獭帮你复制咒语","intro":"发散风暴艾岚妮（Alania, Divergent Storm）关心的是这回合的第一张。你每回合施放的第一张瞬间、第一张法术、第一张水獭咒语，都会被复制一份；代价是必须让一个对手抽一张牌。用一点小代价换双倍效果，是这套牌的乐趣。","build":"所以要在一回合里用上三种第一张：先施放一张瞬间，再一张法术，再让一只水獭进场，这样能复制三次。让谁抽牌也是学问，通常挑威胁最小的。苍茂谷唤洪师（Valley Floodcaller）让你的非生物咒语都能当瞬间放，方便凑连击；捕风导师（Stormcatch Mentor）、劈风师（Stormsplitter）既是水獭，也会因法术连发变强。"},"Zimone, Infinite Analyst":{"tagline":"每回合第一张自选费用的咒语，越放越大","intro":"无限究员琦梦（Zimone, Infinite Analyst）和「费用要自己决定投入多少」的咒语绑在一起：你每回合第一张这样的咒语，会因为她身上的＋1/＋1 指示物而便宜一些；而每当你施放这回合的第一张，她自己就长大两个指示物。","build":"打法就是每回合放一张费用自填的咒语，先从小额开始，长大再一掷千金。金脉多头龙（Goldvein Hydra）、水螅融合体（Hydroid Krasis）、善心多头龙（Benevolent Hydra）都能把它当身材用。无拘滋养（Unbound Flourishing）翻倍这类咒语，物灵师唤醒（Animist's Awakening）把法术力换地。"},"Silverquill, the Disputant":{"tagline":"先铺一堆小兵，再把每张法术复制一遍","intro":"启论巨龙银毫（Silverquill, the Disputant）是一条会飞、还会警戒的老龙。它的效果是让你的每一张瞬间和法术都能在施放时牺牲一个攻击力 1 以上的生物，换来这个咒语被复制一次。小兵在它眼里就是双倍法术的燃料。","build":"组牌第一件事是备够小生物。寺院明师（Monastery Mentor）在你施放非生物咒语时源源不断产衍生物，舞蛇术士（Ophiomancer）每回合免费给一条蛇，它们既是攻击手也是牺牲品。然后挑那些复制一次就很值的咒语：卫护荒漠（Secure the Wastes）和渐强终响（Grand Crescendo）都是费用能自填的，复制等于铺两倍场。"},"Killian, Decisive Mentor":{"tagline":"给对手的生物贴上灵气，逼它们去打别人","intro":"果决导师齐力安（Killian, Decisive Mentor）的工作是操纵战斗。你的每个结界进场时，他都能横置一个对手的生物并逼它去攻击、而且尽量不去打你；每当你用灵气附着的生物攻击时，你就能抽一张牌。","build":"这套牌靠灵气，也就是贴在生物上的结界。放得越多，齐力安越能让对手生物互耗；尸鬼促动（Ghoulish Impetus）、玄铁异变（Darksteel Mutation）都能长期留场，寇族魂舞者（Kor Spiritdancer）在你贴灵气时帮你抽牌。毒苹果艾纶缇（Eriette of the Charmed Apple）更进一步：贴了灵气就不能攻击你。"},"Trostani, Selesnya's Voice":{"tagline":"铺出一大片生物，再不断复制最大的那个","intro":"瑟雷尼亚之声卓塔妮（Trostani, Selesnya's Voice）是最容易上手的一位。你每有一只别的生物进场，就按它的防御力回一次血；她还能付一次横置，复制你场上的一个生物衍生物，也就是白拿一只一模一样的大生物。","build":"思路很直接：先造又大又值的衍生物，再反复复制。华冠日魇（Crested Sunmare）在你回血后回合结束时造出 5/5 的马，复耀黎兹（Rhys the Redeemed）一次复制所有衍生物，根生卫护（Rootborn Defenses）、破散生长（Sundering Growth）保命或拆东西时顺便复制一次。要留意：她只复制衍生物，普通生物不行。"},"The Jolly Balloon Man":{"tagline":"把好用的生物复制成气球，用完就送它上路","intro":"吹气文丑（The Jolly Balloon Man）自带敏捷，可以付一点法术力和一次横置，把你场上另一个生物复制成一个 1/1 的红色气球衍生物。它多出飞行和敏捷，但会在下一个回合结束时被牺牲掉，用来借用别人进场时的效果最划算。","build":"所以套牌要挑进场就有用的生物。灵念伴侣（Spirited Companion）复制一次就再抽一张牌，黯色幻影（Solemn Simulacrum）复制一次就再找一张地，村庄司钟（Village Bell-Ringer）复制出来能让所有生物重置。冲击震颤（Impact Tremors）让你的每个衍生物进场都烫对手一下。复制前先想好这回合要什么效果。"},"Lorehold, the Historian":{"tagline":"抽到的第一张法术，两点法术力就能用掉","intro":"启史巨龙衡鉴（Lorehold, the Historian）是一条会飞、有敏捷的老龙。你手上的每张瞬间和法术都有个便宜的价格：如果它是你这回合抽到的第一张牌，两点法术力就能用掉。另外在每个对手的维持阶段，你都能丢一张牌换一张新的。","build":"所以这套牌关键在控制抽牌时机。梁博士图书馆（Library of Leng）让你要丢的牌回牌库顶，配合衡鉴每回合的丢牌抽牌，反复把同一张好牌摆回手上；师范占卜陀螺（Sensei's Divining Top）帮你整理牌库顶。赢法通常先攒够法术力：大干一票（Big Score）换来一堆宝物，接着寻得母脉（Hit the Mother Lode）压上去。"},"Prismari, the Inspiration":{"tagline":"一回合连甩法术，后面的每一张都被复制","intro":"启迪巨龙粹丽（Prismari, the Inspiration）是一条七费的大龙，有飞行，对手想指定它还得付五点生命。它带来的是复制：你每施放一张瞬间或法术，它都会被复制——这回合在你之前施放过的咒语越多，复制出来的份数就越多。","build":"要用上它，你得在同一回合尽量多施放咒语，手上还得有足够法术力。热病祭礼（Pyretic Ritual）、热血战歌（Seething Song）都专产法术力；暴风窑艺家（Storm-Kiln Artist）每次施放或复制都给宝物。荣休大法师（Archmage Emeritus）让你每次施放或复制抽牌，狂搜乱寻（Frantic Search）顺便换牌。"},"Doctor Doom, King of Latveria":{"tagline":"专门给反派打工，弃掉地就让对手掉血","intro":"拉托维利亚之王毁灭博士（Doctor Doom, King of Latveria）围绕「反派」这类永久物和弃牌组队。你每弃掉一张或更多地牌，每个对手就掉两点血；战斗阶段开始时，他会让一个反派获得威慑并抽一张再弃一张，弃到非地牌那只反派就变大。","build":"这套牌的燃料来自博士每回合的抽牌弃牌：弃到地牌，三个对手一起掉血；弃到非地牌，反派就长一点。所以要多放反派，无边恶念奥创（Ultron, Unlimited）、凌虐大亨铁霸王（Iron Monger, Sadistic Tycoon）都能接着抽弃或给全队加指示物，反派居所（Villainous Hideout）还能帮你凑齐三色法术力。"},"Infinite Guideline Station":{"tagline":"多色永久物越多，机器人和手牌就越多","intro":"永继导引基地（Infinite Guideline Station）是一艘五色的太空船。它进场时会按你场上多色永久物的数量，一次造出同样多的 2/2 机器人衍生物；等它攒够充能指示物变成生物之后，每次攻击还能按多色永久物的数量抽牌。","build":"所以套牌里尽量都放两种以上颜色。费罗洛基理将军（General Ferrous Rokiric）在你施放多色咒语时造出 4/4，仙林境接骨木（Faeburrow Elder）按你场上的颜色数量产法术力。想让它从飞船变成生物，需要横置别的生物来攒十二个充能指示物，至高思维奇洛（Kilo, Apogee Mind）每次被横置还会增殖，让这条路走得更快。"},"Ketramose, the New Dawn":{"tagline":"把牌往放逐区送，换手牌也换他出手的资格","intro":"灿烂新晖柯塔摩斯（Ketramose, the New Dawn）有威慑、打中人就回血，还不会被摧毁，但只有当你放逐区里有七张以上的牌时，他才能攻击和阻挡。好消息是：在你的回合里，只要有牌从坟场或场上被放进放逐区，你就能抽一张牌、掉一点血。","build":"所以这套牌要常往放逐区塞牌。吸魂器（Ghost Vacuum）和狮头饰带（Lion Sash）都能从坟场放逐牌、攒数量；流放之径（Path to Exile）既能解决麻烦生物，又能在放逐区加一张。流光烁影（Ephemerate）和亢奋牧犬费利亚（Phelia, Exuberant Shepherd）会把你的生物暂时放逐再送回，每来回一次就抽一张。"},"Saheeli, Radiant Creator":{"tagline":"攒够能量，复制自己最大的一件","intro":"她是绿蓝红三色的神器与工匠主将：你每放一个神器咒语或工匠咒语，就攒下一个能量指示物；开打前花掉三个能量，就能复制自己场上任意一个永久物，复制出来的还是 5/5、带敏捷的神器生物。喜欢先铺一桌零件、再突然复制一件大东西的玩家会喜欢她。","build":"一半以上放地，其余多是能产法术力、又顺手给能量的神器和地，乙太枢纽（Aether Hub）、炼煮模块（Decoction Module）都算这一类。攒够三个能量，就复制场上最大的那件东西，复制品带敏捷，当回合就能打。新人注意：复制品在你结束步骤会被牺牲，是一波爆发不是长期战力，能量来源得先铺好。"},"Tannuk, Steadfast Second":{"tagline":"手里的红牌和神器都能提前放","intro":"他是红色的飞行员主将：你其他生物都带敏捷，手牌里的神器牌和红色生物牌还多了一个用法——可以提前放出来，代价是它到你的结束步骤会被放逐，之后才能从放逐区再放一次。喜欢一回合里连着往外砸东西的玩家会喜欢他。","build":"红宝石徽章（Ruby Medallion）让红咒语都便宜一点，陨石魔像（Meteor Golem）这类「进场就有用」的大件可以提前放一次、再从放逐区放第二次，效果用两遍。咒法师之柜（Conjurer's Closet）每个结束步骤还能带一只生物出场再回来，等于再多一次。新人注意：主将不在场，你其他生物就没有敏捷。"},"Kastral, the Windcrested":{"tagline":"鸟打中一次，就三选一拿好处","intro":"她是蓝白两色的鸟主将，自己会飞。只要有一只你的鸟打中对手，你就在三件事里选一件：从手上或坟场免费放一只鸟进场、给全场每只鸟一个 +1/+1 指示物、或者抽一张牌。所以这套牌就是一群会飞的小鸟轮番打人，喜欢铺一群飞兵的玩家会喜欢她。","build":"大半是鸟，费用尽量压低。伊弗斯岛护卫（Warden of Evos Isle）和护球守卫（Watcher of the Spheres）让带飞行的生物咒语都便宜一点，苍穹灵鹰（Empyrean Eagle）给会飞的伙伴一起加身材。新人注意：触发条件是「你的鸟打中对手」，坟场里的鸟能被拉回场上，但会带上终命指示物，死掉直接放逐，只能用这一次。"},"Thranduil, the Elvenking":{"tagline":"坟场里的妖精，能力归主将用","intro":"他是黑绿蓝三色的妖精主将，最大的特点是「偷学」：坟场里所有妖精牌的启动式能力，他全都能用；每当另一个传奇妖精进场，你还抽两张牌再丢一张。喜欢妖精铺场、也不排斥主动往坟场里送牌的玩家会喜欢他。","build":"活埋（Buried Alive）一次能找三张生物牌丢进坟场，正好给主将凑能力。坟场里躺着虔诚德鲁伊（Devoted Druid）时，主将既有产法术力的能力，也能用身上一个 -1/-1 指示物换一次解横置，于是反复产法术力。新人注意：主将每解一次横置就小一圈，连着用会把自己耗死，先算好次数。"},"Katara, the Fearless":{"tagline":"伙伴的能力，统统触发两遍","intro":"她是三色的伙伴主将，规则只有一句：你操控的伙伴生物的触发式能力，全部额外触发一次。所以她不太打人，价值都在场上一群伙伴身上——同一个进场效果会连着发生两次。喜欢让一桌子小生物互相配合的玩家会喜欢她。","build":"整套牌几乎都是伙伴生物，一进场就给你东西。南极旅人（South Pole Voyager）进场回血，同回合第二次结算顺便抽一张；大鸿沟向导（Great Divide Guide）让你每块地和每个伙伴都能产一点任意颜色的法术力，费用就不缺了。新人注意：主将只把触发翻倍，赢的手段还得靠伙伴自己，所以伙伴要够多；她是三色主将，地要配得稳一点。"},"Quintorius, History Chaser":{"tagline":"牌一离开坟场，就多一个魂灵","intro":"他是一位旅法师主将：只要有一张以上的牌离开你的坟场，你就得到一个 3/2 的红白魂灵。他的加一能力是弃一张牌，然后抽两张、再磨一张——正好把牌送进坟场又立刻让它离开。喜欢在坟场里来回倒牌的玩家会喜欢他。","build":"核心是让牌反复进出坟场。丧信掠夺（Faithless Looting）先抽两张再让你丢两张，之后还能从坟场再放一次；货币兑换机（Currency Converter）在你弃牌时把那张牌挪到一边，你随时能换回手里，于是又能抽、又能丢，一圈下来主将能连出好几个魂灵。新人注意：他的减四能力是给魂灵的一次爆发，等魂灵铺够了再开。"},"Betor, Kin to All":{"tagline":"全队防御力凑够数，奖励一层层开","intro":"他是条会飞的灵龙，只在每个回合结束时结一次账：你所有生物的防御力加起来到 10 就抽一张牌，到 20 就把全队都站起来，到 40 就让每个对手失去一半生命。所以这套牌要的不是攻击力，而是一堆厚实、站得住的东西。喜欢堆一面墙的玩家会喜欢他。","build":"牌表里多放防御力高的生物和守军：森林女像柱（Sylvan Caryatid）能产任意颜色的法术力，乔木追随者（Arbor Adherent）按你场上最大的防御力给你等量的法术力。核心是让它们用防御力打人：突袭阵型（Assault Formation）把战斗伤害改成按防御力算。新人注意：结账在你的结束步骤，别在结算前把生物牺牲掉。"},"Gev, Scaled Scorch":{"tagline":"先让对手掉血，新生物就更大","intro":"他是两费的黑红主将，思路很直：每放一个蜥蜴咒语，就让一个对手掉 1 点血；这回合只要有对手掉过血，你之后进场的每个生物都会额外带一个 +1/+1 指示物（掉过血的对手越多，带的越多）。喜欢便宜、快速、前几回合就压上去的玩家会喜欢他。","build":"牌表以蜥蜴和顺手打血的小牌为主：冲击震颤（Impact Tremors）让每个进场的生物都往对手脸上打一点，喷火勒嘎（Spitfire Lagac）是地一进场就打每个对手一点。伤口一开，后面铺出来的生物就带着更大的指示物进场。新人注意：主将两个效果都看这回合对手有没有掉过血，先打血再铺生物才划算。"},"Aloy, Savior of Meridian":{"tagline":"神器生物一攻击，就白翻一张牌","intro":"她是蓝绿两色的主将，自带警戒和延势。只要有一个以上的神器生物跟着她攻击，就按其中最大的攻击力「倾探」：从牌库顶往下翻，翻出一张费用不超过这个数的非地牌，你就能免费放出来或者拿在手里。喜欢铺机器大军、边打边赚的玩家会喜欢她。","build":"关键是把神器生物的攻击力做大。钢铁督军（Steel Overseer）每回合给所有神器生物加一个 +1/+1 指示物，乙金塑师（Etherium Sculptor）让神器咒语便宜一点，翻出来的大概率又是神器。新人注意：触发条件写的是「神器生物」攻击，普通生物不算；翻出来的牌也可以拿进手里先不放。"},"Niko, Light of Hope":{"tagline":"碎片变成你最凶生物的样子","intro":"他是蓝白主将，进场时先给你两个碎片——花两点法术力牺牲掉就能看牌再抽一张的结界衍生物。之后花两点法术力和横置，他就能把一个非传奇生物暂时送出场外，让你所有碎片都变成它的复制品，直到下个回合结束，再原样回来。喜欢临时变身玩法的玩家会喜欢他。","build":"场面靠结界和「进出场」来滚：怪体追踪人（Entity Tracker）在你结界进场时抽牌，灵魂牧者（Soulherder）每个结束步骤再把一个生物送出去、换回来，顺便让它长大一圈。要复制就挑带着进场效果的生物，它回来时效果会再触发一次。新人注意：复制出来的碎片只维持到下个回合结束，是打一波用的。"},"Eddie Brock":{"tagline":"先捞小生物，再翻面吃出来","intro":"他是三费的黑红绿主将，进场时先从坟场把一张费用 1 以下的小生物拉回场上。之后花三点黑红绿翻面：背面的毒液带威慑、践踏、敏捷，攻击时可以吃掉另一个生物，按它的费用抽牌，还能从手里免费放一张便宜的永久物。喜欢用一个生物换一堆资源的玩家会喜欢他。","build":"前半段用小生物铺路：陋族大主教（Ignoble Hierarch）三色都能产，活尸法（Reanimate）直接把坟场里的大生物抢回来。翻面后是高潮，勤工联霸权（Riveteers Ascendancy）在你牺牲生物时把它从坟场拉回场上，正好接上毒液吃人。新人注意：坟场里先要有费用 1 以下的小生物，主将才有东西可捞。"},"Shiko and Narset, Unified":{"tagline":"一回合第二个咒语，白送一个复制","intro":"他是红白蓝三色的主将，会飞、带警戒。每回合你放第二个咒语时，如果那个咒语指向某个永久物或玩家，就复制一份出来（目标可以重选）；要是它不指向任何东西，就改成抽一张牌。喜欢法术连发、愿意算清顺序的玩家会喜欢他。","build":"牌表大半是便宜又能点目标的瞬间和法术。粹丽指命（Prismari Command）一回合能当两张用，二元之声薇兰（Veyran, Voice of Duality）能让这类触发再翻一次，收益直接加倍。新人注意：主将看的是「第二个」咒语，先用便宜的小牌垫一下，把关键的那张留成第二个，顺序错了就白忙一回合。"},"Bria, Riptide Rogue":{"tagline":"法术一放，全队变大又能穿过去","intro":"她是蓝红两色的水獭主将，自己带灵技（每放一个非生物咒语就变大一点），还让其他所有生物也有灵技。更实用的是：你每放一个非生物咒语，就能指定自己一个生物，这回合它不能被阻挡。喜欢法术连打、边打边抽的玩家会喜欢她。","build":"牌表里塞满便宜的非生物咒语，抽牌的优先：抉择（Opt）和沉思（Ponder）都是低费又能筛牌的办法，捕风导师（Stormcatch Mentor）让瞬间和法术再便宜一点，顺手还是个带灵技的小打手。劈风师（Stormsplitter）在你每放一个瞬间或法术时复制自己一次，一回合很容易变成一小队。新人注意：灵技的加成只维持到回合结束。"},"Shilgengar, Sire of Famine":{"tagline":"吃掉天使，攒血换一次全体复活","intro":"他是黑白主将，会飞。他可以吃掉你另一个生物换一个血滴衍生物；如果吃掉的是天使，就按那只天使的防御力换等量的血滴衍生物。攒够六个再一起牺牲，你就能把坟场里所有生物拉回场上，它们同时还变成吸血鬼，喜欢天使、喜欢攒一波翻盘的玩家会喜欢他。","build":"牌表里大部分是会飞的天使：希望圣源吉娅妲（Giada, Font of Hope）让每个天使进场时多带一个 +1/+1 指示物，黎明使者莱拉（Lyra Dawnbringer）让所有天使一边打一边回血。重点是把血滴衍生物攒到六个。新人注意：主将吃掉的生物是真死了，挑天使吃最划算；从坟场拉回来的生物再死一次就直接放逐，回不了坟场。"},"Ghalta, Primal Hunger":{"tagline":"场上力量越大，它就越便宜","intro":"它标价十二费，但有本事自己变便宜：你场上所有生物的力量加起来有多少，它就便宜多少。所以只要先铺几条能打的生物，这头带践踏的恐龙很早就可能站到你面前。喜欢先铺小生物、再一口气砸出大怪物的玩家会喜欢它。","build":"牌表一半是地，其余多是能产法术力的妖精：罗堰妖精（Llanowar Elves）先把费用铺起来，罗堰部族（Llanowar Tribe）一次能产三点绿，主将来得更快。贾路的反抗（Garruk's Uprising）让全场都带践踏，你场上有大生物时还顺手抽牌。新人注意：减费只看现在场上的力量，生物被清掉后它又变回十二费，别把宝全压在它身上。"},"Kratos, God of War":{"tagline":"不打人的生物，到回合结束就掉血","intro":"他带连击（一次打两下），还让场上所有生物——对手的也算——都带敏捷。真正难受的是每个玩家回合结束那一下：谁有几个生物这回合没攻击，谁就掉几点血。所以他逼着所有人往前冲：不冲就掉血，冲了就得面对你的场面，喜欢把整桌拖进战场的玩家会喜欢他。","build":"多打几个战斗阶段是关键：全世交战（World at War）能让你多打一次，隐匿者洼巴司（Urabrask the Hidden）让你的人更快、对手的生物还得躺着进场，一回合就能打出两轮攻击。热血战歌（Seething Song）一次给你五点红法术力，正好连放几张牌。新人注意：这个掉血效果对你自己一样有效，你也别留着一堆不攻击的生物。"},"Kudo, King Among Bears":{"tagline":"全桌生物一起变成 2/2 的熊","intro":"他只花两费，规则一句话：其他所有生物的基础力量和防御力都变成 2/2，并且额外算作熊——对手的大怪也一样。所以你场上一堆小生物不再吃亏，对手花大价钱放出来的巨兽也被压成一头熊。喜欢把局面拉平、靠配合取胜的玩家会喜欢他。","build":"既然体型都一样，胜负就看别的手段：大修道士艾蕾侬（Elesh Norn, Grand Cenobite）给你其他生物 +2/+2、给对手所有生物 -2/-2，对手那些 2/2 的熊一涨一跌就死了。羊屯斗士（Champion of Lambholt）越长越大，让对手越来越难挡。新人注意：主将也会把你养大的生物压成 2/2，要靠加成和指示物补回来。"},"Iron Man, Titan of Innovation":{"tagline":"打一次就白拿宝物，再换更大的神器","intro":"他是蓝红五费的神器生物，会飞、带敏捷。每次他攻击时，先给你一个宝物；你也可以牺牲一张非生物神器，从牌库找出一张费用刚好比它多一点的神器放到场上。所以这套牌是「一件换一件」往上爬：小的换中的，中的换大的，喜欢攒零件的玩家会喜欢他。","build":"牌表里大多是神器，先把便宜的铺起来：悉诺议会宅邸（Seat of the Synod）这样的神器地既产费又算神器，乙金塑师（Etherium Sculptor）让神器咒语便宜一点，东西就铺得又快又多。真正的乐趣是往上爬，塑型钢（Sculpting Steel）能变成场上任何一张神器的复制品。新人注意：主将只能找「比牺牲那张贵一点」的神器。"},"Tannuk, Memorial Ensign":{"tagline":"每下一块地，全桌掉一点血","intro":"他是红绿三费的主将，规则很短：只要有一块地进场，每个对手就掉 1 点血；如果这是这回合第二次触发，你还额外抽一张牌。所以他不用打人，光是不断地放地，就能把全桌的血一点点磨掉。喜欢慢节奏、靠一堆地滚雪球的玩家会喜欢他。","build":"核心是一回合多下几块地：莲花眼镜蛇（Lotus Cobra）在地进场时给你一点任意颜色的法术力，不倦供给人（Tireless Provisioner）给你食物或宝物，地一多，费用和资源都跟着涨。整地（Harrow）牺牲一块地换两块地进场，一换二正好多触发几次。新人注意：主将一次只打 1 点，赢靠次数多，牌表里要多放找地的牌。"},"Elsha, Threefold Master":{"tagline":"打中几点，就多几个小武僧","intro":"她是红白蓝三费的主将，带践踏和灵技（每放一个非生物咒语就变大一点）。她打中对手几点伤害，就给你几个 1/1 且带灵技的武僧衍生物——所以她最好别被挡住。喜欢先清路、把主将养大、再一口气铺出一排小武僧的玩家会喜欢她。","build":"两件事要一起做：让她打得到人，而且每回合多放几个咒语。寺院明师（Monastery Mentor）和她几乎是一套动作，你每放一个非生物咒语就多一个武僧；进入迷局（Enter the Enigma）直接指定一个生物这回合不能被阻挡，还顺手抽一张牌。新人注意：灵技的加成只维持到回合结束，留到能连放两三张的时候再打。"},"Noctis, Prince of Lucis":{"tagline":"用过的神器，还能从坟场再放一次","intro":"他是三色四费的主将，带系命（他造成的伤害同时帮你回血）。他的本事是让你能用坟场里的神器牌：除了原本的费用，再额外付 3 点生命，就能把坟场里的一张神器再放一次。所以手上的神器用掉不算完，坟场等于第二个手牌，喜欢反复利用同一张牌的玩家会喜欢他。","build":"一边用神器铺场，一边把生命当资源：乙金塑师（Etherium Sculptor）让神器都便宜一点，回血交给主将自己的系命和乙太流贮库（Aetherflux Reservoir）。肃然致哀（Solemnity）会让指示物根本放不上场，于是从坟场放回来的神器不会带上终命指示物，再进坟场也还能捞。新人注意：从坟场放神器每次都要额外付 3 点生命。"},"Phenax, God of Deception":{"tagline":"让生物横置，去磨对手的牌库","intro":"他是蓝黑主将，本身不灭，而且只要场上蓝黑两色的法术力符号不够多，他就不算生物，对手也打不到他。他的本事是给你所有生物一个选择：横置自己，磨某个玩家若干张牌，数量等于这只生物的防御力。喜欢慢节奏、把对手牌库一点点挖空的玩家会喜欢他。","build":"核心是磨牌本身。遗迹蟹（Ruin Crab）在地进场时让每个对手磨三张，浮夸的布鲁瓦（Bruvac the Grandiloquent）让对手每次磨牌都磨两倍，收益直接翻番。新人注意：主将给的磨牌数量看生物的防御力，牌表里要挑防御力大的生物，别放一堆小快灵；你要的是对手牌库见底，不是把他打掉血。"},"Finneas, Ace Archer":{"tagline":"兔子和衍生物越打越大","intro":"他是两费的白绿主将，带延势和警戒。每次他攻击，你其他每个「衍生物或兔子」都得到一个 +1/+1 指示物；如果你场上所有生物的力量加起来到了 10，你还顺手抽一张牌。喜欢玩一大群小生物、越打越多的玩家会喜欢他。","build":"牌表里塞满兔子：兔位继承者（Hare Apparent）进场时按你场上其他同名生物的数量造一批兔子衍生物，牌组里可以放很多张；纵身蹦跃（Hop to It）一次给你三个 1/1 兔子。兔子一多，主将每次攻击加的指示物就更多。新人注意：主将只给「衍生物或兔子」加指示物，牌表里别放无关的生物；全队力量到 10 就能抽牌。"},"Coram, the Undertaker":{"tagline":"全桌坟场里最大的生物，决定他的力量","intro":"他是三色四费的主将，身材不看自己印的数字：全桌坟场里最大的生物牌力量有多少，他就加多少攻击力。他每次攻击时，每个玩家都磨一张牌；而你自己每回合能用刚磨进坟场的地和咒语各一个——地能下，咒语能放。喜欢「磨到什么就用什么」的玩家会喜欢他。","build":"主动往坟场里送大生物是关键：活埋（Buried Alive）一次找三张生物牌丢进坟场，主将立刻就变大。真正的大招是绝灭领主（Lord of Extinction），它的力量和防御力等于所有坟场里的牌数，配上主将就是很重的一击。新人注意：主将磨出来的牌只有这回合进坟场的才能用，所以每回合要留出费用。"},"The Infamous Cruelclaw":{"tagline":"打中对手，就免费放一张牌","intro":"他是黑红三费的主将，带威慑。他一旦打中对手，就从牌库顶一直翻，翻到第一张非地牌，然后你可以改用一个代价来放它：丢掉一张手牌，不用付法术力。所以他越早打中、越频繁打中，就越省钱，喜欢赌一把、也不怕手牌多的玩家会喜欢他。","build":"先想办法让他打中：细语丝篷（Whispersilk Cloak）让装备的生物不能被阻挡，也不会成为对手咒语和异能的目标。翻出来的大件可以放心用，洞穿多重宇宙（Breach the Multiverse）费用很高，但只要主将打中，丢一张手牌就能放出来。新人注意：他只会翻到第一张非地牌，翻出什么就得接受，牌表里别塞太多没用的小法术。"},"Lumra, Bellow of the Woods":{"tagline":"地越多它越大，坟场的地还能全回来","intro":"她是绿色的六费主将，带延势和警戒，身材完全看你场上地的数量——地越多，她越大。她进场时先磨四张牌，然后把坟场里所有的地牌一次性全放回场上（横置进场）。喜欢地里长出来的大生物、愿意多记几件事的玩家会喜欢她。","build":"主动牺牲地，再从坟场一次全捞回来。祖尔的法球（Zuran Orb）能把地换成生命，轮耕法（Crop Rotation）牺牲一块地就能从牌库找出任意一块地，找莲花田野（Lotus Field）这种一次产三点法术力的地最划算。新人注意：捞回来的地是横置进场的，要等到下个回合才能用，所以别在同一回合里把地牺牲光。"},"Alexios, Deimos of Kosmos":{"tagline":"全桌轮流用他打人，他越打越大","intro":"他是红色的四费主将，带践踏，而且每回合都会换主人：每个玩家维持开始时，那个人就获得他的控制权、给他一个 +1/+1 指示物，还让他带敏捷——他必须每回合攻击，也不能攻击自己的操控者。喜欢热闹、也接受「自己可能挨他打」的玩家会喜欢他。","build":"因为他一直在换手，你能掌控的是挂在他身上的装备。列奥尼达斯之矛（The Spear of Leonidas）在他攻击时给他连击或者造一匹战马，钢梁镇殴击棍（Beamtown Beatstick）让他更有威胁、打中还能给你宝物。新人注意：他不能牺牲也不能不打，别指望他帮你防守；你贴的装备会一直跟着他，转到别人手里时也照样被别人用着。"},"Cloud, Midgar Mercenary":{"tagline":"找装备、贴上去，效果触发两遍","intro":"他是两费的白色主将，进场时先从牌库找一张装备牌放进手里。只要他身上贴着装备，他自己和贴在他身上的装备所触发的效果，都会额外再触发一次。喜欢一位英雄带满装备、思路直白的玩家会喜欢他。","build":"牌表几乎全是装备，找装备的牌尤其重要。锻石秘教徒（Stoneforge Mystic）进场时也能从牌库找一张装备，席嘉妲的援助（Sigarda's Aid）让装备能在对手回合贴上，还能一进场就直接装上。新人注意：翻倍效果只有他身上有装备时才算数，别让他空着手；他两费就能上场，早一点贴装备比多放一张牌更值。"},"Kess, Dissident Mage":{"tagline":"每回合能再从坟场放一张法术","intro":"她是蓝黑红三色的四费主将，会飞。规则很省事：你每回合可以从坟场里放一张瞬间或法术；这样放过的咒语如果本来会进坟场，就直接被放逐——也就是说每张瞬间法术你都有两次机会。喜欢精打细算、反复利用法术的玩家会喜欢她。","build":"找牌和抽牌的咒语在这里最划算，因为它们能放两次。沉思（Ponder）、脑力激荡（Brainstorm）都能从坟场再放一次，手牌就比别人厚；狂搜乱寻（Frantic Search）更值，抽两张丢两张，还能把三块地站起来。新人注意：每回合只有一次机会，选哪张从坟场放是这套牌最需要想的地方。"},"Szarel, Genesis Shepherd":{"tagline":"牺牲点东西，就让一只生物长大","intro":"他是黑红绿五费的主将，会飞，还能从坟场里下地。他的本事是把「牺牲」换成力量：在你回合里，每当你牺牲另一个非衍生物永久物，就能让另一只目标生物按他的攻击力拿等量的 +1/+1 指示物。喜欢把资源倒来倒去、边拆边长的玩家会喜欢他。","build":"牺牲的来源要够多。受诅国王寇沃（Korvold, Fae-Cursed King）进场和攻击时都让你牺牲一个永久物，还顺手抽牌；噬人蛙怪（The Gitrog Monster）让你每回合多下一块地，代价是维持开始时得牺牲一块地。新人注意：他能从坟场下地，是很多牌能转起来的关键，别把坟场弄空；牺牲的对象必须是「非衍生物」。"},"Vnwxt, Verbose Host":{"tagline":"极速涨满，抽一张变抽两张","intro":"絮叨主持维夕特（Vnwxt, Verbose Host）是蓝色的二费小生物，本事围绕「极速」展开：只要对手在你的回合掉血，你的极速就往上涨，涨满之后你每次抽牌都改成抽两张。喜欢手里永远有牌、越打越顺的人会喜欢它。","build":"抽牌这条线靠脑力激荡（Brainstorm）和几张便宜的抽牌牌，一次就能抓一把；变态爬虫（Psychosis Crawler）让你每抽一张牌就让对手掉一点血，于是抽牌和打人变成同一件事。牌表里放几张开局就能把极速点起来的地，再配上几只没人挡得住的小生物，极速会涨得很稳。注意别把自己抽空，也要想好牌库见底时怎么收尾。"},"Neriv, Heart of the Storm":{"tagline":"刚上场的生物，伤害直接翻倍","intro":"霆心灵龙涅雳伏（Neriv, Heart of the Storm）是红白黑三色的四费龙，自己会飞。它的能力是让本回合刚进场的生物伤害翻倍，所以打法是：一回合里尽量多让新生物上场，趁它们刚落地时打人。喜欢一口气出好几只生物的玩家会喜欢它。","build":"关键搭配是暴战翻腾（Warstorm Surge）：它让每只进场的生物按自身攻击力打一次任意目标，而刚进场的生物伤害翻倍，所以同一只生物能打掉两倍的血。永续勇气体（Enduring Courage）给后来的生物加上攻击力和敏捷，再配几件让生物攻击时分身打其他对手的装备。注意爆发都在你自己的回合，生物上场后要马上打人。"},"The Master of Keys":{"tagline":"坟场里的结界，全都能再用一次","intro":"通钥惧怪（The Master of Keys）是白蓝黑三色的三费结界生物，自己会飞，进场时会一边磨自己的牌库一边变大。它最特别的地方在于：你坟场里的每一张结界牌都能从坟场再放一次。喜欢把坟场当第二个手牌、反复拿回资源的玩家会喜欢它。","build":"思路是一边往坟场填牌，一边从坟场掏牌。不死涟动（Ripples of Undeath）每回合帮你磨牌再挑一张回手；几张能反复贴的复活灵气能把坟场里的生物直接拉回场上，它们也是结界，用掉后还能再来一遍。怪体追踪人（Entity Tracker）让你每放一个结界就抽一张牌，手牌不会断。注意多准备能出白蓝黑的地，前期卡色就什么都做不了。"},"Clement, the Worrywort":{"tagline":"小蛙反复进出场，好处拿两遍","intro":"忧天草克莱门特（Clement, the Worrywort）是蓝绿两色的三费青蛙德鲁伊。只要有生物进场，它就能把一只费用更低的自家生物收回手上，而它手下的青蛙都能产绿蓝法术力、专门用来放生物。喜欢把同一只小生物反复重播的玩家会喜欢它。","build":"核心是反复进场：池塘先知（Pond Prophet）一进场就抽一张牌，几只便宜的青蛙进场就加分或回血，主将把它们收回手，再用青蛙产出的法术力重新放出来，一回合能做两三次。再配几张专门盯着「离场但没死」这个动作的牌，每次回收都额外给你一张牌或一个指示物。注意能被收回的是费用更低的生物，牌表里要多放便宜的小生物打底。"},"Winter, Misanthropic Guide":{"tagline":"大家一起抽牌，然后一起掉血","intro":"愤世向导温特（Winter, Misanthropic Guide）是黑红绿三色的四费人类，对手指向它要多付两点法术力。它每回合让所有玩家抽两张牌，而你坟场里的牌张类别越多，对手的手牌上限就越低。喜欢大家一起抽牌、自己占便宜的玩家会喜欢它。","build":"这套牌靠「抽牌惩罚」吃饭：乱涂匍体（Scrawling Crawler）让每个玩家每回合多抽一张，谁抽牌谁就掉血，配合主将每回合发的两张牌，对手的血不知不觉就没了。再堆几张同类的牌，压力会成倍上去；等对手手牌被压满、不得不弃牌时，还要有牌能让弃牌这件事也变成伤害。注意这套牌会让大家都不好受，第一次在朋友局里用之前最好先打个招呼。"},"Squall, SeeD Mercenary":{"tagline":"主将单挑，打中就把小牌捞回来","intro":"SeeD佣兵斯考尔（Squall, SeeD Mercenary）是黑白两色的四费骑士。只要有生物单独攻击就会获得连击，主将打中对手后还能从坟场里把一张费用三点以下的牌直接放回场上，所以牌表都围着它转。喜欢「一把剑砍到底」的玩家会喜欢它。","build":"牌表要给主将让路，同时给自己攒坟场：受诅劫掠者（Accursed Marauder）进场时让每个玩家各牺牲一只生物，正好把牌送进坟场当弹药。记忆面具（Mask of Memory）这类装备挂在主将身上，打中就能抽两张牌再弃一张，边补手牌边继续堆坟场；再放几张能拆掉对手神器或结界的小生物。注意主将只有单独攻击时才有连击，杂兵别抢着上。"},"The Unbeatable Squirrel Girl":{"tagline":"松鼠越攒越多，最后一波压过去","intro":"无敌松鼠妹（The Unbeatable Squirrel Girl）是纯绿的四费主将，进场和攻击都带出一只 1/1 松鼠，还可以花四点法术力按场上松鼠的数量再造一批。第一波很小，第二波就压得对手喘不过气。喜欢铺一地小生物的玩家会喜欢它。","build":"先想办法让松鼠变多、变强。松鼠君王（Squirrel Sovereign）这类牌会随场上松鼠的数量给全队加成，也有牌能让你牺牲一只松鼠换全队永久变大。松鼠够多之后，主将的技能一次就能造出一大群。还要准备几招把满场的小松鼠变成法术力，不然一口气铺出十几只也没钱继续。注意小生物怕清场，别一次全压上去。"},"Jace, Multiverse Architect":{"tagline":"抽牌、换出大生物的四色鹏洛客","intro":"多重宇宙筑师杰斯（Jace, Multiverse Architect）是能当主将的四色鹏洛客。对手不付两点法术力就不能让生物打它；它能抽牌，也能把自家一个生物换成牌库顶第一只生物或鹏洛客。喜欢慢慢摸牌、用大生物压制的玩家会喜欢它。","build":"这套是四色牌，法术力基础要先配好，产费神器能帮你稳住颜色。几张每回合都给你添小生物的牌正好当杰斯换大生物的「材料」：把小家伙换掉，直接从牌库顶翻出一只大生物上场。脑力激荡（Brainstorm）负责把手牌理顺，再配上能在对手清场时保住全队的瞬间。注意四色牌容易卡色，前期别把产费神器换掉。"},"Niv-Mizzet, Visionary":{"tagline":"烧对手多少点，就抽多少张牌","intro":"远见尼米捷（Niv-Mizzet, Visionary）是蓝红两色的六费龙，手牌没有上限。只要你的来源对对手造成非战斗伤害，你就按伤害量抽同样多的牌——每一点烧在对手身上的伤害，都会变成一张牌。喜欢连放咒语的玩家会喜欢它。","build":"思路是把小伤害滚成大优势。几张对每位对手同时造成伤害的
