tion）的身材跟所有坟场里的牌挂钩。堆够了就牺牲一个大生物，让对手一起掉血。不朽见证人（Eternal Witness）帮你把用掉的关键牌捡回来。新人注意：别把自己牌库磨空。"},"Anje Falkenrath":{"tagline":"弃牌换抽牌，越弃越顺手","intro":"安姬伐肯纳（Anje Falkenrath）是黑红两色的三费吸血鬼，自己带敏捷，上场当回合就能动手。她能把手上用不着的牌换成新牌，而弃掉那些「被弃掉反而更好用」的牌时，她还会重新站起来再换一次。喜欢不停换牌、节奏快的人会喜欢她。","build":"牌表里放一批被弃掉反而能用的牌：巨兽猎人（Big Game Hunter）能杀掉大生物，火爆（Fiery Temper）变成三点伤害，终极苦痛（Terminal Agony）和黯境枯萎（Dark Withering）直接拆掉对手的生物，用不上就拿来喂主将。安姬的噬血客（Anje's Ravager）进攻时把手牌全换新。新人注意：算好弃哪张、留哪张。"},"Olivia, Opulent Outlaw":{"tagline":"带一队不法之徒，打中就有珍宝","intro":"奢华狂徒奥莉薇亚（Olivia, Opulent Outlaw）是白黑红三色的四费吸血鬼，会飞，打到人还能回血。她带来的刺客、海盗、浪客这些「不法之徒」只要打中对手，就给你留下珍宝，攒够了能让所有生物一起变大。喜欢边打边攒资源的人会喜欢她。","build":"主将要的是刺客、海盗、浪客这类不法之徒：兰娜莉速腾船长（Captain Lannery Storm）一进攻就有珍宝，夺命笔锋玛丽（Mari, the Killing Quill）让这些生物带上死触、顺手管住对手的坟场，玛切莎女王（Queen Marchesa）也是带敏捷的刺客。醒金师威翰（Vihaan, Goldwaker）让全队获得警戒和敏捷。新人注意：珍宝别急着花，攒起来给主将用更划算。"},"Gwen Stacy // Ghost-Spider":{"tagline":"从放逐区白拿牌，越用越大","intro":"格温·史黛西（Gwen Stacy // Ghost-Spider）是白蓝红三色的两费生物，上场就先放逐牌库顶一张牌让你能用。凑齐白蓝红三点有色法术力她就会变身：能飞、能警戒，而且每次从放逐区用牌都长大一点。喜欢提前摸牌、算着用的玩家会喜欢她。","build":"这套牌靠「从放逐区拿牌」吃饭：重铸利锋拉耶梨（Laelia, the Blade Reforged）和蜘蛛之心阿拉尼亚（Araña, Heart of the Spider）不断往放逐区送牌，维度之网手表（Interdimensional Web Watch）一次放逐两张还帮你出法术力。流放之径（Path to Exile）留着处理挡路的生物。新人注意：放逐区的牌要记得用，过了期限就废了。"},"Alesha, Who Smiles at Death":{"tagline":"一进攻，就把小生物从坟场拉回来打","intro":"蔑死者阿列莎（Alesha, Who Smiles at Death）是白黑红三色的三费人类战士，自带先攻。她每次进攻都能从你的坟场里拉回一个力量不超过 2 的小生物，横着进场直接参战。喜欢用小生物反复利用、越打越顺的人会喜欢她。","build":"关键是把小生物送进坟场再用：活埋（Buried Alive）一次把三张生物牌埋进去，丧信掠夺（Faithless Looting）换牌时顺手弃掉它们，然后靠主将每回合拉一个回来。宿命导士（Karmic Guide）也是一张救场牌，黯色幻影（Solemn Simulacrum）进场帮你找地。新人注意：只能拉力量 2 以下的，别放太多大生物。"},"Aurelia, the Warleader":{"tagline":"全队解开，一回合打两次","intro":"战领欧瑞梨（Aurelia, the Warleader）是白红两色的六费天使，会飞、会警戒，自己还带敏捷。她每回合第一次进攻时会把你的生物全部解开，然后额外多出一个战斗阶段，也就是全队能再打一次。喜欢一鼓作气压过去的人会喜欢她。","build":"天使是主体：希望圣源吉娅妲（Giada, Font of Hope）让每只天使多带指示物，黎明使者莱拉（Lyra Dawnbringer）是能打能回血的大天使。给主将装上军团之盔（Helm of the Host），每次战斗开始都能复制出一个带敏捷的她，全队会再冲一轮。新人注意：六费不便宜，前期先铺法术力。"},"Eirdu, Carrier of Dawn // Isilu, Carrier of Twilight":{"tagline":"让全队死不掉，死了还能再来","intro":"晨光神使埃尔度（Eirdu, Carrier of Dawn // Isilu, Carrier of Twilight）是白黑两色的五费神使，会飞、还能回血。付一点黑色法术力它就变身，变身后你其他生物死后都能带伤回来一次。喜欢反复利用生物的玩家会喜欢它。","build":"变身后全队都变得「死得起」：拽脏预言师（Viscera Seer）可以随时牺牲生物、换一次看牌，影环狂信者（Umbral Collar Zealot）牺牲东西时帮你看牌库顶，孽物米凯耶（Mikaeus, the Unhallowed）有威慑，同色或神器生物才挡得住。护教军圣战（Cathars' Crusade）在你每次有生物进场时让全队变大。新人注意：带伤回来的生物身上挂着减益指示物。"},"Toph, Hardheaded Teacher":{"tagline":"地也能变成生物替你打人","intro":"固执师父拓芙（Toph, Hardheaded Teacher）是红绿两色的四费战士。她每放一个咒语，就能把一块地变成带指示物的生物——那块地既能打人，还在帮你产法术力。她进场时还能把手牌换成坟场里的瞬间或法术。喜欢拿地搞事的玩家会喜欢她。","build":"牌表以找地为主：复苏轮回（Cycle of Renewal）和同根共生（Shared Roots）把地捞上场，永固城（Ba Sing Se）自己就能把地变成生物，纪念军少尉塔努科（Tannuk, Memorial Ensign）在你每次放地时让所有对手掉一点生命。新人注意：被变成生物的地如果被打掉，会横置着回到场上，别怕用它去挡。"},"Gonti, Night Minister":{"tagline":"用对手的牌打赢对手","intro":"晚市司贡提（Gonti, Night Minister）是黑色的四费浪客。你的生物一旦打中对手，它的操控者就能翻走对手牌库顶的一张牌留着用，连施放它都能用任意颜色的法术力。对面牌越贵，你拿到的好处越大。喜欢使坏、专挑别人的东西用的玩家会喜欢它。","build":"牌表里塞满「一定打得中」的小生物：化形黜人（Changeling Outcast）和受虐灵魂（Tormented Soul）都不能被挡，窃物害兽（Thieving Varmint）还能替你产出专门用来施放别人牌的法术力。道西虚空行者（Dauthi Voidwalker）专门盯着对手的坟场。喂饱虫群（Feed the Swarm）留着拆掉挡路的东西。新人注意：抢来的牌要趁早用，别攒在手上。"},"Altaïr Ibn-La'Ahad":{"tagline":"一进攻，坟场里的刺客全回来帮忙","intro":"阿泰尔·伊本·拉阿哈德（Altaïr Ibn-La'Ahad）是白黑红三色的三费刺客，自带先攻。他每次进攻都会把坟场里的一位刺客记下来，再让每一个被他记住的刺客变成复制冲上战场打一下，回合结束就消失。喜欢提前把牌铺好、一击爆发的人会喜欢他。","build":"先把刺客送进坟场：丧信掠夺（Faithless Looting）换牌时顺手丢，戴斯蒙德·迈尔斯（Desmond Miles）自己有威慑，要两个生物才挡得住；锡瓦的巴耶克（Bayek of Siwa）和亚历山大的艾雅（Aya of Alexandria）都是能打的刺客。新人注意：复制只在当回合存在，进攻的时机要抓准。"},"Quandrix, the Proof":{"tagline":"每放一个法术，就再白翻一张","intro":"启证巨龙量析（Quandrix, the Proof）是蓝绿两色的六费巨龙，会飞会践踏。它自己进场时就能免费翻出一张更便宜的牌直接施放，而且你之后从手上放的每一个瞬间和法术，都会再带一次这种免费翻牌。喜欢一放牌就停不下来的人会喜欢它。","build":"牌表以瞬间和法术为主：历时挖掘（Dig Through Time）和宝船巡游（Treasure Cruise）能翻一大堆牌，荣休大法师（Archmage Emeritus）让你每放一个法术都抽一张，恩赐主祭依莫提（Imoti, Celebrant of Bounty）自己也带免费翻牌。新人注意：翻出来的牌不一定划算，看清再决定放不放。"},"Sami, Wildcat Captain":{"tagline":"神器铺满，什么牌都变便宜","intro":"私掠队长萨米（Sami, Wildcat Captain）是白红两色的六费神器师，自带连击，还带警戒，能打能守。她在场时，你每放一个咒语都会因为场上的神器而变便宜——神器越多，后面的牌越接近白拿。喜欢先铺一地小神器、再一口气放光的人会喜欢她。","build":"牌表里神器地特别多：大熔炉（Great Furnace）、远古狮穴（Ancient Den）和锈谷结桥（Rustvale Bridge）既是地也是神器，两份好处都占。神秘熔炉（Mystic Forge）让你直接从牌库顶放神器，信念饰符（Talisman of Conviction）前期帮你把法术力铺开，也能顺手压低后面咒语的费用。新人注意：神器越多越便宜，别舍不得往下铺。"},"Raphael, Fiendish Savior":{"tagline":"魔鬼死了也要咬人一口","intro":"炼狱救星拉斐尔（Raphael, Fiendish Savior）是黑红两色的五费魔鬼贵族，自己会飞。他让场上的魔鬼、恶魔都变大、还能回血；只要有生物进你的坟场，回合结束就白送你一个死了会炸人的小魔鬼。喜欢牺牲打法的玩家会喜欢他。","build":"牌表以魔鬼为主：混沌骑兵祖佐斯（Zurzoth, Chaos Rider）和诙谐损言师（Witty Roastmaster）总在造小魔鬼、顺手让对手掉血，货棚老板马哈迪（Mahadi, Emporium Master）把当回合死掉的生物变成珍宝，破坏魔鬼（Mayhem Devil）则在任何人牺牲永久物时都能造成伤害。新人注意：自己的生物该牺牲就牺牲，它们死了更值钱。"},"Miles Morales // Ultimate Spider-Man":{"tagline":"指示物翻倍，蜘蛛越打越大","intro":"迈尔斯·莫拉莱斯（Miles Morales // Ultimate Spider-Man）是三色两费英雄，上场就给两个生物各加一个指示物。变身后他每次进攻都把你所有蜘蛛和传奇生物身上的指示物翻一倍，越打越夸张。喜欢小生物快速长大的玩家会喜欢他。","build":"关键是把指示物叠起来：坚固鳞甲（Hardened Scales）让每次放指示物都多一个，朋克蜘蛛侠（Spider-Punk）让所有蜘蛛都能自己选带指示物或带敏捷，蜘蛛之心阿拉尼亚（Araña, Heart of the Spider）每次进攻都往进攻的生物上加指示物。流放之径（Path to Exile）留给挡路的大生物。新人注意：变身前先铺好场面再进攻。"},"Yuna, Hope of Spira":{"tagline":"结界越铺越多，结界生物越打越狠","intro":"史匹拉之望尤娜（Yuna, Hope of Spira）是白绿两色的五费僧侣。轮到你的回合，她和你场上的结界生物都会获得践踏、系命和保护，打人又回血；每个回合结束，她还能从坟场免费带回一张结界牌。喜欢慢慢布置、每张牌都在帮忙的玩家会喜欢她。","build":"牌表以结界为主：丰收之手叙提丝（Sythis, Harvest's Hand）让你每放一个结界都抽一张、回一点血，Summon: Bahamut这类结界生物既是结界也是能打的大家伙。圣所织叶灵（Sanctum Weaver）按你场上的结界数量产法术力，结界越多它越能干活。新人注意：从坟场带回来的结界一旦再离场就会被放逐，别再指望第二次。"},"Goreclaw, Terror of Qal Sisma":{"tagline":"大生物便宜放，一进攻全队践踏","intro":"黑山之威血爪（Goreclaw, Terror of Qal Sisma）是绿色的四费巨熊。她让你手上力量 4 以上的生物都便宜两点，自己一进攻，这些大生物还会一起变大并获得践踏。也就是说：她负责打折，你的大兽负责压过去。喜欢直接砸大生物的人会喜欢她。","build":"牌表就是大生物：始饥戈厄塔（Ghalta, Primal Hunger）的费用跟场上总力量挂钩，生物越强越便宜；贾路的兽群长（Garruk's Packleader）让你放大生物就抽牌，贾路的反抗（Garruk's Uprising）让全队践踏。罗堰妖精（Llanowar Elves）前期帮你抢速度。新人注意：多放力量 4 以上的生物，少混小东西。"},"Jan Jansen, Chaos Crafter":{"tagline":"神器来回换，珍宝和机器人都不缺","intro":"混沌械匠姚恩姚森（Jan Jansen, Chaos Crafter）是白黑红三色的三费侏儒，自己带敏捷，上场就能干活。他能把神器生物变成两个珍宝，也能把普通神器换成两个小机器人，来回一换手里总有东西用。喜欢算小账、把东西反复变现的玩家会喜欢他。","build":"这套牌靠「进场就赚、离场也赚」的神器：脓水涌泉（Ichor Wellspring）进场和进坟场都抽一张，鲁莽织焰匠（Reckless Fireweaver）在你放神器时让每位对手掉一点生命，黑森林蝙蝠（Mirkwood Bats）则在你造或牺牲衍生物时磨对手的血。备忘夹（Skullclamp）把小机器人变成两张牌。新人注意：牺牲前先算清楚。"},"Kyler, Sigardian Emissary":{"tagline":"人类越多，主将越大，全队都跟着涨","intro":"席嘉妲密使凯勒尔（Kyler, Sigardian Emissary）是白绿两色的五费人类。每有一个人类进场，他身上就多一个指示物；他身上的指示物越多，你其他人类就越大。所以铺得越开，整队涨得越快。喜欢整齐推进、所有人一起变强的玩家会喜欢他。","build":"牌表就是人类合集：羊屯斗士（Champion of Lambholt）会随场上生物变多而越长越大、越挡不住，华辉护教军艾德琳（Adeline, Resplendent Cathar）进攻时按对手数量给你造士兵，天使之拳托亨斯（Torens, Fist of the Angels）每放一个生物咒语就多带一个学徒。新人注意：别光放大生物，人类越多主将涨得越快。"},"Faldorn, Dread Wolf Herald":{"tagline":"从放逐区出牌，每次都给一条狼","intro":"惧栗狼使法多（Faldorn, Dread Wolf Herald）是红绿两色的三费德鲁伊。她能帮你从牌库顶「预支」一张牌，只要从放逐区用出来，就会多一条 2/2 的狼替你打人。用牌和造狼绑在一起，节奏很顺。喜欢边摸牌边铺狼群的玩家会喜欢她。","build":"牌表以「先放逐、后使用」为主：照亮舞台（Light Up the Stage）和逃往幻野（Escape to the Wilds）一次给你好几张牌用，重铸利锋拉耶梨（Laelia, the Blade Reforged）进攻时不断往放逐区送牌。洁丝卡的意志（Jeska's Will）帮你一口气凑出大量红色法术力。新人注意：放逐的牌有期限，当回合能用的就别留着。"},"Xantcha, Sleeper Agent":{"tagline":"把主将塞给对手，让他替你挨打","intro":"潜藏密探珊迦（Xantcha, Sleeper Agent）是黑红两色的三费密探，一开场就跑到你指定的对手那边，还必须每回合进攻、只能打别人。谁操控她都得掉血，你却能白抽一张牌。喜欢挑拨离间、让别人替你干活的玩家会喜欢她。","build":"牌表专挑「让别人替你打」的牌：闪耀促动（Shiny Impetus）和渴血之刃（Bloodthirsty Blade）贴在对手的生物上，逼它们每回合都得进攻，礼数不周（Disrupt Decorum）则让全桌对手互殴一轮。末日灾祸卡尔杜（Kardur, Doomscourge）进场也能把对手全推向别人。新人注意：这套牌不靠单挑，靠把大家搅在一起。"},"Zask, Skittering Swarmlord":{"tagline":"虫子死了回牌库底，还能再来一次","intro":"掠行群长札嘶克（Zask, Skittering Swarmlord）是黑绿两色的五费昆虫。你能直接从坟场使用地和施放昆虫咒语，你操控的昆虫死掉时还会回到牌库底等着再来一轮。也就是说，你的虫子几乎用不完。喜欢重复利用、越磨越多的玩家会喜欢它。","build":"牌表全是虫子：硬盔虫聚群（Scute Swarm）每放一块地就多一只昆虫，腐蚀毛虫（Caustic Caterpillar）和失控虫械（Haywire Mite）可以牺牲自己拆掉对手的神器或结界，之后还能从坟场请回来接着用。饥潮格蕊斯（Grist, the Hunger Tide）自己就能造虫、顺手磨牌。新人注意：磨牌是好事，别怕把自己牌库磨下去。"},"Tamiyo, Inquisitive Student // Tamiyo, Seasoned Scholar":{"tagline":"抽到第三张牌，就变成鹏洛客","intro":"好问学徒多美代（Tamiyo, Inquisitive Student // Tamiyo, Seasoned Scholar）是蓝绿两色的一费法师，自己会飞；你每回合抽到第三张牌，她就翻面变成鹏洛客。喜欢不停抽牌的人会喜欢她。","build":"牌表靠便宜的抽牌咒语：脑力激荡（Brainstorm）、狂搜乱寻（Frantic Search）这类一放就抽，让你容易在一回合里凑到第三张。量束联能师（Flux Channeler）会在你放非生物咒语时给场上的指示物再加一个，变态爬虫（Psychosis Crawler）则把每次抽牌变成对手掉血。新人注意：变身之后她的能力偏向防守和回收法术，别拿她去硬拼。"},"Taii Wakeen, Perfect Shot":{"tagline":"小额伤害被放大，正好点掉对手生物","intro":"精准射手泰依瓦肯（Taii Wakeen, Perfect Shot）是白红两色的两费佣兵。花掉若干法术力，她就能让你这一回合的所有非战斗伤害全部加码；而只要你的一次伤害刚好点掉对手的生物，你就抽一张牌。喜欢用小法术精确清场的玩家会喜欢她。","build":"牌表里全是便宜的范围伤害：喜庆终结（End the Festivities）和地壳灾害（Tectonic Hazard）只要一点法术力就能扫掉对手的小生物。电流恶戏（Electrickery）还能选择只打一只，加码之后闪电击（Lightning Bolt）也能清掉大生物。新人注意：加多少点要算好，刚好点掉最划算。"},"Minthara, Merciless Soul":{"tagline":"每牺牲一样东西，全队就更凶一点","intro":"冷酷无情的明萨拉（Minthara, Merciless Soul）是白黑两色的四费精灵僧侣。只要你的永久物在回合里离开过战场，她就会累积经验，你所有生物随之变强。她还自带保护，对手想除掉她要先多付代价。喜欢用牺牲换整体变强的玩家会喜欢她。","build":"关键是每回合都让东西离场：致命争执（Deadly Dispute）牺牲一个神器或生物，换两张牌和一个珍宝；巢居跛行尸（Nested Shambler）死掉时按自己的力量留下小松鼠；秘藏备品（Hidden Stockpile）在你的东西离场后回送一个机器人。促蚀福音师（Metastatic Evangel）帮你把经验指示物继续加上去。新人注意：宁可少打一点，也要保证每回合都有东西离场。"},"Liliana, Heretical Healer // Liliana, Defiant Necromancer":{"tagline":"自己的生物一死，主将就变身","intro":"异端治疗师莉莲娜（Liliana, Heretical Healer // Liliana, Defiant Necromancer）是黑色三费主将，会回血。你别的生物一死她就变身，之后每回合让全桌各弃一张牌。喜欢坟场玩法的玩家会喜欢她。","build":"牌表一半是别的莉莲娜：亡者女王莉莲娜（Liliana, Death's Majesty）能造丧尸、还能从坟场拉回生物，震惧军将莉莲娜（Liliana, Dreadhorde General）在你生物死去时抽牌，莉莲娜得胜（Liliana's Triumph）逼每位对手各牺牲一个生物。黑暗祭礼（Dark Ritual）让你提前发力。新人注意：变身要靠自己别的生物死去，先铺几个便宜生物当垫子。"},"Ghoulcaller Gisa":{"tagline":"牺牲一个大生物，换一群丧尸","intro":"尸鬼牧者基沙（Ghoulcaller Gisa）是黑色的五费法师。她能把一个生物牺牲掉，换成一群 2/2 的丧尸——牺牲的生物力量越大，换来的丧尸越多。她自己不用打架，只要场上有东西可换，丧尸就源源不断。喜欢铺一桌丧尸、稳稳推进的玩家会喜欢她。","build":"牌表以丧尸为主：死亡爵主（Death Baron）和遭诅者领主（Lord of the Accursed）让丧尸更大更凶，不死卜算师（Undead Augur）在你每次有丧尸死去时抽牌。墓场匍尸（Gravecrawler）只要场上有丧尸就能一直从坟场爬回来，正好当牺牲的材料。新人注意：牺牲前想清楚，力量大的生物换来的丧尸更多。"},"Neera, Wild Mage":{"tagline":"把咒语塞回牌库，换一张白拿的牌","intro":"狂野法师妮拉（Neera, Wild Mage）是蓝红两色的六费法师。每个回合一次，你可以把刚放的一个咒语塞回牌库底，然后从牌库顶一路翻到第一张非地牌，免费把它放出来。运气好就是白赚一张大牌。喜欢赌一把、看牌库顶有什么的玩家会喜欢她。","build":"关键是把大牌留在牌库顶：脑力激荡（Brainstorm）能把大咒语放回牌库顶，抉择（Opt）帮你调整牌库顶，再用妮拉的能力免费翻出来。多重宇宙加身（One with the Multiverse）让你直接从牌库顶放牌，始啸埃泰力（Etali, Primal Storm）进攻时也从每位对手那里白拿牌用。新人注意：这个能力每回合只能触发一次。"},"Solphim, Mayhem Dominus":{"tagline":"所有伤害翻倍，包括打自己的","intro":"破坏圣主索非穆（Solphim, Mayhem Dominus）是红色的四费惊惧兽。只要是对手或对手的东西受伤，来自你的来源就全部翻倍——一点变两点，四点变八点。代价是它自己也不太好过，但它能靠弃牌换不灭。喜欢一鼓作气烧穿对手的玩家会喜欢它。","build":"牌表全是范围烧：硫磺旋风（Sulfuric Vortex）每回合都让每位玩家掉两点生命，无情碑出告（Heartless Hidetsugu）一次就能让所有人掉掉一半生命，翻倍之后相当凶。贫窟伏击客（Guttersnipe）在你每放一个瞬间或法术时让对手掉血，渎神行径（Blasphemous Act）用来清场。新人注意：有的伤害也会打到自己，血量要留着。"},"Vincent Valentine // Galian Beast":{"tagline":"对手的怪一死，它就变大","intro":"文森特·瓦伦丁（Vincent Valentine）是四费黑色主将：对手的生物每死一只，它就按那只生物的力气长大一点，攻击时还能翻面变成一头会践踏、会回血的野兽。喜欢逼对手不断牺牲生物的玩家会喜欢它。","build":"牌表里塞满逼人牺牲的牌：希欧蕊的勒令（Sheoldred's Edict）、受诅劫掠者（Accursed Marauder）和播疫师（Plaguecrafter）都能让对手失去生物。前期用黑暗祭礼（Dark Ritual）抢一回合出场，黑玉徽章（Jet Medallion）让黑色咒语更便宜。新人注意：它前期还没攒到指示物，别单独冲上去。"},"Kumena, Tyrant of Orazca":{"tagline":"人鱼越多，它越能抽牌","intro":"欧拉兹卡暴君库莫那（Kumena, Tyrant of Orazca）是蓝绿三费人鱼。它自己不好斗，靠别的鱼站起来用：让一只人鱼横过来，它这回合就不能被挡；让三只横过来，你抽一张牌。喜欢铺一群同类小家伙、慢慢滚大的玩家会喜欢它。","build":"美洛理骑士（Merrow Reejerey）、珍珠三叉戟大师（Master of the Pearl Trident）和人鱼君王（Merfolk Sovereign）给全队人鱼一起加大；石溪掌旗（Stonybrook Banneret）让每张鱼都便宜一点。新人注意：人鱼个头都小，遇到清场会一次全没，铺场时要留点后手。"},"Rakdos, the Muscle":{"tagline":"牺牲小怪，借对手的牌来打","intro":"帮凶魔头拉铎司（Rakdos, the Muscle）是红黑五费恶魔，会飞也会践踏。你每牺牲一只别的生物，它就从对手牌库顶上翻出等量的牌，让你在下个回合结束前用掉，等于拿自家小怪换别人的资源。喜欢用牺牲换收益的玩家会喜欢它。","build":"遭弃矿工（Forsaken Miner）能自己从坟场爬回来，反复当牺牲的材料；阿士诺的祭坛（Ashnod's Altar）随时把一只生物换成两点法术力；不羁饰符（Talisman of Indulgence）和黑暗祭礼（Dark Ritual）负责前期把法术力凑齐。新人注意：牺牲是有收益的，但别把场上生物一次牺牲光。"},"Syr Vondam, Sunstar Exemplar":{"tagline":"小怪来回进出，它就慢慢变大","intro":"辉星模范冯棠爵士（Syr Vondam, Sunstar Exemplar）是黑白两费骑士，自带警戒和威慑。你别的生物死掉或被人放逐时，它会变大一点、你也回一点血；等它力气到四点以上被放逐，还能拆掉对手一个永久物。喜欢磨小便宜的玩家会喜欢它。","build":"流光烁影（Ephemerate）和云移（Cloudshift）花一点白色，把自家生物先放逐再立刻送回来，等于白拿一次好处；虐之华寇族黜人依拉丝（Elas il-Kor, Sadistic Pilgrim）在你放生物时回血、生物死掉时让对手掉血。新人注意：它一开始力气不到四点，别硬挡大生物。"},"Heliod, Sun-Crowned":{"tagline":"你一回血，它就往生物上放指示物","intro":"日冠赫利欧德（Heliod, Sun-Crowned）是三费白色神，本身不灭。你先要弄到够多的白色法术力，它才会从结界变成生物下场；你每次回血，它就往自家一只生物或结界上放一个指示物。喜欢把一点点好处攒成大场面的人会喜欢它。","build":"护灵师（Soul Warden）在每只生物进场时给你回一点血，几乎每次回血都能换成指示物；执政官威权（Authority of the Consuls）让对手的生物横着进场，也顺便替你回血；自行弩炮（Walking Ballista）是常见的收尾手段：用主将给它系命，它摘指示物打人，指示物又被补回来。新人注意：它一开始不是生物。"},"Rat King, Verminister":{"tagline":"老鼠越铺越多，还能整队回来","intro":"疫病根源鼠王（Rat King, Verminister）是两费黑色主将。只要你这一回合有永久物离开场上，回合结束它就白给你一只老鼠，自己也长大一点；攒够三只老鼠献出去，还能把坟场里的一整批同名生物一起拉回场上。喜欢老鼠越滚越多的玩家会喜欢它。","build":"鼠群魔笛手（Piper of the Swarm）既能造老鼠，又给老鼠威慑；啮骨牙（Marrow-Gnawer）牺牲一只老鼠就换出一整群；贫窟霸食人魔（Ogre Slumlord）在你别的生物死掉时补一只，还让所有老鼠带死触；暴群墓场（Swarmyard）能救回一只快被打死的老鼠。新人注意：主将的回收要献三只老鼠，别一口气全献光。"},"Slicer, Hired Muscle // Slicer, High-Speed Antagonist":{"tagline":"连击快攻，还能借给对手用","intro":"受雇狂徒切片（Slicer, Hired Muscle）是红色五费的神器生物，连击加上敏捷，出场那一回合就能打两次。每到对手回合开始，你还可以把它临时交给那位对手，它这回合就得去攻击别人。喜欢直接、爽快、不绕弯的玩家会喜欢它。","build":"给它贴装备能一次吃两份收益：记忆面具（Mask of Memory）让它打中就能多抽牌，钢梁镇殴击棍（Beamtown Beatstick）打中还能换出宝物。急迫祭礼（Desperate Ritual）帮你抢一回合把它放出来；场面失控时用渎神行径（Blasphemous Act）一次清掉所有生物，代价是它自己也会一起死。新人注意：它很怕被拆。"},"Kozilek, the Great Distortion":{"tagline":"十费大怪，靠法术力硬砸出来","intro":"无际曲相寇基雷（Kozilek, the Great Distortion）是十费的无色奥札奇，费用很重，前期要拼命铺法术力。你手牌不多时，施放它会补一大把牌；它还带威慑，能靠弃手牌反击对手的咒语。喜欢堆法术力、放大东西压场的玩家会喜欢它。","build":"奥札奇殿堂（Eldrazi Temple）让奥札奇咒语更便宜，索蓝发电机（Thran Dynamo）一次给三点法术力，遭弃纪念碑（Forsaken Monument）给无色生物加大、还能多补无色法术力。尽归尘土（All Is Dust）能把所有有色永久物一次清掉。新人注意：前期先铺产法术力的东西，别急着出主将。"},"Savra, Queen of the Golgari":{"tagline":"牺牲自家的怪，逼对手也牺牲","intro":"葛加理女王撒芙儿（Savra, Queen of the Golgari）是黑绿四费精灵。你牺牲黑色生物时，可以付两点生命让每位对手也跟着牺牲一只；牺牲绿色生物能回两点生命。这套牌不靠打人，而是让对手的场面一直空着，喜欢慢慢磨的玩家会喜欢它。","build":"鲜血画家（Blood Artist）和筑拉波割喉客（Zulaport Cutthroat）让每次生物死亡都变成对手掉血、你回血；樱宗长老（Sakura-Tribe Elder）牺牲自己帮你找一张地，正好触发回血那一半；贝雷卓靡华（Beledros Witherbloom）每回合给一只会回血的害虫当材料。新人注意：留一只生物挡刀。"},"Ultron, Artificial Malevolence":{"tagline":"每放一个神器，就多复制一个","intro":"人工恶意奥创（Ultron, Artificial Malevolence）是三费的无色神器生物。每有一个别的神器进场，你都可以再付两点法术力复制一个；复制出来的如果不是生物，还会变成一只会打人的机器。喜欢把神器一层层往上叠的玩家会喜欢它。","build":"铸造厂监工（Foundry Inspector）让每个神器咒语都便宜一点，省下的法术力正好拿去复制；索蓝发电机（Thran Dynamo）一次产三点法术力；克撒的动力炉（Urza's Power Plant）这类无色地负责铺法术力；遭弃纪念碑（Forsaken Monument）给无色生物加大。新人注意：复制要额外付费用，手上有法术力时再放神器。"},"Liberty Prime, Recharged":{"tagline":"出手要花能量，能量靠别的神器换","intro":"满电自由至尊（Liberty Prime, Recharged）是红白蓝五费的神器生物，自带警戒、践踏和敏捷，出场那一回合就能打。它每次攻击或阻挡都要花两点能量，不够就得把自己牺牲掉，所以这套牌要一边出手一边补能量。喜欢算资源的玩家会喜欢它。","build":"主将能把别的神器牺牲掉，换两点能量并抽一张牌（还要花两点法术力），所以牌表要放够便宜的神器当燃料；麦蒂森·黎博士（Dr. Madison Li） 在你放神器咒语时给你能量，还能用能量给生物加成；迅速了结（Dispatch）在你神器够多时直接把对手的生物放逐；神秘寺院（Mystic Monastery）和冰河要塞（Glacial Fortress）负责凑三色。"},"Grub, Storied Matriarch // Grub, Notorious Auntie":{"tagline":"两面鬼怪，翻来翻去都赚","intro":"盛誉族母寻宝（Grub, Storied Matriarch）是红黑三费的双面鬼怪，两面都带威慑。正面进场就从坟场捡回一张鬼怪牌；翻到背面后，每次攻击还能复制自家一只生物一起冲上去。喜欢鬼怪一群一群、来回翻面赚便宜的玩家会喜欢它。","build":"鬼怪女舍监（Goblin Matron）进场就再帮你找一张鬼怪，鬼怪战酋长（Goblin Warchief）让鬼怪咒语更便宜、全队获得敏捷，攻城指挥官（Siege-Gang Commander）一次带出三只鬼怪。背面攻击时给自家一只生物放一个 -1/-1 指示物，就能复制它跟着打。新人注意：复制出来的东西回合结束要还。"},"The Council of Four":{"tagline":"大家多抽牌，我就有好处","intro":"四人议会（The Council of Four）是白蓝五费的人类贵族。别人每回合抽到第二张牌，你也跟着抽一张；别人一回合里放第二个咒语，你就白得一只骑士。它不主动打人，而是让整桌人一起抽牌，自己悄悄攒兵。喜欢让别人帮你做事的玩家会喜欢它。","build":"嚎叫的矿井（Howling Mine）和克罗芬斯的旨意（Dictate of Kruphix）让每位玩家每回合都多抽一张，正好喂饱主将的抽牌条件；伏特里亚波涛骑士（Vodalian Wave-Knight）在你每次抽牌时给人鱼和骑士加指示物。新人注意：你给别人的牌也可能马上被用来对付你。"},"Alesha, Who Laughs at Fate":{"tagline":"每次攻击都变大，还能从坟场拉人","intro":"嘲命者阿列莎（Alesha, Who Laughs at Fate）是红黑三费的人类战士，自带先攻。它每次攻击都会长大一点；只要你这一回合打过人，回合结束就能从坟场拉回一个小生物。喜欢用小生物做交换、又把它们捞回来的玩家会喜欢它。","build":"活埋（Buried Alive）一次把三张生物放进坟场，正好当弹药；拼接师备尸（Stitcher's Supplier）进场和死掉都往坟场堆牌；受诅劫掠者（Accursed Marauder）和播疫师（Plaguecrafter）进场时逼所有玩家牺牲生物，拉回坟场再放一次就能再来一轮。新人注意：它能拉回的生物大小取决于它当时的力气。"},"Lonis, Cryptozoologist":{"tagline":"生物一进场就攒线索，最后白拿一张","intro":"隐匿动物学家罗尼斯（Lonis, Cryptozoologist）是蓝绿两费的蛇精灵斥候。你每放一只别的生物，它就给你一个线索；线索能花两点法术力换牌，也能攒起来翻对手牌库顶，换一块便宜的永久物过来。喜欢闷声赚便宜的玩家会喜欢它。","build":"大学院制造工人（Academy Manufactor）让你造线索时一次拿到线索、食物和珍宝三样；树林之友贾希拉（Jaheira, Friend of the Forest）让你造出来的棋子也能产绿法术力；不朽见证人（Eternal Witness）进场捡回坟场里的牌，还能多一个线索。新人注意：线索要留几个给主将用。"},"Vishgraz, the Doomhive":{"tagline":"用中毒指示物把对手堆死","intro":"末日繁生威袭瑰（Vishgraz, the Doomhive）是白黑绿五费的非瑞人昆虫，自带威慑和下毒，进场还带三只同样会下毒的小虫；对手身上的中毒指示物越多，它自己就越大。攒够十个中毒指示物就能赢，不靠打光生命。喜欢换个赢法的人会喜欢它。","build":"下毒就是打中对手就多一个中毒指示物。斯勒夫的巢穴（Skrelv's Hive）每回合掉一点生命换一只带下毒的小虫；播疫探究（Infectious Inquiry） 让你抽两张牌的同时给每位对手一个中毒指示物；瓦丝卡沦落（Vraska's Fall） 逼对手牺牲生物再额外补一个；白阳垂暮（White Sun's Twilight） 能一次造出一群带下毒的小虫。新人注意：这些小虫不能阻挡。"},"Plagon, Lord of the Beach":{"tagline":"让小家伙用防御力去打人","intro":"滩涂之主普拉贡（Plagon, Lord of the Beach）是白蓝三费的海星法师。它进场时，你场上每有一只防御力比力气大的生物，你就抽一张牌；它还能让自家一只生物这回合改用防御力打人。喜欢怪招、靠抽牌铺路的人会喜欢它。","build":"扑翼机（Ornithopter）和天堂扑翼机（Ornithopter of Paradise）都是零攻、防御力更高的小飞机，进场就能让普拉贡多抽牌；流光烁影（Ephemerate）和云移（Cloudshift）把它先放逐再送回来，等于再抽一轮；菁华异变（Essence Flux）也是同一招。新人注意：它不打人，抽牌全靠生物。"},"Herigast, Erupting Nullkite":{"tagline":"牺牲小生物，提前放出九费巨龙","intro":"喷焰虚虐体赫厉轧（Herigast, Erupting Nullkite）是红色九费的奥札奇龙。它能牺牲一只生物提前出场；之后，你放的每只生物也都能用这招提前落地。它还会飞，进场时能把手牌全换成三张新牌。喜欢大生物、敢拿小兵换大牌的人会喜欢它。","build":"黯色幻影（Solemn Simulacrum）进场找地、死掉抽牌，是最好用的牺牲料；钯秘耳（Palladium Myr）一次产两点法术力，帮你凑齐大费用；反因果残肢（Anticausal Vestige）离场就抽牌，条件够时还能白放一张永久物。新人注意：提前落地都要牺牲生物。"},"Odric, Lunarch Marshal":{"tagline":"一只会飞，全队都跟着会飞","intro":"月主会元帅欧吉克（Odric, Lunarch Marshal）是四费白色人类士兵。它自己没什么本事，但每次战斗开始时，只要你场上有生物会飞、有先攻、系命、威慑或践踏，全队就一起获得同一条本事。喜欢把普通士兵带成一支全能队伍的人会喜欢它。","build":"始辉泽塔帕（Zetalpa, Primal Dawn）一只就带着飞行、连击、警戒、践踏和不灭，有它在场，全队瞬间全能；典范达妮莎卡帕轩（Danitha Capashen, Paragon）自带先攻、警戒和系命，还能让灵气和装备更便宜；流放之径（Path to Exile）处理挡路的大生物。新人注意：全队一起变大很方便，被清场也会一起没。"},"Black Waltz No. 3":{"tagline":"每放一张法术，全桌一起掉血","intro":"黑色华尔兹3号（Black Waltz No. 3）是红黑四费的法师，自带飞行和死触。它自己不太打人，而是盯着你放的每张非生物咒语：一放就对每位对手各打两点。所以牌表里的瞬间和法术越多，全桌掉血越快。喜欢用一张张咒语慢慢压死对手的人会喜欢它。","build":"闪电击（Lightning Bolt）一点红就打三点伤害，既是解也是输出；贫窟伏击客（Guttersnipe）和你一样盯着瞬间与法术，放了就让对手掉两点；黑魔纹（Circle of Power）让你抽两张牌（掉两点生命），还留一个跟着咒语打人的法师；闪光法师（Coruscation Mage）也是一个路子。新人注意：解牌有限，想清楚哪张先放。"},"Tinybones, Trinket Thief":{"tagline":"让对手不停弃牌，顺手赚一张","intro":"琐物窃贼细骨（Tinybones, Trinket Thief）是两费黑色骷髅盗贼。只要这一回合有对手弃过牌，回合结束你就白抽一张，代价是一点生命；到后期，你还能花六点法术力，让手上没牌的对手直接掉十点生命。喜欢逼对手做选择的人会喜欢它。","build":"物尽其用（Waste Not）在你对手弃牌时给你衍生物或法术力，盖司秘录（Geth's Grimoire）则让你抽牌；压制（Oppression）逼每次施放咒语的人先弃一张；痛苦窘境（Painful Quandary）让对手每放一个咒语都在掉五点生命和弃一张牌之间选；吸收心灵（Syphon Mind）一次让所有对手各弃一张，你还按数量抽牌。"},"Toph, Earthbending Master":{"tagline":"每块地进场攒一点，攻击时把地叫起来打人","intro":"运土宗师拓芙（Toph, Earthbending Master）是四费绿色人类战士。每有一块地进场，你就攒一个经验指示物；攻击时它会把一块地变成带敏捷的生物，并且按你攒的数量变大。喜欢慢慢攒、突然来一记重拳的人会喜欢它。","build":"永固城（Ba Sing Se）本身就是一块能运土的地；运土神通腾扬（Earthbender Ascension）进场先运土，再帮你找一张地进场；演化智者（Evolution Sage）在你每次有地进场时，让场上的指示物一起变多。新人注意：被运土变成生物的地如果死了，会横着回到场上，但也别只靠一块地打人。"},"Otharri, Suns' Glory":{"tagline":"攻击一次攒一点，叛军越带越多","intro":"五阳荣光欧萨利（Otharri, Suns' Glory）是红白五费的凤凰，自带飞行、系命和敏捷，出场就能打。它每次攻击都会攒一个经验指示物，并按数量带出同样多的叛军，直接参战；它死后横置一个叛军就能从坟场回来。喜欢越打越多的玩家会喜欢它。","build":"冲击震颤（Impact Tremors）在你每放一只生物时让每位对手掉一点血，正好配主将每回合带出来的那群叛军；卡恩关堡（Karn's Bastion）能花四点法术力让场上的指示物一起变多；信念饰符（Talisman of Conviction）负责把红白两色凑齐。新人注意：花四点法术力横置一个叛军，就能把它换回来。"}},"cardDisplay":{"Y'shtola, Night's Blessed":{"synergy":["Snuff Out","Curiosity","Papalymo Totolymo","Propaganda","Emet-Selch of the Third Seat","Lyse Hext"],"popular":["Talisman of Dominance","Void Rend","Talisman of Progress","Talisman of Hierarchy"]},"Edgar Markov":{"synergy":["Captivating Vampire","Cordial Vampire","Stromkirk Captain","Blood Artist","Indulgent Aristocrat","Legion Lieutenant"],"popular":["Welcoming Vampire","Bloodline Keeper","Sanctum Seeker","Vito, Thorn of the Dusk Rose"]},"The Ur-Dragon":{"synergy":["Miirym, Sentinel Wyrm","Dragon Tempest","Crux of Fate","Tiamat","Haven of the Spirit Dragon","Atarka, World Render"],"popular":["Lathliss, Dragon Queen","Dragonlord Dromoka","Terror of the Peaks","Temur Ascendancy"]},"Atraxa, Praetors' Voice":{"synergy":["Tekuthal, Inquiry Dominus","Evolution Sage","Karn's Bastion","Ezuri, Stalker of Spheres","Inexorable Tide","Vraska, Betrayal's Sting"],"popular":["Thrummingbird","Breeding Pool","Tezzeret's Gambit","Overgrown Tomb"]},"Krenko, Mob Boss":{"synergy":["Goblin Warchief","Skirk Prospector","Goblin Matron","Goblin Chieftain","Impact Tremors","Goblin Bombardment"],"popular":["Brightstone Ritual","Pashalik Mons","Siege-Gang Commander","Goblin King"]},"Vivi Ornitier":{"synergy":["Curiosity","Ophidian Eye","Harmonic Prodigy","Tandem Lookout","Wizard's Staff","Gitaxian Probe"],"popular":["Brainstorm","Steam Vents","Ponder","Shivan Reef"]},"Sauron, the Dark Lord":{"synergy":["Call of the Ring","S       var idxs = Array.isArray(picked) ? picked : [picked];
      // 「期望值」：这一题如果随便答，平均会拿到的向量。多选题按选了几项等比放大。
      var share = q.opts.length ? idxs.length / q.opts.length : 0;
      q.opts.forEach(function (o) {
        Object.keys(o.s || {}).forEach(function (a) {
          expected[a] = (expected[a] || 0) + o.s[a] * share;
        });
      });
      idxs.forEach(function (i) {
        var o = q.opts[i]; if (!o) return;
        Object.keys(o.s || {}).forEach(function (a) { pref[a] = (pref[a] || 0) + o.s[a]; });
        Object.keys(o.col || {}).forEach(function (c) { colors[c] = (colors[c] || 0) + o.col[c]; });
        Object.keys(o.cval || {}).forEach(function (k) { acc[k].push(o.cval[k]); });
        if (o.exp) expLevel = o.exp;
      });
    });
    // 只保留「这个人与平均答题者的差异」——140 多题累加出的共同分量会淹没个人口味，
    // 导致所有人的偏好向量彼此相似、推荐被少数「居中」的主将垄断。必须与 Python 引擎一致。
    var centered = {}, axis;
    var seen = {};
    Object.keys(pref).forEach(function (a) { seen[a] = 1; });
    Object.keys(expected).forEach(function (a) { seen[a] = 1; });
    for (axis in seen) centered[axis] = (pref[axis] || 0) - (expected[axis] || 0);
    var cons = {};
    Object.keys(DEFAULT_C).forEach(function (k) {
      cons[k] = acc[k].length ? acc[k].reduce(function (a, b) { return a + b; }, 0) / acc[k].length
                              : DEFAULT_C[k];
    });
    cons.exp = expLevel || 3;
    return { pref:centered, colors:colors, cons:cons };
  }
  function cosine(a, b) {
    var keys = {}, dot = 0, na = 0, nb = 0, k;
    Object.keys(a).forEach(function (x) { keys[x] = 1; });
    Object.keys(b).forEach(function (x) { keys[x] = 1; });
    for (k in keys) {
      var av = a[k] || 0, bv = b[k] || 0;
      dot += av * bv; na += av * av; nb += bv * bv;
    }
    return (na && nb) ? dot / Math.sqrt(na * nb) : 0;
  }
  function rank(t) {
    var maxDecks = Math.max.apply(null, CMDS.map(function (c) { return c.num_decks || 1; }));
    var maxColor = Math.max.apply(null, Object.keys(t.colors).map(function (c) { return t.colors[c]; }).concat([0]));
    var cap = saltCapFor(t.cons.salt);
    // 接触时长决定整套评分标准
    var expLevel = t.cons.exp || 3;
    var prof = EXP_PROFILE[expLevel] || EXP_PROFILE[3];
    var complexTol = Math.min(t.cons.complex, prof.complexCap);
    var popWeight = CONST.W_POPULAR * prof.popMul;
    return CMDS.map(function (c) {
      var sim = cosine(t.pref, c.vec), affinity = 0.5;
      if (maxColor > 0) {
        affinity = c.colors === "C" ? 0.5
          : c.colors.split("").reduce(function (s, col) { return s + (t.colors[col] || 0); }, 0)
            / (maxColor * c.colors.length);
      }
      var pop = Math.log10(Math.max(1, c.num_decks || 1)) / Math.log10(maxDecks);
      // 难度扣分用连续值（difficulty），五档只用于显示，避免相邻档位差一跳就是一大截
      var pc = Math.max(0, (c.difficulty != null ? c.difficulty : c.complexity)
                           - complexTol) * CONST.P_COST;
      var pb = Math.max(0, c.budget - t.cons.budget) * CONST.P_BUDGET;
      var ps = Math.max(0, c.salt - cap) * CONST.P_SALT;
      // 强度档位：新人被高 Bracket 主将劝退，老手不受限
      var pbr = Math.max(0, (parseInt(c.bracket, 10) || 3) - prof.bracketCap) * CONST.P_BRACKET;
      var bonus = t.cons.salt >= 4 ? 0.05 * c.salt : 0;
      return { c:c, sim:sim, exp:expLevel, expName:prof.name,
               score: CONST.W_SIM*sim + CONST.W_COLOR*affinity + popWeight*pop
                       - pc - pb - ps - pbr + bonus };
    }).sort(function (a, b) { return b.score - a.score; });
  }

  /* ---------- 画面 ---------- */
  var app = NO_DOM ? null : document.getElementById("app");

  function start(mode) {
    state = { mode:mode, current:null, history:[], answers:{} };
    state.current = resolveInMode(START);
    screenQuestion();
  }

  /* ---------- 分支流程 ---------- */
  // 一道题的所有出边：选项的 goto 优先，否则用 next
  function targetsOf(q) {
    var outs = [];
    q.opts.forEach(function (o) { if (o.goto) outs.push(o.goto); });
    if (!outs.length) outs.push(q.next);
    return outs;
  }
  // 快速版：主线题不在 QUICK 里就沿主线往后跳，分支题一律照常问
  function resolveInMode(target) {
    if (!target) return null;
    if (state.mode !== "quick") return target;
    if (!SPINE_SET[target]) return target;
    if (QUICK_SET[target]) return target;
    var at = SPINE.indexOf(target);
    for (var i = at < 0 ? 0 : at; i < SPINE.length; i++) {
      if (QUICK_SET[SPINE[i]]) return SPINE[i];
    }
    return null;
  }
  // 路径长度区间：分支长度可能不一致（有的枢纽选项会跳过分支直接走 next），
  // 所以进度条按最长路径估，标签显示区间。
  function pathBounds(mode) {
    var saved = state.mode;
    state.mode = mode;
    var memo = {};
    function walk(id) {
      if (!id) return [0, 0];
      if (memo[id]) return memo[id];
      memo[id] = [1, 1];                       // 防环占位
      var q = Q.byId[id];
      if (!q) { memo[id] = [0, 0]; return memo[id]; }
      var outs = [];
      q.opts.forEach(function (o) { if (o.goto) outs.push(resolveInMode(o.goto)); });
      outs.push(resolveInMode(q.next));
      var lo = Infinity, hi = 0;
      outs.forEach(function (t) {
        var b = walk(t);
        lo = Math.min(lo, b[0]);
        hi = Math.max(hi, b[1]);
      });
      if (!isFinite(lo)) lo = 0;
      memo[id] = [1 + lo, 1 + hi];
      return memo[id];
    }
    var result = walk(resolveInMode(START));
    state.mode = saved;
    return result;
  }
  function goNext(opt) {
    var q = Q.byId[state.current];
    var raw = (opt && opt.goto) ? opt.goto : q.next;
    var target = resolveInMode(raw);
    state.history.push(state.current);
    if (!target) {
      screenResult();
    } else {
      state.current = target;
      screenQuestion();
    }
  }
  function goBack() {
    if (!state.history.length) return;
    state.current = state.history.pop();
    screenQuestion();
  }

  function screenQuestion() {
    var q = Q.byId[state.current];
    var picked = state.answers[q.id];
    var isMulti = !!q.multi;
    app.innerHTML = "";
    var box = el("div", "card");

    var done = state.history.length;
    var bounds = state.mode === "quick" ? QUICK_BOUNDS : FULL_BOUNDS;
    var total = bounds[1];
    var pct = Math.max(2, Math.round(done / total * 100));
    var head = el("div");
    head.innerHTML =
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="sechead"><span>' + esc(q.secName) + '</span>' +
      '<span>第 ' + (done + 1) + ' 题 / 共 ' + totalLabel(bounds) + '</span></div>';
    box.appendChild(head);

    box.appendChild(el("div", "qtext", esc(q.q)));
    if (isMulti) box.appendChild(el("p", "muted", "可多选，最多 " + q.multi + " 个"));

    var list = el("div", "mt-s");
    q.opts.forEach(function (o, i) {
      var b = el("button", "opt");
      var on = isMulti ? (picked || []).indexOf(i) >= 0 : picked === i;
      if (on) b.className += " on";
      b.innerHTML = '<span class="idx">' + "ABCDEFG"[i] + '</span>' + esc(o.t);
      b.onclick = function () { choose(q, i); };
      list.appendChild(b);
    });
    box.appendChild(list);

    var nav = el("div", "row mt");
    var back = el("button", "btn ghost", "← 上一题");
    back.disabled = !state.history.length;
    back.onclick = goBack;
    nav.appendChild(back);
    if (isMulti) {
      var nxt = el("button", "btn", "下一题 →");
      nxt.disabled = !(picked && picked.length);
      nxt.onclick = function () { goNext(null); };
      nav.appendChild(nxt);
    }
    box.appendChild(nav);
    app.appendChild(box);
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  function choose(q, i) {
    if (q.multi) {
      var cur = state.answers[q.id] || [];
      var at = cur.indexOf(i);
      if (at >= 0) cur.splice(at, 1);
      else if (cur.length < q.multi) cur.push(i);
      state.answers[q.id] = cur.slice();
      screenQuestion();
    } else {
      state.answers[q.id] = i;
      goNext(q.opts[i]);
    }
  }

  function axisLabel(id) {
    var a = AXES[id];

  function expProf() {

      t.cons.budget.toFixed(1) + '</b> · 被针对容忍度 <b>' + t.cons.salt.toFixed(1) + "</b></p>" +

    document.getElementById("copy").onclick = function () {

      // 剪贴板 API 在部分环境（非安全上下文 / 旧浏览器）不可用，逐级降级
      var legacy = function () {

          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";

        }
      };

        navigator.clipboard.writeText(text).then(done, legacy);

        legacy();

    };

    var note = el("div", "warn mt");
    note.innerHTML = "结果基于问卷匹配，<b>不是强度排名</b>。选主将最好的方式还是先借一副牌打两局——" +

    app.appendChild(note);

  /* ---------- 预处理 ---------- */
  var byId = {}, all = [], secNames = {};
  (Q.sections || []).forEach(function (s) { secNames[s.id] = s.name; });
  Q.questions.forEach(function (q) {
    q.secName = secNames[q.sec] || "";
    byId[q.id] = q; all.push(q);
  });
  Q.byId = byId; Q.all = all; Q.count = all.length;

  // 主线顺序：从起点沿 next 走一遍（忽略 goto 分支）
  var START = Q.start || (all[0] && all[0].id);
  var SPINE = [], SPINE_SET = {}, QUICK_SET = {};
  (function () {
    var id = START, guard = 0;
    while (id && guard++ < 600) {
      SPINE.push(id);
      SPINE_SET[id] = true;
      var q = byId[id];
      if (!q) break;
      id = q.next;
    }
  })();
  QUICK.forEach(function (id) { QUICK_SET[id] = true; });
  // 题量区间由路径分析得出（部分枢纽选项会跳过分支，所以是个区间）
  var FULL_BOUNDS = pathBounds("full");
  var QUICK_BOUNDS = pathBounds("quick");
  var FULL_TOTAL = FULL_BOUNDS[1];
  var QUICK_TOTAL = QUICK_BOUNDS[1];
  function totalLabel(bounds) {
    return bounds[0] === bounds[1] ? String(bounds[1]) : bounds[0] + "–" + bounds[1];
  }

  // 离线校验钩子：parity / UI 冒烟测试脚本用它驱动同一套逻辑
  if (typeof globalThis !== "undefined") {
    globalThis.__quizEngine = {
      tally: tally, rank: rank, cosine: cosine, AXES: AXES, CONST: CONST,
      setAnswers: function (answers) { state.answers = answers; },
      quickIds: QUICK.slice(),
      start: start, choose: choose, goNext: goNext, goBack: goBack,
      screenQuestion: screenQuestion, goNextRaw: goNext,
      getState: function () { return state; }, Q: Q,
      spine: SPINE.slice(), startId: START,
      totals: { full: FULL_TOTAL, quick: QUICK_TOTAL,
                fullBounds: FULL_BOUNDS.slice(), quickBounds: QUICK_BOUNDS.slice() }
