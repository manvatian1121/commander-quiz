牌，一次就能让你抽好几张；再配上几只「你每放一个瞬间或法术就补一点伤害」的生物，伤害和手牌会一起涨。牌抽多了要想怎么赢，实验室狂人（Laboratory Maniac）会在你牌库空掉时把抽牌直接变成胜利。注意有些牌也会打到自己，血少时别乱用。"},"Bruce Banner":{"tagline":"一费小科学家，变身后越打越猛","intro":"布鲁斯·班纳（Bruce Banner）是只要一点法术力的双面主将，正面是个小科学家，能花钱换牌。凑齐费用变身之后，他就成了无敌浩克：有践踏和延势，每次受伤都会变大，被打到时还能站起来多打一轮。喜欢前期隐忍、后期爆发的玩家会喜欢它。","build":"变身之后要靠「被打」来成长。铁蒺藜（Caltrops）会在每个生物攻击时对它造成一点伤害，它自己攻击时正好被戳到，于是加上指示物并多打一轮；再放一张每回合给全场生物和玩家各来一点的牌，它就会自己滚起来。还要有牌能让它这回合不会死，顺便把受到的每点伤害换成指示物。月雾（Moonmist）可以直接把主将翻面，不用等凑齐费用。"},"Ozai, the Phoenix King":{"tagline":"手上留着六点法术力，主将就打不死","intro":"凤凰大帝敖载（Ozai, the Phoenix King）是黑红两色的六费主将，自带践踏、敏捷和御火，一攻击就给你四点红色法术力。更关键的是：只要你手上留着六点以上没花完的法术力，它就同时获得飞行和不灭。喜欢憋着资源打爆发的玩家会喜欢它。","build":"核心是攒住没花掉的红色法术力。苏进彗星（Sozin's Comet）这类牌会一次性给你一大把红法术力，还能留到战斗结束，主将趁这个时候攻击就又有飞行又不会死；再放几张能给自家生物补御火的地。前期也要靠便宜的产费咒语抢时间，让主将早点上场。注意法术力花光后主将就只是普通大生物，出手的时机要想清楚。"},"Ultima, Origin of Oblivion":{"tagline":"无色爆费，一只只砸下大怪","intro":"原初的生命体阿尔蒂玛（Ultima, Origin of Oblivion）是纯无色的五费主将，自己会飞。你每次横置地取无色法术力，它都额外多给一点；攻击时它还会污染对手的一块地，那块地从此只能产无色。喜欢攒一大笔费用再放大生物的玩家会喜欢它。","build":"这套牌走「先攒钱、后放大牌」的路子。遭弃纪念碑（Forsaken Monument）会让每块地的无色法术力再多一点，两三回合之后你就有能力把费用极高的大怪直接放上场。再配一张能清掉场上所有有色永久物的牌，而你的生物全是无色的，正好不受影响。注意无色套牌几乎没有即时应变的手段，前期要忍得住。"},"Tifa, Martial Artist":{"tagline":"养出一只七攻大怪，回合再打一次","intro":"格斗家蒂法（Tifa, Martial Artist）是红绿白三色的四费武僧，攻击的对手越多她就越大。当自家有攻击力七以上的生物打中对手时，她会把全队重置一遍，并在第一个战斗阶段后再补一轮战斗。上手难度低，喜欢一路打脸的新人会很喜欢她。","build":"路子很直白：把主将和伙伴的攻击力堆到七以上，再靠重置加额外战斗连打两轮。贾路的反抗（Garruk's Uprising）给全队践踏，还会在你场上有大怪时抽一张牌；地动鼹鼠安札格（Anzrag, the Quake-Mole）被挡住时同样能重置全队并追加战斗。牌表里多放能自己变大的生物。注意这套牌防守手段不多，别为了多打一轮把自己留空。"},"Zoraline, Cosmos Caller":{"tagline":"小蝙蝠不停进场，血越回越多","intro":"星宇唤师佐拉琳（Zoraline, Cosmos Caller）是黑白两色的三费蝙蝠牧师，会飞。自家的蝙蝠一攻击你就回一点血；它自己进场或攻击时，你可以付点法术力和两点生命，把坟场里一张费用三点以下的牌拉回场上。喜欢飞行生物的玩家会喜欢它。","build":"核心是「蝙蝠进场、回血、捞牌」的循环。奉生搭档（Lifecreed Duo）每次有生物进场都让你回一点血，再放几张在你这回合血量有变化时给全队蝙蝠加攻击力的牌。另外几张盯着回合结束时的血量变化、给对手施压的牌，能让你一边回血一边推对手的血。注意主将拉牌回来要额外付法术力和两点生命，血少的时候别乱用。"},"Tony Stark":{"tagline":"两费筛神器，变身后免费铺装备","intro":"托尼·史塔克（Tony Stark）是蓝红两色的二费主将，能翻看牌库顶四张牌挑一张神器进手。费用够了让他变身，他就成了无敌钢铁侠，每个战斗阶段前还能直接把手上的一张神器放进场，是装备就当场穿上。喜欢慢慢攒神器的玩家会喜欢它。","build":"前期就是不停用主将的技能筛牌，把神器挑进手；瓦坎达发明家苏睿（Shuri, Wakandan Inventor）这类让神器咒语变便宜的牌，能让你更快把它们放下来。变身之后要靠场上的神器数量吃饭：神器越多，那些变身形态的大块头越能打，攻击时还会生出宝物继续供费。注意关键神器别被对手一次清光，不然变身之后也撑不住场面。"},"Raph & Mikey, Troublemakers":{"tagline":"主将一攻击，牌库顶拉出一只帮手","intro":"经常捣乱的拉夫与麦奇（Raph & Mikey, Troublemakers）是红绿两色的七费主将，自带践踏和敏捷。它每次攻击都会从牌库顶往下翻，直到翻出一张生物牌，直接把它横着放进场一起攻击。喜欢主将一上场就开打的玩家会喜欢它。","build":"因为主将要靠翻牌找帮手，牌表里的大生物越多它就越稳，歼铁巨像（Blightsteel Colossus）这种平时放不下来的牌就靠这一下免费上场。再配几张打中对手后能重置全队、追加一轮战斗的牌，主将就能连着翻好几次；也别忘了能靠生物打中产出珍宝的牌，正好补贴主将七费的开销。注意这套牌完全依赖攻击，遇到对手满地挡兵时会比较难受。"},"Slinza, the Spiked Stampede":{"tagline":"野兽便宜上场，进场就和对手互斗","intro":"尖背跺兽斯林沙（Slinza, the Spiked Stampede）是红绿两色的五费野兽。你放的野兽咒语便宜两点，自家野兽进场还多带一个指示物；每当它或四攻以上生物进场，你都可以付费让它和对手的生物互斗。喜欢大野兽成群压上的玩家会喜欢它。","build":"牌表要尽量塞满野兽。克洛萨战酋长（Krosan Warchief）让野兽再便宜一点，接着就是各种便宜下来的大块头，有的一进场就带指示物，有的在有地进场时还会再给你一只 4/4。再放几张盯着野兽进场让你抽牌的牌，保证你手上有货继续铺。注意互斗是双向的，主将身上指示物还不够多的时候，别随便让它和对手的大生物对撞。"},"Evereth, Viceroy of Plunder":{"tagline":"吃宝物长大，死后拉全场垫背","intro":"劫夺总督艾霏蕾（Evereth, Viceroy of Plunder）是黑红两色的三费吸血鬼。你可以牺牲自家生物或神器给它加指示物，牺牲宝物时它当回合还获得系命。它死后你付费就能按当时的攻击力给每位对手一次伤害。喜欢边攒边牺牲的玩家会喜欢它。","build":"这套牌一半是宝物、一半是牺牲。冷酷袭劫者（Pitiless Plunderer）会在你的生物死掉时补一个宝物，刚好可以喂给主将；再放几张每回合按死掉生物数量给你一批珍宝的牌，货源就很稳。宝物产量翻倍的牌也值得放，另外还要有一两张「牺牲掉就替你打伤害」的牌收尾。注意主将的技能只能在你的主阶段用，它被养大之后再死掉，你就得重攒一遍。"},"Thorin, King of Durin's Folk":{"tagline":"矮人带宝物，宝物再养矮人","intro":"都林一族之王梭林（Thorin, King of Durin's Folk）是红白两色的五费矮人贵族。它自己或你其它的矮人进场都会给你一个宝物，而你场上的每个宝物都会变成自家其他矮人的攻击力加成。喜欢矮人和宝物、把队伍越滚越大的玩家会喜欢它。","build":"牌表以矮人为主。矮人特使格罗因（Glóin, Dwarf Emissary）每回合都能再补你一个宝物，其余位置尽量放便宜好用的矮人打手。宝物攒得越多，主将给的加成越夸张，所以用宝物换法术力、把更多矮人放下来才是正事；地也可以选能持续产出费用的那几张。注意矮人整体身材不大，别指望单挑赢过对手的大生物。"},"Clive, Ifrit's Dominant":{"tagline":"丢掉整手牌，换来一整手新牌","intro":"伊弗利特显化者克莱夫（Clive, Ifrit's Dominant）是纯红的六费主将。它进场时可以弃掉整手牌，按场上红色法术力符号的数量重抽一批；之后还能变身成伊弗利特，一边和对手的生物互斗，一边产出大量红法术力。喜欢赌一把的玩家会喜欢它。","build":"关键是场上的红色符号要多，所以牌表尽量放红咒语。墨癸斯的狂信徒（Fanatic of Mogis）进场时按你的虔诚度打每位对手，和主将用的是同一套算法；再放几张「你一弃牌就给对手造成伤害」的牌，主将进场正好要弃掉整手牌。还得有让红咒语变便宜、或者能复制自家生物的牌。注意手牌一旦弃掉就回不来，手牌本来就差的时候再变身才划算。"},"Zurgo, Thunder's Decree":{"tagline":"每次攻击白送两个战士，还不会走","intro":"雷霆之裁珠高（Zurgo, Thunder's Decree）是白黑红三色的三费兽人战士。它每次攻击都会额外带出两个一起参战的 1/1 战士，本来它们下一个回合结束就要被牺牲，但主将能让自家的战士衍生物免掉这一下。喜欢靠小兵取胜的玩家会喜欢它。","build":"因为战士衍生物能留下来，这套牌会越打越多。拓求围驮兽（Dalkovan Packbeasts）这类自带动员的大生物，进场就带一支小兵队伍；再配上几张能把「攻击」这件事放大的牌，小兵会越打越多。还有的牌动员数量取决于你坟场里的生物牌，前期被牺牲的小兵正好变成它的燃料。注意场面铺满之后，要考虑怎么清掉对手的挡兵，而不是继续加人。"},"Ardbert, Warrior of Darkness":{"tagline":"放白牌就变强，放黑牌就给威吓","intro":"暗之战士阿尔博特（Ardbert, Warrior of Darkness）是黑白两色的三费主将。你每放一个白咒语，自家传奇生物就一起加指示物并获得警戒；每放一个黑咒语，则换成获得威慑。所以牌表里几乎全是传奇生物。喜欢全员传奇的玩家会喜欢它。","build":"牌表尽量塞满传奇生物。受诅咒的亚瓦德（Arvad the Cursed）给自家其他传奇生物 +2/+2，正好和主将的指示物叠在一起；灭除火花（Despark）能直接处理对手的大件。再放一两张只清掉非传奇永久物的牌，正好不伤自己人，也别忘了能把坟场里的传奇永久物一次性捞回来的大招。注意主将只在放黑白咒语时触发，无色牌帮不上忙。"},"Mabel, Heir to Cragflame":{"tagline":"老鼠一起变大，还自带一把剑","intro":"焰齿剑传人玛贝尔（Mabel, Heir to Cragflame）是红白两色的三费老鼠士兵。自家其他老鼠都 +1/+1，它进场时会带来一把「焰齿剑」——一件让生物更大、还带警戒、践踏和敏捷的传奇装备。上手难度低，喜欢小生物冲上去的新人会喜欢它。","build":"牌表以老鼠为主。心火勇士（Heartfire Hero）这类便宜老鼠负责铺场，再配上几张能在战斗前把全队攻击力顶起来的牌。主将给的焰齿剑要早早装上，挂在每回合都会打过去的生物身上最划算；能额外带出一只复制小老鼠的牌也很好用，等于白送一个攻击点。注意这套牌的生物都很小，被清场一次就全没了。"},"Hei Bai, Forest Guardian":{"tagline":"神龛越找越多，灵魂越造越多","intro":"森林护卫黑白（Hei Bai, Forest Guardian）是五色的四费熊灵。它进场时会翻牌库顶，翻到神龛就直接放进场；你还可以付五色法术力并横置它，按自家传奇结界的数量造出一批灵魂衍生物。喜欢五色结界、慢慢累积优势的玩家会喜欢它。","build":"牌表的主体是神龛。万物圣殿（Sanctum of All）每回合都能帮你从牌库或坟场再找一个神龛，再配上能把坟场里的结界捞回来的牌。神龛越多，其余那些圣殿的效果就越夸张——抽牌、产费、吸血全都跟着数量走，手牌也能补得很足。注意这是五色牌，前期最怕卡色，能产多色的地要优先放。"},"The Lord of Pain":{"tagline":"谁放咒语谁挨打，对手还不能回血","intro":"苦痛领主（The Lord of Pain）是黑红两色的五费人类刺客，自带威慑。它让对手完全无法获得生命；同时每个玩家每回合放第一个咒语时，它都会照那个咒语的法术力值挑一位其他玩家打伤害。喜欢拖住对手节奏的玩家会喜欢它。","build":"这套牌自己不急着出手，而是让对手在放牌时不断挨打。砸瓶女汉子（Vial Smasher the Fierce）能加强这套压力，而费用越高的咒语伤害越大，所以自己的牌可以尽量往大费用放；再放几张「对手掉血就给你补牌」或者每回合稳定磨对手血的牌，压力就一直在。注意这套牌会让对手不太舒服，第一次在朋友局里用之前最好先打个招呼。"},"Jenova, Ancient Calamity":{"tagline":"指示物堆给别人，死了再换一把牌","intro":"古来灾厄杰诺瓦（Jenova, Ancient Calamity）是黑绿两色的四费主将。每个战斗阶段前，它按攻击力把等量指示物放到另一只生物身上，并把它变成突变体；突变体在你回合死掉时，你按它的攻击力抽牌。喜欢把指示物堆高的玩家会喜欢它。","build":"核心是「先把主将养大，再把身材转出去」。坚固鳞甲（Hardened Scales）会让你放指示物时多放一个，再放几张效果类似或者直接翻倍的牌，主将的成长会快很多；也有牌能把收集到的指示物转给它。还要有能把死去生物身上的指示物转给下一只的牌，让这套牌不容易亏。注意突变体要死在你自己的回合才有牌抽，动手的时机要算一下。"},"Ral, Monsoon Mage":{"tagline":"咒语连放，翻硬币变身","intro":"风雨法师拉尔（Ral, Monsoon Mage）是蓝红两色的二费主将，让你放的瞬间和法术都便宜一点。你在自己回合每放一个瞬间或法术就要翻一次硬币：输了它打你一点伤害，赢了你可以把它翻面成鹏洛客形态。喜欢一口气连放很多咒语的玩家会喜欢它。","build":"这套牌的路子是把小费用咒语一张接一张串起来。几张便宜的红色产费咒语，一次就给你好几点红法术力，让你继续往下放；过往成焰（Past in Flames）让坟场里的瞬间和法术这回合都能再放一遍。再配上「每放或复制一个咒语就给你宝物」的牌，费用就能一直续上。注意翻硬币会打自己血，这套牌上手也难，第一次玩建议先照着别人的牌表抄。"},"Rootha, Mastering the Moment":{"tagline":"先放法术，再凭空变出一只元素","intro":"精进当下如莎（Rootha, Mastering the Moment）是蓝红两色的四费兽人术士。只要你这个回合放过瞬间或法术，战斗前它就会造出一只蓝红元素，身材等于本回合用过的咒语中最大的费用。喜欢法术和生物混着打的玩家会喜欢它。","build":"牌表要放一些费用高、效果实在的瞬间和法术，让主将造出来的元素够大。有几张牌会按坟场里那张瞬间或法术的费用给全队加成，正好和主将的算法呼应；火山迸发（Volcanic Salvo）费用极高，但能让元素直接变成巨兽。再放几张让瞬间和法术便宜一点、或者帮你复制下一张咒语的牌。注意战斗前必须先放法术，不然主将什么都不会造。"},"Brigid, Clachan's Heart":{"tagline":"一面造人，一面把队伍变成法术力","intro":"小村之心布莉姬（Brigid, Clachan's Heart）是绿白两色的三费双面主将。正面进场会造一只 1/1 的绿白生物，翻回正面再造一只；第一个主阶段你可以付费让它翻面，背面按场上其他生物的数量产出法术力。喜欢小兵越铺越多的玩家可以试试。","build":"这套牌靠反复翻面赚钱：正面造兵，背面产出法术力，再翻回正面继续造兵。英缘相连（Kinbinding）按你本回合进场的生物数量给全队加成，配上主将每回合送的小兵，队伍会越来越壮；再放几张能复制自家小生物、或者攻击时从手上直接拉一只生物进场一起打的牌。注意翻面要花钱，法术力得留在主阶段用。"},"Zur the Enchanter":{"tagline":"主将一攻击，就白拿一个结界","intro":"结界大师祖尔（Zur the Enchanter）是白蓝黑三色的四费法师，自己会飞。它每次攻击都会免费从牌库里翻出一张费用不大的结界，直接放进场，所以你越早让它打中一次，好处来得越快。喜欢提前布置、一点点把局势锁住的人会喜欢它。","build":"牌表以结界为主：魂魅拘禁（Ghostly Prison）和宣导（Propaganda）让对手攻击你时先多付法术力，命运之攫（Grasp of Fate）一次封住每位对手的一个非地永久物。给主将贴上闪光宝物（All That Glitters），它会变成很大的攻击者，而且每次攻击都多带一张结界进场。新人注意：主将怕被反击，前期别让它单独冲上去。"},"Aesi, Tyrant of Gyre Strait":{"tagline":"每落一块地，就多抽一张牌","intro":"盖尔海峡暴君艾西（Aesi, Tyrant of Gyre Strait）是蓝绿两色的六费巨蛇。它让你每回合多放一块地，而且只要有一块地进场，你就抽一张牌。这套牌靠的是地越铺越多、手牌一直有补充，不靠打人。喜欢慢慢变大的玩家会喜欢它。","build":"云游者梓纱（Azusa, Lost but Seeking）让你一回合多放两块地，探索大地（Explore）和成长涡旋（Growth Spiral）也帮你多放地并顺手抽牌。地铺开之后，赞迪卡复仇者（Avenger of Zendikar）会带出一群生物替你收尾。新人注意：别怕手上地多，但也别把牌用光。"},"Urza, Chief Artificer":{"tagline":"神器越多，场上的机器越大","intro":"铸物卿克撒（Urza, Chief Artificer）是白蓝黑三色的六费神器师。你场上的神器生物都有威慑，对手要用两只以上才挡得住；每个回合结束，它还会免费给你一个跟自家神器数量一样大的机器生物。喜欢把一桌小神器滚大的人会喜欢它。","build":"牌表里有很多神器地，像悉诺议会宅邸（Seat of the Synod）和远古狮穴（Ancient Den），它们既产法术力，又让每回合白来的那个机器更大。乙金塑师（Etherium Sculptor）让神器咒语更便宜，扑翼大师塞埃（Sai, Master Thopterist）在你放神器时不断给你小飞机。新人注意：主将费用不低，前期先铺便宜神器。"},"Alela, Artful Provocateur":{"tagline":"放神器或结界，就多一只小飞仙","intro":"祸水阿莉莱（Alela, Artful Provocateur）是白蓝黑三色的四费仙灵，自己会飞，还带死触和系命。你每放一张神器或结界，它就免费给你一只会飞的小仙灵，自家会飞的生物也都大一点。喜欢一边铺场一边回血、用小飞兵淹过去的人会喜欢它。","build":"苦涩花开（Bitterblossom）每回合自动给你一只小仙灵，眷顾之风（Favorable Winds）和无形美善（Intangible Virtue）让这些小家伙一起变大，迷梦斗客欧拜拉（Obyra, Dreaming Duelist）在你每多一只仙灵进场时就让对手掉血。新人注意：仙灵很小，遇到清场会一次全没，别把希望全押在它们身上。"},"Morophon, the Boundless":{"tagline":"选一个种族，全族都变便宜","intro":"无形莫洛丰（Morophon, the Boundless）是五色的七费变形兽。它进场时你要选一个生物类别，比如龙或者鬼怪；之后你放的这类生物咒语会便宜一大截，自家同类生物也都会大一点。适合一开始就想好「我要组一套全是某某族」的玩家。","build":"克撒的抚育设备（Urza's Incubator）和传令号角（Herald's Horn）让选定的那类咒语更便宜，境域行者（Realmwalker）让你能一直从牌库顶挑同类生物来放，覆面林连结点（Maskwood Nexus）则让自家所有生物都算作你选的类别。新人注意：先想好种族，再照着它配牌。"},"Zada, Hedron Grinder":{"tagline":"一张小咒语，全队一起受益","intro":"晶石磨工查妲（Zada, Hedron Grinder）是红色的四费鬼怪。它的本事很特别：只要你放的瞬间或法术只指它自己，这个咒语就会为场上每只别的生物各复制一份。所以一张「抽一张牌」的小咒语会变成全队一起抽。喜欢用便宜小牌打配合的人会喜欢它。","build":"提速咒（Expedite）和深红鬼火（Crimson Wisps）让全队获得敏捷并抽一张牌，火焰冲拳（Fists of Flame）让每只生物都加上践踏和攻击力，巨龙食粮（Dragon Fodder）负责铺开小鬼怪给你复制。暴风窑艺家（Storm-Kiln Artist）在你放或复制咒语时不断给你宝物。新人注意：咒语只能指主将一个人，否则复制不了。"},"Magus Lucea Kane":{"tagline":"花多少费用，都会再来一份","intro":"占星师露西娅·凯恩（Magus Lucea Kane）是蓝绿红三色的四费法师。它每回合战斗前给一只生物加一层指示物，还能产出两点无色法术力；关键是你接下来放的那张费用里带变量的咒语会直接再来一份。喜欢一口气砸出一只超大生物的人会喜欢它。","build":"核心是一堆费用带变量的生物，比如水螅融合体（Hydroid Krasis）、畸变体（Aberrant）和母虫（Tervigon）：你把法术力全花在上面，它们就带着成堆的指示物进场，而主将会把这一下原样再复制一次，等于白来一只。无拘滋养（Unbound Flourishing）让变量翻倍。新人注意：想复制就得留法术力给主将。"},"Satoru Umezawa":{"tagline":"小生物打过去，换大生物偷袭","intro":"梅泽悟（Satoru Umezawa）是蓝黑两色的三费忍者。它让手上每一张生物牌都能用「忍术」便宜地换上场：先派一只没人挡得住的小生物攻击，再把手里的大生物换进去，直接横着进场并参加这次攻击。喜欢偷袭、用小生物骗过对手的人会喜欢它。","build":"蛇身刀客（Slither Blade）和雾隐传令（Mist-Cloaked Herald）这类不能被阻挡的小生物是起手最想要的，有它们在，你每回合都能把手里的大生物换上场；银毛师父（Silver-Fur Master）让这些交换更便宜，每次换人还能从牌库顶挑一张进手。新人注意：忍术只能在攻击者没被挡住之后用。"},"Inalla, Archmage Ritualist":{"tagline":"每只法师，都能多来一只","intro":"仪法大师因娜拉（Inalla, Archmage Ritualist）是蓝黑红三色的五费人类法师。就算她还没上场，你放法师生物时也能付一点法术力，让那只法师多来一只复制品。喜欢反复利用生物进场效果、把好处滚大的人会喜欢她。","build":"关键是挑进场就有好处的法师：古语术士（Archaeomancer）能把坟场里的瞬间或法术拿回手上，血脉死灵术士（Bloodline Necromancer）能把坟场里的法师拉回场上，复制出来的那只还会再触发一次。迭演院长奈班（Naban, Dean of Iteration）让这些效果再多来一次。新人注意：复制来的那只回合结束就被放逐。"},"Omnath, Locus of All":{"tagline":"五色大手牌，法术力不浪费","intro":"万物核欧那斯（Omnath, Locus of All）是五色的五费元素。你每个回合都会先看一眼牌库顶、把它拿到手里，如果那张牌的颜色够杂，还会顺带给你三点法术力；没花完的法术力也不会白消失，会变成黑色法术力留着。喜欢手里牌多的玩家会喜欢它。","build":"靠大量不同颜色的地撑起五色，仙林境接骨木（Faeburrow Elder）也能按你场上颜色的数量产法术力。赢法是把省下的法术力砸在贵的多色牌上：毁坏通牒（Ruinous Ultimatum）一次清掉对手全场的非地永久物，不义之财（Villainous Wealth）直接从对手牌库顶挖走一堆牌免费使用。新人注意：凑齐五色是前提。"},"Kykar, Wind's Fury":{"tagline":"放非生物咒语，就多一只小精怪","intro":"狂风怒火凯卡（Kykar, Wind's Fury）是蓝红白三色的四费鸟法师，自己会飞。你每放一个不是生物的咒语，它就给你一只会飞的小精怪；这些小精怪还能被牺牲掉换成红色法术力，让你继续放咒语。喜欢法术不断、场面越铺越满的玩家会喜欢它。","build":"牌表里塞满便宜的瞬间和法术，脑力激荡（Brainstorm）和抉择（Opt）这种一张就能换一只小精怪；冲击震颤（Impact Tremors）让每只新来的生物都让对手掉一点血，思绪旋风（Whirlwind of Thought）则在你每放一个非生物咒语时补一张牌。新人注意：精怪既是兵也是法术力，牺牲前先想清楚。"},"The Scarab God":{"tagline":"把坟场里的生物，变成自己的僵尸","intro":"甲虫神（The Scarab God）是蓝黑两色的五费神。它能把双方坟场里的生物挖出来，变成一只黑色僵尸替你作战；你场上的僵尸越多，它每个回合开始时就让每位对手掉越多血。而且它就算被打死，也会自己回到你手上。喜欢把坟场当资源用的人会喜欢它。","build":"屋顶风暴（Rooftop Storm）让你放僵尸生物几乎不用花法术力，死亡爵主（Death Baron）和战墓队长（Diregraf Captain）给全队僵尸加强，安福陵的暗贾（Gray Merchant of Asphodel）进场时按你黑色法术力符号的数量让每位对手掉血。新人注意：主将费用不低，前期先靠便宜的僵尸站住场面。"},"Winota, Joiner of Forces":{"tagline":"小飞机打过去，白拉一个人类","intro":"聚力领袖薇诺塔（Winota, Joiner of Forces）是红白两色的四费人类战士。每当一只不是人类的生物攻击，它就翻牌库顶六张，翻到人类就直接放进场一起打，而且这回合不会被消灭。喜欢「一攻击就白来人」的玩家会喜欢它。","build":"扑翼机（Ornithopter）和姜饼怪人（Gingerbrute）都是很便宜的小攻击者，专门用来触发主将；翻出来的人类里，刀锋史家（Blade Historian）让所有攻击生物打出两倍伤害，安戈斯的劫掠者（Angrath's Marauders）让伤害整体翻倍。新人注意：触发只认「不是人类的生物」在攻击，别只放人类。"},"Prosper, Tome-Bound":{"tagline":"牌库顶的那张，早晚都是我的","intro":"书契坡斯博（Prosper, Tome-Bound）是黑红两色的四费提夫林，自带死触。它每回合结束都会把牌库顶一张牌放逐，而你可以在一轮之内把它当手牌用掉；只要你从放逐区用了牌，它就还你一枚宝物。喜欢「资源总比别人多一份」的玩家会喜欢它。","build":"索尔石怪（Xorn）让你每次做宝物都多做一枚，狂乱魔法术士（Wild-Magic Sorcerer）让你从放逐区放的第一张咒语顺带再白放一张。鲁莽织焰匠（Reckless Fireweaver）在宝物进场时就让对手掉血，破坏魔鬼（Mayhem Devil）则在你牺牲宝物换法术力时补上伤害。新人注意：放逐出来的那张只能用到下个回合结束，别攒着。"},"Sythis, Harvest's Hand":{"tagline":"放结界就回血抽牌，越放越多","intro":"丰收之手叙提丝（Sythis, Harvest's Hand）是白绿两色的二费结界生物，规则很短：你每放一个结界咒语，就回一点血并抽一张牌。它两费就能上场，所以这套牌从第一两个回合起就不停放结界、不停补牌。喜欢规则简单的玩家会喜欢它。","build":"牌表里几乎全是结界：野地丛生（Wild Growth）和理想境蔓生（Utopia Sprawl）贴在自家地上，让每块地多产法术力；圣所织叶灵（Sanctum Weaver）按你场上结界的数量产法术力。虚位印记（Sigil of the Empty Throne）则不断为你带来会飞的天使。新人注意：主将很小，被针对时很难受。"},"Marchesa, the Black Rose":{"tagline":"带指示物的生物，死了还能回来","intro":"黑蔷薇玛切莎（Marchesa, the Black Rose）是蓝黑红三色的四费人类法师。只要一只带指示物的生物死掉，它下个回合结束时就会自己爬回场上。所以你不用怕清场，还能主动牺牲自家生物换好处。喜欢反复利用同一批生物的人会喜欢她。","build":"禁忌徽记（Unspeakable Symbol）让你花血给生物加指示物，腐食怪（Carrion Feeder）和阿士诺的祭坛（Ashnod's Altar）负责把生物牺牲掉换好处。怀恨劫掠者（Flayer of the Hatebound）在生物从坟场回场时会打对手一大下。新人注意：先给生物加上指示物再牺牲，顺序反了就回不来了。"},"Tiamat":{"tagline":"主将一进场，手上多五条龙","intro":"提亚玛特（Tiamat）是五色的七费龙神，自己会飞。它进场时会从牌库里直接找出五条名字各不相同的龙放进手牌，等于一次把弹药全拿到手，之后你只要一张一张把它们放出来就行。喜欢龙、喜欢大生物压场的玩家几乎都会选它。","build":"龙语祭师（Dragonspeaker Shaman）让龙咒语更便宜，龙袭风暴（Dragon Tempest）在每条龙进场时按你场上龙的数量打一下任意目标，龙后拉黎丝（Lathliss, Dragon Queen）和上古龙卫米瑞穆（Miirym, Sentinel Wyrm）则会不断给你更多龙。新人注意：主将七费不便宜，前期要把费用攒够。"},"Najeela, the Blade-Blossom":{"tagline":"战士一攻击，就多一个战士","intro":"剑花娜吉拉（Najeela, the Blade-Blossom）是五色的三费战士。每当一个战士攻击，就免费再多一个横着进场、也在攻击的战士，场面像雪球一样越打越多。它还能付五色各一点，让全体攻击者站起来再打一次。喜欢人海战术的玩家会喜欢它。","build":"天堂鸟（Birds of Paradise）和繁茂丘陵（Wooded Foothills）这类能产任意颜色、能找地的牌，负责把五色凑齐，这是最重要的功课。德鲁伊贮藏处（Druids' Repository）在你每次攻击时攒指示物再换成法术力，好让你反复启动主将的能力。新人注意：这套牌最怕卡色，地要配得讲究。"},"Shelob, Child of Ungoliant":{"tagline":"被蜘蛛咬死的生物，变成食物","intro":"乌苟立安特后代希洛布（Shelob, Child of Ungoliant）是黑绿两色的六费蜘蛛恶魔，自家其他蜘蛛和它一样有死触；被它们咬过又死掉的生物会变成食物留给你，食物能换来三点生命。这套牌靠一群蜘蛛守住场面慢慢赚。喜欢稳守的玩家会喜欢它。","build":"双胞丝蛛（Twin-Silk Spider）和无尽缠丝阿拉斯塔（Arasta of the Endless Web）都会带来新蜘蛛，蜘蛛创生（Arachnogenesis）能在对手大举进攻时变出一群蜘蛛挡下来。抽肢娃娃（Twitching Doll）能产任意颜色的法术力，还能牺牲自己换一只蜘蛛。新人注意：靠蜘蛛咬伤对手生物赚食物，主动去打不是重点。"},"Rocco, Street Chef":{"tagline":"有人从放逐区出牌，我就加菜","intro":"街头主厨罗孔（Rocco, Street Chef）是红绿白三色的三费妖精德鲁伊，也是位「请客」型主将：每回合结束，每位玩家都从牌库顶翻一张，谁都能用；只要有人从放逐区用牌或放地，你就给自家生物加指示物、还多一块食物。喜欢热闹的玩家会喜欢它。","build":"糖果复仇夜（Night of the Sweets' Revenge）让食物能当法术力用，树林之友贾希拉（Jaheira, Friend of the Forest）让自家衍生物都能产法术力，正好把食物换成放出大生物的钱。大学院制造工人（Academy Manufactor）让你每次做食物时顺便多出别的宝物。新人注意：这套牌会给对手送资源，你要拿到更多。"},"Liesa, Shroud of Dusk":{"tagline":"谁放咒语谁掉血，我负责回血","intro":"薄暮之帷莉艾莎（Liesa, Shroud of Dusk）是黑白两色的五费天使，会飞又有系命。任何玩家每放一个咒语都要掉两点血，连你自己也不例外；就算她被打死，你也能用付生命的方式把她再召唤回来。喜欢让对手处处别扭的玩家会喜欢她。","build":"划配执政坎拔（Kambal, Consul of Allocation）在对手放非生物咒语时让他掉血、你回血，护灵师（Soul Warden）这类牌负责一点点攒生命。暮影蔷薇之棘维托（Vito, Thorn of the Dusk Rose）把「你回血」直接变成「对手掉血」，是这套牌真正的赢法。新人注意：你自己放咒语也要掉两点血，算血时别忘了。"},"Ramos, Dragon Engine":{"tagline":"多色咒语攒指示物，攒够爆法术力","intro":"龙形引擎瑞莫斯（Ramos, Dragon Engine）是五色的六费神器龙，自己会飞。你每放一个咒语，它就按那个咒语的颜色数攒指示物；攒够五个，你可以把它们全部换成十点五色法术力，一口气放一张很大的牌。喜欢攒一波再爆发的玩家会喜欢它。","build":"牌表里全是颜色够杂的牌：聚流（Conflux）一次从牌库找出五种颜色各一张，阿布赞护符（Abzan Charm）这种三色牌一次就能让主将攒三层。攒出的十点法术力，正好够放祖神兽（Progenitus）或启动空无之门（Door to Nothingness）。新人注意：主将被打死，攒的指示物就全没了。"},"Sefris of the Hidden Ways":{"tagline":"一边填坟场，一边闯地城","intro":"密宗法师塞弗莉丝（Sefris of the Hidden Ways）是白蓝黑三色的三费人类法师。只要你往自家坟场放进生物牌，她就带你进地城探险；地城走到头时，你就能把坟场里的生物直接拉回场上。喜欢一边送牌进坟场、一边慢慢经营的人会喜欢她。","build":"凯旋冒险者（Triumphant Adventurer）和白羽山冒险家（White Plume Adventurer）都能自己带你进地城，辉光炽天神侍（Radiant Solar）则在自家生物进场时帮你推进，地城会走得快很多。旭日泰坦（Sun Titan）能把费用小的永久物从坟场反复拿回来。新人注意：每回合只会因为坟场进生物推进一次。"},"Varina, Lich Queen":{"tagline":"带僵尸打人，一边抽牌一边丢牌","intro":"巫妖女王瓦理娜（Varina, Lich Queen）是白蓝黑三色的四费僵尸法师。你带着僵尸攻击时，几只僵尸就抽几张牌，然后丢掉同样数量的牌，同时回等量的血；丢进坟场的牌还能换成新的僵尸。喜欢坟场越堆越厚、资源越滚越多的人会喜欢她。","build":"屋顶风暴（Rooftop Storm）让你放僵尸几乎不用花法术力，腐尸骑士（Corpse Knight）在你每只生物进场时就打对手一点血，刚愎仆从（Wayward Servant）则在僵尸进场时让对手掉血。墓场匍尸（Gravecrawler）只要场上有僵尸就能从坟场反复出来。新人注意：攻击时是先抽牌再丢牌，先想好丢什么。"},"Judith, Carnage Connoisseur":{"tagline":"小伤害配上死触，清掉对手全场","intro":"品戮佳人裘蒂丝（Judith, Carnage Connoisseur）是黑红两色的五费祭师。你每放一个瞬间或法术都能二选一：让它获得死触和系命，或免费多一只小恶魔。配上打一点伤害的小法术就能清掉对手全场生物；喜欢用小法术搞大事的人会喜欢她。","build":"地壳灾害（Tectonic Hazard）和喜庆终结（End the Festivities）都是打一点伤害的小法术，配上死触就变成对全场的清扫。贫窟伏击客（Guttersnipe）在你每放一个瞬间或法术时打对手两点血，配合清场很容易把人磨垮。新人注意：渎神行径（Blasphemous Act）会伤害场上所有生物，用之前先看看自己这边。"},"Stella Lee, Wild Card":{"tagline":"一回合第二个咒语，白拿一张牌","intro":"狂野王牌史黛拉李（Stella Lee, Wild Card）是蓝红两色的三费人类浪客。你每回合放的第二个咒语会额外从牌库顶放逐一张牌给你用；如果你一回合放了三个以上咒语，还能横置她，把一个瞬间或法术再复制一份。喜欢连放小咒语的人会喜欢她。","build":"牌表的核心是一费两费的小抽牌和调牌：抉择（Opt）、注定（Preordain）和浆液预视（Serum Visions）都能帮你安排牌库顶，顺便凑出「第二个咒语」。再度凝神（Refocus）和蔚蓝鬼火（Cerulean Wisps）既便宜又能顺手抽一张，最容易凑到三个咒语好启动主将。新人注意：复制能力要这个回合已经放过三个咒语才能用。"},"Sheoldred, the Apocalypse":{"tagline":"你抽牌我回血，对手抽牌掉血","intro":"启示天灾希欧蕊（Sheoldred, the Apocalypse）是黑色的四费非瑞人。你每抽一张牌就回两点血，而对手每抽一张牌就掉两点血。她既是你的回血机器，也是逼着别人掉血的压力源；配上让全场抽牌的牌，对手很快撑不住。这张主将本身也不便宜。","build":"嚎叫的矿井（Howling Mine）让对手不停抽牌，他们每抽一张就掉两点血，地底幻梦（Underworld Dreams）还会补上伤害；窥探深渊（Peer into the Abyss）让人一次抽掉半个牌库。非瑞克西亚斗技场（Phyrexian Arena）负责你自己的抽牌。新人注意：这套牌会让对手有点难受，别在朋友局头一次就掏出来。"},"Marneus Calgar":{"tagline":"铺小兵换手牌，越打越厚","intro":"白蓝黑的三色主将，自己带先攻和连击，只要你有衍生物进场就抽一张牌，还能花六点法术力一次造两个带警戒的士兵。整套牌走铺场加抽牌，喜欢铺满小兵、手里永远有牌的人会喜欢。","build":"套牌里大部分是造衍生物、再把衍生物换成收益的牌：备忘夹（Skullclamp）能把用不上的小兵换成两张牌，阿士诺的祭坛（Ashnod's Altar）把生物换成法术力，方便继续铺。多放些找地和两费石头，主将五费拍下去才不会太晚。新人要注意，兵铺开之后先让主将继续抽牌，别急着全送掉。"},"Etali, Primal Conqueror // Etali, Primal Sickness":{"tagline":"翻对手的牌，白拿一波法术","intro":"红绿的大恐龙，登场时从每个牌库顶往下翻，翻到的非地牌你可以直接不付费用施放。它翻过身之后带上不灭和毒侵，靠打中对手一点点把人拖死。喜欢翻牌、喜欢拿别人的牌来用的人会喜欢它。","build":"整套牌想做的事是反复让主将进场：龙骑残虐者（Hellkite Courser）能把它从主将区直接拉进场，各种复制咒语也能造出一份新的，每多一次进场就多翻一轮牌。天堂鸟（Birds of Paradise）这类小生物能帮你提前把它拍下去。新人要注意，翻出来的牌挑最合适的那张用就行，不必把每一张都花掉。"},"Fynn, the Fangbearer":{"tagline":"死触小生物，靠毒计数赢","intro":"两费的绿色主将，自己带死触，只要你有死触生物打中对手，对手就多两个毒计数，凑够十个直接输。整套牌就是一群便宜的死触小生物往前压，节奏很快。喜欢用小生物抢攻的人会喜欢它。","build":"组牌思路很简单：把带死触的绿色生物尽量多铺一点，早期就不停打中对手，让毒计数快速堆起来。场上有死触的生物越多，每一次打中的收益越大，所以先铺后打比一味硬冲更稳。新人要注意，毒计数只认战斗伤害，光靠阻挡堆不起来，攻击要果断一点。"},"Tovolar, Dire Overlord // Tovolar, the Midnight Scourge":{"tagline":"狼群夜袭，打中就摸牌","intro":"红绿的三费主将，你有三只以上的狼就会入夜，而只要你的狼打中对手你就能抽牌。另一面能主动把人类狼人翻面，让它们变得更大。适合喜欢快节奏、靠一群生物不停压上去的人。","build":"组牌时把狼和狼人放满，尽量让它们早点聚起来好触发入夜。入夜之后主将能主动把人类狼人翻面，翻过来那一面更大，还能给一只狼加攻击和践踏，所以翻面时机最好挑在自己这回合能打出去的时候。新人要注意，入夜是全场共享的状态，对手的法术也会影响它。"},"Be'lakor, the Dark Master":{"tagline":"恶魔带队，进场就烧血","intro":"蓝黑红的三色恶魔主将，自己会飞，进场时按你场上恶魔的数量抽牌再掉同样多的血，之后每有一只恶魔进场，就能对任意目标造成等于它攻击力的伤害。喜欢大生物压场的人会喜欢它。","build":"套牌主体就是恶魔，恶魔越多主将进场抽得越多，之后每一只新恶魔进场都能顺手点掉对手的小生物。控驭饰符（Talisman of Dominance）这类石头能帮你按时把它拍下来。新人要注意，主将进场抽牌会按恶魔数量掉血，血少的时候先稳住场面，别急着再拍一轮。"},"Lord of the Nazgûl":{"tagline":"法术连发，幽灵越堆越大","intro":"蓝黑主将，本身会飞，你每施放一个瞬间或法术就造一个带威慑的幽灵，幽灵凑够九只以后全体变成九攻九防。整套牌一边丢小法术一边铺幽灵。喜欢一次出很多小法术的人会喜欢它。","build":"组牌重点是压低瞬间和法术的费用，多带抽牌和顺手做事的小牌，比如脑力激荡（Brainstorm）、抉择（Opt），一回合丢出两三个法术就能稳稳铺出幽灵。魔戒呼唤（Call of the Ring）会让幽灵整体变大。新人要注意，幽灵只有凑够九只才集体变大，前期先攒数量，别急着拿去换。"},"Kibo, Uktabi Prince":{"tagline":"人人发香蕉，靠吃神器养猴子","intro":"红绿的三费主将，能不断给所有玩家发香蕉，而对手的神器进坟场时你的猿和猴就各自变大一点。它攻击时对手还得弃掉一个神器。一边拆对手的神器一边把自己的猴子养大。","build":"组牌时大量带能拆神器的牌，让对手的神器不停进坟场，你的猿和猴就会越来越壮。坚固鳞甲（Hardened Scales）能让每次加的指示物再多一个。新人要注意，香蕉是发给所有人的，对手也可能拿它来加速，所以拆神器的节奏不能太慢。"},"Marrow-Gnawer":{"tagline":"老鼠越铺越多，一波带走","intro":"黑色的五费主将，让你的老鼠都带上恐惧，还能牺牲一只老鼠换来一群新老鼠，数量按你场上的老鼠数算。整套牌就是一群老鼠往前冲，越打越多。喜欢便宜小生物的人会喜欢它。","build":"组牌时把老鼠尽量堆满，林鼠群（Pack Rat）能不断复制自己，鼠群魔笛手（Piper of the Swarm）给所有老鼠带上威慑，让对手很难挡住。贫窟霸食人魔（Ogre Slumlord）会在别的生物死掉时补出新的老鼠。新人要注意，主将的异能要牺牲一只老鼠才发动，动手前想好场上还剩几只。"},"Feather, the Redeemed":{"tagline":"法术打自己人，用完再回手","intro":"红白的三费天使，会飞，只要你的瞬间或法术指向自己的生物，结算之后那张牌就回到你手上。整套牌靠反复使用同一批小法术，一边护住主将一边抽牌。喜欢精打细算的人会喜欢它。","build":"组牌重点是那些便宜、能指向自己生物的瞬间：提速咒（Expedite）能给主将敏捷又顺手抽一张，火焰冲拳（Fists of Flame）能在打之前补手牌和践踏。晶石磨工查妲（Zada, Hedron Grinder）能把只指向她的法术复制给全队，暴风窑艺家（Storm-Kiln Artist）每次都会留下宝物。新人要注意，法术一旦指向对手就回不来了。"},"Jon Irenicus, Shattered One":{"tagline":"把麻烦送出去，让对手互相打","intro":"蓝黑的四费主将，每个结束步骤都能把自己的一只生物送给对手，给它加两个指示物、让它必须攻击，而且不能被牺牲。你拥有的生物在别人手里攻击时你还能抽牌。喜欢搅局的人会喜欢它。","build":"组牌时挑那些留在自己场上很碍事、送给对手却更麻烦的生物，再配上宣导（Propaganda）这类让对手不方便打你的牌，把攻击都引到别人身上。底密尔印记（Dimir Signet）能帮你按时拍下主将。新人要注意，送出去的东西就是对手的，别把防守要用的关键生物送走，先送小的。"},"Tivit, Seller of Secrets":{"tagline":"全场投票，票票都有好处","intro":"白蓝黑的三色主将，会飞，而且对手要多付三点法术力才能指定它。它进场或打中对手时全场投票，每一票都会变成你的线索或珍宝。整套牌一边攒神器一边控场，喜欢政治和话术的人会喜欢它。","build":"组牌的核心是把线索和珍宝攒起来再换成别的东西。大学院制造工人（Academy Manufactor）能让每次造线索都三样一起出，攒得快很多；移位幼兽（Displacer Kitten）能反复让主将进场，投票一次接一次。新人要注意，投票是所有人一起决定的，你可以靠多出来的票把结果往自己想要的方向拉。"},"Yurlok of Scorch Thrash":{"tagline":"人人多法术力，浪费就掉血","intro":"红黑绿的三色主将，带警戒，能让所有玩家一次性加上三点法术力，但谁没花完，剩下的就会变成伤害。整套牌靠给所有人堆法术力，看谁先撑不住。喜欢在牌桌上制造混乱的人会喜欢它。","build":"组牌时多放给所有玩家加法术力的牌，让每一回合的法术力都多得用不完，对手一犹豫就会掉血。放干鲜血（Exsanguinate）这类按对手血量结算的终结牌，能在对局后期一次把血线拉开。新人要注意，主将的异能两边都受益，自己也要算清楚每回合能花掉多少，节奏慢下来对你不利。"},"Hylda of the Icy Crown":{"tagline":"冻住对手的生物，换成好处","intro":"白蓝的四费主将，只要你横置了对手一只原本未横置的生物，就可以付一点法术力，换来一只大元素、全队指示物，或者占卜加抽牌。整套牌把对手的生物一直按住。喜欢控场的人会喜欢它。","build":"组牌时大量带能横置对手生物的牌，把对手的主力一直按住，主将的异能就能反复触发，越到后期收益越大。冰河要塞（Glacial Fortress）这类双色地能让白蓝两边的牌都顺畅打出来。新人要注意，主将的能力每次都要另外付一点法术力，手上要留些费用，别每回合都花得干干净净。"},"Zedruu the Greathearted":{"tagline":"把东西送给对手，换成牌和血","intro":"白蓝红的三色主将，每回合开始时按你送给对手的永久物数量抽牌回血，还能花三点法术力把自己的一样永久物送给对手。整套牌靠送东西换收益，一边拖住对手。喜欢玩心理战的人会喜欢它。","build":"组牌时要挑那些送出去对你没损失、甚至对你有利的永久物，一边送一边让主将每回合都在抽牌回血，送得越多每回合收益越大，慢慢就把牌差拉开了。魂魅拘禁（Ghostly Prison）、宣导（Propaganda）能让对手打你要额外付费，帮你拖到后期。新人要注意，送出去的牌对手是能用的，别把太好用的东西送出去。"},"Arahbo, Roar of the World":{"tagline":"一群猫往前冲，越打越大","intro":"白绿的五费主将，即使它待在主将区，你的猫每回合开打前也会有一只加三点攻防；其他猫攻击时你还能付费用让它们带上践踏。整套牌就是一群猫不停往前冲。喜欢上手简单的套牌的人会喜欢它。","build":"组牌就是把好用的猫尽量放满，让每回合都有人吃得到主将给的加成。威严狞猫（Regal Caracal）、灵猫君王（Feline Sovereign）这类给全队加攻防的猫，能让整群猫一起变大。新人要注意，主将的加成每回合只有一只猫吃得到，尽量挑身材最大的那只，别让小的先吃。"},"Thalia and The Gitrog Monster":{"tagline":"地上加快，对手进来要用躺的","intro":"白黑绿的四费主将，带先攻和死触，每回合能多打一张地，而对手的生物和非基本地进场时都是横置的。整套牌围绕地牌做文章，一边抢节奏一边铺场。喜欢慢慢磨、靠资源取胜的人会喜欢它。","build":"组牌的关键是让地持续进场：拉慕拿开挖人（Ramunap Excavator）让你能从坟场再打地，噬人蛙怪（The Gitrog Monster）同样如此，每回合多打的地都能变成收益。硬盔虫聚群（Scute Swarm）会随每次地进场不断长出新的虫，场面很容易一下子铺开。新人要注意，主将攻击时要牺牲一个生物或一张地。"},"Derevi, Empyrial Tactician":{"tagline":"横一只竖一只，把节奏拿在手里","intro":"白蓝绿的三色主将，会飞，进场时和你的生物打中对手时都能横置或重置一个永久物，还能花四点法术力从主将区反复回到场上。整套牌靠不断横竖永久物来掌控节奏。喜欢精细操作的人会喜欢它。","build":"组牌时多带能从横置和重置里拿到好处的牌，莳花师（Bloom Tender）和仙林境接骨木（Faeburrow Elder）都按你场上颜色的数量产法术力，重置它们就等于多出一轮费用。街头监哨德雷尼（Delney, Streetwise Lookout）能让小生物的触发式异能多触发一次。新人要注意，横置对手的关键永久物往往比重置自己更赚。"},"Ovika, Enigma Goliath":{"tagline":"每放一个法术，就多一群鬼怪","intro":"蓝红的七费大生物，会飞，你每施放一个非生物咒语，就按它的法术力值造出同样数量的鬼怪，而且当回合就能攻击。整套牌靠连续丢非生物咒语铺出一大波鬼怪。喜欢一次铺满场面的人会喜欢它。","build":"组牌时把非生物法术放得多一些，法术力值越高的咒语造出的鬼怪越多，所以别怕放大牌。冲击震颤（Impact Tremors）会在每个鬼怪进场时顺手给对手来一下，同仇敌忾（Shared Animosity）能让攻击的鬼怪整体变大。司克探矿者（Skirk Prospector）可以把多余的鬼怪换成法术力。新人要注意，主将七费不便宜，前期得先把地铺顺。"},"Saruman, the White Hand":{"tagline":"法术养出一支兽人大军","intro":"蓝黑红的四费主将，你每施放一个非生物咒语，就在兽人军团上叠等同其法术力值的指示物，你场上的鬼怪和兽人还都带上护持。整套牌一边放法术一边把军团养大。喜欢慢慢积累的人会喜欢它。","build":"组牌时把非生物法术铺满，每一个咒语都会让军团变大一点，攒到后期就是一个很难处理的巨兽。巴拉督尔（Barad-dûr）在有传奇生物时能直接产黑，后期还能继续把军团养大；渎神行径（Blasphemous Act）能在中盘一次清掉对手的小生物。新人要注意，军团只有一个，别把全部希望都压在它身上。"},"Umbris, Fear Manifest":{"tagline":"把对手的牌放逐，自己越变越大","intro":"蓝黑的五费主将，对手在放逐区每多一张牌它就大一点，而它和其他惊惧兽、惊骇生物进场时，会让对手从牌库顶一张张翻到地牌为止全部放逐。整套牌靠放逐对手的牌把它养大。喜欢慢磨的人会喜欢它。","build":"组牌时多放磨牌和放逐的牌，塔莎狂笑术（Tasha's Hideous Laughter）一次就能放逐掉一大堆，致狂杂音（Maddening Cacophony）也能成片地磨。纳噶斯罗船长（Captain N'ghathrod）会给你的惊骇生物带上威慑，还能源源不断地磨对手。新人要注意，主将的攻击力完全取决于对手放逐区的牌数，磨牌和打人是同一件事。"},"Orvar, the All-Form":{"tagline":"法术点自己人，就多一份复制","intro":"蓝色的四费变形兽，你每次施放指向自己其他永久物的瞬间或法术，就能复制其中一个永久物。整套牌靠一堆便宜的小法术不断复制自己的永久物，越复制越多。喜欢把简单的小牌玩出花样的人会喜欢它。","build":"组牌时多放只花一点点费用、能指向自己永久物的瞬间，这些牌在奥瓦尔面前等于一次复制。蓝宝石徽章（Sapphire Medallion）能让蓝色咒语都便宜一点，荣休大法师（Archmage Emeritus）会在你每次施放瞬间或法术时抽一张牌，古语术士（Archaeomancer）则能把用过的法术拿回手上。新人要注意，复制要先有值得复制的永久物。"},"Veyran, Voice of Duality":{"tagline":"一个小法术，触发两次好处","intro":"蓝红的三费主将，你施放或复制瞬间和法术时它会变大，而且它会让这些咒语触发的异能额外再触发一次。整套牌靠密集地丢瞬间和法术来滚雪球。喜欢连环出牌、越打越顺的人会喜欢它。","build":"组牌时把瞬间和法术塞满，费用越低越好，沉思（Ponder）、抉择（Opt）这类小牌既帮你找牌又能触发主将。贫窟伏击客（Guttersnipe）每被你触发一次就打对手两点，有了主将就是四点；暴风窑艺家（Storm-Kiln Artist）每次触发都留下宝物。新人要注意，前期先把主将和烧血源摆好，别急着把手上牌全丢出去。"},"Gonti, Canny Acquisitor":{"tagline":"打中一次，偷对手一张牌","intro":"蓝黑绿的三色主将，你的生物打中对手时，你可以看对手牌库顶那张并面朝下放逐，之后随时用任意颜色的法术力把它打出来，而且不是你拥有的咒语都便宜一点。喜欢用别人的牌打赢的人会喜欢它。","build":"组牌时多放不容易被挡的小生物，蛇身刀客（Slither Blade）、岸袭屈东（Triton Shorestalker）都自带不可被阻挡，能稳定地每回合偷一张牌。恶邪枭（Baleful Strix）会飞还带死触，既能挡又能顺手抽一张。新人要注意，偷来的牌埋在放逐区，用什么颜色的法术力都行，但别拖太久忘了用。"},"Child of Alara":{"tagline":"它一死，全场清空重来","intro":"五色的主将，带践踏，它一死就会把所有非地永久物全部消灭。整套牌自己带一张随时能引爆的清场，场面对你不利时让主将死掉就能直接翻盘。喜欢大范围控场、把局面推倒重来的人会喜欢它。","build":"组牌时要注意，主将一死会连你自己的东西一起清掉，所以关键永久物要挑那些能在坟场里继续起作用的，或者干脆少依赖场面。云游者梓纱（Azusa, Lost but Seeking）能在清场之后让你一口气补回好几张地，把节奏重新拉起来；世界树（The World Tree）能让地都产任意颜色。新人要注意，别在主将死掉那回合才想起自己场上也有东西。"},"Sliver Overlord":{"tagline":"裂片妖越聚越多，全体一起变强","intro":"五色的主将，能花三点法术力从牌库找出任意一张裂片妖，也能花三点抢走别人的裂片妖。裂片妖每多一只，全体就多一份能力。整套牌靠不断找出合适的裂片妖，把整群越堆越强。喜欢整齐划一的打法的人会喜欢它。","build":"组牌时把各司其职的裂片妖都备上一份：需要法术力找灿衣裂片妖（Gemhide Sliver），需要保护找水晶裂片妖（Crystalline Sliver），需要穿透找御风裂片妖（Galerider Sliver），主将就像一个随叫随到的工具箱。新人要注意，主将的异能要花法术力，别把它当成免费的导师一直用。"},"Dihada, Binder of Wills":{"tagline":"翻传奇牌，进坟场的换成宝物","intro":"白黑红的四费鹏洛客主将，加忠诚能护住一只传奇生物，减忠诚则翻四张牌，把传奇牌挑进手里、其余进坟场并换成宝物。整套牌围绕传奇永久物做文章。喜欢翻牌、把坟场当资源的人会喜欢它。","build":"组牌时把传奇牌尽量放满，这样每次翻牌都能挑到东西，翻空的牌也能变成宝物帮你加速。潜探灾祸夏义德（Shanid, Sleepers' Scourge）能让传奇生物都带上威慑，还能源源不断地抽牌；月主会元帅欧吉克（Odric, Lunarch Marshal）会把一只传奇生物身上的关键词分享给全队。新人要注意，减忠诚是往前冲的关键手段。"},"Ziatora, the Incinerator":{"tagline":"扔一只生物出去，换三个宝物","intro":"红黑绿的六费主将，会飞，每回合结束时可以牺牲另一只生物，造成等于它攻击力的伤害，同时换来三个宝物。整套牌靠大生物加牺牲来打脸。喜欢用巨大生物换伤害、打法直接的人会喜欢它。","build":"组牌时要多放攻击力高、代价又不心疼的生物，雅骨尔与穆塔尼（Yargle and Multani）这种身材夸张的生物扔一次就够对手疼很久。勤工联霸权（Riveteers Ascendancy）能在每次牺牲之后把坟场里一只更小的生物拉回场上，等于每回合都有东西可以扔。新人要注意，主将每回合只能牺牲一只，别把场面一次性全换掉。"},"Clavileño, First of the Blessed":{"tagline":"吸血鬼死了，反而留下更大的","intro":"白黑的三费主将，你每次攻击时可以让一只攻击中的吸血鬼额外变成恶魔，并让它死后能抽一张牌、再留下一只带飞行的大吸血鬼。整套牌靠牺牲自己的吸血鬼换更大的收益。喜欢牺牲流打法的人会喜欢它。","build":"组牌时把便宜的吸血鬼尽量堆满，热忱吸血鬼（Cordial Vampire）会在每次生物死掉时给所有吸血鬼加指示物，放纵豪族（Indulgent Aristocrat）牺牲生物同样能让全队变大，两者配合主将死后留生物的能力，越换越赚。军团尉官（Legion Lieutenant）给全队加攻防。新人要注意，攻击前先想好这回合要牺牲谁再动手。"},"Ob Nixilis, Captive Kingpin":{"tagline":"对手掉一点血，你就多一张牌","intro":"红黑的四费恶魔，会飞带践踏，只要有一个对手正好掉一点血，它就变大一点，还能从牌库顶放逐一张牌让你当回合用掉。整套牌靠反复制造一点伤害来滚雪球。喜欢以小博大的人会喜欢它。","build":"组牌时多放能每次只造成一点伤害的牌，奇登磊寄生怪（Kederekt Parasite）、尖头锐器人（Razorkin Needlehead）会在对手抽牌时点他一点，凯锡革喷焰师（Kessig Flamebreather）则在你每次施放非生物咒语时打全场各一点。新人要注意，主将只认一点伤害，一次打两点不会触发，所以小伤害要多、大伤害留到关键回合。"},"Rakdos, Lord of Riots":{"tagline":"先打出血，再免费放大生物","intro":"红黑的四费恶魔，会飞带践踏，只有当有对手本回合掉过血你才能施放它，而它会让你的生物咒语按对手本回合掉的血量便宜下来。整套牌先点对手一点血，再一口气放出大生物。喜欢爆发式铺场的人会喜欢它。","build":"组牌时多放成本低、每回合都能点对手血的牌，热力炼金术士（Thermo-Alchemist）和匍行吸血怪（Creeping Bloodsucker）都能在回合开始时直接让对手掉血，主将的减免就会一层层叠上去；符痕恶魔（Rune-Scarred Demon）这类高费大生物在减免够多时几乎能免费登场。新人要注意，手上要留几张能开路的牌。"},"Narset, Enlightened Exile":{"tagline":"攻击就从坟场白捡一张咒语","intro":"受启黜人娜尔施（Narset, Enlightened Exile）是白蓝红三色的四费修士。你每放一张非生物咒语，自家生物就一起变大一点；她一攻击，还能从坟场里挑一张费用不大的非生物牌，免费再用一次。喜欢一口气连放很多小咒语的人会喜欢它。","build":"寺院明师（Monastery Mentor）在你放非生物咒语时不停给你小修士，思绪旋风（Whirlwind of Thought）让每张咒语都顺手抽一张牌，狂搜乱寻（Frantic Search）既补手牌又把地重新立起来。流放之径（Path to Exile）负责清理挡路的大生物。新人注意：她的本事只在攻击时发挥，别让她单独冲上去。"},"Raffine, Scheming Seer":{"tagline":"一攻击就抽牌换牌，顺便变大","intro":"卜策魔拉斐茵（Raffine, Scheming Seer）是白蓝黑三色的三费斯芬克斯，会飞，还带着一点护身。她一攻击，就让一只攻击中的生物先抽若干张牌、再弃同样多的牌，每弃掉一张非地牌，那只生物就长一格。喜欢一边打人一边整理手牌的人会喜欢它。","build":"华辉护教军艾德琳（Adeline, Resplendent Cathar）攻击时带出一堆小兵，让拉斐茵一次能看更多牌；依法尼大恶魔（Archfiend of Ifnir）在你弃牌时给对手全场生物放小指示物。活尸法（Reanimate）和生体活祭（Victimize）把弃掉的大生物直接拉回场。新人注意：弃牌在这里是好事，但别把关键牌全扔掉。"},"Ojer Axonil, Deepest Might // Temple of Power":{"tagline":"一点小伤害都变成一大下","intro":"深邃勇力安雄理尊神（Ojer Axonil, Deepest Might）是红色的四费神。它的本事很特别：你红色来源对对手造成的非战斗伤害，只要不足它的力量，就一律按它的力量算，所以小伤害会变成一大下。喜欢用便宜小法术不停扎对手的人会喜欢它。","build":"焰箭弓手（Firebrand Archer）和凯锡革喷焰师（Kessig Flamebreather）在你每放一张非生物咒语时就扎对手一下；地壳灾害（Tectonic Hazard）一张就能扎到每位对手和他家小生物。红宝石徽章（Ruby Medallion）让红色咒语更便宜。新人注意：这些伤害全靠非生物咒语触发，手牌空了就哑火。"},"Vihaan, Goldwaker":{"tagline":"宝物一转眼就变成打人的刺客","intro":"醒金师威翰（Vihaan, Goldwaker）是白黑红三色的三费矮人。你场上的宝物在战斗前可以一起变成 3/3 的刺客生物，打完再变回宝物；自家的刺客、海盗这类伙伴还会获得警戒与敏捷。喜欢先攒一堆宝物、再一口气全冲出去的人会喜欢它。","build":"索尔石怪（Xorn）让每次造宝物都多造一个，货棚老板马哈迪（Mahadi, Emporium Master）在回合结束时按本回合死掉的生物数量给你宝物，冷酷袭劫者（Pitiless Plunderer）也在自家生物死掉时补宝物。破相好手（Professional Face-Breaker）打中对手就造宝物。新人注意：宝物留到能一起冲的那回合再用。"},"The Gitrog Monster":{"tagline":"地进坟场就抽牌，地越打越多","intro":"噬人蛙怪（The Gitrog Monster）是黑绿两色的五费巨蛙，带死触。它每回合能多放一块地，代价是维持时得牺牲一块地；只要有任何地牌进坟场，你就抽一张牌。喜欢用一块地换一张牌、把坟场当地窖用的人会喜欢它。","build":"拉慕拿开挖人（Ramunap Excavator）让你能从坟场里继续放地，黑土滋壤（Life from the Loam）一次把三块地拿回手上，林间救护人（Sylvan Safekeeper）牺牲地来保护自家生物，牺牲掉的地又变成抽牌。杀手留念（Assassin's Trophy）负责解决难缠的永久物。新人注意：维持时的牺牲是强制的，别把地全用光。"},"Lord Windgrace":{"tagline":"从坟场捞地，地盘越铺越大","intro":"风华领主（Lord Windgrace）是黑绿红三色的五费鹏洛客，可以当主将。它能让你一边换手牌一边把地送进坟场，再花忠诚把坟场里的地直接放回场上；攒够忠心，它还能一次炸掉对手一堆永久物，顺便给你一群猫战士。喜欢慢慢攒资源的人会喜欢它。","build":"云游者梓纱（Azusa, Lost but Seeking）让你一回合多放两块地，拉慕拿开挖人（Ramunap Excavator）让你直接从坟场放地，绚烂复生（Splendid Reclamation）一次把坟场里的地全放回来。赞迪卡复仇者（Avenger of Zendikar）靠地多带出一群植物收尾。新人注意：主将不是生物，要靠别的办法保护它。"},"Jetmir, Nexus of Revels":{"tagline":"场上人越多，全队越猛","intro":"欢宴魔杰米尔（Jetmir, Nexus of Revels）是白红绿四色的猫魔。它给自家全队加成，而且你场上的生物越多，加成越强：三只时全队带警戒，六只时再加上践踏，九只时连双击都有。喜欢一口气铺出一大桌小生物、再整体压过去的人会喜欢它。","build":"华辉护教军艾德琳（Adeline, Resplendent Cathar）和锡街头目克仑可（Krenko, Tin Street Kingpin）都能在攻击时不断带出新兵，很快把人数凑到九只以上。渐强终响（Grand Crescendo）一次给你一群小兵，还让全队这回合不会被打死。新人注意：数量只看你自己场上的生物，别把对手的算进去。"},"Rocco, Cabaretti Caterer":{"tagline":"多花一点费，就多找一只大生物","intro":"乐舞会主厨罗孔（Rocco, Cabaretti Caterer）是白红绿三色的主厨，你多付几点费，它就能从牌库找出更大一点的生物。它进场时能从牌库里直接挑一只生物放进场，等于每局都能按需要点菜。喜欢留一手、随时找对答案的人会喜欢它。","build":"天堂鸟（Birds of Paradise）和不朽见证人（Eternal Witness）都是便宜又好用的小菜，前者帮你出各种颜色的费，后者把用过的牌拿回手上。迎宾吸血鬼（Welcoming Vampire）在你放小生物时抽牌。新人注意：罗孔只有被施放时才会找出生物，用别的办法放进场就没这份好处；X 选太大容易空过一回合。"},"Nicol Bolas, the Ravager // Nicol Bolas, the Arisen":{"tagline":"先让对手弃牌，再变身成大魔王","intro":"烈龙尼可波拉斯（Nicol Bolas, the Ravager）是蓝黑红四费的巨龙，会飞，进场时每位对手都要弃一张牌。它还能花法术力变身成鹏洛客，用忠诚能力抽牌、点杀生物，甚至挖走坟场里的生物。喜欢用大龙压场、爱捣乱对手手牌的人会喜欢它。","build":"恶源重生（The Eldest Reborn）会逼每位对手牺牲一个生物或鹏洛客，还从坟场里挖一只生物给你。龙尊尼可波拉斯（Nicol Bolas, Dragon-God）也是同一路数的伙伴，能逼对手弃牌或放逐手牌。积水墓地（Watery Grave）和血腥墓穴（Blood Crypt）帮你把三色铺稳。新人注意：主将费用偏重，前期别急着上手。"},"Omnath, Locus of Mana":{"tagline":"没花掉的绿费，都变成它的个头","intro":"魔力核欧那斯（Omnath, Locus of Mana）是绿色的三费元素。未花掉的绿色法术力在步骤结束时不会消失，可以一直留到需要时再用；它自己每有一点没花的绿费就 +1/+1。喜欢把法术力攒成一座山、再一口气花掉的人会喜欢它。","build":"罗堰妖精（Llanowar Elves）和妖精秘教徒（Elvish Mystic）这类一费小妖精早早就能产绿费；复归荒野（Wilderness Reclamation）在你回合结束时把地全部立起来，苗生谬思（Seedborn Muse）更是让每个别人的回合你都能再用一次自己的地。新人注意：只有主将在场时才留得住绿费，它一走，攒的法术力就没了。"},"Chulane, Teller of Tales":{"tagline":"每放一只生物，抽一张牌再放一块地","intro":"说书人楚兰（Chulane, Teller of Tales）是白蓝绿三色的五费德鲁伊，带警戒。你每放一只生物，它就让你抽一张牌，还能顺手把手上的一块地直接放进场；它自己也能花费用把自家生物收回手上。喜欢一直有牌有地、节奏顺的人会喜欢它。","build":"悲鸣龙兽（Shrieking Drake） 和 白鬃狮（Whitemane Lion） 进场时要先把你的一只生物收回手上，于是可以反复重放，让楚兰一次次抽牌铺地。莲花眼镜蛇（Lotus Cobra）让你每次放地都补一点费，深洋德鲁伊塔托娃（Tatyova, Benthic Druid）让地进场时回血抽牌。新人注意：收回手上再放要花钱，前期别把费用全花光。"},"Roxanne, Starfall Savant":{"tagline":"进场和攻击都带一颗陨石","intro":"落星学者罗珊妮（Roxanne, Starfall Savant）是红绿两色的五费猫德鲁伊。她进场或攻击时都会留下一个陨石，陨石进场就打任意目标 2 点，自己还能产一点任意颜色的费；你敲宝物产费时还会多拿一点。喜欢铺宝物又爱砸人的人会喜欢它。","build":"万和琴（Panharmonicon）让陨石进场时的伤害触发两次，二度收获（Second Harvest）把场上的陨石一次翻倍。众我长剑（Blade of Selves）装上主将后能让它多出几个攻击中的复制体，每个都再带一颗陨石，陨石一多还能顺手砸掉对手的小生物。新人注意：陨石进场时是横着的，想立刻产费得先把它立起来。"},"Shalai and Hallar":{"tagline":"每加一个指示物，就痛一下对手","intro":"莎黎与贺拉尔（Shalai and Hallar）是白红绿四色的天使与妖精搭子，会飞，还带警戒。你每次往自家生物身上放 +1/+1 指示物，它们就让一位对手掉等量的血，所以往自家生物身上加料就等于直接打人。喜欢把生物越养越大的人会喜欢它。","build":"遗世先人（Forgotten Ancient）在你放咒语时不断积攒 +1/+1 指示物，坚固鳞甲（Hardened Scales）让每次放指示物都多放一个。振奋呼号（Inspiring Call）按自家带指示物的生物数量抽牌，还让它们这回合不会被打死。新人注意：它们自己是飞行的打手，但真正磨人的是一下一下的掉血。"},"Queza, Augur of Agonies":{"tagline":"每抽一张牌，对手就掉一点血","intro":"苦痛占师桂莎（Queza, Augur of Agonies）是白蓝黑四色的章鱼谋士。你每抽一张牌，就有一位对手掉 1 点血、你回 1 点血，所以在这里抽牌本身就是打人。喜欢用手牌优势慢慢磨、让对手一点点掉血的人会喜欢它。","build":"变态爬虫（Psychosis Crawler）让每次抽牌变成全体对手掉血，泰菲力的永恒洞察（Teferi's Ageless Insight）把每张抽牌都变成抽两张。窥探深渊（Peer into the Abyss）让一位对手抽半副牌、掉一半血。新人注意：抽得太快会把牌库抽干，实验室狂人（Laboratory Maniac）能把这种意外变成获胜。"},"Dina, Soul Steeper":{"tagline":"你回一点血，对手就掉一点","intro":"浸灵迪娜（Dina, Soul Steeper）是黑绿两色的两费树灵德鲁伊，费用很轻。你只要回一点血，每位对手就掉 1 点血，所以回血在这里等于打人；它还能牺牲自家生物，按那只生物的力量把自己变大。喜欢用小生物换血、慢慢把对手耗掉的人会喜欢它。","build":"鲜血画家（Blood Artist）和筑拉波割喉客（Zulaport Cutthroat）在生物死掉时让你回血，顺势触发迪娜让对手掉血；护华师（Essence Warden） 在你放生物时回血，祝亡士（Deathgreeter） 在生物死掉时回血。林地墓园（Woodland Cemetery）这类地帮你把黑绿两色铺稳。新人注意：一下只掉 1 点，别指望很快解决人。"},"Jodah, Archmage Eternal":{"tagline":"再贵的咒语，都只收五色各一点","intro":"永世大法师裘达（Jodah, Archmage Eternal）是五色的四费法师，会飞。它让你改用白蓝黑红绿各一点来付任何咒语，所以那些平时根本放不起的贵牌突然都放得起了。喜欢一上来就砸大牌、喜欢五色大杂烩的人会喜欢它。","build":"毁坏通牒（Ruinous Ultimatum）能一次清光对手所有非地永久物，聚流（Conflux）从牌库找出五色各一张牌进手。五阳护手（Fist of Suns）是备用的第二份同款本事，天堂鸟（Birds of Paradise）和仙林境接骨木（Faeburrow Elder）负责凑齐五色。新人注意：五色地不齐就什么也放不出，前期先把颜色铺好。"},"Tatyova, Benthic Druid":{"tagline":"每放一块地，就回血抽一张","intro":"深洋德鲁伊塔托娃（Tatyova, Benthic Druid）是蓝绿两色的五费人鱼德鲁伊。每当有一块地在你场上进场，你就回 1 点血并抽一张牌，所以它一到场，铺地就变成了铺牌。喜欢地越铺越多、手牌永远有货的人会喜欢它。","build":"云游者梓纱（Azusa, Lost but Seeking）让你一回合多放两块地，成长涡旋（Growth Spiral）这类咒语也能多放一块地并顺手抽牌。莽闯巴洛西（Rampaging Baloths）和赞迪卡复仇者（Avenger of Zendikar）靠地多产出一群生物收尾。新人注意：主将费用不低，先靠便宜的地法术把地铺开。"},"Mirko, Obsessive Theorist":{"tagline":"看牌库顶、扔坟场，再把生物挖回来","intro":"偏执理论家梅可（Mirko, Obsessive Theorist）是蓝黑两色的三费吸血鬼侦探，会飞带警戒。你每次刺探（看牌库顶牌，决定留或扔）都会让它变大；每回合结束还能从坟场挖回一只比自己小的生物。喜欢慢慢筛牌、把坟场当资源的人会喜欢它。","build":"毁灭低语魔（Doom Whisperer）可以付血反复刺探，详加考虑（Consider） 也是便宜好用的刺探牌，都能让梅可很快长大；它越大，能挖回来的生物就越强。活尸法（Reanimate）用来把坟场里的大生物直接拉回场，沉落幽谷（Sunken Hollow）这类地帮你把蓝黑两色铺稳。新人注意：只能挖回力量比它小的生物，先把它养大再动手。"},"The Mycotyrant":{"tagline":"坟场堆得越厚，蘑菇大军越大","intro":"智蕈暴君（The Mycotyrant）是黑绿两色的三费蘑菇，带践踏。它的力量与防御力看自家有多少真菌和腐生物，所以蘑菇越多它越大；每回合结束，它还按你当回合往坟场里送过几张牌，给你一群不能挡的小蘑菇。喜欢一边堆坟场一边铺场的人会喜欢它。","build":"真菌洛西（Mycoloth）会不断给你新的蘑菇；占颅先知（Skull Prophet） 能磨牌又能产黑绿费，牌进坟场就等于当回合白拿更多小蘑菇。黑森林蝙蝠（Mirkwood Bats）在你造出或牺牲小蘑菇时扎对手，备忘夹（Skullclamp）把用不上的小蘑菇换成两张牌。新人注意：小蘑菇不能挡，它们只负责长大和进攻。"},"Hazezon, Shaper of Sand":{"tagline":"沙漠一块接一块，沙兵越铺越多","intro":"塑砂师哈泽忠（Hazezon, Shaper of Sand）是白红绿三色的三费战士。你每有一块沙漠地进场，它就给你两只沙兵；它还能让你直接从坟场把沙漠地放回场上，等于同一块沙漠可以反复用。喜欢铺小兵海、又爱在地牌上做文章的人会喜欢它。","build":"哈什普绿洲（Hashep Oasis） 和 谢菲沙丘（Shefet Dunes） 这类沙漠进了坟场还能被哈泽忠重新放出来，每回来一次就带两只沙兵；拉慕拿遗迹（Ramunap Ruins） 可以牺牲一块沙漠，让每位对手掉 2 点血。馏木荒地（Creosote Heath） 进场时顺手扎对手一点，沙丘吟颂师（Dune Chanter） 更让你家所有地都算沙漠。新人注意：不少沙漠只能产一点费或要付血，前期别只顾着凑沙漠。"},"Reaper King":{"tagline":"稻草人一个个进场，对手的牌一张张没","intro":"夺命王者（Reaper King）是五色的十费稻草人，费用很高。你每有另一个稻草人进场，它就能炸掉场上一张牌，自家的稻草人还一起变大。所以这套牌靠不断往场上放稻草人，把对手的地、生物、神器一个个点掉。喜欢用冷门生物类型玩花样的人会喜欢它。","build":"覆面林连结点（Maskwood Nexus）让自家所有生物都算稻草人；境域行者（Realmwalker）本身什么生物类型都算。万和琴（Panharmonicon）让你放稻草人时炸两张牌。急跑草人（Scuttlemutt） 和 绿洲园丁（Oasis Gardener） 是最便宜的稻草人，负责早早把主将喂出来。新人注意：主将费用高，前几回合要靠便宜稻草人和地撑住。"},"Marvo, Deep Operative":{"tagline":"比大小赢了，就免费放一张咒语","intro":"深洋密探玛沃（Marvo, Deep Operative）是蓝黑两色的五费章鱼。它攻击时和防守的对手各翻开牌库顶一张牌比费用，赢了你就抽一张牌，还能从手上免费放一张费用 8 以下的咒语。喜欢赌点运气、又想放贵牌的人会喜欢它。","build":"脑力激荡（Brainstorm）能把手上用不上的贵牌放回牌库顶，正好帮你比大小赢；探究深水（Research the Deep） 这类咒语赢下比大小后会回到手上，可以反复用。多重宇宙加身（One with the Multiverse）让你直接从牌库顶放咒语。新人注意：玛沃的本事只在攻击时发动，得让它打得进去。"},"Norin the Wary":{"tagline":"主将进进出出，每次回来都扎人","intro":"谨慎的诺林（Norin the Wary）是红色的一费人类战士。只要有人放咒语或有人攻击，它就吓得躲出去，然后在回合结束时自己回来，所以它一回合能进进出出好几次。这套牌就是围着它这些反复的进场做文章。喜欢又吵又乱的小快牌的人会喜欢它。","build":"冲击震颤（Impact Tremors）和 熔锻神普罗烽斯（Purphoros, God of the Forge） 在自家生物进场时扎每位对手，诺林每回来一次就触发一次。创生秘室（Genesis Chamber） 在非衍生物进场时给你一个小兵。渎神行径（Blasphemous Act）负责清场，那时诺林早就躲出去了。新人注意：它几乎从不留在场上，别指望它自己打人。"},"Gargos, Vicious Watcher":{"tagline":"多头龙便宜四费，还替你打架","intro":"卫护恶龙加戈斯（Gargos, Vicious Watcher）是绿色的六费多头龙。你放多头龙类生物时少付四点费，靠多付法术力长大的大家伙来得比想象中快；自家生物被人指定为目标时，它还会替你咬对手的生物。喜欢一次放一只超大多头龙的人会喜欢它。","build":"贪餮多头龙（Voracious Hydra）和饥渴多头龙（Hungering Hydra）都是按 X 长大的多头龙，被加戈斯减费后能进得更大；原初多头龙（Primordial Hydra）每次自己回合开始都把身上的指示物翻倍。贾路的反抗（Garruk's Uprising）让全队获得践踏。新人注意：减费只对多头龙生效，别的生物照样原价。"},"Athreos, God of Passage":{"tagline":"死掉的生物，要么回手要么让对手掉血","intro":"渡亡神雅睿欧斯（Athreos, God of Passage）是白黑两色的三费神。自家的生物死掉时，它会给对手一个选择：要么那位对手付 3 点血，要么你把那只生物拿回手上重放一次。它平时不算生物，清场弄不掉它。喜欢反复利用小生物的人会喜欢它。","build":"影裔宗徒（Shadowborn Apostle） 是这套牌的核心，牺牲六只同名同伴就能从牌库找一只恶魔直接放进场，配 嗡响碑石（Thrumming Stone） 能一张接一张连放；逸界僧（Edgewalker） 让这类小传教士的费用变得极便宜。永生效命（Immortal Servitude） 能把坟场里一整批同费生物一次全拉回来。新人注意：自家黑白永久物够多时它才算生物，别指望它去挡。"},"Toxrill, the Corrosive":{"tagline":"对手的生物一点点缩小、然后死掉","intro":"腐蚀蝓怪陀袭力（Toxrill, the Corrosive）是蓝黑两色的七费大蝓。每回合结束它给对手的每只生物放一个黏液指示物，黏液越多就越小，很多小生物会直接死掉，死掉还变成你的小蝓。这套牌会让对手有点难受，别在朋友局里第一次就掏出来。","build":"黑暗祭礼（Dark Ritual）能一次给你三点黑费，底密尔印记（Dimir Signet）帮你把蓝黑地铺稳，好早点把主将放出来。敲击鸟（Thrummingbird）打中对手后能让场上已有的指示物再多一个，黏液会越堆越多；泥泞怪物（Sludge Monster） 额外加黏液并让对手生物失去所有异能。新人注意：主将七费，前期先忍住，把地铺好。"},"Arna Kennerüd, Skycaptain":{"tagline":"装备越贴越多，攻击时还会翻倍","intro":"空骑士队长亚娜肯吕德（Arna Kennerüd, Skycaptain）是白蓝黑三色的五费骑士，会飞带系命。自家贴着装备或带指示物的生物一攻击，它的指示物就翻倍，贴着的装备还会自动复制一份。喜欢给一只生物贴满装备、越打越夸张的人会喜欢它。","build":"资深建筑师斯勒姆（Sram, Senior Edificer）和净钢神圣武士（Puresteel Paladin）在你放装备时抽牌，越贴牌越顺。闪光宝物（All That Glitters）按你场上的神器与结界数量给生物加成，先贤披风（Mantle of the Ancients）能把坟场里的装备全捞回来。新人注意：装备不会自己变强，要先贴到生物身上。"},"Raggadragga, Goreguts Boss":{"tagline":"会产费的生物，全变成打手","intro":"蛮血帮首脑拉噶达噶（Raggadragga, Goreguts Boss）是红绿两色的四费野猪人。自家会产费的小生物都额外 +2/+2，攻击时会被立起来，能再用一次产费；花掉七点以上法术力，它就能把一只生物灌大。喜欢小妖精也能打人的人会喜欢它。","build":"罗堰妖精（Llanowar Elves）这类一费小妖精在它手下都变成 3/3 打手；培育人玛雯（Marwyn, the Nurturer）能一次产出一大堆绿费，暗碧族接合工（Viridian Joiner） 也按自己的力量产费。荒野韵律（Rhythm of the Wild）让自家生物不会被反击。新人注意：只有会产费的生物才有加成，别的它不管。"},"Minsc & Boo, Timeless Heroes":{"tagline":"带一只仓鼠，随时能扔出去砸人","intro":"历时英雄明斯克与布布（Minsc & Boo, Timeless Heroes）是红绿四费的鹏洛客。它进场和每个维持都给你一只带践踏、敏捷的仓鼠布布；它能让带践踏或敏捷的生物多三个 +1/+1 指示物，也能牺牲生物砸任意目标。喜欢又大又闹的人会喜欢它。","build":"遗世先人（Forgotten Ancient）和坚固鳞甲（Hardened Scales）能不断往自家生物身上加指示物，布布拿得到就越来越凶；牛身虐杀兽（Taurean Mauler） 也会随对手放咒语自己长大。投掷（Fling） 是把大生物扔出去砸人的同款手段，渎神行径（Blasphemous Act）用来清理场面。新人注意：牺牲仓鼠砸人时还能顺便抽一堆牌，别舍不得它。"},"Myrel, Shield of Argive":{"tagline":"你的回合里，对手什么都做不了","intro":"阿基夫之盾穆雷尔（Myrel, Shield of Argive）是白色的四费士兵。你的回合里，对手不能放咒语，也不能用神器、生物、结界的能力，你的计划很难被打断；她每次攻击还会按自家士兵数量带出同样多的兵。喜欢稳稳铺兵、把对手憋住的人会喜欢它。","build":"珍珠徽章（Pearl Medallion）让白色咒语更便宜，元帅（Field Marshal） 和 英勇老兵（Valiant Veteran） 让自家士兵更大更能打。守望队长（Captain of the Watch） 进场就带三个士兵，还继续放大全队。驯良明师（Mentor of the Meek）在你放小兵时，花一点费就能抽一张牌。新人注意：士兵铺满一桌很爽，但遇到清场会一次全没。"},"Omnath, Locus of Rage":{"tagline":"地一落地，就多一个大元素","intro":"怒火核欧那斯（Omnath, Locus of Rage）是红绿两色的七费元素。每有一块地进场，它就白给你一个 5/5 的元素；元素死掉时它还能顺手打掉对手三点血。这套牌想做的事很直白：把地一块接一块放下去，用元素把场面堆满。","build":"亚苏莎让你每回合多放地，莲花眼镜蛇（Lotus Cobra）和犁地帮你把地找出来。刷够元素以后，加鲁克的崛起给全队践踏，远古育碧灵（Ancient Greenwarden）让坟场里的地能再放一次。注意：地牌有限，别一次全用光。"},"Elas il-Kor, Sadistic Pilgrim":{"tagline":"生物一进一出，对手就掉血","intro":"虐之华寇族黜人依拉丝（Elas il-Kor, Sadistic Pilgrim）是黑白两色的两费牧师，带死触。自家别的生物进场时你回一点血，自家生物死掉时每位对手掉一点血——一来一去，差距就拉开了。这套牌靠不停进退小生物慢慢磨掉对手的血。","build":"让对手流血的不止主将一个：筑拉波割喉客（Zulaport Cutthroat）、腐尸骑士（Corpse Knight）和鲜血画家（Blood Artist）都会跟着掉血。拽脏预言师（Viscera Seer）让你随时能把生物献掉，备忘夹（Skullclamp）把送掉的生物换成两张手牌。注意：别把生物全送光，场上要留能回血的那几只。"},"Obeka, Brute Chronologist":{"tagline":"回合说停就停，代价全免掉","intro":"蛮野时代学者欧蓓卡（Obeka, Brute Chronologist）是蓝黑红三色的四费食人魔。它能把当前回合一刀截断：还在堆叠上的咒语和异能在这一刻全部作废，「到回合结束」的代价也跟着失效。于是很多原本会让你吃亏的牌，到它手里就变成纯赚。","build":"先靠偷袭（Sneak Attack）把大生物提前拉上场、打一下，再在回合结束前截断回合，让「必须献掉它」的代价落空。无尽日晷（Sundial of the Infinite）自己就能截断回合，烈阳绽辉莎希莉（Saheeli, the Sun's Brilliance）负责复制场上的好东西。注意：什么时候按停最难。"},"Adrix and Nev, Twincasters":{"tagline":"一只变两只，越复制越多","intro":"双咒法师艾季与涅夫（Adrix and Nev, Twincasters）是蓝绿两色的四费人鱼法师，自带护法，对手想指定它得先多付两点法术力。它的本事只有一句：你造出的衍生物数量翻倍。一句话听着简单，配上一张本来能造一堆的牌，场面立刻就不一样。","build":"模造仪式（Rite of Replication）本来只能复制一个生物，翻倍之后就有两个；二度收获（Second Harvest）把你场上所有衍生物再复制一遍，算下来是四倍。繁盛分灵埃席兹（Esix, Fractal Bloom）能把每次造衍生物的机会换成别的生物。注意：先想好复制谁，别浪费机会。"},"Brimaz, Blight of Oreskos":{"tagline":"非瑞人落场，孵出一窝宝宝","intro":"俄瑞恣荒王布黎玛（Brimaz, Blight of Oreskos）是黑白两色的四费非瑞人猫。你每放一张非瑞人生物或神器生物，它就替你孵一个跟费用一样大的孵卵器；有非瑞人死掉，你还能让场上所有指示物再涨一轮。它做的事是把小生物慢慢孵成能打的。","build":"孵卵器自己不会打架，付两点法术力才变成生物，所以别急着全转。先祖督教（Progenitor Exarch）和正道本体（Essence of Orthodoxy）进场时都能多孵几个，丝金介体（Filigree Vector）给自家生物和神器发指示物，卡恩关堡（Karn's Bastion）再把它们全部翻一倍。注意：主将只在放非瑞人时才触发。"},"Braids, Arisen Nightmare":{"tagline":"逼对手交东西，不交就掉血","intro":"觉醒梦魇布蕾德（Braids, Arisen Nightmare）是黑色的三费梦魇。每个回合结束，你可以献掉自己的一样东西，然后逼每位对手也交出同类的永久物；交不出来的那位掉两点血，你还抽一张牌。它不靠打人，靠让对手一直做难受的选择。","build":"这套牌要保证自己每回合都有东西可献：舞蛇术士（Ophiomancer）每回合自动给一条带死触的小蛇，重组骷髅妖（Reassembling Skeleton）和可怖血妖（Bloodghast）能反复爬回场上，脓水涌泉（Ichor Wellspring）进坟场还会补一张牌，安福陵的暗贾负责收尾。注意：铺场要有层次，别全是同一类。"},"Strefan, Maurer Progenitor":{"tagline":"先让对手掉血，再白上吸血鬼","intro":"茂威原祖史崔凡（Strefan, Maurer Progenitor）是黑红两色的四费吸血鬼，自己会飞。回合结束时，本回合掉过血的每位玩家都让你得到一个血滴；攻击时献掉两个血滴，就能从手里免费放一个吸血鬼上场，直接横着参与进攻，还带不灭。","build":"血滴是这套牌的关键：琉璃心像（Glass-Cast Heart）和血税收集官（Bloodtithe Harvester）都能给你补血滴。奥莉薇亚的喜娘（Olivia's Attendants）和访圣团骑士（Sanctum Seeker）让对手持续掉血，大道惹祸徒给进攻的吸血鬼死触和系命。注意：血滴别一口气用光，留着下一轮攻击。"},"Marwyn, the Nurturer":{"tagline":"妖精越多，主将产的法术力越多","intro":"培育人玛雯（Marwyn, the Nurturer）是绿色的三费妖精德鲁伊。自家每有一个别的妖精进场，她身上就多一个 +1/+1 指示物；横置她产出的法术力，等于她当时的攻击力。你越铺妖精，她越能帮你把大东西提前放出来。","build":"起手靠罗堰妖精（Llanowar Elves）把法术力做起来，泰坦尼亚牧师（Priest of Titania）和妖精高位德鲁伊（Elvish Archdruid）按妖精数量产法术力，铺开一次能产一大把。叶冠幻术师（Leaf-Crowned Visionary）和兽群语者在你放生物时补手牌，叛军领袖伊祖黎给全队 +3/+3 和践踏。"},"Maelstrom Wanderer":{"tagline":"一出场就白翻两张牌","intro":"涡心漫游怪（Maelstrom Wanderer）是蓝红绿三色的八费元素。它一出场，就从牌库顶一张张翻，翻到费用比它低的非地牌就直接免费放出来，而且这个过程走两遍；自家所有生物还都带敏捷，当回合就能冲。","build":"倾曳翻出来的牌免费，所以牌表里塞满大生物最划算：始啸埃泰力（Etali, Primal Storm）和夷世霸兽（Apex Devastator）都很适合被翻出来。黑山之威血爪（Goreclaw, Terror of Qal Sisma）让大生物便宜两点，混沌之华阿韦纳让你顺手把翻到的地放上场。注意：翻牌是随机的。"},"Imotekh the Stormlord":{"tagline":"神器从坟场回来，战士成对冒出来","intro":"风暴领主伊摩特克（Imotekh the Stormlord）是黑色的四费神器生物。只要有一张神器牌离开你的坟场，它就一次造出两个死灵战士；你的回合开始战斗时，它还能给另一个神器生物 +2/+2 并让它获得威慑。整套牌围绕坟场里的神器转。","build":"关键是让神器牌不停进出坟场：废铁打捞械（Scrap Trawler）在自家神器进坟场时把坟场里的神器拿回手，换算下来等于每死一个神器就多两个死灵战士；时间巫师（Chronomancer）献掉神器来抽牌，正好也把神器送进坟场。注意：坟场空了就转不动。"},"Elesh Norn, Mother of Machines":{"tagline":"同一件好事，你这边做两遍","intro":"机械之母艾蕾侬（Elesh Norn, Mother of Machines）是白色的五费非瑞人，自带警戒。你操控的永久物进场时，它的触发式异能会额外触发一次；对手的永久物进场时，他们的异能干脆不触发。同一件事在你这边做两遍，在对手那边做不了。","build":"和主将同一类效果的还有万和琴（Panharmonicon），两张同时在场上，一次进场就能触发三遍。往外跳的牌要挑进场就有好处的：灵念伴侣（Spirited Companion）进场抽一张，复归天使（Restoration Angel）进场时能把自家一个生物再拉回来一次。注意：主将一旦被解掉会慢下来。"},"Kellan, the Kid":{"tagline":"从手牌以外放牌，就白赚一张","intro":"凯澜小子（Kellan, the Kid）是白蓝绿三色的三费仙灵浪客，自己会飞又有系命。只要你在手牌以外的地方施放咒语，它就能让你免费从手里放出一张费用不超标的永久物，或者干脆多放一块地。它围着「先把牌藏起来、以后再放」这类玩法转。","build":"先把牌挪出手牌，主将才有的赚：感临多重宇宙（Behold the Multiverse）和早知如此（Saw It Coming）能用预言先把手牌藏起来，宝库秘钥（The Key to the Vault）打中对手后放逐一张牌、之后再用。灵枭看守维嘉（Vega, the Watcher）在你从别处施放咒语时抽牌。注意：先想好这回合从哪里放牌。"},"Grist, the Hunger Tide":{"tagline":"一边磨牌一边孵虫，最后收人头","intro":"饥潮格蕊斯（Grist, the Hunger Tide）是黑绿两色的三费鹏洛客，但它不在场上时算作一只 1/1 昆虫生物，所以可以当主将用。它的第一个能力是造一只小虫再磨一张牌，磨到昆虫就再来一轮；第二个能力牺牲一只生物，干掉对手一个生物。","build":"这套牌要把昆虫喂进坟场：腐蚀毛虫（Caustic Caterpillar）和失控虫械（Haywire Mite）能拆对手的神器结界，牺牲掉正好喂给主将；黄蜂巢（Hornet Nest）被打到时吐出一堆带飞行和死触的小虫，蜂后（Hornet Queen）进场一次给四只。掠行群长札嘶克让你从坟场放昆虫。"},"Bristly Bill, Spine Sower":{"tagline":"每落一块地，指示物就涨一圈","intro":"锐刺播种师尖棘比利（Bristly Bill, Spine Sower）是绿色的两费植物德鲁伊。每有一块地进场，它就往一个生物身上放一个 +1/+1 指示物；攒够法术力后它还能把全场生物的指示物直接翻一倍。放地这件事本身就等于让生物长大。","build":"坚固鳞甲（Hardened Scales）和分枝演化（Branching Evolution）让每次放指示物都多给一到两倍，苔生多头龙（Mossborn Hydra）自己带践踏、每落地也长一圈。演化智者（Evolution Sage）在你每次落一块地时增殖全场，振奋呼号能让养大的生物这一刻不灭。注意：对手会用清场一次收掉。"},"Tuvasa the Sunlit":{"tagline":"结界越多，主将打得越痛","intro":"阳辉吐瓦萨（Tuvasa the Sunlit）是白蓝绿三色的三费人鱼萨满。你每操控一个结界，它就大一圈；每回合你放的第一张结界还能让你抽一张牌。它自己就是这套牌最大的攻击者，同时还兼任补牌。喜欢用小结界堆出巨兽的人会喜欢它。","build":"牌表里几乎全是结界：咒术师的风采（Enchantress's Presence）和花丛幻灵（Eidolon of Blossoms）都会在你放结界时抽牌，所以一张一张放下来手牌不会断。圣所织叶灵（Sanctum Weaver）按结界数量产出法术力，野地丛生（Wild Growth）贴在自家地上帮你铺法术力。注意：别只顾铺法术力忘了进攻。"},"Talion, the Kindly Lord":{"tagline":"先定一个数，对手放了就掉血","intro":"仁慈仙王塔莱恩（Talion, the Kindly Lord）是蓝黑两色的四费仙灵贵族，自己会飞。它进场时你先在心里定一个 1 到 10 之间的数字；之后对手每放一张费用、攻击力或防御力等于这个数的咒语，他就掉两点血，你还抽一张牌。","build":"数字一般挑对手最常用的费用，比如两点或三点，越多人踩中越赚。启示天灾希欧蕊（Sheoldred, the Apocalypse）在你抽牌时回血、对手抽牌时掉血，奥克弓手（Orcish Bowmasters）在对手多抽牌时直接造成伤害。注意：天鹅绝唱（Swan Song）只能挡瞬间、法术和结界。"},"Gisa and Geralf":{"tagline":"僵尸死了不算完，还能再放一次","intro":"基沙与基拉夫（Gisa and Geralf）是蓝黑两色的四费人类法师。它进场时先磨四张牌，之后每个回合你都可以从坟场里再放一个僵尸生物，等于手里的僵尸用完还能从坟场接着来。这套牌围着僵尸和坟场转，靠反复回收把场面撑住。","build":"先往坟场里堆僵尸：屋顶风暴（Rooftop Storm）让你可以不用付法术力就放僵尸，放出来的每一个都能被主将从坟场再拉一次。战墓队长（Diregraf Captain）、遭诅者领主（Lord of the Accursed）和墓地镰刀手（Cemetery Reaper）各自给全队僵尸 +1/+1。注意：磨牌是随机的，好牌被磨掉也别慌。"},"Gluntch, the Bestower":{"tagline":"每回合送三份礼物，自己也不亏","intro":"遣施怪古朗奇（Gluntch, the Bestower）是白绿两色的三费水母，自己会飞。每个回合结束，它给三位玩家各送一份礼：一个人拿到两个 +1/+1 指示物，一个人抽一张牌，一个人拿到两个宝藏。它不给对手制造麻烦，而是让整桌都愿意跟你做朋友。","build":"礼物发得好，局面就站在你这边：呋噜怪（Flumph）让每位玩家都多抽牌，茁壮仪式（Rites of Flourishing）每回合额外多抽一张、还能多放一块地。达成协议（Cut a Deal）和秘密相会（Secret Rendezvous）都是给对手好处、但你拿得更多。注意：别把礼物发给已经领先的人。"},"Breena, the Demagogue":{"tagline":"别人互相打，你就白拿指示物","intro":"煽动师布莉娜（Breena, the Demagogue）是黑白两色的三费鸟妖，自己会飞。只要有玩家攻击了你的对手，而那位对手的血比另一位对手多，攻击的那位就抽一张牌，你则往自家生物身上放两个 +1/+1 指示物。你什么都不用做，别人开打你就变强。","build":"这套牌要主动给对手制造打起来的理由：斗客的遗产（Duelist's Heritage）让每次进攻都多一份双头击的机会，忠诚承诺（Promise of Loyalty）逼每位玩家只留一个生物、而且那个生物不能打你。暮影军团斗客（Dusk Legion Duelist）在收到指示物时抽牌。注意：盯着血最少的那家。"},"Koma, Cosmos Serpent":{"tagline":"每个回合都多一条盘蛇","intro":"寰宇盘蛇寇玛（Koma, Cosmos Serpent）是蓝绿两色的七费巨蛇，而且不能被反击。每个回合开始时你都白得一条 3/3 的盘蛇；献掉一条盘蛇，你可以让对手一个永久物横置、或者让它这一回合不灭。它自己产兵、自己保命，很难处理。","build":"盘蛇要用得狠：垃圾盘蛇（Junk Winder）在自家衍生物进场时横置对手的永久物，元素羁绊（Elemental Bond）让你每次造出攻击力三点以上的生物时抽一张牌。平行生命（Parallel Lives）让每条盘蛇都变成两条。注意：主将费用很高，前期先把法术力铺好。"},"Lathiel, the Bounteous Dawn":{"tagline":"回的血越多，队友长得越大","intro":"丰饶曙光拉狄雷（Lathiel, the Bounteous Dawn）是白绿两色的四费独角兽，自带系命。每个回合结束，只要你这一回合回血，它就能把等同于回血量的 +1/+1 指示物分给自家别的生物。回血在这套牌里不只是保命，还是资源。","build":"回血要变成常态：护灵师（Soul Warden）、护华师（Essence Warden）和灵魂照护僧（Soul's Attendant）都在别的生物进场时给你回一点血，所以铺场本身就等于攒指示物。罗克维念师（Rhox Faithmender）让你回的血翻倍，盟会导师（Conclave Mentor）每次放指示物都加量。注意：回血要发生在自己的回合。"},"Sidisi, Brood Tyrant":{"tagline":"一边磨牌一边攒僵尸","intro":"族群暴君谢迪西（Sidisi, Brood Tyrant）是蓝黑绿三色的四费蛇萨满。它进场或攻击时磨三张牌；只要有生物牌被磨进坟场，你就得到一个 2/2 的僵尸。也就是说，你越磨牌，场上的僵尸越多，而坟场也越攒越厚。","build":"磨牌要磨得有用：拼接师备尸（Stitcher's Supplier）进场或死掉都磨三张，占颅先知（Skull Prophet）可以磨牌又能产法术力，圣物老妖（Wight of the Reliquary）按坟场里的生物数量变大。神奇（Wonder）在坟场里就能让自家生物全都会飞。注意：磨到好东西是常事，坟场就是第二副手牌。"},"Admiral Brass, Unsinkable":{"tagline":"海盗死了也能再冲一次","intro":"不沉传奇霸司总帅（Admiral Brass, Unsinkable）是蓝黑红三色的五费人类海盗。它进场时先磨四张牌；之后每个回合开始战斗时，你可以从坟场把一个海盗拉回场上，直接变成 4/4，还带敏捷，当回合就能进攻。它让海盗死了也不亏。","build":"海盗要多，坟场才有的可拉：骷髅妖船员（Skeleton Crew）会在生物离开坟场时造出 2/2 的海盗骷髅，锐目领航员马科姆（Malcolm, Keen-Eyed Navigator）在海盗打中对手时造宝藏。港口劫盗（Port Razer）打中对手后能多给一个战斗阶段。注意：从坟场拉回来的会被放逐。"},"Ellivere of the Wild Court":{"tagline":"给队友戴上角色，打中就有牌","intro":"幻野廷的莉薇尔（Ellivere of the Wild Court）是白绿两色的四费人类骑士。它进场和攻击时都会给自家另一个生物贴上一个角色结界，被贴的生物按你操控的结界数量变大；只要有被贴的生物打中对手，你就抽一张牌。它把结界变成攻击力。","build":"角色结界要贴得准，因为每只生物同时只能有一个角色。理想境蔓生（Utopia Sprawl）贴在森林上产法术力，圣所织叶灵（Sanctum Weaver）按结界数量产法术力，瑟特萨斗士（Setessan Champion）在结界进场时抽牌。注意：瑞斯之风（Winds of Rath）只清掉没被贴结界的生物。"},"Sméagol, Helpful Guide":{"tagline":"戒指一引诱，就顺手拿走一块地","intro":"有用向导斯密戈（Sméagol, Helpful Guide）是黑绿两色的三费半身人惊惧兽。你的回合结束，只要有生物死掉，戒指就会引诱你；每次戒指引诱你，你就让对手从牌库顶一直翻到一张地，把那张地横着放到自己场上，其余全进对手坟场。","build":"戒指引诱你的次数就是收益：魔戒呼唤（Call of the Ring）每回合维持时引诱一次，耐心谋策鬼咕噜（Gollum, Patient Plotter）离场时引诱一次，山姆危急施救（Sam's Desperate Rescue）和收获宝贝（Claim the Precious）也各带一次。杜内丹游民在你落地时引诱。注意：要有生物愿意死。"},"Commodore Guff":{"tagline":"鹏洛客越多，一炮打得越狠","intro":"古夫准将（Commodore Guff）是白蓝红三色的四费鹏洛客。每个回合结束，它给自家另一个鹏洛客多放一个忠诚指示物；它的大招按你操控的鹏洛客数量抽牌并让每位对手掉等量的血。它自己还能造出专门用来放鹏洛客的法师。","build":"鹏洛客要多，大招才狠：泰菲力的誓约（Oath of Teferi）让你每回合能多用一次鹏洛客的忠诚异能，锁链面纱（The Chain Veil）在特定条件下也能再来一轮。旭日天尊艾紫培（Elspeth, Sun's Champion）每回合造三个士兵。注意：鹏洛客很怕被攻击，记得留兵挡。"},"The Gitrog, Ravenous Ride":{"tagline":"用大生物的力气换一地一抽","intro":"血口坐骑噬人蛙怪（The Gitrog, Ravenous Ride）是黑绿两色的五费蛙怪坐骑，自带践踏和敏捷。它打中对手后，你可以把本回合用来骑它的生物献掉，然后按那只生物的攻击力抽牌，并把等量的地放上场——攻击力越高的坐骑，换来的地越多。","build":"坐骑要挑攻击力夸张的：始饥戈厄塔（Ghalta, Primal Hunger）和雅骨尔与穆塔尼（Yargle and Multani）都是能一下换来一大把地的坐骑，无丈魔泰坦（Daemogoth Titan）攻击力也高，反正它本来就要你献生物。不倦供给人（Tireless Provisioner）让你每落一块地时多一个宝藏。注意：献掉的是自家的生物。"},"Kardur, Doomscourge":{"tagline":"逼全场互殴，自己坐收其成","intro":"末日灾祸卡尔杜（Kardur, Doomscourge）是黑红两色的四费恶魔狂战士。它进场后，到你下个回合之前，对手的生物每次战斗都必须攻击，而且尽量不打你；只要有攻击中的生物死掉，每位对手掉一点血、你回一点血。它让整桌人替你打。","build":"逼人开打的牌越多，主将的收益越稳定：礼数不周（Disrupt Decorum）一次让所有对手的生物都必须进攻，晶岩怒兽（Geode Rager）在你落一块地时就让某位对手全军开打。山崖暴君克卒（Kazuul, Tyrant of the Cliffs）在有人打你时给你一个 3/3 挡着。注意：渎神行径（Blasphemous Act）会清掉全场。"},"Nethroi, Apex of Death":{"tagline":"变异一次，坟场里的生物全回来","intro":"夺命霸狮涅司罗（Nethroi, Apex of Death）是白黑绿三色的五费猫，带死触和系命。它可以用变异的方式叠在自家非人类生物上；每次变异，它就把坟场里总攻击力不超过十的生物一起拉回场上。也就是说，变一次就能翻出一整片生物。","build":"先把好东西放进坟场：活埋（Buried Alive）一次把三张生物牌塞进坟场，拼接师备尸（Stitcher's Supplier）进场或死掉都磨三张，樱宗长老（Sakura-Tribe Elder）既能找地、也能当变异的目标。碎晶狂兽（Gemrazer）带践踏并能拆对手的神器和结界。注意：先算好要拉哪几只回来。"},"Sigarda, Font of Blessings":{"tagline":"自家永久物都难被指定，还能翻牌顶","intro":"祝福圣源席嘉妲（Sigarda, Font of Blessings）是白绿两色的四费天使，自己会飞。你操控的其它永久物都带辟邪，对手很难指定它们；你还可以随时看牌库顶那张牌，并且直接从牌库顶放天使和人类咒语。它让自家场面很难被拆。","build":"牌库顶能直接放牌，所以天使放得越多越顺：希望圣源吉娅妲（Giada, Font of Hope）每有一张别的天使就让新天使多带一个指示物，还能产法术力；战令天使（Herald of War）进攻时长大，并给天使和人类咒语减费。注意：牌库顶放牌还是需要法术力。"},"Bilbo, Birthday Celebrant":{"tagline":"回血攒到111点，一次铺满全场","intro":"寿星比尔博（Bilbo, Birthday Celebrant）是白黑绿三色的半身人，你每次回血都多回一点。这套牌先靠小生物和回血把生命堆起来，等攒到111点，就把他自己献出去，从牌库一次拉出一群生物站满场。喜欢做长线目标的人会喜欢他。","build":"铺场主要靠一批「有人进场就回血」的小生物，护灵师（Soul Warden）只要一点白法术力；罗克维念师（Rhox Faithmender）能让每次回血翻倍，老头儿（The Gaffer）则在你一回合回够三点血后帮你补牌。新人注意：111点生命听起来很远，前期要留几堵墙、准备几张清场，别在攒够之前先被打死。"},"Bruvac the Grandiloquent":{"tagline":"对手每磨一张，就变成两张","intro":"浮夸的布鲁瓦（Bruvac the Grandiloquent）是蓝色的三费主将，他自己不打人，但对手每次被磨牌，数量都翻一倍。这套牌就是不停从对手牌库顶上往下推，推到他们没牌可抽。喜欢看对手牌库一点点变薄的人会喜欢他。","build":"主力是一次磨一大叠的咒语，致狂杂音（Maddening Cacophony）和裂崩心智（Fractured Sanity）都走这条路；遗迹蟹（Ruin Crab）则是你每放一块地进场就顺手磨三张。先用宣导（Propaganda）让对手打你时要多掏钱，再一点点掏空他们的牌库。新人注意：磨牌会把对手的坟场喂大，有些人能从坟场里把牌再用起来。"},"Ayula, Queen Among Bears":{"tagline":"熊一只只进场，她一只只变强","intro":"百熊女王阿育拉（Ayula, Queen Among Bears）是绿色的两费主将。她的规矩很简单：只要有别的熊进场，你要么给她加两个指示物，要么让她和对手的一只生物互斗。喜欢熊、喜欢直接开打的人会喜欢她。","build":"这套牌里几乎全是熊，普通的便宜熊就够用，不用挑贵的。黑山之威血爪（Goreclaw, Terror of Qal Sisma）能让力量四点以上的生物咒语便宜两点，是你最该先放的一张。打法是先铺两三只小兽，再让阿育拉跟对面的生物互斗，用一只换一只的方式慢慢清掉对手的场面。新人注意：她得留在场上才有用，别为了互斗把主将搭进去。"},"Kiora, Sovereign of the Deep":{"tagline":"大章鱼大鲸鱼，越用越省","intro":"深洋君王奇奥拉（Kiora, Sovereign of the Deep）是蓝绿两色的人鱼贵族，她自己有警戒。你从手上用海怪、巨鲸、章鱼或巨蛇咒语时，她让你看牌库顶等于该咒语费用的张数，其中更便宜的一张可以免费放出来。喜欢大生物的人会喜欢她。","build":"这套牌的大生物很贵，所以要先铺地：静眠岛屿阿力马昔斯（Arixmethes, Slumbering Isle）本身就是一块地。贾路的反抗（Garruk's Uprising）让你的大生物都能践踏，还能帮你补牌。碎船惊惧兽（Hullbreaker Horror）是常见的收尾手段。新人注意：从手上用大生物才能触发奇奥拉，从别处放出来的都不算。"},"Pramikon, Sky Rampart":{"tagline":"定好方向，让对手互相打","intro":"天空堡垒帕米空（Pramikon, Sky Rampart）是红白蓝三色的会飞的墙，上场时你要选左或右。之后每位玩家只能攻击那个方向上离自己最近的对手，于是原本冲着你来的人，多半掉头去打别人。喜欢看对手互耗的人会喜欢它。","build":"先把「进攻要付费」的牌铺好，宣导（Propaganda）和魂魅拘禁（Ghostly Prison）都能让对手想打你时先掏钱，流放之径（Path to Exile）则用来点掉对面最大的威胁。打法是不出头，让上下家互相消耗，你用墙稳住局面，再靠一点场面优势收尾。新人注意：四个人时它最有用，一对一它几乎没用。"},"Ezuri, Claw of Progress":{"tagline":"小生物堆经验，主将越打越大","intro":"进展之爪伊祖黎（Ezuri, Claw of Progress）是蓝绿两色的四费主将。你每放出一只力量两点以下的生物，他就攒一个经验指示物；战斗一开始，这些指示物全压到另一只生物身上。喜欢把小家伙养大的人会喜欢他。","build":"牌表里全是力量两点以下的小生物，回旋智者（Gyre Sage）能帮你出法术力，羊屯斗士（Champion of Lambholt）则会随着新生物进场越变越大，正好给伊祖黎攒经验。托望神（Kami of Whispered Hopes）能让指示物多给一个。新人注意：攒够经验再动手最舒服，前期多放便宜的小生物，别急着把指示物花在打人上。"},"Ayara, First of Locthwain":{"tagline":"黑生物不断进场，对手不断掉血","intro":"洛司温首领阿娅拉（Ayara, First of Locthwain）是黑色的三费精灵贵族。你每放出一只黑色生物，每位对手就掉一点生命、你回一点。这套牌靠一批批小生物反复进场，把对手的生命一点点磨掉。喜欢慢慢榨干对手的人会喜欢她。","build":"铺场用舞蛇术士（Ophiomancer）这种会不断给你蛇的生物，配上筑拉波割喉客（Zulaport Cutthroat），你的生物死掉时对手就会掉血。安福陵的暗贾（Gray Merchant of Asphodel）进场时能一次打一大片。新人注意：这类牌很难被彻底清掉，但你的血线也别掉太低，记得留几张自保的牌。"},"Azusa, Lost but Seeking":{"tagline":"每回合多落两块地","intro":"云游者梓纱（Azusa, Lost but Seeking）是绿色的三费主将，她的能力只有一句：你每回合可以多放两块地。听起来普通，但多出来的地就是多出来的法术力，也是各种「地进场就触发」的起点。喜欢把资源越铺越大的人会喜欢她。","build":"核心是多放地，所以牌表里要放拉慕拿开挖人（Ramunap Excavator）和慕达雅先知（Oracle of Mul Daya），它们让你能从坟场或牌库顶继续放地。地一多，硬盔虫聚群（Scute Swarm）和赞迪卡复仇者（Avenger of Zendikar）这类「地进场就生一堆」的牌就会迅速撑起场面。新人注意：别只顾放地，最后手上没牌可出。"},"Laughing Jasper Flint":{"tagline":"从对手牌库里偷牌来用","intro":"笑面客燧火贾斯珀（Laughing Jasper Flint）是红黑两色的三费主将。你每回合开始时会从某个对手的牌库顶放逐几张牌，这些牌你当回合就能用，而且随便什么颜色的法术力都能付。喜欢用对手的牌打对手的人会喜欢他。","build":"牌表以便宜的小生物为主，闷燃沼地（Smoldering Marsh）这类双色地保证红黑两色都能准时出。打法是先用小生物压上去，同时每回合从对手牌库顶偷几张当回合就能用的牌，越打手里的资源越多。新人注意：偷来的牌只在当回合有效，回合结束就没了，所以出牌顺序要提前想好；也别指望慢慢来，这套牌得一直往前压。"},"Grolnok, the Omnivore":{"tagline":"自己磨的牌，反而都能用","intro":"全能噬蛙葛诺克（Grolnok, the Omnivore）是蓝绿两色的四费青蛙。你的蛙一进攻就磨三张牌，而只要是磨进坟场的永久物牌，就会被它换个地方存起来，之后你照样可以放地、用牌。喜欢手牌越攒越多的人会喜欢他。","build":"蛙不多，但够用：芽胞蛙（Spore Frog）能牺牲自己挡掉这一回合的战斗伤害，池塘先知（Pond Prophet）进场就补一张牌，苍茂谷唤力师（Valley Mightcaller）在你放别的蛙时会慢慢变大。整体打法是先铺蛙、让它们进攻磨牌，再从磨出来的牌里挑好东西继续用。新人注意：磨牌是这套牌的动力，别害怕牌库变薄。"},"Yawgmoth, Thran Physician":{"tagline":"牺牲小生物，换牌换压制","intro":"索蓝医师约格莫夫（Yawgmoth, Thran Physician）是黑色的四费主将。牺牲一只别的生物再付一点生命，他就能给目标生物放一个-1/-1指示物并让你抽一张牌。小生物在他手里能一直换成手牌，喜欢这种拉扯感的人会喜欢他。","build":"牌表走「小生物反复死」的路线：舞蛇术士（Ophiomancer）会不断给你蛇，筑拉波割喉客（Zulaport Cutthroat）让你的生物死掉时对手掉血。冷酷袭劫者（Pitiless Plunderer）更直接，你的生物一死就给你一个宝物。新人注意：牺牲是有代价的，别把唯一能挡的生物也吃掉，主将自己也怕清场。"},"Jhoira, Weatherlight Captain":{"tagline":"每用一张神器，就抽一张牌","intro":"晴空号船长尤依拉（Jhoira, Weatherlight Captain）是红蓝两色的四费主将。她的规矩很好记：你每施放一张「史迹」咒语就抽一张牌，而神器、传奇、传纪都算史迹。喜欢一直有牌可打的人会喜欢她。","build":"主力是便宜甚至免费的神器：扑翼机（Ornithopter）零费就能出，出来就抽一张牌。乙金塑师（Etherium Sculptor）和铸造厂监工（Foundry Inspector）让每张神器都便宜一点。铺满一桌子小神器后，你几乎每张牌都在替换手牌。新人注意：这类牌表很怕对手的清场和反击，出牌顺序比单张强弱更重要。"},"Kwain, Itinerant Meddler":{"tagline":"人人多抽牌，你先抽干自己","intro":"漫游捣乱者快隐（Kwain, Itinerant Meddler）是白蓝两色的两费兔子法师。横置他，每位玩家都可以抽一张牌，这样抽过的玩家还会各回一点生命。整桌人都舒服，但得利的是你：你可以把自己的牌库先抽空。喜欢先赢一步的人会喜欢它。","build":"牌表要放一整套让所有人多抽牌的东西：嚎叫的矿井（Howling Mine）和克罗芬斯的旨意（Dictate of Kruphix）都会在抽牌步骤多给一张。你用实验室狂人（Laboratory Maniac）收尾，牌库抽空后还要抽牌时你直接赢。另一半牌表是宣导（Propaganda）这类让对手不想打你的东西。新人注意：前期很软，得先活到牌库见底。"},"Wayta, Trainer Prodigy":{"tagline":"让自己的生物互斗，伤越挨越赚","intro":"驯龙逸才薇塔（Wayta, Trainer Prodigy）是红绿白三色的三费主将，她自己有敏捷。她能让你操控的两只生物互斗，而且这种互斗常常是对你有利的：你的生物受到伤害会触发各种好处，她还让这些触发多来一次。喜欢自导自演的人会喜欢她。","build":"主力是挨打有好处的恐龙：成长仪式（Rite of Passage）让你的生物每次受伤都多一个+1/+1指示物，怨怒迅猛龙（Wrathful Raptors）则把恐龙受到的伤害原样打回去。你还可以用渎神行径（Blasphemous Act）一次烧全场，让所有这类触发同时发生。新人注意：先算清楚谁会被打死，互斗和自伤很容易把自家生物一起搭进去。"},"Marisi, Breaker of the Coil":{"tagline":"你打谁，谁就被赶去打别人","intro":"破围马力希（Marisi, Breaker of the Coil）是红绿白三色的四费猫战士。对手在他面前没法在战斗阶段施放咒语；而你的生物一旦打中某个对手，那个玩家所有生物就会被逼着去攻击别人，不能回头打你。喜欢看别人打架的人会喜欢他。","build":"铺场用便宜的绿色生物和猫，能进攻就进攻。欧然霜牙蛇（Ohran Frostfang）给你的进攻生物死触，密讯信使托斯奇（Toski, Bearer of Secrets）则让每次打中对手都补一张牌。加上丛林祭祠（Jungle Shrine）这类三色地，前期不容易卡色。新人注意：这套牌要靠持续进攻才转得起来，你不打人，马力希的能力就什么都不会发生。"},"Chishiro, the Shattered Blade":{"tagline":"每贴一张灵气装备，就多一只精灵","intro":"碎剑治郎（Chishiro, the Shattered Blade）是红绿两色的四费蛇武士。你每放一张灵气或装备进场，他就生一只带威慑的精灵；每回合结束前，你那些贴了东西或带指示物的生物各长一个+1/+1指示物。喜欢边养边铺的人会喜欢他。","build":"牌表里灵气和装备要多：荒野韵律（Rhythm of the Wild）让新的生物不会被反击，狡蛇本影（Snake Umbra）贴上去以后，打中对手就能抽牌。羊屯斗士（Champion of Lambholt）和遗世先人（Forgotten Ancient）负责把+1/+1指示物越堆越多。新人注意：贴东西有被一次清掉的风险，别把筹码全押在一只生物身上。"},"Astarion, the Decadent":{"tagline":"掉的血绕一圈，最后都回你身上","intro":"颓废的阿斯代伦（Astarion, the Decadent）是白黑两色的六费吸血鬼，自带死触和系命。每到你的结束步骤，你要二选一：让某个对手再掉一次他这回合掉过的血量，或者让你再回一次这回合回过的血量。喜欢用回血慢慢磨死对手的人会喜欢他。","build":"关键搭配是血色羁绊（Sanguine Bond）和暮影蔷薇之棘维托（Vito, Thorn of the Dusk Rose）：它们都把「你回血」直接变成对手掉血，阿斯代伦再多回一次，对手就再多掉一次。放干鲜血（Exsanguinate）这类一次结算一大笔的咒语最适合用来触发这条链。新人注意：两件套凑齐之前，这套牌只是普通回血，别急着跟人拼速度。"},"Ruric Thar, the Unbowed":{"tagline":"谁用非生物咒语，谁就吃六点","intro":"拒降者鲁瑞杂尔（Ruric Thar, the Unbowed）是红绿两色的六费食人魔战士，而且每个战斗都必须攻击。他的脾气写在牌上：任何玩家施放非生物咒语，他就打那个人六点。所以这张牌表里几乎全是生物。喜欢用大生物硬碰硬的人会喜欢他。","build":"牌表基本只用生物：罗堰妖精（Llanowar Elves）和妖精秘教徒（Elvish Mystic）负责前期出法术力，兽群语者（Beast Whisperer）让你每放一只生物都补一张牌。复碧智者（Reclamation Sage）进场时顺手拆掉对手的神器和结界。新人注意：他自己也必须攻击，被打掉会很亏，所以留几只生物陪他一起冲。"},"The Mimeoplasm":{"tagline":"从坟场里凑一只怪物出来","intro":"拟生原浆（The Mimeoplasm）是蓝黑绿三色的五费流浆。它上场时会从坟场里挑两只生物：它变成其中一只的样子，再按另一只的力量拿到一堆额外的+1/+1指示物。所以坟场对你来说像自助餐。喜欢做组合、喜欢翻坟场的人会喜欢它。","build":"先把好料送进坟场：活埋（Buried Alive）一次就能把三只生物扔进去，绝灭领主（Lord of Extinction）这种大身材的生物正好当力量来源。吞噬畸变体（Consuming Aberration）一边磨对手一边自己变大，横财（Windfall）能让所有人换手牌。新人注意：坟场是你的资源，但不安全，有人能清空它，所以别拖太久。"},"Elenda, the Dusk Rose":{"tagline":"她死后留下一整队吸血鬼","intro":"暮影蔷薇依莲达（Elenda, the Dusk Rose）是白黑两色的四费吸血鬼骑士，自带系命。别的生物死掉时她会长大，而她自己死掉时，会按当时的力量生出一整队带系命的白色吸血鬼。喜欢提前铺好、再用一次爆发收尾的玩家会喜欢她。","build":"铺场用热忱吸血鬼（Cordial Vampire）和残酷主祭（Cruel Celebrant）：前者让你的吸血鬼们一死就长指示物，后者让生物死时对手掉血你回血。血侯之刃（Blade of the Bloodchief）贴在依莲达身上，可以让她的力量涨得非常快，她死后生出的吸血鬼也就更多。新人注意：她得先长大再死掉才划算，还小的时候别让她上去挡。"},"Juri, Master of the Revue":{"tagline":"牺牲得越多，他死时炸得越响","intro":"剧团业主裘里（Juri, Master of the Revue）是红黑两色的两费人类。你每牺牲一个永久物，他就长一个+1/+1指示物；而他死掉时，会把等于自己力量的伤害打向任意目标。喜欢先攒后爆的玩家会喜欢他。","build":"宝物是这套牌的燃料：冲动小偷（Impulsive Pilferer）死后留下一个宝物，货棚老板马哈迪（Mahadi, Emporium Master）每个结束步骤按当回合死掉的生物数量给你一堆宝物。破坏魔鬼（Mayhem Devil）让每次牺牲都顺手打一点伤害。新人注意：该牺牲的时候就牺牲，留在场上不动的宝物不会让裘里变大。"},"Ixhel, Scion of Atraxa":{"tagline":"让每个人慢慢中毒","intro":"亚崔夏赋使伊歇儿（Ixhel, Scion of Atraxa）是白黑绿三色的四费天使，会飞、有警戒，打中对手时还会额外给对手两个中毒指示物。对手中毒够多之后，每回合结束都要把牌库顶交出来给你用。喜欢慢慢逼近的人会喜欢她。","build":"这套牌的目标是把三个对手的中毒指示物一点点推上去，卡恩关堡（Karn's Bastion）这种能增殖的地很关键，它让每个人身上的指示物都再涨一点。铺场用带毒侵的小生物，配上几张直接给对手中毒指示物的牌，让毒素慢慢积累。新人注意：中毒是另一条取胜路线，对手有多少生命完全不影响你的进度。"},"Karumonix, the Rat King":{"tagline":"一桌老鼠都带毒","intro":"鼠王卡鲁蒙（Karumonix, the Rat King）是黑色的三费老鼠。他自己带毒侵1，而且你所有的老鼠都跟着有；他上场时你还能看牌库顶五张，把里面的老鼠全收进手牌。所以这套牌的目标是铺一片老鼠。喜欢小生物海的人会喜欢他。","build":"老鼠越多越好：鼠群魔笛手（Piper of the Swarm）能让你的老鼠带上威慑，水渠鼠霸捷敏王（Lord Skitter, Sewer King）在别的老鼠进场时顺手清对手的坟场。啮骨牙（Marrow-Gnawer）可以牺牲一只老鼠换出一整队老鼠。这套牌不靠大生物，靠的是数量和毒。新人注意：铺场很快，但要小心对手一次清场把你打回原形。"},"Aminatou, the Fateshifter":{"tagline":"让生物反复进出场","intro":"矫命师阿米娜图（Aminatou, the Fateshifter）是白蓝黑三色的三费鹏洛客主将。她的一个能力让你抽一张牌再放一张回牌库顶，另一个能力可以把你自己的一张永久物先放逐、再立刻放回场上。喜欢把好处拿两遍的人会喜欢她。","build":"灵魂牧者（Soulherder）每回合帮你把一只生物送出去再接回来，万和琴（Panharmonicon）则让进场的好处多来一次；流光烁影（Ephemerate）是便宜的一次离场再回来，配恶邪枭（Baleful Strix）这类进场就抽牌的生物，一张牌能换两次好处。新人注意：她的能力每回合只能用一次，节奏偏慢，别急着铺太多。"},"Kambal, Profiteering Mayor":{"tagline":"对手生一个衍生物，你也生一个","intro":"牟利镇长坎拔（Kambal, Profiteering Mayor）是白黑两色的三费人类议员。对手一回合里第一次造出衍生物时，你也跟着造一个一模一样的；而你自己每造出衍生物，每位对手就掉一点生命、你回一点。喜欢借力打力的人会喜欢他。","build":"牌表要能自己造衍生物：黑森林蝙蝠（Mirkwood Bats）让你每次造出或牺牲衍生物时对手都掉血，虐之华寇族黜人依拉丝（Elas il-Kor, Sadistic Pilgrim）则负责你的生命。备忘夹（Skullclamp）用来把小衍生物换成两张牌。新人注意：对手造衍生物这件事你没法控制，所以别把赢法全押在等他铺场上。"},"Nahiri, Forged in Fury":{"tagline":"装备越多，主将越便宜","intro":"怒火熔铸娜希丽（Nahiri, Forged in Fury）是红白两色的六费寇族神器师。你场上的每张装备都能让她的费用少一点。你的生物带着装备进攻时，她会从牌库顶翻一张牌给你，装备牌还能直接免费贴上场。喜欢越打越顺手的人会喜欢她。","build":"牌表里装备要放够：净钢神圣武士（Puresteel Paladin）和资深建筑师斯勒姆（Sram, Senior Edificer）都会在你放装备进场时帮你补牌，席嘉妲的援助（Sigarda's Aid）则让你能在对手回合突然把装备贴上去。新人注意：没有装备时的娜希丽很普通，所以先把装备铺好，再让她上场。"},"Yusri, Fortune's Flame":{"tagline":"掷硬币，赢了抽牌输了挨打","intro":"命运烈焰亚司利（Yusri, Fortune's Flame）是红蓝两色的三费主将，会飞。他每次进攻时你报一个1到5的数字，然后掷那么多次硬币：赢一次抽一张牌，输一次他打你两点。五把全赢的话，这回合你的手牌都是免费的。喜欢赌一把的人会喜欢他。","build":"酒馆恶棍（Tavern Scoundrel）是你最该先放的：你每赢一次硬币它就给两个宝物，掷硬币越多越赚。这套牌的乐趣在于每次进攻都是一次赌局，输赢都能接受。新人注意：亚司利会自己打自己，生命掉得比你想的快，别在血少的时候还硬要报大数字；只报1的话他只会打你两点，这是最稳的用法。"},"The Locust God":{"tagline":"每抽一张牌，就多一只虫子","intro":"蝗虫神（The Locust God）是红蓝两色的六费神，会飞。它的规矩很短：你每抽一张牌，就生一只会飞、带敏捷的虫子；你还可以付两点蓝红，抽一张再弃一张。喜欢一直抽牌的人会喜欢它。","build":"冲击震颤（Impact Tremors）让每只虫子进场都打对手一点，变态爬虫（Psychosis Crawler）则让你每抽一张牌对手掉一点血。泰菲力的永恒洞察（Teferi's Ageless Insight）让你的抽牌几乎都翻倍，横财（Windfall）这类一次抽好几张的牌最配它。新人注意：抽得凶，自己的牌库也会见底，别把最后几张牌算漏了。"},"Brudiclad, Telchor Engineer":{"tagline":"把一桌小东西变成同一只","intro":"钛可工程师布迪凯（Brudiclad, Telchor Engineer）是红蓝两色的六费神器师。每次战斗开始时你先得到一只2/1的秘耳，然后可以指定场上一只衍生物，让你其他所有衍生物都变成它的复制品。喜欢变戏法的人会喜欢他。","build":"牌表要有一堆便宜的衍生物来源：振翼机情报网（Thopter Spy Network）在你场上有神器时每回合给你一只会飞的振翼机，秘耳斗球（Myr Battlesphere）进场一次给四只秘耳。伊捷印记（Izzet Signet）负责把红蓝两色凑齐。关键是要先有一只够大的衍生物，再让布迪凯把它变成一整桌。新人注意：他一上场就要想好复制谁。"},"Emry, Lurker of the Loch":{"tagline":"从坟场里反复捞出神器","intro":"深湖潜妖艾莉（Emry, Lurker of the Loch）是蓝色的三费人鱼法师。你场上的神器越多她的费用越低；她上场时先磨四张牌，之后每回合她可以把坟场里的一张神器拿出来，让你这个回合施放它。喜欢反复用同一张牌的人会喜欢她。","build":"神器越便宜越好用：乙金塑师（Etherium Sculptor）让神器咒语少付一点费用，装配（Fabricate）则帮你把需要的那张神器直接找出来。悉诺议会宅邸（Seat of the Synod）和玄铁殿堂（Darksteel Citadel）是能当法术力用的地，本身也算神器，正好喂给她。新人注意：她磨的四张牌里如果有神器，别急着把坟场清掉。"},"Narci, Fable Singer":{"tagline":"一章章传纪讲完，血和牌都到手","intro":"寓言歌者娜尔提（Narci, Fable Singer）是白黑绿三色的四费歌手，自带系命。你每牺牲一个结界就抽一张牌，而传纪讲完最后一章本来就会被牺牲，所以讲故事等于顺手补牌；传纪念完时，每位对手还要失去等同于它费用的生命，你回复等量。","build":"牌表以传纪和结界为主：禁锢古神记（Binding the Old Gods）能解掉对手的永久物，恶源重生（The Eldest Reborn）逼对手交出生物。丰收之手叙提丝（Sythis, Harvest's Hand）和咒术师的风采（Enchantress's Presence）让你放结界时抽牌。新人注意：传纪要一章章慢慢结算，别一次全铺出来。"},"Ivy, Gleeful Spellthief":{"tagline":"给别的生物贴灵气，主将也白拿一份","intro":"欢笑窃咒客艾薇（Ivy, Gleeful Spellthief）是蓝绿双色的两费仙灵，会飞。任何牌手施放一个只以单个生物为目标的咒语时，你都可以复制一份，复制品的目标改成艾薇。所以你给别人贴灵气，她也会白拿一份。","build":"主流是把自己人也贴上灵气：好奇（Curiosity）和狡蛇本影（Snake Umbra）让被贴的生物打中对手就抽牌，贴在别的生物身上，艾薇会同时收到一份，两份一起抽。内陆港湾（Hinterland Harbor）帮你凑齐蓝绿两色。新人注意：艾薇自己很脆，灵气又都挂在她身上，对手一旦把她解掉，附着的东西会一起掉。"},"Don Andres, the Renegade":{"tagline":"借对手的牌来用，用着用着还更强","intro":"变节军将唐安德烈（Don Andres, the Renegade）是蓝黑红三色的四费吸血鬼海盗。凡是你操控、但不属于你的生物，都会 +2/+2，还会获得威慑（对手得用两个以上生物才挡得住）和死触，并且变成海盗。","build":"思路是拿对手的东西打对手：人质挟匪（Hostage Taker）先放逐对手的生物或神器，之后你就能自己把它放出来——那不属于你，主将正好给你两个珍宝。始啸埃泰力（Etali, Primal Storm）攻击时从每位对手的牌库顶翻牌，你可以免费用掉翻到的咒语。新人注意：借来的东西被解掉就还回去了。"},"Peter Parker // Amazing Spider-Man":{"tagline":"两费上场，传奇咒语还能再省一次","intro":"彼得·帕克（Peter Parker）是白蓝绿三色的两费主将，进场时先给你一个能拦住飞行生物的蜘蛛衍生物。凑齐三个颜色让他翻面后，你每施放一个传奇咒语，都可以用一个便宜的价格来放，条件是把一只已经横置的生物收回手上。","build":"牌表要装够传奇生物和传奇咒语：说书人楚兰（Chulane, Teller of Tales）让你放生物时抽一张牌，传承遗宝（Relic of Legends）产任何颜色的法术力，还能横置传奇生物多产一点。神奇蜘蛛侠（Spectacular Spider-Man）能让全队获得辟邪与不灭。新人注意：翻面要付一点无色和三个颜色各一点，先算好手上的地。"},"Aang, at the Crossroads // Aang, Destined Savior":{"tagline":"生物进进出出，安昂随时准备变身","intro":"身处十字路口的安昂（Aang, at the Crossroads）是白蓝绿三色的五费主将，会飞。他进场时先看牌库顶五张，免费放一个费用不高的生物进场；之后只要有别的生物离开场上，他在下个维持就会翻面。","build":"玩法就是让生物不停地进出：流光烁影（Ephemerate）把一只生物放逐再送回来，正好触发主将翻面，无所畏惧的卡塔拉（Katara, the Fearless）还能让这类触发再多发生一次。翻面后，每个战斗开始他都会把一块地变成能立刻进攻的生物，这些地生物也都有警戒。新人注意：翻面要等到下个维持，别以为立刻就能变。"},"Karametra, God of Harvests":{"tagline":"放一个生物，就多一块地","intro":"丰收神卡拉美特拉（Karametra, God of Harvests）是白绿双色的五费神。你每施放一个生物咒语，就能从牌库找一块树林或平原横置着放进场。她本身杀不掉，但要等你场上的绿白色法术力符号够多，她才算生物。","build":"先铺法术力，让地进场的好处滚起来：莲花眼镜蛇（Lotus Cobra）每有一块地进场就给你一点任意颜色，莽闯巴洛西（Rampaging Baloths）每落一块地就造出一只 4/4，兽群语者（Beast Whisperer）让你放生物时顺手抽牌。新人注意：她杀不掉，但绿白色永久物不够多之前也不算生物，别指望她去前线。"},"Delney, Streetwise Lookout":{"tagline":"小生物才有好处，触发还来两次","intro":"街头监哨德雷尼（Delney, Streetwise Lookout）是三费白色主将。你场上力量 2 以下的小生物，不会被力量 3 以上的大生物挡住；这些小生物的触发式异能还会额外多触发一次。你越专心用小生物做事，收益越多。","build":"牌表尽量只放身材小的生物，让主将的两次触发一直生效：永续无瑕体（Enduring Innocence）在你每只小生物进场时帮你补牌，兔位继承者（Hare Apparent）一次就能带来一整群小兔子。珍珠徽章（Pearl Medallion）让白色咒语便宜一点，方便一回合放好几只。新人注意：放一只大生物进来，它吃不到好处，思路也跑偏。"},"Imodane, the Pyrohammer":{"tagline":"打对手的生物，顺手也打对手","intro":"烈焰锤依莫丹（Imodane, the Pyrohammer）是红色的四费骑士。你施放的瞬间或法术如果只以一只生物为目标、并造成了伤害，主将就把同样的伤害复制给每一位对手。所以打生物和打人在这里是同一件事。","build":"牌表放满便宜的小伤害咒语：闪电击（Lightning Bolt）三点伤害就能顺手让每位对手掉三点血，控驭电能（Electrodominance）投入越多，打生物和打人的数字一起变大。贫窟伏击客（Guttersnipe）在你每放一个瞬间或法术时也打对手两点。新人注意：咒语只能以那一个生物为目标，一旦还想指定别的，主将就不触发。"},"Zur, Eternal Schemer":{"tagline":"把结界叫起来打人，还自带一身保护","intro":"永世阴谋家祖尔（Zur, Eternal Schemer）是白蓝黑三色的三费法师，会飞。你可以花一点白，把你场上的一个非灵气结界变成生物，攻防等于它的费用；你所有的结界生物还会获得死触、系命与辟邪。","build":"牌表以结界为主，便宜的最好：台地咒术师（Mesa Enchantress）让你每放一个结界就抽一张牌，好奇烁光体（Inquisitive Glimmer）让结界咒语都便宜一点。安全球罩（Sphere of Safety）让对手想攻击你时，每个生物都得先多付法术力。新人注意：结界变成生物后会被清场咒语扫到，辟邪挡不住清场。"},"Dr. Madison Li":{"tagline":"放神器攒能量，想用的时候花掉","intro":"麦蒂森·黎博士（Dr. Madison Li）是白蓝红三色的三费科学家。你每施放一个神器咒语就得到一个能量指示物；她可以花掉能量，给一个生物 +1/+0 并让它获得践踏与敏捷，或者抽一张牌、把坟场里的神器捞回场上。","build":"神器要放够，它们既是零件也是燃料：伊捷产能所（Izzet Generatorium）让你每次得到的能量都多一个，迅速了结（Dispatch）在你神器够多时直接把对手的生物放逐。神秘寺院（Mystic Monastery）和硫磺瀑布（Sulfur Falls）帮你把三个颜色凑齐。新人注意：三个能力都要横置她自己，一回合只能用一次，攒够能量再动。"},"Sorin of House Markov // Sorin, Ravenous Neonate":{"tagline":"一回合回够血，他就翻面成鹏洛客","intro":"马可夫家族的索霖（Sorin of House Markov）是黑白双色的两费主将，自带系命。你每次施放咒语，都可以付一点黑白，让每位对手失去 1 点生命、你回复等量；只要一个回合里回过三点以上的生命，他在战斗后的主阶段就会翻面。","build":"一条路是攒生命：护灵师（Soul Warden）在你每放一个生物时回一点，暮影蔷薇之棘维托（Vito, Thorn of the Dusk Rose）让你每次回血都顺手让对手掉等量的血。翻面成鹏洛客后，他还能按你本回合回过的血量打出伤害。新人注意：回血不到三点就不会翻面，得把施放咒语的顺序排好。"},"Aragorn, King of Gondor":{"tagline":"当上君主，全队就没人挡得住","intro":"刚铎国王阿拉贡（Aragorn, King of Gondor）是白蓝红三色的四费人类贵族，带警戒和系命。他一进场你就成为君主；之后他每次攻击，如果你还是君主，对手所有生物这回合都不能阻挡。","build":"要有人帮你守住君主：执盾女战士伊奥温（Éowyn, Shieldmaiden）在你回合里有别的人类进场时，带来两个能立刻进攻的骑士；埃奥尔勇往直前！（埃奥尔勇往直前！（Forth Eorlingas!））一次铺出一群带践踏与敏捷的骑士，正好趁对手不能阻挡时冲过去。新人注意：你被对手打中，君主就会换人，别只顾进攻。"},"The Emperor of Palamecia // The Lord Master of Hell":{"tagline":"攒够指示物就翻面，用坟场换伤害","intro":"帕拉美奇亚皇帝（The Emperor of Palamecia）是蓝红双色的两费主将。他自己能横置产蓝或红，但那份法术力只能用来放非生物咒语；你每放一个花了四点以上法术力的非生物咒语，他都会长大一点，攒够三个指示物就翻面。","build":"翻面之后靠的是坟场：意外横财（Unexpected Windfall）和大干一票（Big Score）都是一边弃牌一边抽牌，还给你两个珍宝，既能凑出四点以上的费用，也把非生物牌送进坟场；他攻击时就按坟场里这类牌的数量打每位对手。新人注意：便宜的咒语不会给他指示物，想翻面就要挑贵一点的咒语。"},"Heliod, the Radiant Dawn // Heliod, the Warped Eclipse":{"tagline":"让对手多抽牌，你的咒语就越便宜","intro":"曙光耀辉赫利欧德（Heliod, the Radiant Dawn）是白蓝双色的四费神。他翻面以后，你可以随时施放咒语，而且对手本回合每抽过一张牌，你的咒语就便宜一点；正面进场时，还能从坟场把一张结界牌收回手上。","build":"核心是让对手尽量多抽牌：横财（Windfall）让每位牌手弃掉手牌重抽，对手一次抽得多，你接下来的咒语就便宜得多；精进饰符（Talisman of Progress）和俄佐立印记（Azorius Signet）负责前期把法术力铺开。翻面要三点无色加一点蓝，那点蓝可以用两点生命代替。新人注意：你送出去的牌会变成对手的资源。"},"Maha, Its Feathers Night":{"tagline":"对手生物只剩一点防，碰一下就死","intro":"蔽夜飞羽玛哈（Maha, Its Feathers Night）是黑色的五费元素鸟，会飞、带践踏。只要她在场，对手所有生物的基础防御力都变成 1，平时看起来很大的生物，这时候一点伤害就够解决；对手想指定她，还得先弃一张牌。","build":"牌表要多放能一次削弱全场的牌：黑阳当空（Black Sun's Zenith）只要投入一点点，就能把对手所有生物一起清掉；知名凶手杀戮女郎（Massacre Girl, Known Killer）让你所有生物打出的伤害都变成 -1/-1 指示物。新人注意：对手给自家生物加的指示物仍然能救活它们，别把她单独留在前面。"},"Slimefoot, the Stowaway":{"tagline":"腐生物死一个，全场各掉一点血","intro":"寄舱客黏足（Slimefoot, the Stowaway）是黑绿双色的三费真菌。你每有一个腐生物死去，每位对手就掉 1 点血、你回 1 点；他自己也能花四点法术力造一个新的腐生物。所以这套牌是先养一群、再一个个送掉。","build":"造腐生物和牺牲腐生物都要放够：乌托菌（Utopia Mycon）每回合攒孢子指示物，攒够就换一个腐生物；真菌洛西（Mycoloth）进场时吃掉一批生物，之后每回合都给你新的腐生物；新叶树灵（Tendershoot Dryad）每个维持都补一只。新人注意：别舍不得牺牲自己人，伤害就是靠它们死掉换来的。"},"Tasigur, the Golden Fang":{"tagline":"坟场越厚，他来得越早","intro":"金牙塔西格（Tasigur, the Golden Fang）是蓝黑绿三色的六费主将。施放他时，你可以把坟场里的牌放逐掉来抵费用，所以坟场越厚，他来得越早；进场之后，你只要付得出费用就能磨两张牌，再让对手挑一张非地牌还给你。","build":"这套牌把坟场当第二个手牌用：牲祭仪式（Culling Ritual）一次清掉全场费用两点以下的非地永久物，还能顺手爆出一大笔法术力；聚污三角洲（Polluted Delta）这类找地牌帮你把三种颜色凑齐。他的能力是让对手挑要还你哪一张，所以先和谁打交道也是一门功课。新人注意：磨掉的牌也可能是你想要的。"},"Mr. Foxglove":{"tagline":"手牌比对手少就补牌，多就白放生物","intro":"狐袜先生（Mr. Foxglove）是白蓝绿三色的五费狐狸，带系命。他每次攻击时，会比较你和被攻击者手上的牌：对手手牌多，你就补上一叠；如果你一张都没补到，就可以直接从手牌免费放一个生物进场。","build":"牌表要同时准备补手牌的办法和值得免费进场的大生物：东树木灵（Kodama of the East Tree）会在别的东西进场时，让你再从手牌免费放一个永久物进场；希望天使艾维欣（Avacyn, Angel of Hope）让你场上其他永久物都获得不灭，是免费放出来最划算的一张。新人注意：免费放生物的条件是你一张牌都没补到，手牌别急着打空。"},"Minn, Wily Illusionist":{"tagline":"每回合抽到第二张牌，就多一个虚影","intro":"老成幻术师珉恩（Minn, Wily Illusionist）是三费蓝色主将。你每回合抽到第二张牌时，他就造一个会互相加大的虚影；你的虚影死掉时，你可以从手牌免费放一个永久物进场，费用不超过那只虚影的力量。","build":"这套牌一边抽牌一边送掉自己的虚影：备忘夹（Skullclamp）挂在虚影身上，它会立刻死掉，你抽两张牌，主将又顺手给你一个免费的永久物；脑力激荡（Brainstorm）和狂搜乱寻（Frantic Search）都能一次抽两张以上，帮你每回合凑到第二张牌。新人注意：虚影很小，别指望它们打伤害，它们是用来换资源的。"},"Karn, Legacy Reforged":{"tagline":"神器越多，产费越多，他也越大","intro":"神兵重铸卡恩（Karn, Legacy Reforged）是无色的五费神器生物。他的攻防等于你场上费用最高的那件神器；每个维持他还会按你操控的神器数量产出一大笔无色法术力，但那笔钱只能用来施放神器咒语。","build":"牌表要放费用高的神器，也要放让它们变便宜、变大的：铸造厂监工（Foundry Inspector）让所有神器咒语便宜一点；克撒的三块地克撒的矿脉（Urza's Mine）、克撒的动力炉（Urza's Power Plant）和克撒的塔（Urza's Tower）凑齐，一次能产出很多无色法术力。新人注意：主将产的法术力只能拿来放神器咒语。"},"Nelly Borca, Impulsive Accuser":{"tagline":"逼对手互相打，你在旁边抽牌","intro":"冲动控官内莉博卡（Nelly Borca, Impulsive Accuser）是红白双色的四费侦探，带警戒。她每次攻击时会先给对手一个生物打上标记（它获得威慑、也不能阻挡），然后逼所有被标记的生物下回合去攻击别人，而不是你。","build":"这套牌靠别人互相消耗：斗客的遗产（Duelist's Heritage）在有人进攻时给一个攻击生物连击，馈击掌（Deflecting Palm）能把打向你的一次伤害原样送回去；每当对手的生物打中别的对手，你和那位攻击者各抽一张牌。新人注意：这套牌不靠自己去打人，别把仇恨都拉到身上。"},"Beorn the Fierce":{"tagline":"一群熊越打越大，主将还顺手抽牌","intro":"凶猛的贝奥恩（Beorn the Fierce）是绿色五费主将，带践踏，你场上其他的熊都 +2/+2。每个战斗开始，他都能给一个生物一个践踏指示物、把它也变成熊；只要场上有三只以上的熊，你还能抽两张牌。","build":"牌表尽量全是熊：百熊女王阿育拉（Ayula, Queen Among Bears）在别的熊进场时给指示物，或者让它去和对手的生物互斗；黑山之威血爪（Goreclaw, Terror of Qal Sisma）让你施放力量 4 以上的生物咒语便宜两点，它攻击时这些大生物还会一起变大并获得践踏。新人注意：每回合战斗开始先用主将的能力把一只别的生物变成熊。"},"Selvala, Heart of the Wilds":{"tagline":"场上最大的生物，决定你能产多少费","intro":"荒野之心塞瓦拉（Selvala, Heart of the Wilds）是绿色三费主将。她花一点绿横置，能产出等同于你场上最大力量的任意颜色法术力；每当有生物进场、而它的力量比场上其他生物都大，它的操控者就能抽一张牌。","build":"牌表一半以上是地，其余多是便宜的产费妖精：罗堰妖精（Llanowar Elves）和妖精秘教徒（Elvish Mystic）一费就能产绿。始饥戈厄塔（Ghalta, Primal Hunger）的费用会按你生物的总力量减少，场面越大它来得越便宜。新人注意：塞瓦拉自己不打人，靠的是后面那只大家伙。"},"Ratadrabik of Urborg":{"tagline":"自家传奇生物死掉，就多一个僵尸","intro":"乌尔博格的拉塔札比（Ratadrabik of Urborg）是黑白双色的四费僵尸法师，带警戒。你场上其他传奇生物死掉时，他会造一个它的复制品——不是传奇，是一只 2/2 的黑色僵尸。也就是说，你的传奇生物被打掉，反而会多出一个。","build":"牌表要尽量放传奇生物，还要有办法主动让它们死掉：邋遢终局（Nasty End） 牺牲一个生物抽两张牌，牺牲的是传奇就抽三张；虐之华寇族黜人依拉丝（Elas il-Kor, Sadistic Pilgrim）在你每只生物死去时让对手掉血。新人注意：复制品是 2/2 的僵尸，没有原来的身材。"},"Aeve, Progenitor Ooze":{"tagline":"前面多放几个咒语，主将就多来几只","intro":"流浆先祖艾夫（Aeve, Progenitor Ooze）是绿色五费主将。他有风暴：一回合里，在他之前每施放过一个咒语，你就会多得到一个他的复制品，复制品是衍生物、不再是传奇，可以同时留在场上；他自己进场时还会按你已有的流浆数量带上指示物。","build":"所以先用便宜咒语打底，最后再放主将：生源流浆（Biogenic Ooze） 进场带一个流浆，之后每回合结束都给所有流浆加指示物；反人淤泥（Slime Against Humanity） 会造出一个带指示物的流浆衍生物，你坟场里的相关牌越多它越大。贾路的反抗（Garruk's Uprising）让全队获得践踏。新人注意：主将的风暴只算在它之前施放的咒语，顺序别弄反。"},"Narset, Enlightened Master":{"tagline":"她一攻击，就免费放出牌库顶的牌","intro":"悟道大师娜尔施（Narset, Enlightened Master）是白蓝红三色的六费武僧，带先攻和辟邪，对手很难用咒语指定她。她每次攻击时，会翻出你牌库顶的四张牌，本回合你可以免费施放其中所有的非生物咒语。","build":"所以牌库顶要放你真正想要的东西：脑力激荡（Brainstorm）让你抽三张再把两张放回牌库顶，正好替她安排好要翻出来的牌；时间延展（Time Stretch） 和来日信标（Beacon of Tomorrows） 这类额外回合的咒语被免费放出来，就是一回合接一回合地打。新人注意：她六费才下场，前期要把费用攒够。"},"Nine-Fingers Keene":{"tagline":"一套门牌，靠她翻牌库顶找门","intro":"九指姬恩（Nine-Fingers Keene）是蓝黑绿三色的四费盗贼，带威慑。她打中对手时，你会检视牌库顶九张牌，从中免费放一张门进场；如果你已经有九个以上的门，剩下的牌还会直接进你的手。","build":"牌表几乎全是门：石蜥门（Basilisk Gate）能按你门的数量把一个生物加得很大，贡德门（Gond Gate） 则让所有门进场时都不横置，节奏会顺很多。门本身大多横置进场，前期会慢一点。新人注意：要让她打中对手才有收益，她带着威慑，也有要付 9 点生命的守护。"},"Syr Konrad, the Grim":{"tagline":"有生物进坟场，每位对手就掉一点血","intro":"冷酷孔纳德爵士（Syr Konrad, the Grim）是黑色五费骑士。只要有别的生物死去、有生物牌从任何地方进坟场，或者有生物牌离开你的坟场，他就对每位对手各造成 1 点伤害。他自己还能花一点黑，让每个牌手都磨一张牌。","build":"所以磨牌和牺牲都直接变成伤害：凿灵钻（Mindcrank）会让失去生命的对手磨掉等量的牌，和主将互相推动，有时会一环接一环停不下来；苦刑生活（Tortured Existence）每次把坟场里的生物换回手上都是一次触发；播疫师（Plaguecrafter）逼每个牌手各牺牲一个生物。新人注意：你的坟场是资源，别急着清空。"},"Kelsien, the Plague":{"tagline":"配上死触后，一点伤害就能点杀","intro":"疫病凯鑫（Kelsien, the Plague）是白黑红三色的三费刺客，带警戒和敏捷，出场那一回合就能进攻。他每有一个经验指示物就 +1/+1，还能横置起来对一只你不操控的生物造成 1 点伤害；那只生物这回合死掉，你就得到一个新的经验指示物。","build":"关键是让他那一点伤害变成致命一击：蜥怪颈环（Basilisk Collar）让装备的生物获得死触与系命，他每次点掉对手一只生物，你还会回等量的血，同时他越来越大。游牧人哨站（Nomad Outpost）帮你把三个颜色凑齐。新人注意：主将一次只能做一件事，横置起来点杀生物，或者去进攻。"},"The Reaper, King No More":{"tagline":"把对手的死生物收编，变成你的人","intro":"夺命枉者（The Reaper, King No More）是黑红绿三色的六费神器生物。他进场时会给两个生物各放一个 -1/-1 指示物；之后每当一个带着这种指示物的对手生物死去，你都可以把那张牌直接放进自己场上，一回合一次。","build":"牌表围绕 -1/-1 指示物展开：绿蝇侵扰（Blowfly Infestation）让带指示物的生物死掉时，指示物会传给别的生物；司毒维齐尔哈芭恰（Hapatra, Vizier of Poisons）每次你放指示物都会带来一条小蛇；黑阳当空（Black Sun's Zenith）则一次给全场放上。新人注意：收编对手生物一回合只有一次，别浪费在小生物上。"},"Mister Negative":{"tagline":"跟对手换血，换完还能抽牌","intro":"底片先生（Mister Negative）是白黑双色的七费生物，打人时能顺手回一点血。它进场时可以和一位对手交换双方的生命总数；如果你因此少了血，就抓等量的牌。喜欢慢慢攒法术力、用一把大手牌翻盘的人会喜欢它。","build":"重点在反复用它进场那一下：流光烁影（Ephemerate）和云移（Cloudshift）都能让它先离场再回来，交换生命和抓牌就能再来一次；寇利斯之子（Children of Korlis）能把你这一回合掉的血一次补回来。阶层饰符（Talisman of Hierarchy）这类产费牌帮忙凑齐七费。新人注意：它很贵，前期先专心铺地。"},"Anzrag, the Quake-Mole":{"tagline":"逼对手来挡，挡住就再打一轮","intro":"地动鼹鼠安札格（Anzrag, the Quake-Mole）是红绿双色的四费生物。只要它被挡住，你所有生物就重新站起来，而且这一回合还会多出一次战斗；它自己也能花费用强迫对手来挡。喜欢一轮接一轮进攻、不想慢下来的人会喜欢它。","build":"套牌里要放够逼对手阻挡的牌：挑战之吼（Roar of Challenge） 这类牌能让对手非挡不可，主将一被挡住就能重置全场、多打一轮。荒野韵律（Rhythm of the Wild）让你的生物不能被反击、进场还能选一个加成，贾路的反抗（Garruk's Uprising）给全队践踏。新人注意：多打的几轮会耗光对手的阻挡者，自己也要留够法术力。"},"Imoti, Celebrant of Bounty":{"tagline":"大咒语自带连锁，一波接一波","intro":"恩赐主祭依莫提（Imoti, Celebrant of Bounty）是蓝绿双色的五费生物。它自己会从牌库顶一路往下翻，翻到一张更便宜的牌就免费放出来；你放的六费以上大咒语也一样。喜欢越打越大、白拿的东西越滚越多的人会喜欢它。","build":"先铺好法术力，然后开始放大的：始饥戈厄塔（Ghalta, Primal Hunger）和碎船惊惧兽（Hullbreaker Horror）这类大生物一进场，就顺带免费翻出更便宜的一张。贾路的反抗（Garruk's Uprising）给全队践踏。新人注意：翻出来的是牌库顶的随机牌，别指望每次都翻到想要的那张。"},"Gisa, the Hellraiser":{"tagline":"僵尸越堆越多，主将还护得紧","intro":"狱尸唤师基沙（Gisa, the Hellraiser）是黑色的五费主将。她让你场上的骷髅和僵尸都更大一点、更难挡住；只要你针对对手做了点小动作，就会多出两只僵尸。喜欢堆一大群僵尸、慢慢淹过去的人会喜欢它。","build":"主流是僵尸群：死亡爵主（Death Baron）给骷髅和僵尸再加一层强化，不死卜算师（Undead Augur）在你自己的僵尸死掉时帮你抓牌，安福陵的暗贾（Gray Merchant of Asphodel）一次把对手的血削掉一大截。黑玉徽章（Jet Medallion）让你的黑色咒语更便宜。新人注意：主将有守护，但别让它单独待在前排。"},"Felix Five-Boots":{"tagline":"打到人，触发的东西全算两遍","intro":"五靴菲利斯（Felix Five-Boots）是蓝黑绿三色的五费生物，自己有威慑和守护。它的本事是：只要你的生物打到对手、触发了你场上永久物的异能，那个异能就会再触发一次。喜欢用一串小好处慢慢把优势堆起来的人会喜欢它。","build":"关键是那些打到人就有好处的牌：欧然霜牙蛇（Ohran Frostfang）和塔萨的双叉戟（Bident of Thassa）都能在生物打中对手时抓牌，有主将在，一次就是两张；密讯信使托斯奇（Toski, Bearer of Secrets）也一样。内陆港湾（Hinterland Harbor）这类地负责把三色凑齐。新人注意：打不到人就什么都不会发生。"},"Hapatra, Vizier of Poisons":{"tagline":"放一个指示物，就多一条蛇","intro":"司毒维齐尔哈芭恰（Hapatra, Vizier of Poisons）是黑绿双色的两费生物，打中对手时能让一个生物变小。每次你往某个生物身上放这种变小的指示物，就会多一条带死触的小蛇。喜欢用一堆小蛇慢慢磨、看对手生物一点点变小的人会喜欢它。","build":"铺场路线是放指示物换蛇：黑阳当空（Black Sun's Zenith）一次给全场生物都放上指示物，转头就是一片蛇；绿蝇侵扰（Blowfly Infestation）让指示物在生物死后一个个传下去；掠行死灵（Necroskitter）能把对手带着指示物死掉的生物捡回来自己用。新人注意：主将自己也是蛇的来源，别忘了让它去攻击。"},"Magnus the Red":{"tagline":"衍生物越多，法术越便宜","intro":"红魔马格努斯（Magnus the Red）是蓝红双色的五费生物，自己会飞。你场上的衍生物越多，你放的瞬间和法术就越便宜；它打中对手也能造出一个衍生物。喜欢一口气放很多小咒语、用一片衍生物压过去的人会喜欢它。","build":"先铺造衍生物的牌：托腾坦之歌（Song of Totentanz）和净空繁殖地（Empty the Warrens）能一次堆出一片，之后你的瞬间和法术就越放越便宜。荣休大法师（Archmage Emeritus）在你放或复制这类咒语时抓牌，暴风窑艺家（Storm-Kiln Artist）帮你产法术力。新人注意：这些衍生物本身很弱，别拿它们去挡大生物。"},"Black Panther, Wakandan King":{"tagline":"把地当仓库，攒够了搬到生物上","intro":"瓦坎达之王黑豹（Black Panther, Wakandan King）是白绿双色的两费主将。有生物进场，它就往你的一块地上放一个 +1/+1 指示物；攒够了再花三点法术力，一次全搬到某个生物身上。喜欢慢慢积累、然后一次爆发的人会喜欢它。","build":"铺场的关键是不断有生物进场：卫护荒漠（Secure the Wastes）能一次造出一小队战士，每只都给地加指示物；托望神（Kami of Whispered Hopes）让每次放指示物都多一个。把指示物搬到生物上时还会回血抓牌，欧佐晶岩（The Ozolith）能在生物离场时保住这些指示物。新人注意：主将自己不擅长大打出手，前期别让它单独冲。"},"Amalia Benavides Aguirre":{"tagline":"一加血就探索，攒到二十清场","intro":"阿玛利亚贝纳维德阿格雷（Amalia Benavides Aguirre）是白黑双色的两费主将。每次你回血，她都会探索一次：是地就进手，否则自己变大一点。等她的力量刚好到二十，其他生物全被清掉。喜欢边回血边养大一只生物的人会喜欢它。","build":"铺一堆有生物进场就回血的小家伙：护灵师（Soul Warden）和灵魂照护僧（Soul's Attendant）负责持续回血，主将就持续变大。执政官威权（Authority of the Consuls）让对手的生物进场时都得横着，同时还在给你加血。新人注意：对手想动她就得先付三点血，但前期别指望她替你挡。"},"Arixmethes, Slumbering Isle":{"tagline":"先当一块地产费，睡醒就变大怪","intro":"静眠岛屿阿力马昔斯（Arixmethes, Slumbering Isle）是蓝绿双色的四费主将。刚出场时它就是一块地，能产两点法术力；你每放一个咒语就能去掉一个睡眠指示物，睡够了就变成大海怪。喜欢前期不缺法术力的人会喜欢它。","build":"前期它就是一块地，成长涡旋（Growth Spiral）这类咒语既能帮你多放一块地，本身也算放了一个咒语，可以顺手把它叫醒得更快。贾路的反抗（Garruk's Uprising）给全队践踏，大海怪就算被小生物挡住也照样打到对手。新人注意：睡着的时候它不是生物，别指望它去挡。"},"Arthur, Marigold Knight":{"tagline":"每次进攻都白拉一个帮手","intro":"金盏花骑士亚瑟（Arthur, Marigold Knight）是白蓝红三色的五费主将，自带敏捷，出场就能打。只要它和别的生物一起进攻，就免费从牌库顶翻出一个生物跟着打；战斗结束它回手，下次还能再来。喜欢每次进攻都多一个打手的人会喜欢它。","build":"寡言港法师（Dour Port-Mage）在生物离场回手时帮你抓牌，正好配上亚瑟每回合把打手送回手上；旭日泰坦（Sun Titan）被拉进场时就在攻击，能立刻从坟场带回一张小永久物。遗迹天使（Angel of the Ruins）被拉进来时能顺手放逐神器或结界。新人注意：一定要凑够两只以上的进攻者，效果才会启动。"},"Progenitus":{"tagline":"十费的巨兽，几乎没人动得了它","intro":"祖神兽（Progenitus）是五色的十费主将，很难被伤到、指到或挡住；就算它要进坟场，也会先回到牌库。整套牌就是想办法尽快凑出十点法术力，把它放出来。喜欢大后期、养一只谁都处理不掉的大兽的人会喜欢它。","build":"全部重心都在法术力：映奇宝珠的余韵（Mirari's Wake）让每块地多产一点，仙林境接骨木（Faeburrow Elder）在中期一次能产好几点。五阳护手（Fist of Suns）让你付五个颜色各一就能把它放出来，省下五点；世界树（The World Tree）在场时你的地能产任意颜色。新人注意：放它之前你会一直在铺地，要有耐心。"},"Massacre Girl, Known Killer":{"tagline":"把对手生物全变小，死了就抽牌","intro":"知名凶手杀戮女郎（Massacre Girl, Known Killer）是黑色的四费主将，自己有威慑。你所有生物造成的伤害都变成 -1/-1 指示物，把对手的生物越打越小；它们被减到 0 或更低而死时，你还能抓一张牌。喜欢控场磨光对手的人会喜欢它。","build":"黑阳当空（Black Sun's Zenith）一次给全场生物放上一堆 -1/-1 指示物，被清掉的对手生物还能让主将帮你抓上几张牌；绿蝇侵扰（Blowfly Infestation）让指示物在生物死后继续传下去，掠行死灵（Necroskitter）能把对手带指示物死掉的生物捡回来。新人注意：这套牌偏慢，要多留几手应对，别把自己摊空。"},"Camellia, the Seedmiser":{"tagline":"松鼠越生越多，吃了食物就变强","intro":"守种奴卡茉拉（Camellia, the Seedmiser）是黑绿双色的三费主将，它自己和别的松鼠都有威慑。每当你牺牲一个食物，就多一只松鼠；它还能觅食，让其他松鼠都变大。喜欢养一大群松鼠、看它们一起冲过去的人会喜欢它。","build":"铺场全靠食物和松鼠：金鹅（Gilded Goose）和佩里格林·图克（Peregrin Took）不断给你塞食物，叽响喷吐器（Chitterspitter）让松鼠整体变大，松鼠将军聒牙（Chatterfang, Squirrel General）造衍生物时还会多出一批。新人注意：牺牲食物是好事，别舍不得；强化要点在自己身上，记得留法术力。"},"Davros, Dalek Creator":{"tagline":"逼对手掉血，掉够就多一个戴立克","intro":"戴立克创造者戴沃斯（Davros, Dalek Creator）是蓝黑红三色的四费主将，自己带威慑。只要让对手一回合掉三点以上血，回合结束就能造出一个戴立克，还逼对手选：要么让你抓一张牌，要么自己弃一张牌。喜欢烧血又让对手手牌变少的人会喜欢它。","build":"套牌里几乎都是能顺手打血的神器生物，消灭！（Exterminate!） 之类的牌负责清掉挡路的生物；每回合结束时造出的戴立克本身就是神器生物，戴立克的起源（Genesis of the Daleks） 能一次铺出一队。崩毁古陵寝（Crumbling Necropolis）这类三色地保证法术力不缺。新人注意：一定要在回合结束前让对手掉到三点血，不然这回合什么都不会发生。"},"Averna, the Chaos Bloom":{"tagline":"翻牌翻到的地，直接铺进场","intro":"混沌之华阿韦纳（Averna, the Chaos Bloom）是蓝红绿三色的三费主将。你放那些会倾曳的牌时，会从牌库顶一路翻出一张更便宜的牌免费放出来；阿韦纳让你能把翻到的地也直接放进场。喜欢越打越顺、地越铺越多的人会喜欢它。","build":"整套牌都围着倾曳转：涡心漫游怪（Maelstrom Wanderer）一次翻两张，血辫妖精（Bloodbraid Elf） 和 夷世霸兽（Apex Devastator） 也都是这类牌，每翻一次就可能免费多铺一块地。新人注意：翻出来的地是横着进场的，当回合不能用；倾曳翻出来的是随机牌，翻到大牌就赚，翻到小牌也别失望。"},"Rivaz of the Claw":{"tagline":"从坟场里一条条放龙出来","intro":"龙爪利瓦兹（Rivaz of the Claw）是黑红双色的三费主将，带威慑。它能一次产两点只能用来放龙的法术力，而且每回合都能从坟场里再放一条龙出来。喜欢大龙一条接一条、把坟场也当资源用的人会喜欢它。","build":"先用丧信掠夺（Faithless Looting）把龙丢进坟场，再用主将把它们请回场上；龙后拉黎丝（Lathliss, Dragon Queen）会让每一条新龙都带出一条龙，龙袭风暴（Dragon Tempest）则在龙进场时打对手一下。新人注意：从坟场放出来的龙死后会被放逐，别指望再用第二次。"},"Tasha, the Witch Queen":{"tagline":"用对手的牌，打对手的人","intro":"巫后塔莎（Tasha, the Witch Queen）是蓝黑双色的五费主将。她加忠诚就能抓一张牌，并把对手坟场里的瞬间或法术放逐、记上一笔；之后可以不付费用直接放出那些牌。放不是自己的牌时，还会多一个恶魔。喜欢借对手的牌反打的人会喜欢它。","build":"核心是拿对手牌库和坟场里的东西：人质挟匪（Hostage Taker）先把对手的一个生物或神器借过来，心智窃贼（Thief of Sanity） 和 奢华领主贡提（Gonti, Lord of Luxury） 则把对手牌库顶的牌拿走放逐。底密尔印记（Dimir Signet）帮你更快凑到五点。新人注意：她不擅长正面硬拼，前期要多留应对手段。"},"Karlov of the Ghost Council":{"tagline":"回一次血就长大，攒够就放逐","intro":"鬼影议会的卡洛夫（Karlov of the Ghost Council）是白黑双色的两费主将。你每次回血，它就多两个 +1/+1 指示物；攒够六个，再付一白一黑两点法术力，就能把对手一个生物放逐掉。喜欢一边回血一边攒个随时能用的解场手段的人会喜欢它。","build":"铺一堆有生物进场就回血的小家伙：护灵师（Soul Warden）和灵魂照护僧（Soul's Attendant）让每次进场都算数，暮影蔷薇之棘维托（Vito, Thorn of the Dusk Rose）把回血直接变成对手掉血。新人注意：放逐要花掉六个指示物，别急着用，留着对付最麻烦的那只。"},"Baral, Chief of Compliance":{"tagline":"盯着对手的手，关键时候拦一手","intro":"监察长巴罗（Baral, Chief of Compliance）是蓝色的两费主将。你放的瞬间和法术都更便宜；每当你反击掉对手一个咒语，就能抓一张再弃一张，等于顺手把牌筛一遍。喜欢盯着对手的动作、在关键时刻出手阻拦的人会喜欢它。","build":"套牌里放一批反击咒语：无法拒绝的条件（An Offer You Can't Refuse）只花一点蓝就能挡下对手的非生物咒语，是便宜好用的选择。荣休大法师（Archmage Emeritus）在你放或复制瞬间、法术时抓牌，蓝宝石徽章（Sapphire Medallion）让蓝色咒语更便宜。新人注意：反击要用在真正要紧的牌上，别看到什么都拦。"},"Hamza, Guardian of Arashin":{"tagline":"指示物越多，大生物越便宜","intro":"阿拉辛守护者哈姆札（Hamza, Guardian of Arashin）是白绿双色的六费主将。带 +1/+1 指示物的生物越多，它和你之后放的生物都越便宜。先铺一群小生物撒上指示物，大生物就会越来越便宜。喜欢场面越铺越大的人会喜欢它。","build":"坚固鳞甲（Hardened Scales）让每次放指示物都多一个，遗世先人（Forgotten Ancient）会随着每次有人放咒语不断攒指示物，还能转给别人。振奋呼号（Inspiring Call）能让你场上的生物全部不灭，同时按指示物的数量抓一把牌。新人注意：前期先铺小的、把指示物撒开，主将别急着放。"},"Bre of Clan Stoutarm":{"tagline":"回血越多，白拿的牌越大","intro":"勇臂族的碧莉（Bre of Clan Stoutarm）是红白双色的四费主将。她能让另一个生物暂时会飞、还能吸血；回合结束时，如果你这回合回过血，就从牌库顶往下翻牌，翻到的牌够便宜就能直接免费放出来。喜欢回血换大牌这套循环的人会喜欢它。","build":"风之水晶（The Wind Crystal）让你回的血翻倍，罗克维念师（Rhox Faithmender）也一样；护灵师（Soul Warden）负责每回合稳定回一点。回血越多，回合结束能免费放出来的牌就越大。新人注意：这回合要是没回血，主将的异能什么都不会发生，所以要让回血变成习惯。"},"Jinnie Fay, Jetmir's Second":{"tagline":"所有衍生物都变成猫或狗","intro":"杰米尔副手金妮斐（Jinnie Fay, Jetmir's Second）是红白绿三色的三费主将。本来该造出来的各种衍生物，你都可以改成 2/2 带敏捷的猫，或者 3/1 带警戒的狗。喜欢铺得快、进攻凶的人会喜欢它。","build":"套牌里几乎每张牌都在造衍生物：渐强终响（Grand Crescendo）一次造出一片，冲击震颤（Impact Tremors）让每个进场的小家伙都顺手打对手一点，欢宴魔杰米尔（Jetmir, Nexus of Revels）在你生物够多时给全队加成。新人注意：敏捷的猫能当回合就冲上去，警戒的狗更适合留下来挡，什么时候用哪种要想一下。"},"Ashling, Rekindled // Ashling, Rimebound":{"tagline":"来回翻面，大咒语越放越顺","intro":"复炎灰儿（Ashling, Rekindled）是蓝红双色的两费双面主将。一面在你翻面或进场时帮你换一张手牌；翻到另一面，它会给你两点只能用来放四费以上咒语的法术力。花红蓝各一点就能来回翻，大咒语越放越顺。","build":"两条路配合得很好：索蓝发电机（Thran Dynamo）一次产三点无色法术力，帮你在前期凑够四点；阳禽祝愿（Sunbird's Invocation）在你放咒语时从牌库顶翻牌，正好放大的；大干一票（Big Score）既能抓牌又能造宝物。新人注意：翻面要花钱，别每一轮都翻，攒够想放的牌再切。"},"Loot, Exuberant Explorer":{"tagline":"地铺得越多，免费生物越大","intro":"兴奋探险家烂宝（Loot, Exuberant Explorer）是绿色的三费主将。它让你每回合能多放一块地，还能花六点法术力，从牌库顶六张里直接免费放出一个费用不超过你地数量的生物。喜欢一块块铺地、再换成大家伙的人会喜欢它。","build":"铺地本身就是收益：罗堰妖精（Llanowar Elves）帮你多产法术力，赞迪卡复仇者（Avenger of Zendikar）和莽闯巴洛西（Rampaging Baloths）每放一块地就造出一批衍生物，硬盔虫聚群（Scute Swarm）更是越铺越多。新人注意：地越多，主将能免费放出的生物越大，所以前期别舍不得放地。"},"Anim Pakal, Thousandth Moon":{"tagline":"打得越多，侏儒衍生物越多","intro":"千月统帅阿妮帕卡（Anim Pakal, Thousandth Moon）是红白双色的三费主将。只要你带着真的生物进攻（侏儒衍生物不算），它就先攒一个 +1/+1 指示物，然后造出等量的 1/1 神器生物衍生物，跟着一起打。喜欢越打人越多的人会喜欢它。","build":"用一群便宜的小生物先开打，主将指示物越多，造的侏儒就越多：南小路的罗西·科顿（Rosie Cotton of South Lane）在你造衍生物时顺手放指示物，冲击震颤（Impact Tremors）让每个进场的小家伙都打对手一点。新人注意：衍生物是横着进场直接参战的，但别把它们当长期防线。"},"Mizzix of the Izmagnus":{"tagline":"经验攒起来，法术越放越便宜","intro":"伊捷首法师米捷兹（Mizzix of the Izmagnus）是蓝红双色的四费主将。你放比现有经验指示物更大的瞬间或法术，就多一个经验指示物；经验越多，之后所有瞬间和法术都越便宜。喜欢先小打小闹、后面法术几乎免费的人会喜欢它。","build":"泰兹瑞的计策（Tezzeret's Gambit）抓两张牌还能增殖，帮你把经验指示物攒得更快；暴风窑艺家（Storm-Kiln Artist）在你放或复制瞬间、法术时造宝物，帮你付那些越来越大的咒语；狂搜乱寻（Frantic Search）换牌的同时还能重置三块地。新人注意：先用便宜的法术把经验攒起来，别一开始就想放大招。"},"Atarka, World Render":{"tagline":"每条龙进攻都打两倍伤害","intro":"灭世龙王安塔卡（Atarka, World Render）是红绿双色的七费主将，自己会飞、有践踏。它的好处很简单：你场上任何一条龙进攻，都会获得连击，一下顶两下。喜欢攒一群大龙、直接压过去的人会喜欢它。","build":"龙的费用是最大的问题，龙语祭师（Dragonspeaker Shaman）和龙王仆役（Dragonlord's Servant）都能让龙更便宜；龙袭风暴（Dragon Tempest）在你龙进场时打对手一下，还能让它们当回合就有行动力。新人注意：前期都在铺法术力，别急着放主将；龙被清掉一次就很难追回来。"},"General Ferrous Rokiric":{"tagline":"放一张双色牌，就多一个魔像","intro":"费罗洛基理将军（General Ferrous Rokiric）是红白双色的三费主将，对手的单色招数拿它没办法。你每放一张双色咒语，就会多一个 4/4 的红白魔像。喜欢手牌几乎全是双色牌、每次出手都能带点东西的人会喜欢它。","build":"整套牌几乎都该是红白双色牌：波洛斯护符（Boros Charm）能一次给全队不灭，馈击掌（Deflecting Palm）把对手的一次大伤害原样送回去。刀锋史家（Blade Historian）让所有进攻的生物都获得连击，正好和一堆 4/4 魔像配得上。新人注意：只放双色牌，看到同色的单色好牌先忍住。"},"Emmara, Soul of the Accord":{"tagline":"横置一次，就多一个士兵","intro":"协音之魂艾玛拉（Emmara, Soul of the Accord）是白绿双色的两费主将。她只要被横置，就会造出一个 1/1 带系命的士兵，所以拿她去产法术力、或者帮忙付咒语的费用，都是在白拿人。喜欢地面越铺越宽的人会喜欢它。","build":"坚守者聚落（Holdout Settlement）和雅斯佩树哨卫（Jaspera Sentinel）都能横置生物来产任意颜色的法术力，每横一次就多一个士兵；羊屯斗士（Champion of Lambholt）在你生物进场时不断变大，越大对手越挡不住。新人注意：前期尽量每回合都找机会横置她一次，别让她闲着。"},"Scion of the Ur-Dragon":{"tagline":"花两费就能变成坟场里任何一条龙","intro":"太初龙后裔（Scion of the Ur-Dragon）是五色五费巨龙，自己会飞。花两点法术力，它就能从牌库里挑一条龙丢进坟场，然后变成那条龙的模样打到回合结束。喜欢龙、又爱翻牌库找答案的人会喜欢它。","build":"牌表塞满大龙：裂坟庞巨龙（Colossal Grave-Reaver）进场或攻击都帮你把牌库顶三张送进坟场，上古龙卫米瑞穆（Miirym, Sentinel Wyrm）让每条龙进场都多带一个复制，命途交错（Crux of Fate）想留龙就留龙、想清场就清场。新人注意：主将的复制每次都要付费用，法术力要留够。"},"Rhys the Redeemed":{"tagline":"一费出场，小妖精越滚越多","intro":"复耀黎兹（Rhys the Redeemed）是白绿两色、只要一点法术力的精灵战士。她既能不断造出小妖精，也能把场上所有衍生物原样再复制一份。喜欢从零开始铺场、看着小兵越来越多的人会喜欢她。","build":"前期靠罗堰妖精（Llanowar Elves）和泰坦尼亚牧师（Priest of Titania）产法术力，妖精高位德鲁伊（Elvish Archdruid）让妖精更大，骄傲至美（Imperious Perfect）还能造新的。平行生命（Parallel Lives）让每次造衍生物都翻倍，人一多就能一波推过去。新人注意：主将很便宜，早点让她上场，每回合都干活。"},"Jarad, Golgari Lich Lord":{"tagline":"把坟场堆满，再一口气砸向对手","intro":"葛加理巫妖领主贾雷（Jarad, Golgari Lich Lord）是黑绿两色的四费丧尸妖精，坟场里每多一张生物牌，他就更大一圈。他还能牺牲一个生物，让所有对手一起掉生命。喜欢慢慢堆坟场、再一次性爆发的人会喜欢他。","build":"思路是往坟场里塞生物：碎身惧妖（Splinterfright）和葛加理墓地巨魔（Golgari Grave-Troll）自己会把牌库顶的牌磨下去，绝灭领主（Lord of Extinc
