<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你是哪种指挥官？— EDH 新人主将挑选测试</title>
<style>
  :root{
    --w:#f8f0d8; --u:#a5cfe8; --b:#c9b8d4; --r:#f0a898; --g:#a8d4b0;
    --bg:#0f1218; --bg2:#161b24; --panel:#1b2130; --line:#2a3345;
    --ink:#e8edf6; --dim:#94a3b8; --accent:#7dd3fc; --gold:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#1e293b 0%,var(--bg) 55%);
    color:var(--ink); min-height:100vh; padding:24px 16px 64px;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 20px 50px -30px #000}
  h1{font-size:clamp(24px,4.4vw,38px);line-height:1.25;letter-spacing:-.01em}
  h2{font-size:20px;margin-bottom:12px}
  h3{font-size:15px;color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  p{color:#cbd5e1}
  .lead{font-size:16px;color:#cbd5e1;margin-top:14px}
  .muted{color:var(--dim);font-size:13.5px}
  .btn{
    appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;
    background:linear-gradient(180deg,#38bdf8,#0ea5e9);color:#04121c;
    padding:14px 30px;border-radius:11px;transition:.16s;font-size:16px
  }
  .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink);border-color:#3d4a63}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .mt{margin-top:22px}.mt-s{margin-top:12px}

  /* 进度 */
  .bar{height:6px;background:#0d1119;border-radius:99px;overflow:hidden;margin-bottom:8px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#7dd3fc);width:0;transition:width .28s ease}
  .sechead{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}

  /* 选项 */
  .opt{
    display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:#141a26;border:1px solid var(--line);border-radius:12px;
    padding:15px 18px;color:var(--ink);margin-bottom:10px;transition:.13s;position:relative
  }
  .opt:hover{border-color:#3f5170;background:#182030;transform:translateX(2px)}
  .opt.on{border-color:var(--accent);background:#12283a;box-shadow:0 0 0 1px var(--accent) inset}
  .opt .idx{display:inline-block;min-width:22px;color:var(--dim);font-size:13px;font-weight:700}
  .opt.on .idx{color:var(--accent)}
  .qtext{font-size:19px;font-weight:600;margin:6px 0 18px;line-height:1.5}

  /* 颜色符号 */
  .pips{display:inline-flex;gap:4px;vertical-align:middle}
  .pip{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#131820;border:1px solid #0006}
  .pip.W{background:var(--w)}.pip.U{background:var(--u)}.pip.B{background:var(--b)}
  .pip.R{background:var(--r)}.pip.G{background:var(--g)}.pip.C{background:#c8cdd6}

  /* 结果 */
  .hero{border-radius:16px;padding:26px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;opacity:.09;pointer-events:none;
    background:radial-gradient(400px 200px at 90% 0%,var(--glow,#7dd3fc),transparent)}
  .hero .rank{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
  .hero .name{font-size:clamp(22px,3.6vw,30px);font-weight:800;line-height:1.2;margin:6px 0 2px}
  .hero .zh{font-size:15px;color:var(--dim);margin-bottom:14px}
  .alt{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#141a26;margin-top:12px}
  .alt .n{font-weight:700;font-size:16px}
  .alt .z{font-size:13px;color:var(--dim)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
  .stat{background:#121822;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .stat .k{font-size:11.5px;color:var(--dim);letter-spacing:.05em}
  .stat .v{font-size:17px;font-weight:700;margin-top:2px}

  .axis{margin-bottom:9px}
  .axis .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
  .axis .lab b{font-weight:600}
  .axis .track{height:7px;background:#0d1119;border-radius:99px;overflow:hidden}
  .axis .track > i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#38bdf8);border-radius:99px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:12px;padding:3px 10px;border-radius:99px;background:#1d2736;border:1px solid var(--line);color:#b9c6da}
  .chip.axis{background:#12283a;border-color:#22506e;color:#9ddcf8}
  /* ---- 主将池浏览 ---- */
  .poolinput{width:100%;box-sizing:border-box;padding:11px 14px;font-size:15px;
    border-radius:12px;border:1px solid var(--line);background:#0d1119;color:var(--fg);
    font-family:inherit}
  .poolinput:focus{outline:none;border-color:#22506e}
  .poolchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .poolchip{font-size:12.5px;padding:5px 11px;border-radius:99px;background:#1d2736;
    border:1px solid var(--line);color:#b9c6da;cursor:pointer;user-select:none}
  .poolchip.on{background:#12283a;border-color:#22506e;color:#9ddcf8;font-weight:600}
  .poolrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
    border:1px solid transparent;cursor:pointer}
  .poolrow:hover{background:#151c27;border-color:var(--line)}
  .poolrow .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poolrow .meta{font-size:12px;color:var(--dim);white-space:nowrap;flex-shrink:0}
  .pooldetail{padding:2px 11px 14px;font-size:14px;line-height:1.75;color:#cbd5e1}
  .poolmore{text-align:center;padding:10px}
  .poolmore button{padding:9px 18px}
  .btn.sm{padding:8px 14px;font-size:13.5px}
  .tagline{font-size:15px;font-weight:600;color:var(--gold);margin:8px 0 4px;letter-spacing:.01em}
  .hero .tagline{font-size:17px}
  .block{margin-top:16px}
  .block .bt{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--dim);
    text-transform:uppercase;margin-bottom:6px}
  .block p{font-size:14.5px;line-height:1.78;color:#cbd5e1}
  .cards{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .cc{font-size:12.5px;padding:5px 11px;border-radius:8px;background:#101a24;
    border:1px solid #24384a;color:#9fb4c8}
  .cc b{color:#dfeaf4;font-weight:600}
  .cc i{font-style:normal;color:#67809a;font-size:11px;margin-left:5px}
  .cc.key{border-color:#3a5a78;background:#12252f}
  a{color:var(--accent)}
  .divider{height:1px;background:var(--line);margin:22px 0}
  .warn{background:#2a1f14;border:1px solid #5c3f1c;color:#f5d9a8;padding:12px 14px;border-radius:10px;font-size:13.5px}
  @media(max-width:560px){.card{padding:20px}.hero{padding:20px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script id="payload" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  var NO_DOM = (typeof document === "undefined") || !document.getElementById;
  var DATA = (typeof globalThis !== "undefined" && globalThis.__QUIZ_DATA__)
    ? globalThis.__QUIZ_DATA__
    : JSON.parse(document.getElementById("payload").textContent);
  var Q = DATA.quiz, CMDS = DATA.commanders, AXES = DATA.axes, TAGZH = DATA.tagZh || {};
  var DESC = DATA.descriptions || {}, CARDINFO = DATA.cardInfo || {},
      CARDS = DATA.cardDisplay || {};

  var CONST = { W_SIM:0.60, W_COLOR:0.14, W_POPULAR:0.08, P_COST:0.055, P_BUDGET:0.050,
                P_SALT:0.10, P_BRACKET:0.030,
                // 颜色契合内部拆分：哪几个色 50% + 要几个色 50%
                // 必须与 scripts/engine.py 的 W_COLOR_MATCH / W_BREADTH_MATCH 一致，
                // 否则 parity_compare.py 会报两个引擎不一致。
                W_COLOR_MATCH:0.50, W_BREADTH_MATCH:0.50 };
  var DEFAULT_C = { complex:3, budget:3, salt:3 };
  // 接触时长 → 整套评分标准的切换参数（与 Python 引擎 engine.py 的 EXP_PROFILE 一致）
  var EXP_PROFILE = {
    1: { name:"完全新人",               complexCap:1.6, popMul:1.35, bracketCap:2 },
    2: { name:"玩过万智牌，没打过指挥官", complexCap:2.6, popMul:1.20, bracketCap:3 },
    3: { name:"打过一段时间指挥官",      complexCap:3.8, popMul:1.00, bracketCap:4 },
    4: { name:"老手",                   complexCap:5.0, popMul:0.85, bracketCap:5 }
  };
  var SALT_THRESHOLD = { 1:0.6, 2:1.0, 3:1.4, 4:2.0, 5:3.2 };
  // 连续插值，避免取整（Python round 与 JS Math.round 在 x.5 处分叉）与档位跳变
  function saltCapFor(tolerance) {
    var v = Math.min(5, Math.max(1, tolerance));
    var low = Math.floor(v), high = Math.min(5, low + 1), frac = v - low;
    return SALT_THRESHOLD[low] * (1 - frac) + SALT_THRESHOLD[high] * frac;
  }
  // 快速版题序由构建脚本注入（Q.quick，主线题 id 的子集；分支题照常触发）
  var QUICK = (Q.quick || []).slice();

  var state = { mode:"full", current:null, history:[], answers:{} };

  /* ---------- 工具 ---------- */
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function pips(colors) {
    if (!colors || colors === "C") return '<span class="pips"><i class="pip C">◇</i></span>';
    return '<span class="pips">' + colors.split("").map(function (c) {
      return '<i class="pip ' + c + '">' + c + "</i>";
    }).join("") + "</span>";
  }
  function tagZh(t) { return TAGZH[t] || t; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }

  /* ---------- 算分（与 engine.py 保持一致） ---------- */
  function tally() {
    var pref = {}, expected = {}, colors = {}, acc = { complex:[], budget:[], salt:[] };
    var breadthVals = [];
    var expLevel = null;
    // 题目路径是动态的，所以直接遍历整个题库、只统计已作答的题
    Q.all.forEach(function (q) {
      if (!(q.id in state.answers)) return;
      var picked = state.answers[q.id];
      var idxs = Array.isArray(picked) ? picked : [picked];
      // 「期望值」：这一题如果随便答，平均会拿到的向量。多选题按选了几项等比放大。
      var share = q.opts.length ? idxs.length / q.opts.length : 0;
      q.opts.forEach(function (o) {
        Object.keys(o.s || {}).forEach(function (a) {
          expected[a] = (expected[a] || 0) + o.s[a] * share;
        });
      });
      idxs.forEach(function (i) {
        var o = q.opts[i]; if (!o) return;
        Object.keys(o.s || {}).forEach(function (a) { pref[a] = (pref[a] || 0) + o.s[a]; });
        Object.keys(o.col || {}).forEach(function (c) { colors[c] = (colors[c] || 0) + o.col[c]; });
        Object.keys(o.cval || {}).forEach(function (k) { acc[k].push(o.cval[k]); });
        if (o.bw != null) breadthVals.push(o.bw);
        if (o.exp) expLevel = o.exp;
      });
    });
    // 只保留「这个人与平均答题者的差异」——140 多题累加出的共同分量会淹没个人口味，
    // 导致所有人的偏好向量彼此相似、推荐被少数「居中」的主将垄断。必须与 Python 引擎一致。
    var centered = {}, axis;
    var seen = {};
    Object.keys(pref).forEach(function (a) { seen[a] = 1; });
    Object.keys(expected).forEach(function (a) { seen[a] = 1; });
    for (axis in seen) centered[axis] = (pref[axis] || 0) - (expected[axis] || 0);
    var cons = {};
    Object.keys(DEFAULT_C).forEach(function (k) {
      cons[k] = acc[k].length ? acc[k].reduce(function (a, b) { return a + b; }, 0) / acc[k].length
                              : DEFAULT_C[k];
    });
    cons.exp = expLevel || 3;
    // 玩家想要的色数（0 = 无色，1 = 五色）。没答到广度题时取 0.5（两色，最常见）。
    cons.breadth = breadthVals.length
      ? breadthVals.reduce(function (a, b) { return a + b; }, 0) / breadthVals.length
      : 0.5;
    return { pref:centered, colors:colors, cons:cons };
  }
  function cosine(a, b) {
    var keys = {}, dot = 0, na = 0, nb = 0, k;
    Object.keys(a).forEach(function (x) { keys[x] = 1; });
    Object.keys(b).forEach(function (x) { keys[x] = 1; });
    for (k in keys) {
      var av = a[k] || 0, bv = b[k] || 0;
      dot += av * bv; na += av * av; nb += bv * bv;
    }
    return (na && nb) ? dot / Math.sqrt(na * nb) : 0;
  }
  function rank(t) {
    var maxDecks = Math.max.apply(null, CMDS.map(function (c) { return c.num_decks || 1; }));
    var maxColor = Math.max.apply(null, Object.keys(t.colors).map(function (c) { return t.colors[c]; }).concat([0]));
    var cap = saltCapFor(t.cons.salt);
    // 接触时长决定整套评分标准
    var expLevel = t.cons.exp || 3;
    var prof = EXP_PROFILE[expLevel] || EXP_PROFILE[3];
    var complexTol = Math.min(t.cons.complex, prof.complexCap);
    var popWeight = CONST.W_POPULAR * prof.popMul;
    // 玩家想要的色数（0 = 无色，1 = 五色）。没答到广度题时取 0.5（两色，最常见）。
    var playerBreadth = (t.cons.breadth != null) ? t.cons.breadth : 0.5;
    return CMDS.map(function (c) {
      var sim = cosine(t.pref, c.vec);
      // 无色主将（两件事分开）：
      // ① 广度拉到 0.2，与单色同档——「零种颜色」不该比「一种颜色」更极端
      // ② 候选池不混：无色的匹配走独立的 "C" 偏好，没选过无色的人拿不到它的色相分
      // 必须与 Python 引擎 scripts/engine.py 逐字一致。
      var colorMatch = 0.5, cardBreadth, affinity;
      if (c.colors === "C") {
        cardBreadth = 0.2;
        colorMatch = maxColor > 0 ? (t.colors.C || 0) / maxColor : 0;
      } else {
        cardBreadth = c.colors.length / 5;
        colorMatch = maxColor === 0 ? 0.5
          : c.colors.split("").reduce(function (s, col) {
              return s + (t.colors[col] || 0);
            }, 0) / (maxColor * c.colors.length);
      }
      // 广度用平方衰减：差一档从 1.0 掉到 0.64，差两档只剩 0.36
      var breadthGap = Math.abs(playerBreadth - cardBreadth);
      var breadthMatch = (1 - breadthGap) * (1 - breadthGap);
      affinity = CONST.W_COLOR_MATCH * colorMatch
               + CONST.W_BREADTH_MATCH * breadthMatch;
      var pop = Math.log10(Math.max(1, c.num_decks || 1)) / Math.log10(maxDecks);
      // 难度扣分用连续值（difficulty），五档只用于显示，避免相邻档位差一跳就是一大截
      var pc = Math.max(0, (c.difficulty != null ? c.difficulty : c.complexity)
                           - complexTol) * CONST.P_COST;
      var pb = Math.max(0, c.budget - t.cons.budget) * CONST.P_BUDGET;
      var ps = Math.max(0, c.salt - cap) * CONST.P_SALT;
      // 强度档位：新人被高 Bracket 主将劝退，老手不受限
      var pbr = Math.max(0, (parseInt(c.bracket, 10) || 3) - prof.bracketCap) * CONST.P_BRACKET;
      var bonus = t.cons.salt >= 4 ? 0.05 * c.salt : 0;
      return { c:c, sim:sim, exp:expLevel, expName:prof.name,
               score: CONST.W_SIM*sim + CONST.W_COLOR*affinity + popWeight*pop
                       - pc - pb - ps - pbr + bonus };
    }).sort(function (a, b) { return b.score - a.score; });
  }

  /* ---------- 画面 ---------- */
  var app = NO_DOM ? null : document.getElementById("app");

  function screenIntro() {
    app.innerHTML = "";
    var box = el("div", "card");
    var minutes = Math.max(3, Math.round(FULL_TOTAL / 8));
    var quickMinutes = Math.max(2, Math.round(QUICK_TOTAL / 8));
    box.innerHTML =
      '<h1>你是哪种指挥官？</h1>' +
      '<p class="lead">' + totalLabel(FULL_BOUNDS) + ' 道生活化的性格题，帮你从 <b>' + CMDS.length +
      ' 位</b>当前最流行的 EDH 主将里，找到最合你口味的那一位。</p>' +
      '<div class="stats">' +
        '<div class="stat"><div class="k">实际作答</div><div class="v">' + totalLabel(FULL_BOUNDS) + ' 题</div></div>' +
        '<div class="stat"><div class="k">主将池</div><div class="v">' + CMDS.length + ' 位</div></div>' +
        '<div class="stat"><div class="k">完整版用时</div><div class="v">约 ' + minutes + ' 分</div></div>' +
        '<div class="stat"><div class="k">快速版</div><div class="v">约 ' + quickMinutes + ' 分</div></div>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<h3>怎么答</h3>' +
      '<p class="muted">第 1 题会先问你接触万智牌多久——<b>别紧张，那是为了挑对标准，不是考试</b>。' +
      '之后全是生活里的小选择，<b>没有正确答案</b>，也不需要你懂万智牌。' +
      '选完自动进入下一题，可以随时回上一题改。有些题会顺着你的选择多问两句，' +
      '所以每个人的题目路径不完全一样。</p>' +
      '<p class="muted">我们会按你的接触时长调整标准：新人优先推荐好上手、资料多的主将，' +
      '老手则会看到更多高强度的选择。</p>' +
      '<h3 class="mt">数据从哪来</h3>' +
      '<p class="muted">主将池来自 EDHREC 的真实套牌统计，覆盖历史排名前列与近年新出的主将，' +
      '含鹏洛客、载具等非生物主将以及拍档 / 身世组合；每位主将的「玩法画像」由 EDHREC ' +
      '社区真实标签的票数算出，不是拍脑袋写的。搭配牌、造价与难度也都基于真实数据估算。</p>' +
      '<div class="row mt">' +
        '<button class="btn" id="go-full">开始完整版（' + FULL_TOTAL + ' 题）</button>' +
        '<button class="btn ghost" id="go-quick">快速版（' + QUICK_TOTAL + ' 题）</button>' +
      '</div>' +
      '<div class="row mt-s">' +
        '<button class="btn ghost sm" id="go-pool">先看看全部 ' + CMDS.length + ' 位主将 →</button>' +
      '</div>';
    app.appendChild(box);
    document.getElementById("go-full").onclick = function () { start("full"); };
    document.getElementById("go-quick").onclick = function () { start("quick"); };
    document.getElementById("go-pool").onclick = function () { screenPool(); };
  }

  /* ---------- 主将池浏览 ---------- */
  var POOL = { kw:"", color:"", sort:"pop", shown:60, open:null };
  var POOL_PAGE = 60;
  var POOL_COLORS = [
    { k:"",      label:"全部" },
    { k:"W",     label:"白" }, { k:"U", label:"蓝" }, { k:"B", label:"黑" },
    { k:"R",     label:"红" }, { k:"G", label:"绿" },
    { k:"C",     label:"无色" },
    { k:"multi", label:"多色" }
  ];

  function poolList() {
    var kw = POOL.kw.trim().toLowerCase();
    var out = CMDS.filter(function (c) {
      if (POOL.color === "C" && c.colors !== "C") return false;
      if (POOL.color === "multi" && (c.colors === "C" || c.colors.length < 2)) return false;
      if (POOL.color && POOL.color !== "C" && POOL.color !== "multi"
          && c.colors.indexOf(POOL.color) < 0) return false;
      if (kw && (c.zh + " " + c.en).toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    if (POOL.sort === "pop") {
      out.sort(function (a, b) { return (b.num_decks || 0) - (a.num_decks || 0); });
    } else if (POOL.sort === "diff") {
      out.sort(function (a, b) {
        return (a.difficulty || 0) - (b.difficulty || 0)
            || (b.num_decks || 0) - (a.num_decks || 0); });
    } else {
      out.sort(function (a, b) { return String(a.zh).localeCompare(String(b.zh), "zh"); });
    }
    return out;
  }

  function poolDetail(c) {
    var d = DESC[c.en] || {}, picks = CARDS[c.en] || {};
    var h = '<div class="pooldetail">';
    if (d.tagline) h += '<div class="tagline">' + esc(d.tagline) + "</div>";
    if (d.intro) h += '<div class="block"><div class="bt">这套牌在干什么</div><p>' +
                      esc(d.intro) + "</p></div>";
    if (d.build) h += '<div class="block"><div class="bt">怎么组</div><p>' +
                      esc(d.build) + "</p></div>";
    var syn = picks.synergy || [], pop = picks.popular || [];
    if (syn.length || pop.length) {
      h += '<div class="block"><div class="bt">常见搭配（EDHREC 实测）</div><div class="cards">';
      syn.forEach(function (n) {
        var ci = CARDINFO[n] || {};
        h += '<span class="cc key"><b>' + esc(ci.zh || n) + "</b><i>" + esc(n) +
             (ci.cmc != null ? " · " + ci.cmc + " 费" : "") + "</i></span>";
      });
      pop.forEach(function (n) {
        var ci = CARDINFO[n] || {};
        h += '<span class="cc"><b>' + esc(ci.zh || n) + "</b><i>" + esc(n) + "</i></span>";
      });
      h += "</div></div>";
    }
    h += '<div class="block"><div class="bt">数据</div><p class="muted">难度 ' +
         c.complexity + "/5　常见强度 Bracket " + c.bracket + "　对手仇恨度 " +
         (c.salt || 0).toFixed(2) + "　EDHREC " + (c.num_decks || 0).toLocaleString() +
         " 副套牌　历史第 " + (c.all_time_rank || "—") + " 位</p></div>";
    h += '<p class="muted" style="font-size:12.5px">' +
         '<a href="https://edhrec.com/commanders/' + esc(c.id) +
         '" target="_blank" rel="noopener">EDHREC 牌组页</a> · ' +
         '<a href="https://scryfall.com/search?q=' +
         encodeURIComponent('!"' + c.en + '"') +
         '" target="_blank" rel="noopener">Scryfall 查卡</a></p>';
    return h + "</div>";
  }

  function poolRender() {
    var list = poolList();
    var shown = list.slice(0, POOL.shown);
    var host = document.getElementById("pool-list");
    if (!host) return;
    host.innerHTML = shown.map(function (c) {
      var open = POOL.open === c.en;
      return '<div class="poolrow" data-en="' + esc(c.en) + '">' +
        '<span class="nm">' + esc(c.zh || c.en) + "</span>" + pips(c.colors) +
        '<span class="meta">难度 ' + c.complexity + " · " + (c.num_decks || 0).toLocaleString() +
        " 副</span></div>" + (open ? poolDetail(c) : "");
    }).join("") + (list.length > shown.length
      ? '<div class="poolmore"><button class="btn ghost sm" id="pool-more">显示更多（还有 ' +
        (list.length - shown.length) + " 位）</button></div>"
      : "");

    var cnt = document.getElementById("pool-count");
    if (cnt) cnt.textContent = "找到 " + list.length + " 位";

    host.querySelectorAll(".poolrow").forEach(function (row) {
      row.onclick = function () {
        var en = row.getAttribute("data-en");
        POOL.open = POOL.open === en ? null : en;
        poolRender();
      };
    });
    var more = document.getElementById("pool-more");
    if (more) more.onclick = function () { POOL.shown += POOL_PAGE; poolRender(); };
  }

  function screenPool() {
    app.innerHTML = "";
    var box = el("div", "card");
    box.innerHTML =
      "<h1>主将池</h1>" +
      '<p class="muted">全部 <b>' + CMDS.length + "</b> 位主将，按 EDHREC 套牌总数排序。" +
      "点任意一位可以展开它的介绍与搭配牌。</p>" +
      '<div class="mt-s"><input id="pool-q" class="poolinput" type="search" ' +
      'placeholder="搜中文名或英文名…" value="' + esc(POOL.kw) + '"></div>' +
      '<div class="poolchips" id="pool-colors">' +
        POOL_COLORS.map(function (o) {
          return '<span class="poolchip' + (POOL.color === o.k ? " on" : "") +
                 '" data-c="' + o.k + '">' + o.label + "</span>";
        }).join("") + "</div>" +
      '<div class="row mt-s">' +
        '<button class="btn ghost sm" id="pool-sort">排序：' +
          ({ pop:"流行度", diff:"难度", name:"名称" })[POOL.sort] + " ▾</button>" +
        '<span class="muted" id="pool-count" style="align-self:center"></span></div>' +
      '<div class="mt-s" id="pool-list"></div>' +
      '<div class="row mt"><button class="btn ghost" id="pool-back">← 回首页</button></div>';
    app.appendChild(box);

    var q = document.getElementById("pool-q");
    q.oninput = function () { POOL.kw = q.value; POOL.shown = POOL_PAGE; poolRender(); };
    document.getElementById("pool-colors").querySelectorAll(".poolchip")
      .forEach(function (chip) {
        chip.onclick = function () {
          POOL.color = chip.getAttribute("data-c");
          POOL.shown = POOL_PAGE;
          screenPool();
        };
      });
    document.getElementById("pool-sort").onclick = function () {
      POOL.sort = POOL.sort === "pop" ? "diff" : (POOL.sort === "diff" ? "name" : "pop");
      POOL.shown = POOL_PAGE;
      screenPool();
    };
    document.getElementById("pool-back").onclick = function () { screenIntro(); };
    poolRender();
  }

  function start(mode) {
    state = { mode:mode, current:null, history:[], answers:{} };
    state.current = resolveInMode(START);
    screenQuestion();
  }

  /* ---------- 分支流程 ---------- */
  // 一道题的所有出边：选项的 goto 优先，否则用 next
  function targetsOf(q) {
    var outs = [];
    q.opts.forEach(function (o) { if (o.goto) outs.push(o.goto); });
    if (!outs.length) outs.push(q.next);
    return outs;
  }
  // 快速版：主线题不在 QUICK 里就沿主线往后跳，分支题一律照常问
  function resolveInMode(target) {
    if (!target) return null;
    if (state.mode !== "quick") return target;
    if (!SPINE_SET[target]) return target;
    if (QUICK_SET[target]) return target;
    var at = SPINE.indexOf(target);
    for (var i = at < 0 ? 0 : at; i < SPINE.length; i++) {
      if (QUICK_SET[SPINE[i]]) return SPINE[i];
    }
    return null;
  }
  // 路径长度区间：分支长度可能不一致（有的枢纽选项会跳过分支直接走 next），
  // 所以进度条按最长路径估，标签显示区间。
  function pathBounds(mode) {
    var saved = state.mode;
    state.mode = mode;
    var memo = {};
    function walk(id) {
      if (!id) return [0, 0];
      if (memo[id]) return memo[id];
      memo[id] = [1, 1];                       // 防环占位
      var q = Q.byId[id];
      if (!q) { memo[id] = [0, 0]; return memo[id]; }
      var outs = [];
      q.opts.forEach(function (o) { if (o.goto) outs.push(resolveInMode(o.goto)); });
      outs.push(resolveInMode(q.next));
      var lo = Infinity, hi = 0;
      outs.forEach(function (t) {
        var b = walk(t);
        lo = Math.min(lo, b[0]);
        hi = Math.max(hi, b[1]);
      });
      if (!isFinite(lo)) lo = 0;
      memo[id] = [1 + lo, 1 + hi];
      return memo[id];
    }
    var result = walk(resolveInMode(START));
    state.mode = saved;
    return result;
  }
  function goNext(opt) {
    var q = Q.byId[state.current];
    var raw = (opt && opt.goto) ? opt.goto : q.next;
    var target = resolveInMode(raw);
    state.history.push(state.current);
    if (!target) {
      screenResult();
    } else {
      state.current = target;
      screenQuestion();
    }
  }
  function goBack() {
    if (!state.history.length) return;
    state.current = state.history.pop();
    screenQuestion();
  }

  function screenQuestion() {
    var q = Q.byId[state.current];
    var picked = state.answers[q.id];
    var isMulti = !!q.multi;
    app.innerHTML = "";
    var box = el("div", "card");

    var done = state.history.length;
    var bounds = state.mode === "quick" ? QUICK_BOUNDS : FULL_BOUNDS;
    var total = bounds[1];
    var pct = Math.max(2, Math.round(done / total * 100));
    var head = el("div");
    head.innerHTML =
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="sechead"><span>' + esc(q.secName) + '</span>' +
      '<span>第 ' + (done + 1) + ' 题 / 共 ' + totalLabel(bounds) + '</span></div>';
    box.appendChild(head);

    box.appendChild(el("div", "qtext", esc(q.q)));
    if (isMulti) box.appendChild(el("p", "muted", "可多选，最多 " + q.multi + " 个"));

    var list = el("div", "mt-s");
    q.opts.forEach(function (o, i) {
      var b = el("button", "opt");
      var on = isMulti ? (picked || []).indexOf(i) >= 0 : picked === i;
      if (on) b.className += " on";
      b.innerHTML = '<span class="idx">' + "ABCDEFG"[i] + '</span>' + esc(o.t);
      b.onclick = function () { choose(q, i); };
      list.appendChild(b);
    });
    box.appendChild(list);

    var nav = el("div", "row mt");
    var back = el("button", "btn ghost", "← 上一题");
    back.disabled = !state.history.length;
    back.onclick = goBack;
    nav.appendChild(back);
    if (isMulti) {
      var nxt = el("button", "btn", "下一题 →");
      nxt.disabled = !(picked && picked.length);
      nxt.onclick = function () { goNext(null); };
      nav.appendChild(nxt);
    }
    box.appendChild(nav);
    app.appendChild(box);
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  function choose(q, i) {
    if (q.multi) {
      var cur = state.answers[q.id] || [];
      var at = cur.indexOf(i);
      if (at >= 0) cur.splice(at, 1);
      else if (cur.length < q.multi) cur.push(i);
      state.answers[q.id] = cur.slice();
      screenQuestion();
    } else {
      state.answers[q.id] = i;
      goNext(q.opts[i]);
    }
  }

  function axisLabel(id) {
    var a = AXES[id];
    return a ? a.zh : id;
  }
  function expProf() {
    var st = state.answers["e0"];
    var opt = (st != null) ? Q.byId["e0"].opts[st] : null;
    return EXP_PROFILE[(opt && opt.exp) || 3] || EXP_PROFILE[3];
  }
  function expName() { return expProf().name; }

  function screenResult() {
    var t = tally();
    var ranked = rank(t);
    var top = ranked.slice(0, 3);
    // 偏好向量是「相对平均答题者的偏差」，因此可能为负。
    // 画像只展示真正高于平均水平的口味：负值或接近零的轴画成条形只会误导
    // （曾经把 -4% 的「铺场爆兵」画出来，用户以为系统推荐错了）。
    var profileAxes = Object.keys(t.pref)
      .filter(function (a) { return t.pref[a] > 0; })
      .sort(function (a, b) { return t.pref[b] - t.pref[a]; })
      .slice(0, 6);
    var maxPref = profileAxes.length ? t.pref[profileAxes[0]] : 1;

    app.innerHTML = "";
    app.appendChild(el("h3", null, "你的结果"));

    top.forEach(function (item, i) {
      var c = item.c;
      var glow = c.colors === "C" ? "#c8cdd6"
        : ({ W:"#f8f0d8", U:"#a5cfe8", B:"#c9b8d4", R:"#f0a898", G:"#a8d4b0" })[c.colors[0]];
      var box = el("div", i === 0 ? "hero" : "alt");
      box.style.setProperty("--glow", glow);
      if (i === 0) box.style.marginBottom = "14px";

      var matched = profileAxes.filter(function (a) { return (c.vec[a] || 0) > 0.6; })
                           .map(axisLabel);
      var html = "";
      if (i === 0) {
        html += '<div class="rank">最适合你的主将</div>';
        html += '<div class="name">' + esc(c.zh || c.en) + " " + pips(c.colors) + "</div>";
        html += '<div class="zh">' + esc(c.en) + (c.cmc != null ? " · " + c.cmc + " 费" : "") + "</div>";
      } else {
        html += '<div class="row" style="justify-content:space-between">' +
                '<div><div class="n">' + esc(c.zh || c.en) + " " + pips(c.colors) + "</div>" +
                '<div class="z">' + esc(c.en) + "</div></div>" +
                '<div class="z">备选 ' + i + "</div></div>";
      }
      var tagline = (DESC[c.en] || {}).tagline;
      if (tagline) html += '<div class="tagline">「' + esc(tagline) + "」</div>";
      html += '<div class="stats">' +
        '<div class="stat" title="牌面理解成本 ' + c.text_level + '/5 ＋ 操作负担 ' +
          c.pilot_level + '/5"><div class="k">上手难度</div><div class="v">' +
          c.complexity + ' / 5</div></div>' +
        '<div class="stat"><div class="k">造价档位</div><div class="v">' + c.budget + ' / 5</div></div>' +
        '<div class="stat"><div class="k">对手仇恨度</div><div class="v">' + c.salt.toFixed(2) + '</div></div>' +
        '<div class="stat"><div class="k">常见强度</div><div class="v">Bracket ' + c.bracket + '</div></div>' +
      '</div>';
      html += '<h3>玩法定位</h3><div class="chips">' +
        c.top_tags.slice(0, 5).map(function (tag) {
          return '<span class="chip">' + esc(tagZh(tag)) + "</span>"; }).join("") + "</div>";

      // 介绍与建牌思路（由素材驱动撰写，见 data/descriptions_*.json）
      var info = DESC[c.en];
      if (info) {
        if (info.intro) {
          html += '<div class="block"><div class="bt">这套牌在干什么</div><p>' +
                  esc(info.intro) + "</p></div>";
        }
        if (info.build) {
          html += '<div class="block"><div class="bt">怎么组</div><p>' +
                  esc(info.build) + "</p></div>";
        }
      }
      var picks = CARDS[c.en];
      if (picks && picks.synergy && picks.synergy.length) {
        html += '<div class="block"><div class="bt">常见搭配（EDHREC 实测）</div><div class="cards">';
        picks.synergy.forEach(function (name) {
          var ci = CARDINFO[name] || {};
          html += '<span class="cc key"><b>' + esc(ci.zh || name) + "</b><i>" +
                  esc(name) + (ci.cmc != null ? " · " + ci.cmc + " 费" : "") + "</i></span>";
        });
        (picks.popular || []).forEach(function (name) {
          var ci = CARDINFO[name] || {};
          html += '<span class="cc"><b>' + esc(ci.zh || name) + "</b><i>" + esc(name) + "</i></span>";
        });
        html += "</div><p class=\"muted\" style=\"font-size:12.5px;margin-top:8px\">" +
                "深色标签是该主将专属的高协同牌；浅色是大多数牌组都会放的通用件。</p></div>";
      }
      if (matched.length) {
        html += '<p class="muted mt-s">和你的口味重合：<b>' + matched.join(" · ") + "</b></p>";
      }
      html += '<p class="muted mt-s">' +
        '<a href="https://edhrec.com/commanders/' + esc(c.id) + '" target="_blank" rel="noopener">EDHREC 牌组页</a>' +
        ' · <a href="https://scryfall.com/search?q=' + encodeURIComponent('!"' + c.en + '"') +
        '" target="_blank" rel="noopener">Scryfall 查卡</a></p>';
      box.innerHTML = html;
      app.appendChild(box);
    });

    // 你的画像
    var p = el("div", "card mt");
    var profileBody;
    if (profileAxes.length) {
      profileBody = '<p class="muted">只看你<b>明显高于平均水平</b>的口味——' +
        '没上榜的玩法代表你对它没有特别偏好，而不是讨厌它。</p><div class="mt-s">' +
        profileAxes.map(function (a) {
          var ratio = Math.max(0, Math.min(1, t.pref[a] / maxPref));
          return '<div class="axis"><div class="lab"><b>' + axisLabel(a) + "</b><span>" +
                 Math.round(ratio * 100) + '%</span></div>' +
                 '<div class="track"><i style="width:' + (ratio * 100) + '%"></i></div></div>';
        }).join("") + "</div>";
    } else {
      profileBody = '<p class="muted">你的选择分布得很平均，没有哪一项特别突出——' +
        '说明你什么玩法都能接受，选主将时不妨优先看颜色和上手难度。</p>';
    }
    p.innerHTML = '<h2>你的玩法画像</h2>' + profileBody +
      '<div class="divider"></div>' +
      '<p class="muted">你的经验段：<b>' + esc(expName()) + '</b>——'
        + '已按这个段位调整评分标准（难度容忍上限 <b>' + expProf().complexCap
        + '</b>、强度档位上限 <b>Bracket ' + expProf().bracketCap + '</b>）。</p>' +
      '<p class="muted">约束档位：复杂度容忍 <b>' + t.cons.complex.toFixed(1) + '</b> · 预算档 <b>' +
      t.cons.budget.toFixed(1) + '</b> · 被针对容忍度 <b>' + t.cons.salt.toFixed(1) + "</b></p>" +
      '<div class="row mt"><button class="btn ghost" id="again">重新测一次</button>' +
      '<button class="btn ghost" id="copy">复制结果</button></div>';
    app.appendChild(p);
    document.getElementById("again").onclick = screenIntro;
    document.getElementById("copy").onclick = function () {
      var btn = this;
      var lines = top.map(function (x, i) {
        return (i + 1) + ". " + (x.c.zh || x.c.en) + "（" + x.c.en + "） " + x.c.colors +
               " · 难度 " + x.c.complexity + "/5";
      });
      var tail = profileAxes.length
        ? "\n玩法偏好：" + profileAxes.map(axisLabel).join("、")
        : "";
      var text = "我的 EDH 主将推荐：\n" + lines.join("\n") + tail;
      var done = function () { btn.textContent = "已复制 ✓"; };
      // 剪贴板 API 在部分环境（非安全上下文 / 旧浏览器）不可用，逐级降级
      var legacy = function () {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          var ok = document.execCommand && document.execCommand("copy");
          document.body.removeChild(ta);
          if (ok) { done(); return; }
          throw new Error("execCommand 失败");
        } catch (e) {
          try { window.prompt("按 Ctrl+C 复制这段结果：", text); } catch (e2) { /* 放弃 */ }
        }
      };
      if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, legacy);
      } else {
        legacy();
      }
    };

    var note = el("div", "warn mt");
    note.innerHTML = "结果基于问卷匹配，<b>不是强度排名</b>。选主将最好的方式还是先借一副牌打两局——" +
      "上面三位主将都可以在 EDHREC 上找到现成牌表和升级路线。";
    app.appendChild(note);
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  /* ---------- 预处理 ---------- */
  var byId = {}, all = [], secNames = {};
  (Q.sections || []).forEach(function (s) { secNames[s.id] = s.name; });
  Q.questions.forEach(function (q) {
    q.secName = secNames[q.sec] || "";
    byId[q.id] = q; all.push(q);
  });
  Q.byId = byId; Q.all = all; Q.count = all.length;

  // 主线顺序：从起点沿 next 走一遍（忽略 goto 分支）
  var START = Q.start || (all[0] && all[0].id);
  var SPINE = [], SPINE_SET = {}, QUICK_SET = {};
  (function () {
    var id = START, guard = 0;
    while (id && guard++ < 600) {
      SPINE.push(id);
      SPINE_SET[id] = true;
      var q = byId[id];
      if (!q) break;
      id = q.next;
    }
  })();
  QUICK.forEach(function (id) { QUICK_SET[id] = true; });
  // 题量区间由路径分析得出（部分枢纽选项会跳过分支，所以是个区间）
  var FULL_BOUNDS = pathBounds("full");
  var QUICK_BOUNDS = pathBounds("quick");
  var FULL_TOTAL = FULL_BOUNDS[1];
  var QUICK_TOTAL = QUICK_BOUNDS[1];
  function totalLabel(bounds) {
    return bounds[0] === bounds[1] ? String(bounds[1]) : bounds[0] + "–" + bounds[1];
  }

  // 离线校验钩子：parity / UI 冒烟测试脚本用它驱动同一套逻辑
  if (typeof globalThis !== "undefined") {
    globalThis.__quizEngine = {
      tally: tally, rank: rank, cosine: cosine, AXES: AXES, CONST: CONST,
      setAnswers: function (answers) { state.answers = answers; },
      quickIds: QUICK.slice(),
      start: start, choose: choose, goNext: goNext, goBack: goBack,
      screenQuestion: screenQuestion, goNextRaw: goNext,
      screenIntro: screenIntro, screenPool: screenPool,
      poolList: poolList, POOL: POOL,
      getState: function () { return state; }, Q: Q,
      spine: SPINE.slice(), startId: START,
      totals: { full: FULL_TOTAL, quick: QUICK_TOTAL,
                fullBounds: FULL_BOUNDS.slice(), quickBounds: QUICK_BOUNDS.slice() }
    };
  }

  if (!NO_DOM) screenIntro();
})();
</script>
</body>
</html>
